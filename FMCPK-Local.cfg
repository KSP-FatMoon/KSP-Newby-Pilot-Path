	description = Теперь, когда удалось первое погружение, мы хотим превратить нашего космонавта в водолаза. И исследовать именно дно! Утопите капсулу минимум с 1 кербалом на борту так, чтобы устойчиво достигнуть дна. Отсчет пойдет с момента касания, 5 минут. И соберите данные любого эксперимента - условия на дне должны отличаться от поверхности! Представьте себе доклад "Приземлен в биоме воды Кербина" - Да его в рамку можно будет вешать, такая редкость!
	notes = Если в предыдущем погружении вы могли добавить "поплавок", то теперь обойдитесь только грузом. Если прикрепить к капсуле пару малых баков с рудой, они наверняка потянут вниз! Если собираетесь ронять батискаф в воду с большой высоты, возьмите парашют побольше - аппарат получится тяжелым. И не забудьте про таймер - не всплывайте сразу, 5 минут на дне!
	synopsis = Погрузиться под воду до дна и пробыть там 5 минут.
	completedMessage = Ну, как там было? Рыбок видели? А крабов?

