// задать без маркера ледниковое озеро и остров Махи-Махи достаточно сложно. Придется делать по цепочке маркеров!
// первый маркер на центр острова или озера, второй скрытый. А направление через диалог: ищите к юго-востоку от вас
CONTRACT_TYPE:NEEDS[!Kerbalism]
{	// наука в кербализме засчитывается при передаче/возвращении. И ничем не отличается от стартового стола (биом побережья)
	name = VisitKSCMonolith
	title = Таинственный монолит
	
	description = Наверняка вы видели странную черную точку на побережье, на север от нашей взлетной полосы. Да, там стоит мистический объект, оставленный неизвестно кем и неизвестно когда - Черный Монолит! Таких монолитов на Кербине несколько, и ходят слухи, что один из них особенный. Но об этом потом. В очередной раз наши ученые решили проверить постоянство физических констант вблизи объекта. Стройте вездеход и отправляйтесь в небольшую поездку - от ВПП до монолита. Возьмите с собой: таинственную слизь, термометр, барометр и полупортативный спектробукометр... отставить, последнего нет на складе. Тогда накопайте земли рядом с монолитом, килограмм 5! И возвращайтесь с собранными образцами.
	
	synopsis = Провести эксперименты около таинственного монолита. Вы должны: измерить температуру и давление, зафиксировать поведение таинственной слизи и собрать образец почвы. Верните результаты.
	
	completedMessage = Очень интересно, но ничего не понятно! Ничем не отличается от окрестностей - нулевое влияние! Это потрясающе - такая странная штука, черная, массивная, твердая - и никакого влияния на приборы. Знаете, что от него даже отрезать кусочек нельзя? да, мы пробовали!
	
	prestige = Trivial
	maxCompletions = 1
	group = FMCP_Local
	cancellable = false
	declinable = false
	targetBody = HomeWorld()
	sortKey = 1506
	advanceFunds = 7000.0
	rewardFunds = 8000.0
	rewardScience = 3.0
	rewardReputation = 3.0
	REQUIREMENT
	{
		name = SurfSampleAvailable
		type = Facility
		facility = ResearchAndDevelopment
		minLevel = 2
		title = Научно-конструкторский комплекс должен быть хотя бы 2 уровня (образцы грунта)
	}
	DATA
	{
		type = List<ScienceExperiment>
		sciExpes = [ mysteryGoo, surfaceSample, temperatureScan, barometerScan ]
		hidden = true
	}
	BEHAVIOUR
	{
		name = KSCMonolithWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Монолит у Космоцентра
			icon = balloon
			targetBody = @/targetBody
