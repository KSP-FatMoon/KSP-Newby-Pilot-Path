// остались неохваченными испытания деталей (типа "провести испытания колеса Движ-М в полете над Кербином").
// Мне не приходит в голову ни одного нормального испытания деталей, чтобы это давало новый полезный опыт.
// Стоковые либо абсурдно, либо слишком дешево.
// Воспроизвести, кстати, стоковый тест ОЧЕНЬ сложно. Тут и определение детали, и вариативность.
// Единственный смысл - получить прототип до исследования.
