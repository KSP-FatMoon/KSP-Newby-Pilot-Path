CONTRACT_TYPE
{
	name = BabyHopOnKerbin
	title = Малый прыжок - проще, чем через скакалку!
	group = FMCP_Local
	
	description = Программа "Наполлон" продвигается успешно, скоро нам предстоит посадка на Муну - а там атмосферы нет, парашюты не помогут! Придется оттормозиться на некоторой высоте, а потом медленно упасть, выдерживая скорость падения не более 12 м/с, а перед самым касанием погасить менее 5. В условиях гравитации Муны, должно быть вполне безопасно. Надо провести испытания на Кербине, чтобы убедится, что мы все правильно поняли.\n\n	 Соберите простую ракету с жидкотопливным двигателем, небольшим запасом топлива и командным блоком. Рекомендуем беспилотный запуск. Наверняка потребуется гиродин - мы тренируемся перед посадкой в условиях вакуума, нельзя полагаться на атмосферные стабилизаторы. Не забудьте посадочные опоры - мы не хотим потерять ракету из-за падения на бок. И никаких парашютов - весь смысл испытаний в том, чтобы плавно опустить ракету исключительно на реактивной струе! И постарайтесь не раздавить двигатель - на Муне у вас не будет цеха для ремонта, потеря двигателя станет катастрофой!
	synopsis = Взлететь со стартовой площадки нашего центра, поднять аппарат хотя бы на 500м, и опустить на поверхность, не повредив. Никаких ступеней, никаких парашютов - управляющий блок, топливо, двигатель. Взлет - и тут же посадка, как подпрыгнуть на месте. Мы даже не требуем посадку точно на стартовый стол - можно рядом, главное не разбиться.
	completedMessage = Отлично, реактивная посадка возможна. Осталось применить эти навыки на Муне!

	cancellable = true
	declinable = true
	targetBody = HomeWorld()
	sortKey = 1509
	prestige = Trivial
	maxSimultaneous = 1
	maxCompletions = 1
	rewardFunds = 8000.0
	rewardReputation = 5.0
	REQUIREMENT
	{
		type = Orbit
		targetBody = HomeWorld().Children().First()
		title = Старт после достижения орбиты Муны
	}
	PARAMETER
	{
		name = BabyHopGroup
		type = VesselParameterGroup
		title = Взлететь над стартовой площадкой на 500м и мягко опустится на поверхность на реактивном двигателе, не используя парашюты. Без читов! никаких вертолетов, мы следим!
		PARAMETER
		{
			name = NoParachutes
			type = PartValidation
			NONE
			{
				partModule = ModuleParachute
			}
			title = Без парашютов!
		}
		PARAMETER
		{
			name = StageLock
			type = NoStaging
			title = Одна ступень, никакого разделения.
		}
		PARAMETER
		{
			name = LaunchAndLandOnePiece
			type = PartValidation
			// Требуем наличие ЖРД и модуля управления от старта и до посадки
			partModule = ModuleEnginesFX
			partModule = ModuleCommand
			// minCount = 1
			title = От старта до посадки корабль должен иметь двигатель и командный блок.
			hideChildren = true
			disableOnStateChange = false
			// это одновременно и проверка что не расколотили, и отсечение обломков от других запусков.
		}
		//PARAMETER
		//{
		//	name = CommandBlockSurvived
		//	type = PartValidation
		//	
		//	minCount = 1
		//	title = Контроль: Бортовой компьютер / кабина управления целы
		//	disableOnStateChange = false
		//}
		PARAMETER
		{
			name = FlightSequence
			type = Sequence
			title = Выполнить все задачи согласно плану полета:
			PARAMETER
			{
				name = StartAtPad
				type = ReachState
				targetBody = HomeWorld()
				biome = LaunchPad	// запуск строго со стартового стола
				situation = PRELAUNCH
				title = Разместите новый аппарат на стартовом столе (LaunchPad)
				hideChildren = true
				disableOnStateChange = true 
			}
			PARAMETER
			{
				name = ReachApex
				type = ReachState
				targetBody = HomeWorld()
				minAltitudeSurface = 500
				title = Наберите высоту не менее 500 метров над поверхностью
				hideChildren = true
				disableOnStateChange = true
				completeInSequence = true
			}
			PARAMETER
			{
				name = SafeTouchdown
				type = ReachState
				targetBody = HomeWorld()
				situation = LANDED
				situation = SPLASHED
