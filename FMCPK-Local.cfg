CONTRACT_TYPE
{
	name = KSCPerfectLanding
	title = Исключительно точная посадка
	
	description = Настало время доказать свое мастерство пилотирования: приземлитесь с орбиты на стартовую площадку! Да, она маленькая. Поэтому облегчим задачу: приземлитесь в круг с радиусом 3000 м, с центром на стартовой площадке. Круг диаметром 6 км! \n\n Но обязательно с орбиты - из обычного атмосферного полета это сделать слишком просто. Запустите новый аппарат или используйте любой уже имеющийся - но сначала орбита, потом спуск и приземление не далее 3000 м от стартовой площадки нашего центра.
	
	synopsis = Сойти с орбиты и приземлиться в КСЦ не дальше чем 3000м от стартовой площадки
	completedMessage = Потрясающая точность! А прямо на стартовую сможете?
	
	prestige = Significant
	maxCompletions = 1
	group = FMCP_Local
	cancellable = false
	declinable = false
	targetBody = @/homePlanet
	sortKey = 1504
	
	rewardFunds = 50000.0
	rewardScience = 0.0
	rewardReputation = 10.0
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = @/homePlanet
		title = стартует после возврата с орбиты
	}
	// подсказки: космолет/космоплан. Ровер. Капсула с двигателем и запасом топлива для маневра в атмосфере.
	// Капсула с крыльями, стабилизаторами и аэро-рулями.
	// Ну и конечно точный расчет и повторные попытки методом проб и ошибок. Недолет-перелет, подбор момента зажигания.
	// хитрый способ: лететь в кресле - раскрытый личный парашют прекрасно работает в кресле.
	// наглый способ: прыгнуть с парашютом. Кербал-пилот считается тем же аппаратом, орбита уже засчитана. ТАК НЕЧЕСТНО!
	// Я не знаю способа ТОЧНОЙ посадки с орбиты в заданную точку, кроме как "на глазок" - поэтому 3000м отличный допуск.
	// Умельцы, сажающие на платформу в океане, явно не относятся к "молодым пилотам" - можете сбрасывать миссию,
	// пока не сядете на саму площадку ;) наверно там нужен keoscript или что-то подобное, вручную граничит с безумием
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
	}
	BEHAVIOUR
	{
		name = LaunchPadWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Стартовый стол Космоцентра
			icon = balloon
			targetBody = @/homePlanet
			// Точные координаты -0.097, -74.558
			parameter = OrbitingVessel
			latitude = -0.097
			longitude = -74.558
			altitude = 0.0
			hidden = false
		}
	}
	PARAMETER
	{
		name = mainSequence
		type = VesselParameterGroup
		title = Спуститесь с орбиты Кербина в заданную точку с точностью до 3000 м
		PARAMETER
		{
			name = OrbitingVessel
			type = ReachState
			situation = ORBITING
			targetBody = @/homePlanet
			title = Вывести на орбиту новый аппарат (или использовать уже имеющийся, готовый к возвращению)
			// однако ричСтейт может не взять аппарат на орбите - он срабатывает при изменении состояния! а состояние не менялось...
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = LandedVessel
			type = ReachState
			situation = LANDED
			situation = SPLASHED
			// 3 км от стартового стола захватывает прибрежный океан
			targetBody = @/homePlanet
			title = Приземлиться на Кербин...
			hideChildren = true
			disableOnStateChange = false
			completeInSequence = true
		}
		PARAMETER
		{	// зачет точки - только после фактического приземления/приводнения
			name = LandOnLaunchpad
			type = VisitWaypoint
			index = 0
			distance = 3000.0
			horizontalDistance = 3000.0
			showMessages = true
			title = ...не далее 3000 м от стартового стола нашего Космического Центра!
			disableOnStateChange = false
			completeInSequence = true
			hideChildren = true
		}
	}
}
