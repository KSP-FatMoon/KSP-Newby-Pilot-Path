CONTRACT_TYPE
{
	name = RaceChallenge5000
	title = Большая гонка 5000
	
	description = Только сегодня! Объявляется регистрация на большие гонки на малых кораблях! Требования к участникам: любой управляемый корабль, способный оторваться от поверхности Кербина и выйти на орбиту, а потом отправиться к Минмусу. С экипажем или без, время гонки не ограничено. Любые детали на ваш выбор. За сближение с другими кораблями или стыковку немедленная дисквалификация.\n Трасса очень простая: взлет с поверхности Кербина на любой стартовой площадке по вашему выбору. Выход на низкую орбиту, полет к Минмусу. Далее вы должны построить маневр, приводящий корабль в сферу влияния Муны, пролететь мимо Муны и приземлиться на Кербин. Орбиты вокруг Минмуса и Муны не обязательны.\n Ознакомьтесь с правилами перед стартом: Общее ограничение 16т и 18 деталей. На первой ступени от 2700 до 3300 dV вакуумной. Второй чекпойнт на орбите - заняв орбиту ниже 300 км, не должно быть более 2000 и менее 1650 dV вакуумной, с количеством деталей не более 12. Орбита и наклонение на ваше усмотрение.
	synopsis = Выполните полет Кербин (взлет) -> Кербин (орбита) -> Минмус (пролет или орбита) -> Муна (пролет или орбита) -> Кербин (посадка), без дозаправок и имея на старте примерно 5000 dV(вакуумной), подробнее см. ограничения в правилах.
	notes = Не используя гипердвигатели, мюоны, бозоны, кварки и антикварки. Допускаются - атомные двигатели, двигатели на эффекте Холла, ионные двигатели на ксеноне, и любые комбинации стандартных двигателей (на жидком или твердом топливе).
	completedMessage = Победа! Ваша награда вполне заслужена!
// есть проблема: дельта считается для текущей ступени
// поэтому введем ограничения: максимум деталей при старте - 18 (куда столько?)
// максимум масса при старте - 16т (чуть меньше, чем на стартовой 1 уровня)
// максимум dV ваккумная - 3300, минимум 2700 (чек при старте)
// и чек на орбите: если сброшена 1-я ступень, это максимум -1 двигатель, -1 бак и -1 декаплер
// и ни в жизнь не поверю что не будет опор или стабилизаторов
// поэтому требуем на орбите максимум 12 деталей, максимум dV 2000, и минимум dV = 1650
// иначе недопуск! Ограничения по массе и деталям не дадут использовать сильно многоступенчатые ракеты...
// (гомерический хохот. На ступень 3 детали. Парашют, капсула, и понеслась: отделитель бак движок, и т.д.)
// Понятно, что результат будет плавать в больших пределах - 2000dV на копланарной Минмусу орбите
// с апоцентром 299999 и перицентром 299998 - это очень много. А 1650 на экваториальной 85 на 80
// пожалуй что и мало (проверил, не мало. Даже запас будет, небольшой)
// А чтобы по максимуму, удачи при заданных ограничениях вывести 2000 дельты на такую орбиту))
// (это, возможно, сложнее, чем долететь по маршруту с 1650)
// реальная ваккуумная дельта будет от 4750, до 5300, что в целом меня устраивает.
// Хотя есть хитрые способы для многоступенчатости, откручивания баков инженером, и использование МТ
// Но проще долететь чем так изощряться.
	prestige = Exceptional
	maxSimultaneous = 1
	group = FMCP		//FMCP_Milestones
	deadline = 0
	cancellable = true
	declinable = true

	rewardFunds = 100000.0
	rewardScience = 10.0
	rewardReputation = 20.0

	failureFunds = 0
	failureReputation = 0
	advanceFunds = -5000.0	//вступительный взнос! Зато никаких штрафов при провале.

	sortKey = 2020

	REQUIREMENT
	{
		name = MoonFlyByAchieved
		type = FlyBy
		targetBody = HomeWorld().Children().ElementAt(0)	//First()
		title = Вы должны предварительно совершить хотя бы один пролет мимо Муны
	}
	REQUIREMENT
	{
		name = MinmusFlyByAchieved
		type = FlyBy
		targetBody = HomeWorld().Children().ElementAt(1)	//Last()
		title = Вы должны предварительно совершить хотя бы один пролет мимо Минмуса
	}
	PARAMETER
	{
		name = RegSequence
		type = Sequence
		title = Регистрация и аттестация участника
	PARAMETER
	{
		name = StartAttestation
		type = VesselParameterGroup
		title = 1. Регистрация участника гонок
		//define = Race5000		//new vessel, нельзя определять на старте
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Ракета должна быть запущена после взятия контракта
		}
		PARAMETER
		{
			name = ReadyForLaunch
			type = ReachState
			situation = PRELAUNCH
			targetBody = HomeWorld()
			//minDeltaVeeVacuum = 2700
			maxDeltaVeeVacuum = 3300.0
			title = На стартовом столе. Дельта в разрешенных пределах (менее 3300)
			//hideChildren = true
		}
		PARAMETER
		{
			name = CheckMass
			type = VesselMass
			maxMass = 16.0
			title = Масса в разрешенных пределах (до 16т)
		}
	}
	
	PARAMETER
	{
		name = OrbitalAttestation
		type = VesselParameterGroup
		title = 2. Аттестация на орбите
		define = Race5000
		targetBody = HomeWorld()
		// 1: орбита Кербина
		PARAMETER
		{
			name = CheckOrbit
			type = Orbit
			title = Достигнута орбита Кербина (апоцентр ниже 300км)
			targetBody = HomeWorld()
			minPeA = 75000
			maxApA = 299999
			//hideChildren = true
		}
				PARAMETER
				{
					name = timer0
					type = Duration
					duration = 5s
					preWaitText = waiting
					waitingText = Stay on		//в течении @duration
					completionText = finished
					hideChildren = true
					hidden = true
				}
		PARAMETER	//wtf
		{	// переход к Минмусу требует около 1160 не выравнивая, или около 900 - предварительно выровняв.
			// попадание в Муну - порядка 16-20, пусть будет 40.
			// скругление до перицентра Кербина ниже атмосферы - максимум 300. В сумме 1500.
			// сделаем нижний предел 1650, чтобы наверняка.
			name = CheckDelta1
			type = ReachState
			situation = ORBITING
			targetBody = HomeWorld()
			//minDeltaVeeVacuum = 1650
			maxDeltaVeeActual = 2000.0
			title = Дельта в разрешенных пределах (до 2000)
			//с дельтой 2000 можно даже посадку на Минмус сделать. Или выйти на орбиты Минмуса и Муны.
			// то есть, если бы удалось 5000 вакуумной со всех ступеней считать, хватило бы со свистом.
			//hideChildren = true
		}
		PARAMETER
		{//no
			name = CheckMass1
			type = VesselMass
			maxMass = 5.0
			title = Масса в разрешенных пределах (до 5т)
		}
		PARAMETER
		{//no
			name = PartValidation2
			type = PartValidation
			VALIDATE
			{
			FILTER = Vessel("Race5000").Parts().Count() <= 12		//?
			}
			title = Количество деталей в разрешенных пределах (12 и меньше)
		}
	}
	}
	//PARAMETER
	//{
	//	name = MainRace
	//	type = VesselParameterGroup
	//	title = 3. Вперед к победе!
	//	vessel = Race5000
	//	completeInSequence = true
		PARAMETER		//ok
		{
			name = MissionSequence
			type = Sequence
			title = 3. Вперед к победе!
			// пролет Минмуса
			PARAMETER
			{
				name = group1
				type = VesselParameterGroup
				title = Посетить Минмус
				hideChildren = true
				vessel = Race5000
				targetBody = HomeWorld().Children().ElementAt(1)	//Last()
				PARAMETER
				{
					name = Check2
					type = ReachState
					title = Посетить Минмус
					targetBody = HomeWorld().Children().ElementAt(1)	//Last()
					hideChildren = true
					hidden = true
				}
				PARAMETER
				{
					name = timer1
					type = Duration
					duration = 5s
					preWaitText = waiting
					waitingText = Stay on		//в течении @duration
					completionText = finished
					hideChildren = true
					hidden = true
				}
			}
			// пролет Муны
			PARAMETER
			{
				name = group2
				type = VesselParameterGroup
				title = Посетить Муну
				hideChildren = true
				vessel = Race5000
				targetBody = HomeWorld().Children().ElementAt(0)	//First()
				PARAMETER
				{
					name = Check3
					type = ReachState
					title = Посетить Муну
					targetBody = HomeWorld().Children().ElementAt(0)	//First()
					hideChildren = true
					hidden = true
				}
				PARAMETER
				{
					name = timer2
					type = Duration
					duration = 5s
					preWaitText = waiting
					waitingText = Stay on		//в течении @duration
					completionText = finished
					hideChildren = true
					hidden = true
				}
			}
			// возврат домой
			PARAMETER
			{
				name = ReturnHome
				type = ReturnHome
				targetBody = HomeWorld()
				title = Вернуться на Кербин
			}
		}
	//}
}