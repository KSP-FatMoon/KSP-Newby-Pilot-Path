// аварийные ситуации
// Хотел добавить испытания системы спасения, но она настолько бесполезна, что даже не стоит внимания.
CONTRACT_TYPE
{
	name = EmergencyMuna
	title = Аварии: к Муне любой ценой
	
	group = FMCP
	
	sortKey = 302
	
	description = Некоторые неисправности могут обнаружить инженеры по телеметрии. Например, прогоревшую стенку двигателя, или утечку топлива из баков. Или неминуемый отказ систем. В таком случае у команды будет несколько минут на принятие решения. Можно срочно свести корабль с орбиты и вернуться. Но иногда можно выполнить миссию, несмотря на возникшие проблемы! Давайте имитируем такую ситуацию.\n  Задача миссии: пролететь мимо Муны и вернуться. Но на орбите ЦУП обнаруживает проблему: через 30 минут откажут двигатели, возможно воспламенение топлива и взрыв. А это означает либо немедленное возвращение назад, либо... прожиг к Муне, обеспечивающий траекторию возврата в атмосферу и посадку, без дополнительных маневров. Аварийные ступени после маневра придется отсоединить - пролетать Муну и возвращаться будет только капсула с экипажем! Правда, есть нюанс: при выходе на орбиту, время до маневра может меняться, в зависимости от высоты орбиты и периода. Можно не успеть, тогда возвращение будет единственным выходом.\n  Вам предстоит собрать корабль для пролета Муны. Рекомендуем прикрепить на капсулу маневровые РСУ - вдруг вам потребуется маленькая коррекция? Наличие теплового щита и парашюта обязательно, и убедитесь что есть как минимум 60 единиц аблятора. Возвращение с Муны без торможения двигателем будет опасным!
	
	synopsis = Подготовьте ракету для пролета мимо Муны. Уложитесь в заданное время и выполните маневр, позволяющий пролететь мимо Муны и вернуться домой безопасно (перицентр траектории возврата должен быть в пределах 50-35 км, в атмосфере), после чего отстыкуйте капсулу (предполагая, что ступени с двигателями и остатками топлива могут взорваться). После истечения таймера двигателей на аппарате быть не должно!
	
	completedMessage = Наши поздравления! Ваше хладнокровие в напряженной ситуации спасло миссию от провала - задача успешно выполнена, несмотря на аварию!

	maxCompletions = 1
	cancellable = true
	declinable = true
	prestige = Exceptional
	targetBody = HomeWorld()
	rewardScience = 5
	rewardReputation = 10
	rewardFunds = 55000.0
	advanceFunds = 5000.0
	
	REQUIREMENT
	{
		name = FlyBy
		type = FlyBy
		targetBody = HomeWorld().Children().First()
		checkType = MANNED
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = EmergencyRCS
	}
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		DIALOG_BOX
		{
			title = Сообщение об аварии
			condition = PARAMETER_COMPLETED
			parameter = ReachOrbit
			position = CENTER
			INSTRUCTOR
			{
				name = Strategy_MechanicGuy
				showName = true
				animation = false_sadA
			}
			TEXT
			{
				text = Внимание, телеметрия показывает расплавление изоляции в электрической цепи управления двигателями. У вас есть 30-40 минут, потом провода замкнет, управление будет блокировано, возможно воспламенение и взрыв топливных баков. Уходите с орбиты и отделяйте капсулу!
			}
		}
	}
	PARAMETER
	{
		name= MainSequence
		type = Sequence
		title = Старт и полет 13-го
		failWhenCompleteOutOfOrder = true
		PARAMETER
		{
			name = Prelaunch
			type = All
			title = Проверка на старте: ракета готова к полету!
			PARAMETER
			{
				name = NewVessel
				type = NewVessel
				hidden = true
			}
			PARAMETER
			{
				name = HasCrew0
				type = HasCrew
