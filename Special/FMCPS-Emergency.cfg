				hideChildren = true
			}
			PARAMETER
			{
				name = HasParachute
				type = PartValidation
				partModule = ModuleParachute
				minCount = 1
				title = Есть парашют
				hideChildren = true
			}
			PARAMETER
			{
				name = HasMono
				type = HasResource
				resource = MonoPropellant
				minQuantity = 0.0
				maxQuantity = 10.0
				title = не более 10 единиц монотоплива
				hideChildren = true
			}
			PARAMETER
			{
				name = HasAblator
				type = HasResource
				resource = Ablator
				minQuantity = 60.0
				maxQuantity = 250.0
				title = Есть аблятор (минимум 60)
				hideChildren = true
				hidden = true
			}
		}
		PARAMETER
		{
			name = ReachOrbit
			type = VesselParameterGroup
			title = Выйти на орбиту: апоцентр не выше 96, перицентр не ниже 80км
			hideChildren = true
			duration = 10s
			PARAMETER
			{
				name = Orbit0
				type = Orbit
				minPeA = 80000
				maxApA = 96000
				title = Вывести на орбиту: апоцентр не выше 96, перицентр не ниже 80км
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = HasMono
				type = HasResource
				resource = MonoPropellant
				minQuantity = 0.0
				maxQuantity = 10.0
				title = не более 10 единиц монотоплива
				hideChildren = true
				hidden = true
			}
		}
		// Главная часть...
		PARAMETER
		{
			name = WinOrLose
			type = VesselParameterGroup
			title = За 38 минут надо построить маневр к Муне и выполнить его. Отстрелить аварийные ступени и отправиться к Муне (и назад) без двигателей, по достигнутой траектории. И осторожнее с отделением - толчок отделителя может все испортить! Надеюсь, маневровые двигатели у вас есть?
			completeInSequence = true
			PARAMETER
			{	//как показала проверка, на орбите 87км период около 30 мин. Накинем еще 8 для запаса.
				name = CheckOrbit
				type = Duration
				duration = 38m
				preWaitText = ожидаем выхода на орбиту
				waitingText = До взрыва:
				completionText = Бум!
				startCriteria = PARAMETER_COMPLETION
