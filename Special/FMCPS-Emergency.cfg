				//disableOnStateChange = true
			}
			PARAMETER
			{	//выполнится немедленно после таймера, и не раньше. Если мы не удаляемся - значит маневра не было, провал!
				name = LeavingHome
				type = ReachState
				targetBody = @/targetBody
				minRateOfClimb = 20
				title = Удаляемся от Кербина...
				completeInSequence = true
				failWhenUnmet = true
			}
			PARAMETER
			{
				name = NoEngines
				type = PartValidation
				partModule = ModuleEnginesFX
				partModule = ModuleEngines
				minCount = 0
				maxCount = 0
				hideChildren = true
				title = Никаких двигателей!
			}
		}
		PARAMETER
		{	//если выполнится вне очереди - на отдалении в 3500000 у нас еще остались двигатели. Это провал!
			name = LeavingHome2
			type = ReachState
			targetBody = @/targetBody
			minAltitude = 3500000
			title = Удаляемся от Кербина... провал если к этому моменту остались двигатели
			disableOnStateChange = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = ReachMun
			type = ReachState
			targetBody = HomeWorld().Children().First()
			disableOnStateChange = true
			title = Пролететь мимо луны!
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			targetBody = @/targetBody
			title = Вернуться на Кербин
			hideChildren = true
		}
	}
}
CONTRACT_TYPE
{
	name = EmergencyJump
	title = Аварии: прыжок с парашютом
	
	group = FMCP
	
	sortKey = 300
	
	description = Если вы забыли прикрепить парашют к кораблю (или его оторвало в полете), то у вас проблемы. Но если у вас весь экипаж - единственный кербал, он же пилот - все не так плохо! У наших астронавтов есть персональный парашют! И в критической ситуации пилот может покинуть корабль в атмосфере. Можно даже спасти собранные научные данные из капсулы. Давайте смоделируем такую ситуацию!\n  Вам потребуется: капсула, ровно 1 пилот (и никого кроме пилота), минимальный двигатель или твердотопливный ускоритель, способные закинуть капсулу на достаточную высоту, и обязательно проверьте, что у пилота есть парашют (многие оставляют его дома)! На самой капсуле парашют можете не ставить - все равно она разобъется.\n Поднимайте аппарат в воздух. На высоте около 5-8км вылезайте из кабины и отправляйтесь в свободный полет. Раскройте парашют. Когда он полностью раскроется (обычно на высоте 1 км), вы получите управляемый планер, позволяющий приземлиться в нужную вам точку. Перед посадкой погасите горизонтальную скорость сменой направления или наклоном, потом разверните плоскость строго параллельно поверхности (для этого и делать ничего не надо - отпустите управление, горизонтальная ориентация купола естественное поведение). Вас может немного протащить по земле, но наши пилоты крепкие, и не такое выдерживали! Готовы испытать парашют в деле? А приземлиться точно на вертолетную площадку на крыше ЦВС? Да, звучит как вызов.
	synopsis = Запустите капсулу с 1 пилотом в полет, на высоте от 5 до 8 км вылезайте из кабины и верните пилота на поверхность на индивидуальном парашюте. Конечно пилот должен выжить!
	completedMessage = Прыжок с парашютом, рискованно, но прекрасно! Повторим?

	maxCompletions = 1
	cancellable = true
	declinable = true
	prestige = Significant
	targetBody = HomeWorld()
	rewardScience = 0
	rewardReputation = 3
	rewardFunds = 12500.00
	advanceFunds = 2500.0
	REQUIREMENT
	{
		name = ReturnFromOrbit
		type = ReturnFromOrbit
		targetBody = @/targetBody
		checkType = MANNED
	}
	REQUIREMENT
	{
		name = PossibleEVA
		type = Facility
		facility = AstronautComplex
		minLevel = 2
	}
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Поднимите аппарат с пилотом на борту на высоту от 5 до 10 км. Или опустите, если десантируетесь с орбиты
		PARAMETER
		{
			name = HasPilot
			type = HasCrew
			title = Экипаж: 1 пилот (с парашютом!)
			trait = Pilot
			minCrew = 1
			maxCrew = 1
			//disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = @/targetBody
			situation = FLYING
			minAltitude = 5000
			maxAltitude = 10000
			disableOnStateChange = true
			hideChildren = true
			hidden = true
		}
		//completeInSequence = true
		//disableOnStateChange = false
		hideChildren = true	
	}
	// есть засада... взлетели на чем угодно - готово 1. Вышли в люк при посадке - 2. После посадки - 3
	// То есть нормальное поведение ради "отчет в полете низко" и "образец почвы". И без прыжка.
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Вылезайте из кабины и отправляйтесь в свободное падение.
		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = @/targetBody
			situation = FLYING
			maxAltitude = 6000
			hideChildren = true
			//hidden = true
		}
		PARAMETER
		{
			name = VesselIsType
			type = VesselIsType
			vesselType = EVA
			hideChildren = true
			hidden = true
		}
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true	
	}
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Раскройте парашют, и опуститесь на поверхность, невредимым!
		PARAMETER
		{
			name = VesselIsType
			type = VesselIsType
			vesselType = EVA
			hideChildren = true
			hidden = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = @/targetBody
			situation = LANDED
			situation = SPLASHED
			hideChildren = true
			title = Приземлитесь или приводнитесь на поверхность.
			hidden = true
		}
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = Невредимым!
			//countMax = 0
			hideChildren = true	
			hidden = true
		}
		completeInSequence = true
		hideChildren = true	
	}
}
CONTRACT_TYPE
{
	name = EmergencyRCS
	title = Аварии: без топлива на орбите
	
	group = FMCP
	
	sortKey = 301
	
	description = Представляете, корабль выходит на орбиту, а двигатели не работают, или топливо внезапно кончилось? На суб-орбитальной траектории можно отстрелить капсулу и приземлиться, где получится. Но если авария произошла на орбите - наш астронавт окажется в неприятном положении! Но если у вас есть маневровые двигатели... Вы знаете про маленькие монотопливные двигатели для корректировки курса? Несмотря на свой размер и малую тягу, их можно перенастроить, а 10 единиц монотоплива для малой капсулы - это очень много. Хватит, чтобы увести корабль с орбиты!\n  Давайте отработаем такую ситуацию. Вам потребуется:\n - 1 парашют для приземления,\n - 1 капсула Mk1,\n - 10 единиц монотоплива (стандартная заправка капсулы),\n - 2 малых РСУ типа "Куда-попало" или "Где-угодно", прикрепленные либо сверху, либо снизу, симметрично от оси,\n - 1 отделитель типа ТД-12, чтобы отстрелить двигатели и баки,\n - и собственно баки с топливом и двигатель! Подберите двигатель и запас топлива, достаточный для выхода на орбиту с апоцентром не выше 100км, и перицентром выше 90. А на орбите - отказ систем! все двигатели отказали, баки пусты! Что делать?\n  Без паники, отстреливаем капсулу. Потом перенастройте РСУ в режим "главного двигателя". Разверните капсулу соплами РСУ против движения (в зависимости от того, куда именно вы их поставили). А теперь включите РСУ и дайте тягу, как если бы двигатель был. Или воспользуйтесь обычным включением маневровых - клавиши H или N. 10 монотоплива для капсулы Мк1 с пилотом и 2мя РСУ - хватит, чтобы понизить перицентр до плотных слоев атмосферы. А дальше капсула затормозится о воздух и нас ждет обычная посадка. Готовы опробовать монотопливо в деле? тогда вперед!
	
	synopsis = Вывести специально подготовленную ракету на орбиту требуемой высоты. Имитируя отказ систем, отстрелить капсулу с пилотом и парашютом. Двигателей оставаться не должно! Развернуться соплами маневровых РСУ против направления на орбите и сжечь имеющееся монотопливо для снижения. Вернуть капсулу и астронавта домой.
	
	completedMessage = Не имея двигателей кроме РСУ, и всего 10 единиц монотоплива, вы смогли сойти с орбиты и приземлиться!

	maxCompletions = 1
	cancellable = true
	declinable = true
	prestige = Significant
	targetBody = HomeWorld()
	rewardScience = 0
	rewardReputation = 5
	rewardFunds = 22500.00
	advanceFunds = 2500.0
	
	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		part = RCSLinearSmall
		part = linearRcs
	}
	REQUIREMENT
	{
		name = ReturnFromOrbit
		type = ReturnFromOrbit
		targetBody = @/targetBody
		checkType = MANNED
	}
	PARAMETER
	{
		name = Prelaunch
		type = All
		title = Проверка на старте: ракета готова к испытаниям!
		PARAMETER
		{
			name = NewVessel
