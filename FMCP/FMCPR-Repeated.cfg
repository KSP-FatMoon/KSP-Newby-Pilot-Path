CONTRACT_TYPE
{
	name = Rpt_TrainCrewMedium
	title = Тренировка для команды
	group = FMCP
	description = Мы подумали и решили, что наша команда нуждается в тренировке и повышении уровня. Выбирайте самых необученных и отправляйте получать звезды на погоны! А мы еще и приплатим, чтобы был стимул. Слушайте задание:\n  Командой из 3 кербонавтов, из которых обязательно 1 пилот, 1 ученый и 1 инженер, на одном корабле, за 1 полет: взлететь с Кербина, выйти на орбиту, и посетить в любом порядке орбиты Муны, Минмуса, и Солнца. После чего вернуться домой. Участникам полета после возвращения будет выдан бонус: +2 очка опыта, каждому. Выбирайте новичков - опасностей не предвидится, специальных операций тоже. Просто большое путешествие - туда и обратно.\n\n Посчитав на калькуляторе, научный консультант предложил варианты: Кербин-Минмус-Солнце-Муна-Кербин и более долгий и затратный маршрут Кербин-Минмус-Муна-Солнце-Кербин. Все остальные варианты (сначала Муна, или сначала Солнце) выдали ЕГГОГ, наверно калькулятор устаревшей модели... Но это на ваше усмотрение, ракету вы строите сами, время для старта выбираете сами. И последовательность полета тоже за вами - нам главное выполнение.
	sortKey = 505
	synopsis = Соберите команду для тренировки и отправьте на надежном корабле к орбитам Муны, Минмуса и Солнца. Надо побывать у всех перечисленных тел, в любом порядке, после чего вернуться домой. Обязательно наличие 3 кербонавтов разных профессий, начального или 1 уровня, наградой будет +2 очка опыта в дополнение к полученному за полет.
	completedMessage = Невероятно, вы сделали это! Надеемся, что со временем обучим всех - а это простое задание станет стандартом для тренировок.
	
	// примечание: никто не запрещает отправить корабль на 10 человек,
	// из которых строго 1 пилот с 1 звездой, 1 инженер с 1 звездой, и 1 ученый с 1 звездой.
	// А остальные - матерые волки, желающие примазаться к тренировкам и получить +2 опыта. Но начисляется тем, кто выполнил всю миссию.
	// То есть посадить тоже надо будет 1 аппарат со всеми, а не по частям. Если игрок готов на это пойти - заслужил, однозначно!
	// НО есть сомнения, даст ли опыт повторное выполнение. Возможно, что условный Джеб, полетевший во второй раз, уже ничего не получит.
	
	minExpiry = 4
	maxExpiry = 6
	deadline = 3650
	maxCompletions = 5
	cancellable = true
	declinable = true
	prestige = Significant
	targetBody = @/target0
	maxSimultaneous = 1
	rewardScience = 25
	rewardReputation = 25
	rewardFunds = 120000.00
	failureReputation = 0.0
	failureFunds = 0.0
	advanceFunds = 10000.0
	REQUIREMENT
	{
		name = ReturnFromOrbit
		type = ReturnFromOrbit
		targetBody = @/target1
		checkType  = MANNED
		title = Сначала вернитесь хотя бы 1 раз с орбиты Муны
	}
	REQUIREMENT
	{
		name = ReturnFromOrbit
		type = ReturnFromOrbit
		targetBody = @/target2
		checkType  = MANNED
		title = Сначала вернитесь хотя бы 1 раз с орбиты Минмуса
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/target0.HaveReached()
		title = Сначала надо достичь СТ Солнца, любым аппаратом
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = Rpt_TrainCrewMedium
		cooldownDuration = 12d
	}
	DATA
	{
		type = CelestialBody
		target0 = HomeWorld().Parent()
		target1 = HomeWorld().Children().First()
		target2 = HomeWorld().Children().Last()
		hidden = true
	}
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		parameter = MediumTourMission
		experience = 2	//это повторяющееся задание, +2 хватит за глаза. Можно будет выполнить 5 раз, прокачав 15 кербалов.
	}
	PARAMETER
	{
		name = MediumTourMission
		type = VesselParameterGroup
		title = Наберите команду новичков для тренировки (пилот, инженер и ученый не выше 1 уровня), отправьте по всем пунктам задания и верните их живыми (всех вместе, на 1 корабле, включая посадку)
		PARAMETER
		{
			name = CheckPilot
			type = HasCrew
			trait = Pilot
			minCrew = 1
			maxExperience = 1
			hideChildren = true
			disableOnStateChange=false
			title = На борту должен быть 1 пилот, не более чем 1 уровня
		}
		PARAMETER
		{
			name = CheckEngineer
			type = HasCrew
			trait = Engineer
			minCrew = 1
			maxExperience = 1
			hideChildren = true
			disableOnStateChange=false
			title = На борту должен быть 1 инженер, не более чем 1 уровня
		}
		PARAMETER
		{
			name = CheckScientist
			type = HasCrew
			trait = Scientist
			minCrew = 1
			maxExperience = 1
			hideChildren = true
			disableOnStateChange=false
			title = На борту должен быть 1 ученый, не более чем 1 уровня
		}
		PARAMETER
		{
			name = OrbitKerbin
			type = ReachState
			targetBody = HomeWorld()
			situation = ORBITING
			title = Побывать на орбите Кербина
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitMun
			type = ReachState
			targetBody = @/target1
			situation = ORBITING
			title = Побывать на орбите Муны
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitMinmus
			type = ReachState
			targetBody = @/target2
			situation = ORBITING
			title = Побывать на орбите Минмуса
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = VisitSol
			type = ReachState
			targetBody = @/target0
			title = Посетить СТ Солнца
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Вернуться на Кербин, не потеряв никого по пути
			hideChildren = true
		}
	}
}
CONTRACT_TYPE
{
	name = Rpt_TrainCrewHard
	title = Посетить луну соседней планеты
	group = FMCP
	description = По сравнению с тем, что вы уже делали, это будет просто! Экзамен на настоящего кербонавта: посетить соседнюю планету, приземлиться на поверхность ее спутника, и доставить нам образец грунта. Да, это долгое путешествие, но в награду весь экипаж получит дополнительный опыт!
	sortKey = 506
	synopsis = Отправьте корабль к @/targetBody и доставьте нам образец почвы с поверхности @/targetMun
	completedMessage = Ваша награда определенно заслужена! А наши ученые с жадностью набросились на новые образцы.
	
	// примечание: очевидно, что корабль должен быть пилотируемым (образец почвы!). Но поскольку некоторые моды (и Тантарес в частности)
	// имеют прибор для беспилотного взятия образцов, будем требование наличия команды. Как и в простом туре по лунам Кербина и Солнцу,
	// можно отправить любое количество экипажа, и опыт получат все, кто присутствует на корабле, доставившем образец.
	// и да, можно попытаться сжульничать: не знаю, как оно поведет себя, если переложить образец в другую капсулу...
	// НО образец должен быть получен (полет состоялся) и должен быть перехват на орбите (еще и дельта на закругление вокруг Кербина)
	// - короче, я бы не пытался. Можно пролететь с выполнением.
	
	minExpiry = 4
	maxExpiry = 6
	deadline = 8500
	maxCompletions = 0	//неограниченное выполнение. На поздней стадии можно качать команду до 5 звезд, но это уже не так актуально
	cancellable = true
	declinable = true
	prestige = Significant
	targetBody = @/target
	maxSimultaneous = 1
	rewardScience = 40
	rewardReputation = 35
	rewardFunds = 500000.00
	failureReputation = 0.0
	failureFunds = 0.0
	advanceFunds = 75000.0
	REQUIREMENT
	{
		type = Expression
		expression = @/neighbours.Count()>0
		title = должна быть хотя бы 1 посещенная планета с луной, кроме Кербина
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = Rpt_TrainCrewHard
		cooldownDuration = 100d
	}
	DATA
	{
		type = List<CelestialBody>
		orbited = OrbitedBodies().Where(b=> b.IsPlanet()&&b.HasSurface()&&(b.Children().Count()>0))
		neighbours = @orbited.Where(b=> !(b.IsHomeWorld()))
		hidden = true
	}
	DATA
	{
		type = CelestialBody
		target = @/neighbours.Random()
		targetMun = @target.Children().First()
		hidden = true
	}
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		parameter = HardTourMission
		experience = 5
	}
	PARAMETER
	{
		name = HardTourMission
		type = VesselParameterGroup
		title = Отправьте пилотируемый аппарат к @/targetBody и привезите домой образец грунта @/targetMun
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			hideChildren = true
			disableOnStateChange=false
			title = Должна быть команда (минимум 1 кербал)
		}
		PARAMETER
		{
			name = OneMoreSample
			type = CollectScience
			targetBody = @/targetMun
			experiment = surfaceSample
			recoveryMethod = Recover
			hideChildren = true
			title = Соберите образец почвы ( @targetBody ), и доставьте на Кербин
		}
	}
}