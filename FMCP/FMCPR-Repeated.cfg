	completedMessage = Вот это мы понимаем, научная взаимопомощь!
	minExpiry = 3
	maxExpiry = 7
	deadline = 1000
	maxCompletions = 20
	maxSimultaneous = 1
	cancellable = true
	declinable = true
	prestige = Trivial
	rewardFunds = @/calculatedFunds
	rewardScience = @/calculatedScience
	rewardReputation = 10.0
	failureFunds = 1000 + @/calculatedFunds * 0.25
	failureReputation = 5.0
	advanceFunds = 1000.0
	DATA
	{
		type = CelestialBody
		targetBody = ReachedBodies().Random()
		title = случайный выбор из домашней планеты и любых посещенных
		//title required for this data
	}
	DATA
	{
		type = double
		multiplier = @/targetBody.Multiplier()
		calculatedFunds = 5000.0 * @multiplier
		calculatedScience = 5.0 * @multiplier
	}
   PARAMETER
	{
		name = CollectScience
		type = CollectScience
		targetBody = @/targetBody
		//minScience = 0.5
		//minScienceValue = 0.5
		title = Собрать НОВЫЕ научные данные с @/targetBody или космоса вокруг
		recoveryMethod = RecoverOrTransmit
		//recoveryMethod = Ideal
		hideChildren = true
	}
	REQUIREMENT
	{
		name = Expression
		type = Expression
		expression = ReachedBodies().Count() > 1
		title = Должно быть открыто хотя бы одно тело кроме Кербина
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = Rpt_science
		cooldownDuration = 5d
	}
}
