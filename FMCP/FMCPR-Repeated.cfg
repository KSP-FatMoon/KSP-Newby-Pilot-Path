	{
		type = CompleteContract
		minCount = 0
		contractType = Rpt_launch
		cooldownDuration = 5d
	}
}
// *** Get more science! sponsors
CONTRACT_TYPE
{
	name = Rpt_science
	title = Больше науки!
	genericTitle = Больше науки!
	group = FMCP
	
	sortKey = 501
	
	description = Один из НИИ хочет получить новые данные с @/targetBody, или космоса вокруг. И готовы поделится в обмен своими исследованиями. Рекомендуем не отказываться от такого предложения - наверняка хоть какие-то новые данные мы еще получим, правда?
	genericDescription = Мы хотим получить НОВЫЕ данные с одного из уже посещенных небесных тел
	synopsis = Собрать НОВЫЕ научные данные с @/targetBody, или космоса вокруг, передать или вернуть.
	completedMessage = Вот это мы понимаем, научная взаимопомощь!
	minExpiry = 3
	maxExpiry = 7
	deadline = 1000
	maxCompletions = 20
	maxSimultaneous = 1
	cancellable = true
	declinable = true
	prestige = Trivial
    rewardFunds = @/calculatedFunds
    rewardScience = @/calculatedScience
    rewardReputation = 10.0
    failureFunds = 1000 + @/calculatedFunds * 0.25
    failureReputation = 5.0
	advanceFunds = 1000.0
	DATA
    {
        type = CelestialBody
        targetBody = ReachedBodies().Random()
		title = случайный выбор из домашней планеты и любых посещенных
		//title required for this data
    }
	DATA
	{
		type = double
        multiplier = @/targetBody.Multiplier()
        calculatedFunds = 5000.0 * @multiplier
        calculatedScience = 5.0 * @multiplier
    }
   PARAMETER
    {
        name = CollectScience
        type = CollectScience
        targetBody = @/targetBody
        //minScience = 0.5
		//minScienceValue = 0.5
        title = Собрать НОВЫЕ научные данные с @/targetBody или космоса вокруг
        recoveryMethod = RecoverOrTransmit
		//recoveryMethod = Ideal
		hideChildren = true
    }
    REQUIREMENT
    {
        name = Expression
        type = Expression
        expression = ReachedBodies().Count() > 1
        title = Должно быть открыто хотя бы одно тело кроме Кербина
    }
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = Rpt_science
		cooldownDuration = 5d
	}
}
// *** Flag planting repeat
CONTRACT_TYPE
{
	name = Rpt_flag1
	title = Поставить флаг на поверхность @/RandomBody
	genericTitle = Поставить флаг на уже посещенное тело
	group = FMCP
	
	sortKey = 502
	
	//description = [ожидаем генерации случайного описания!]
	genericDescription = Мы хотим поставить флаг на уже посещенное тело
	topic = Запуск
    subject = @/RandomBody
	
	synopsis = Мы хотим чтобы вы поставили флаг на поверхности @/RandomBody
	completedMessage = Ураа!
	minExpiry = 3
	maxExpiry = 7
	//deadline = 0
	maxCompletions = 10
	maxSimultaneous = 1
	cancellable = true
	declinable = true
	prestige = Significant
    rewardFunds = @/calculatedFunds
    rewardScience = @/calculatedScience
    rewardReputation = 10.0
	advanceFunds = @/calculatedAdvance
    failureFunds = @advanceFunds + @rewardFunds * 0.1
    failureReputation = 5.0
	DATA
	{	//exclude sol :)
		type=CelestialBody
		RandomBody = ReachedBodies().Exclude(HomeWorld()).Exclude(HomeWorld().Parent()).Random()
		title = любое посещенное (кроме домашней планеты)
	}
	DATA
	{
		type = double
        multiplier = @/RandomBody.Multiplier()
        calculatedFunds = 35000.0 * @multiplier
        calculatedScience = 10.0 * @multiplier
		calculatedAdvance = 5000 * @multiplier
    }
	PARAMETER
	{
		name = PlantFlag
		type = PlantFlag
		targetBody = @/RandomBody
		title = Поставить флаг на @/RandomBody
		hideChildren = true
	}
    REQUIREMENT
    {
        name = Expression
        type = Expression
        expression = ReachedBodies().Count() > 1
        title = Должно быть открыто хотя бы одно тело кроме Кербина
    }
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = Rpt_flag1
		cooldownDuration = 8d
	}
}
