// Набор миссий на ретрансляторы вокруг Кербина и разнообразные орбиты
// 1. Экваториальная
CONTRACT_TYPE
{
	name = FMCP_Orbit01
	group = FMCP_Satellites
	
	title = Идеальная экваториальная орбита
	
	sortKey = 200
	
	description = Ага, вам удалось вывести спутник на орбиту. Да, в первый раз это достижение. Но вообще задача тривиальная, зная как и имея нужные детали. Давайте пройдем курс по орбитам, а заодно обеспечим нашу планету покрытием спутниковой связи!\n Самая простая орбита - экваториальная, с наклонением 0. Давайте сделаем ее идеальной - круг, а не какой-то там эллипс. И наклонение ровно 0! А чтобы вы не потерялись, орбиту заранее заложим в бортовой компьютер - он отобразит ее в режиме карты. Все что нужно - подогнать свою орбиту под заданную виртуальную. Тут чуть-чуть уменьшить, там чуть-чуть выровнять.\n И нам нужны ретрансляторы. Поэтому требуем от спутника наличие электричества (100 единиц минимум), солнечные панели, чтобы подзаряжать батарею, и наличие антенны-ретранслятора. О мой бог, вы не знаете что такое ретранслятор? Это тоже антенна, и с ее помощью тоже можно передавать данные. Но главное не в этом! Предположим, у вас антенна мощностью 500км, дальше не достает. Значит ли это, что мы не улетим дальше 500км от станции слежения? Конечно нет, если добавить ретранслятор! Выведем ретранслятор помощнее на орбиту, и спутники со слабыми антеннами могут летать на расстояние (дальность слабой антенны + расстояние от ретранслятора до другого ретранслятора + до станций связи на поверхности Кербина)! Да-да, ретрансляторы могут передавать сигнал между собой, и если построить цепочку из нескольких, мы наверняка дотянемся до самых далеких планет.
	genericDescription = Вывести ретранслятор на заданную орбиту
	synopsis = Спутник должен иметь солнечные батареи и антенну-ретранслятор. Выведите его на заданную орбиту с минимальными отклонениями.
	completedMessage = Успех! Теперь наши беспилотные аппараты будут обеспечены связью.
	
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld()
	prestige = Trivial
	rewardScience = 3
	rewardReputation = 3
	rewardFunds = 50000
	advanceFunds = 5000
	
	REQUIREMENT
	{
		name = Orbit
		type = Orbit
		targetBody = @/targetBody
		checkType = UNMANNED
	}
	DATA
	{
		type = double
		targetSMA = (@/targetBody.Radius() + @/targetBody.SpaceAltitudeThreshold()) * 2
	}
	BEHAVIOUR
	{
		name = OrbitGenerator
		type = OrbitGenerator
		FIXED_ORBIT
		{
			targetBody = @/targetBody
			//type = EQUATORIAL
			//altitudeFactor = 0.1
			//inclinationFactor = 0.0
			//deviationWindow = 6.0
			ORBIT
			{
				SMA = @/targetSMA		//1100000
				ECC = 1.0E-6
				INC = 0
				LPE = 0
				LAN = 0.001
            //MNA = 1.55872660382504
            //EPH = 31.3999999999994
            //REF = 1
			}
		}
	}
	PARAMETER
	{
		name = NewRelay
		type = VesselParameterGroup
		title = Ретранслятор на экваториальной орбите Кербина
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустить новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = Nocrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Беспилотный
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSolarPanel
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			minCount = 1
			title = Есть солнечные панели
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAntenna
			type = HasAntenna
			antennaType = RELAY
			minAntennaPower = 4000000.0		// первый стоковый ретранслятор - 5М
			title = Есть антенна-ретранслятор
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachSpecificOrbit
			type = ReachSpecificOrbit
			displayNotes = true
			index = 0
			deviationWindow = 5.0
			title = Вывести ретранслятор на заданную орбиту
		}
	}
}
