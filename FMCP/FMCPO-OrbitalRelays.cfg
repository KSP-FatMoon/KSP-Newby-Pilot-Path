	description = Ретранслятор на экваториальных орбитах замечательно покрывает пояс по экватору и субтропики. Но чем ближе к полюсам, тем хуже связь. А сами полюса и полярный круг вообще оказываются в "тени" (проведите касательную от спутника к планете, и вы поймете почему)! Второй интересный момент - наш спутник пролетает только над экватором, но есть же и другие интересные места! Тундра, пустоши, полярный ледник и полюса никогда не окажутся под экваториальной орбитой, и останутся неизученными. Есть замечательное решение - полярная орбита! Если наклонение орбиты перпендикулярно экватору (90 градусов), и спутник пролетает над обоими полюсами, по пути, рано или поздно - на втором витке или на 142 - он пройдет над каждой точкой нашей планеты. Идеально для картографии!
