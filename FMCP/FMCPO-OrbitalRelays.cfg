// 6. Тундра
CONTRACT_TYPE
{
	name = FMCP_Orbit06
	group = FMCP_Satellites
	
	title = Орбита "Тундра"
	
	sortKey = 225
	
	description = Особая высоко-эллиптическая синхронная орбита называется ТУНДРА. Знаете почему? потому что обеспечивает длительное нахождение спутника над крайне-северными или крайне-южными областями, там где тундра и ледник. Из-за вытянутости, скорость спутника меняется от медленного движения в апоцентре до стремительного пролета в перицентре. И большую часть времени спутник висит над северными или южными широтами, медленно поднимаясь и опускаясь к/от высшей точки. Будет несправедливо оставить без спутниковой связи жителей полярного круга, спутника на полярной орбите (который половину времени пролетает над северным, а вторую половину - над южным полушарием) им точно недостаточно!
	genericDescription = Вывести ретранслятор на заданную орбиту
	notes = Из-за существенного наклонения, может быть будет выгоднее выходить на полярную орбиту и разворачиваться, если вы не сможете прицелится точно с правильным углом.
	synopsis = Спутник должен иметь солнечные батареи и антенну-ретранслятор. Выведите его на заданную орбиту с минимальными отклонениями.
	completedMessage = Успех! Полярный круг обеспечен связью!
	
	maxCompletions = 1
	cancellable = false
	declinable = false
