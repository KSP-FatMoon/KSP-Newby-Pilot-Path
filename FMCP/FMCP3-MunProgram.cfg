	title = Пилотируемый пролет @/targetMoon
	genericTitle = Пилотируемый пролет мимо луны
	sortKey = 34
	
	description = План полета проще простого: запустить новый корабль с экипажем, войти в сферу тяготения @/targetMoon, провести эксперименты (как минимум доклад экипажа и отчет EVA), и вернуться домой. Рекомендуем исключительно высокую траекторию, чтобы один-единственный разгонный маневр у @/homePlanet вывел бы нас на траекторию пролета и дальше на суборбитальную траекторию, приводящую к посадке. Остатки топлива используйте для мелких маневров, коррекции траектории входа в атмосферу и торможения - чтобы не влететь в плотные слои, набрав скорость пули. Научный отдел не рекомендует пытаться выйти на орбиту @/targetMoon, орбита в дальнейших планах. Отчет об обстановке при пролете должен быть передан по радио - убедитесь что есть антенна и достаточно энергии для передачи!
	synopsis = Пролететь мимо @/targetBody и вернуться домой, передав по радио отчет из космоса высоко над @/targetMoon
	completedMessage = Отлично! Открываем программу "НАполлон", инженеры уже начали расчеты по посадке и возврату.
	
