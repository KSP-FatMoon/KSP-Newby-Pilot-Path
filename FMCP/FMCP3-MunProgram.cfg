CONTRACT_TYPE
{
	name = FMCP20
	group = FMCP_Muns
	
	title = Беспилотный пролет @/targetMoon - 1
	genericTitle = Беспилотный пролет мимо луны (1)
	sortKey = 30
	
	description = Задача проще простого: запустить зонд, отправить его к @/targetMoon, пролететь мимо, b вернуться на поверхность @/homePlanet. По нашим расчетам, потребуется около 860 dV, или даже меньше. Дальше все сделает орбитальная механика. На первый раз не будем рисковать ценными приборами - достаточно вернуть аппарат.\n  Хотя мы не требуем передачи научных данных, нужна антенна для дистанционного управления, запас энергии на борту и любой способ ее восстановления - например, солнечные панели. Ожидается, что полет займет около 2 суток, и зонд должен быть управляемым, чтобы раскрыть парашют.\n\n  Инженеры предлагают активировать парашют сразу после маневра - если задать давление для раскрытия не менее 0.2 атмосферы, уже активированный парашют раскроется только при возвращении! Тогда можно обойтись минимумом - парашют, беспилотный блок, тепловой щит. На орбите будет полный запас энергии от генераторов двигателя, а после маневра, если все правильно рассчитать, отключение бортового компьютера уже ни на что не повлияет - аппарат полетит по заданной траектории неуправляемым, а возвращаясь в атмосферу, сам развернется по движению тепловым щитом. Когда скорость упадет до безопасной, а давление достигнет заданного предела, раскроется парашют и опустит зонд на поверхность. План выглядит надежным, не потребуется ни антенн, ни батарей, ни солнечных панелей. Попробуйте. Только убедитесь что перицентр при возврате достаточно высоко, иначе щит нас не спасет.
	synopsis = Запустить беспилотный зонд в полет мимо @/targetBody и вернуть его домой.
	completedMessage = Просто фантастика, у вас получилось! Зонд после пролета @/targetBody передан ученым

	// перицентр при возврате должен быть от 36 до 41 км. Иначе зонд взрывается от перегрева (или 2й круг)
	// при выполнении 1й части (пролет) группа остается выполненной - т.е. вернуть можно любой другой зонд

	maxCompletions = 1
	cancellable = true	//false
	declinable = true	//false
	targetBody = @/targetMoon		//HomeWorld().Children().First()
	prestige = Significant
	rewardScience = 15
	rewardReputation = 20
	rewardFunds = 55000
	advanceFunds = 5000
	failureFunds = -5500
	failureReputation = -1
	
	REQUIREMENT
	{
		name = MannedOrbit
		type = Orbit
		targetBody = HomeWorld()
		checkType = MANNED
	}
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
		targetMoon = HomeWorld().Children().First()
		title = Кербин и Муна или их аналоги
	}
	PARAMETER
	{
		name = CrewedMoonFlyby
		type = VesselParameterGroup
		title = Беспилотный пролет @/targetBody и возвращение аппарата
		define = FlyByProbe1		// для запарывания контракта при уничтожении зонда
		dissassociateVesselsOnContractCompletion = true
		dissassociateVesselsOnContractFailure = true
		PARAMETER 
		{
			name = NoCrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Требуется беспилотный аппарат
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyMoon
			type = ReachState
			targetBody = @/targetBody
			title = Войти в сферу тяготения @/targetBody
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = Аппарат должен уцелеть при возвращении!
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			targetBody = HomeWorld()
			title = Вернуть зонд на @/homePlanet
			hideChildren = true
			completeInSequence = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP21
	group = FMCP_Muns
	title = Беспилотный пролет @/targetBody - 2
	genericTitle = Беспилотный пролет мимо луны (2)
	
	sortKey = 31
	
	description = Первый пролет мимо @/targetBody успешно завершен. Пока зонд летел, весь научный отдел задумался, что же сделать дальше? И теперь вам придется запустить еще 3 беспилотных зонда, чтобы проверить все наши теории! На этот раз, оставьте аппарат на высокой орбите. При чем тут пролет мимо @/targetBody? Все дело в экономии топлива! поднять орбиту выше орбиты @/targetBody потребует больше топлива, чем пролететь. А немного изменяя время и длительность прожига для пролета, буквально на секунды, можно добиться любого апоцентра выше орбиты цели после пролета! Останется только закруглить орбиту. Это называется "гравитационный маневр" - войдя в СТ небесного тела, мы получаем небольшой бонус к скорости, в оптимальном случае почти равный скорости движения тела по орбите.\n  Мы полагаем, что зонд, который не собираемся возвращать, без ретрансляторов не имеет смысла. Пусть он послужит нам на этой высокой орбите для дальнейшей связи. Поэтому обязательно поставьте антенну-ретранслятор, батарейки побольше и солнечные панели для их подзарядки! И раз уж собираемся пролететь мимо луны, добавьте любой прибор для научного эксперимента, позволяющего передать результаты по радио. Хотя бы термометр.
	
	synopsis = Пролететь мимо @/targetBody и уйти на высокую орбиту. Спутник должен иметь запас энергии, солнечные батареи и антенну-ретранслятор, и любой научный прибор для сбора данных во время пролета.
	completedMessage = Успех! Во-первых, пролет мимо нашей луны может служить для вывода зондов и ретрансляторов на высокие орбиты...
	
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().First()
	prestige = Significant
	rewardScience = 10
	rewardReputation = 20
	rewardFunds = 65000
	advanceFunds = 5000
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP20
	}
	DATA
	{	// вычислим SMA для высокой орбиты, заведомо выше орбиты луны и не цепляющей SOI
		// однако, поскольку данные об эксцентричности орбиты тела получить не сможем
		// считаем что =0, формулы упрощаются.
		type = double
        munSMA = @/targetBody.SemiMajorAxis()
        //munEcc = @/targetBody.Eccentricity()
        munSOI = @/targetBody.SphereOfInfluence()
        //munMaxDistance = @munSMA * (1.0 + @munEcc)
        TargetSMA = @munSMA + (2.0 * @munSOI)
	}
	BEHAVIOUR
	{
		name = OrbitGenerator
		type = OrbitGenerator
		FIXED_ORBIT
		{
			targetBody = HomeWorld()
			ORBIT
			{
				SMA = @/TargetSMA
				ECC = 1.0E-6
				INC = 0
				LPE = 0
				LAN = 0.001
			}
		}
	}
	PARAMETER
	{
		name = MainSequence
		type = Sequence
		title = Пролет около @/targetBody #2: поднять апоцентр!
		PARAMETER
		{
			name = MoonFlyby
			type = VesselParameterGroup
			title = Пролететь мимо @/targetBody
			//dissassociateVesselsOnContractCompletion = true
			//define = FlyByProbe2
			PARAMETER
			{
				name = NewVessel
				type = NewVessel
				title = Запустить новый аппарат
				hideChildren = true
			}
			PARAMETER 
			{
				name = Nocrew
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Беспилотный
				hideChildren = true
			}
			PARAMETER
			{
				name = HasSolarPanel
				type = PartValidation
				partModule = ModuleDeployableSolarPanel
				minCount = 1
				title = Есть солнечные панели
				hideChildren = true
			}
			PARAMETER
			{
				name = HasAntenna
				type = HasAntenna
				antennaType = RELAY
				minAntennaPower = 4000000.0		// первый стоковый ретранслятор - 5М
				title = Есть антенна-ретранслятор
				hideChildren = true
			}
			PARAMETER
			{
				name = FlybyMoon
				type = ReachState
				targetBody = @/targetBody
				title = Войти в сферу тяготения @targetBody
				hideChildren = true
			}
			PARAMETER
			{
				name = CollectScience
				type = CollectScience
				targetBody = HomeWorld().Children().First()
				recoveryMethod = Transmit
				hideChildren = true
				title = Провести любой эксперимент в СТ @targetBody и передать результаты
				completeInSequence = true
			}
		}
		PARAMETER
		{
			name = RelayDeploy
			type = VesselParameterGroup
			title = Оставить спутник на высокой орбите, имея солнечные панели и ретранслятор
			//vessel = FlyByProbe2
			PARAMETER
			{
				name = HasSolarPanel
				type = PartValidation
				partModule = ModuleDeployableSolarPanel
				minCount = 1
				title = Есть солнечные панели
				hideChildren = true
			}
			PARAMETER
			{
				name = HasAntenna
				type = HasAntenna
				antennaType = RELAY
				minAntennaPower = 4000000.0
				title = Есть антенна-ретранслятор
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachSpecificOrbit
				type = ReachSpecificOrbit
				targetBody = HomeWorld()
				displayNotes = true
				index = 0
				deviationWindow = 10.0
				title = Вывести ретранслятор на заданную орбиту
				hideChildren = true
			}
			//completeInSequence = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP22
	group = FMCP_Muns
	
	title = Беспилотный пролет @/targetBody - 3
	genericTitle = Беспилотный пролет мимо луны (3)
	
	sortKey = 32
	
	description = Финальная орбита не должна быть обязательно высокой! Можно пролететь мимо @/targetBody и вернуться на орбиту ниже. Меняя незначительно момент маневра или длительность прожига, можно получить почти любой перицентр ниже орбиты цели. Давайте разместим следующий ретранслятор примерно на середине расстояния до @/targetBody. Создайте экономный маневр пролета (чтобы получить перицентр при выходе из СТ @/targetBody как можно ближе к нужному нам), а потом выровняйте орбиту до заданной. Это называется "биэллиптический переход". И для некоторых случаев, с использованием гравитации лун или других подходящих тел, он будет выгоднее по топливу, чем увеличение апоцентра до нужной высоты сразу с низкой орбиты.
	
	synopsis = Пролететь мимо и уйти на орбиту ниже орбиты @/targetBody
	completedMessage = Успех! Еще один ретранслятор, так мы обеспечим себя устойчивой связью.
	
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().First()
	prestige = Significant
	rewardScience = 10
	rewardReputation = 25
	rewardFunds = 55000
	advanceFunds = 5000
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP21
	}
	DATA
	{	// вычислим SMA для орбиты примерно посередине между родным миром и первой луной
		// однако, поскольку данные об эксцентричности орбиты тела получить не сможем
		// считаем что =0, формулы упрощаются.
		type = double
        munPeriapsis = @/targetBody.SemiMajorAxis()	// * (1.0 - @/targetBody.Eccentricity())
        munLowestSafePoint = @munPeriapsis - @/targetBody.SphereOfInfluence()
        homeAtmosphere = HomeWorld().AtmosphereAltitude()
        homeRadius = HomeWorld().Radius()
        homeHighestSafePoint = @homeRadius + @homeAtmosphere
        freeSpaceWindow = @munLowestSafePoint - @homeHighestSafePoint
        TargetSMA = @homeHighestSafePoint + (@freeSpaceWindow / 2.0)
	}
	BEHAVIOUR
	{
		name = OrbitGenerator
		type = OrbitGenerator
		FIXED_ORBIT
		{
			targetBody = HomeWorld()
			ORBIT
			{
				SMA = @/TargetSMA
				ECC = 1.0E-6
				INC = 0
				LPE = 0
				LAN = 0.001
			}
		}
	}
	PARAMETER
	{
		name = MainSequence
		type = Sequence
		title = Пролет около @/targetBody #3: поднять перицентр!
		PARAMETER
		{
			name = MoonFlyby
			type = VesselParameterGroup
			title = Пролететь мимо @/targetBody
			//dissassociateVesselsOnContractCompletion = true
			//define = FlyByProbe3
			PARAMETER
			{
				name = NewVessel
				type = NewVessel
				title = Запустить новый аппарат
				hideChildren = true
			}
			PARAMETER 
			{
				name = Nocrew
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Беспилотный
				hideChildren = true
			}
			PARAMETER
			{
				name = FlybyMoon
				type = ReachState
				targetBody = @/targetBody
				title = Войти в сферу тяготения @targetBody
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = RelayDeploy
			type = VesselParameterGroup
			title = Оставить ретранслятор на орбите примерно посередине расстояния до @/targetBody
			//vessel = FlyByProbe3
			PARAMETER
			{
				name = HasSolarPanel
				type = PartValidation
				partModule = ModuleDeployableSolarPanel
				minCount = 1
				title = Есть солнечные панели
				hideChildren = true
			}
			PARAMETER
			{
				name = HasAntenna
				type = HasAntenna
				antennaType = RELAY
				minAntennaPower = 490000.0
				title = Есть ретранслятор
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachSpecificOrbit
				type = ReachSpecificOrbit
				displayNotes = true
				index = 0
				deviationWindow = 10.0
				title = Вывести ретранслятор на заданную орбиту
			}
			//completeInSequence = true
		}
	}
}

