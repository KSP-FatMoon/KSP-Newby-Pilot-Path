		type = VesselParameterGroup
		title = Полет к @/targetBody
		
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Есть экипаж
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAntenna
			type = HasAntenna
			antennaType = TRANSMIT
			minAntennaPower = 20000	//internal = 5000, any direct at least 20K
			title = Есть средство связи для передачи данных
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyMoon
			type = ReachState
			targetBody = @/targetBody	//HomeWorld().Children().First()
			title = Войти в сферу тяготения @/targetBody
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			//targetBody = HomeWorld().Children().First()
			situation = InSpaceHigh
			experiment = evaReport
			recoveryMethod = Transmit
			hideChildren = true
			title = Пролетая мимо @/targetBody, выйти в открытый космос, сделать отчет и передать результаты по радио
			completeInSequence = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			targetBody = HomeWorld()
			title = Вернуться на @/homePlanet после пролета @/targetMoon
			hideChildren = true
			completeInSequence = true
