// manned landing and flag!
CONTRACT_TYPE
{
	name = FMCP28
	group = FMCP_Muns
	
	title = Мунная программа: финальный аккорд
	
	sortKey = 37
	
	description = Муна хранит много тайн, и мы хотим увидеть эти тайны своими глазами, пощупать своими руками! Нам нужен кербал на Муне. Во-первых, наши автоматы еще не научились брать образцы грунта. Во-вторых, вступить на поверхность другого небесного тела - невероятное приключение. А в третьих, пусть на Муне окажется наш флаг. Во имя науки!\n  Отправьте корабль с экипажем на борту. На корабле должны быть: антенна для передачи данных, минимум 100 единиц энергии, и минимум 1 солнечная панель. На научном оборудовании не настаиваем - возьмите любое на ваше усмотрение, живой исследователь сам по себе исключительный научный прибор, доклад об обстановке с поверхности Муны обязателен.\n  Прикрепите посадочные опоры! Мы убедились, что поверхность Муны очень неровная, склоны кратеров неудобны для посадки, и наличие опор даст нашему кораблю хоть какую-то устойчивость.\n  После посадки, ждем передачи по радио доклада экипажа с поверхности и отчета об обстановке. Дальнейшие исследования на ваш выбор, но не перегружайте корабль приборами, мы наверняка еще не раз слетаем к Муне.\n Поставьте флаг! Это вопрос престижа, и вещественное доказательство для скептиков.\n  Закончив исследования, погрузитесь в корабль и взлетайте. Оптимальный маршрут - выход на низкую орбиту Муны и маневр, возвращающий в сферу влияния Кербина. Уйдя к Кербину, снизьте перицентр до 25-35км, чтобы затормозить в атмосфере. Надеюсь, что парашют и тепловой щит у вас будут, без возвращения астронавтов живыми миссия лишена смысла.\n  Научно-технический отдел напоминает: на низкой орбите Кербина для гарантии успешного возвращения с поверхности Муны надо иметь не менее 2850 dV (а лучше 3000, чтобы точно хватило). Конечно, если вы опытный пилот, затраты топлива можно существенно сократить, но ориентируйтесь на это число при постройке.
	synopsis = Отправьте к Муне корабль с экипажем, при-Мунитесь, передайте результаты наблюдений и поставьте флаг. Вернитесь на Кербин, без потерь.
	completedMessage = Да! Маленький шаг кербала - и громадный прыжок для всего кербалечества! Имена отважных кербонавтов навсегда вписаны в историю.
	
	maxCompletions = 1
