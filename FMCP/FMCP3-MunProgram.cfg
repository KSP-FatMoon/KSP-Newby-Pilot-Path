// *** Unmanned Moon Flyby, science and high orbit relay
CONTRACT_TYPE
{
	name = FMCP21
	group = FMCP_Muns
	
	title = Пролететь мимо Муны
	
	sortKey = 30
	
	description = Настало время начать исследование ближайшего к нам космического объекта - @/targetBody ! Сделайте беспилотный аппарат, выведите его на орбиту и направьте к @/targetBody. Вам придется создать маневр, увеличивающий перицентр до орбиты @/targetBody, в нужный момент. После пролета мимо @/targetBody оставьте аппарат на высокой орбите (с апоцентром выше 15000 км) - если добавить солнечные панели и ретранслятор, такой спутник послужит нам долгое время, а дальнейшие запуски беспилотных аппаратов будут обеспечены связью с ЦУПом. Пролетая мимо @/targetBody, не забудьте провести научный эксперимент и передать результаты.
	
	synopsis = Пролететь мимо @/targetBody и уйти на высокую орбиту, выше орбиты Муны. Апоцентр выше 15Мм будет в самый раз. Спутник должен иметь солнечные батареи, антенну-ретранслятор и любой научный прибор для сбора данных. Финальная орбита не должна пересекать орбиту Муны (перицентр выше 14 мегаметров). Но не поднимайте апоцентр выше 20 мега-метров - слабый ретранслятор не сможет работать с такого расстояния.
	notes = Вам потребуется всего 2 маневра после выхода на орбиту: маневр для пролета Муны, и маневр закругления орбиты, вылетев назад в СТ Кербина, на высоте 14-19000 км. Учтите, что без второго маневра можно улететь даже к Солнцу, получив гравитационное ускорение от Муны - но сейчас не время для этого, мы потеряем связь с зондом.
	completedMessage = Успех! Сейчас внесем в планы посадку на другую планету - уже понятно, что в теории долететь можем!
	
	//minExpiry = 0
	//maxExpiry = 0
	//deadline = 0
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().First()
	prestige = Significant
	rewardScience = 10
	rewardReputation = 25
	rewardFunds = 55000
	advanceFunds = 5000
	
	//REQUIREMENT
	//{
	//	name = CompleteContract
	//	type = CompleteContract
	//	contractType = FMCP12
	//}
	REQUIREMENT
	{		//вместо привязки к предыдущим контрактам, каждую программу привяжем к достижениям карьеры
		name = MannedOrbit
		type = Orbit
		targetBody = HomeWorld()
		checkType = MANNED
	}
	PARAMETER
	{
		name = MoonFlyby
		type = VesselParameterGroup
		title = Полет к @/targetBody
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустить новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = Nocrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Беспилотный
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSolarPanel
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			minCount = 1
			title = Есть солнечные панели
			hideChildren = true
		}
		PARAMETER
		{	// На заметку: раскладываемые антенны НЕ считаются таковыми, пока сложены. Проверка в космосе - ок, но на старте - нельзя!
			name = HasAntenna
			type = HasAntenna
			antennaType = RELAY
			//partModule = ModuleDataTransmitter
			minAntennaPower = 490000.0		//required! if need any, set to 10 (but actually min relay power 5M)
			//minCount = 1
			title = Есть ретранслятор
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyMoon
			type = ReachState
			targetBody = @/targetBody	//HomeWorld().Children().First()
			title = Войти в сферу тяготения @targetBody
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			targetBody = HomeWorld().Children().First()
			recoveryMethod = Transmit
			hideChildren = true
			title = Провести любой эксперимент в СТ @targetBody и передать результаты
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = RelayDeploy
		type = VesselParameterGroup
		title = Оставить спутник на высокой (выше 15000км) орбите, имея солнечные панели и ретранслятор
		PARAMETER
		{
			name = HasSolarPanel
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			minCount = 1
			title = Есть солнечные панели
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAntenna
			type = HasAntenna
			antennaType = RELAY
			minAntennaPower = 490000.0
			//minCount = 1
			title = Есть ретранслятор
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			targetBody = HomeWorld()
			minApA = 15000000
			maxApA = 20000000
			minPeA = 14000000
			title = Достигнута орбита Кербина выше 15 мегаметров
			hideChildren = true
			disableOnStateChange = true
		}
		completeInSequence = true
	}
}
// *** Crewed Moon Flyby, science and return
CONTRACT_TYPE
{
	name = FMCP22
	group = FMCP_Muns
	
	title = Пилотируемый пролет Муны
	
	sortKey = 31
	
	description = Спутник успешно пролетел мимо Муны, не взорвался, не оказался притянут к поверхности. Наши данные о гравитации Муны полностью подтвердились. Мы хотим отправить по такому же маршруту экипаж, естественно, с возвратом домой. План полета будет проще простого: запустить новый корабль с экипажем (хотя бы 1 кербал), войти в сферу тяготения Муны, провести эксперименты (как минимум доклад экипажа и отчет EVA), и вернуться домой. Рекомендуем исключительно высокую траекторию, чтобы один-единственный разгонный маневр у Кербина вывел бы нас на траекторию пролета Муны и дальше на суборбитальную траекторию Кербина, приводящую к посадке. По нашим расчетам, потребуется около 860 dV, или даже меньше. Дальше все сделает орбитальная механика. Остатки топлива используйте для мелких маневров, коррекции траектории входа в атмосферу и торможения перед атмосферой - чтобы не влететь в плотные слои, набрав скорость пули. Научный отдел не рекомендует пытаться выйти на орбиту Муны на этом этапе, орбита в дальнейших планах. Отчет об обстановке должен быть передан по радио - убедитесь что есть антенна и достаточно энергии для передачи.
	synopsis = Пролететь мимо @/targetBody и вернуться на Кербин, сделав доклад экипажа и отчет из космоса высоко над Муной.
	completedMessage = Отлично! Открываем программу "НАполлон", инженеры уже начали расчеты по посадке и возврату.
	
	//minExpiry = 0
	//maxExpiry = 0
	//deadline = 0
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().First()
	prestige = Significant
	rewardScience = 15
	rewardReputation = 25
	rewardFunds = 65000
	advanceFunds = 7000
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP21
	}
	PARAMETER
	{
		name = CrewedMoonFlyby
		type = VesselParameterGroup
		title = Полет к @/targetBody
		
		//PARAMETER
		//{			//без требования НОВОГО корабля. Можно использовать второй корабль после стыковки
		//	name = NewVessel
		//	type = NewVessel
		//	title = Запустить новый аппарат
		//	hideChildren = true
		//}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж минимум 1 кербал
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAntenna
			type = HasAntenna
			minAntennaPower = 20000	//internal = 5000, any direct at least 20K
			title = Есть средство связи для передачи данных
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyMoon
			type = ReachState
			targetBody = @/targetBody	//HomeWorld().Children().First()
			title = Войти в сферу тяготения @/targetBody
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			targetBody = HomeWorld().Children().First()
			situation = InSpaceHigh
			experiment = evaReport
			recoveryMethod = Transmit
			hideChildren = true
			title = Пролетая мимо @targetBody, выйти в открытый космос, сделать отчет и передать результаты
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = ReturnHome
		type = ReturnHome
		targetBody = HomeWorld()
		title = Вернуться на Кербин после пролета Муны
		hideChildren = true
		completeInSequence = true
	}
}
// *** Unmanned Moon orbit, orbit relay
CONTRACT_TYPE
{
	name = FMCP23
	group = FMCP_Muns
	
	title = Ретранслятор на орбите Муны
	
	sortKey = 32
	
	description = Орбита Кербина - это несложно, вы же уже убедились. Пролететь мимо Муны - тоже несложно, проверено. Осталось сделать еще 1 шаг, и выйти на орбиту нашего ближайшего спутника! Поскольку зонд может оставаться там годами, сохраняя устойчивую орбиту - давайте воспользуемся предыдущим опытом и сделаем из него ретранслятор! Муна достаточно далеко от нас, а ее тыльная сторона недоступна для радиосвязи напрямую с Кербина. Ретранслятор на орбите Муны даст нам возможность отправлять новые беспилотные миссии, или корабли с туристами без пилота. И управляемые по радио вездеходы. И - даже летать дальше Муны, передавая сигнал на следующие спутники сети. Сами понимаете, со стандартной антенной на 500км до Минмуса не дотянутся!
	synopsis = Спутник должен иметь солнечные батареи и антенну-ретранслятор. Выведите его на орбиту Муны с периодом более 2 (но менее 4) часов, перицентром выше 7500м, наклонением не более 10 градусов (экваториальная вполне подойдет, но если слегка наклоните - тоже годится) и эксцентриситетом не более 0.1
	completedMessage = Успех! Теперь наш спутник будет обеспечивать связью всю Муну. А если вы выведете еще 2-3 ретранслятора, то связь станет бесперебойной! Мы думаем, что идеальное положение - все 3 на одной орбите, на примерно равном расстоянии, образуя треугольник.
	
	//minExpiry = 0
	//maxExpiry = 0
	//deadline = 0
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().First()
	prestige = Significant
	rewardScience = 10
	rewardReputation = 25
	rewardFunds = 55000
	advanceFunds = 5000
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP21
	}
	PARAMETER
	{
		name = MoonOrbit
		type = VesselParameterGroup
		title = Ретранслятор на орбите @/targetBody
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустить новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = Nocrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Беспилотный
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSolarPanel
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			minCount = 1
			title = Есть солнечные панели
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAntenna
			type = HasAntenna
			antennaType = RELAY
			minAntennaPower = 4900000.0		//attribute required! actually min relay power 5M
			title = Есть антенна-ретранслятор
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitMuna
			type = Orbit
			targetBody = @/targetBody	//HomeWorld().Children().First()
			minPeA = 7500
			maxEccentricity = 0.1
			maxInclination = 10
			minPeriod = 2h
			maxPeriod = 4h
			title = Вывести ретранслятор на орбиту Муны с заданными параметрами.
			//hideChildren = true
		}
	}
}
