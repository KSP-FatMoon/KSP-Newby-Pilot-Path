	group = FMCP_Muns
	
	title = Беспилотная посадка на Муну
	
	sortKey = 35
	
	description = Посадка на Муну - звучит сложно, но это почти также, как разбиться! Только включите двигатели и погасите скорость, чтобы коснуться грунта хотя бы на 5м/с, а не на 500. И прицепите научные приборы и антенну! Мы хотим получить данные с поверхности. Обязательно добавьте солнечную панель - будет обидно, если потратив столько усилий, на зонде сядут батарейки. \n Между прочим, в планах еще и вернуться с поверхности Муны! Поэтому можете сразу рассчитывать побольше топлива, чтобы хватило на взлет, выход на орбиту Муны и возвращение домой. И парашют - как бы ни мал зонд, в свободном падении без парашюта он разобьется! Но это на ваше усмотрение - в крайнем случае, запустите еще 1, специально для посадки с возвратом. Если будете планировать возвращение, в научное оборудование добавьте таинственную слизь! Ее не надо по радио передавать, раз можно вернуть.
