// Introduction: look at VAB, R&D, Control. Do first steps and understand basic possibilities
// *********************************
// *** Get first science from Kerbin
// *********************************
CONTRACT_TYPE
{
	name = FMCP01
	title = Изучить обстановку
	genericTitle = Изучить обстановку
	group = FMCP_Intro
	
	sortKey = 10
	
	description = Перед серьезными заданиями, освойтесь с капсулой! Даже летать не надо - изучите возможности капсулы, понажимайте кнопочки, и измерьте что-нибудь, не взлетая. Доложите об обстановке, потыкайте пальцем таинственную слизь... Короче, разберетесь!
	synopsis = Прикрепите к капсуле бак с таинственной слизью, и поместите корабль на стартовую площадку. Проведите доступные эксперименты и верните корабль, экипаж и полученные данные.
	completedMessage = Мы и не сомневались, что вы справитесь. Готовьтесь к полетам!

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Trivial
	rewardScience = 5
	rewardReputation = 1
	rewardFunds = 12500.00
	advanceFunds = 2500.0

	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		location = Surface
		recoveryMethod = RecoverOrTransmit
		title = Получить любые научные данные
		notes = Посмотрите на кнопки и возможности капсулы, проведите эксперименты и сделайте доклад экипажа. Учтите, что ученые могут восстанавливать таинственную слизь и контейнер с материалами - если в капсуле ученый, можно собрать больше образцов за раз (для этого ученый должен выйти из капсулы). Выйдя из капсулы, попробуйте снять шлем скафандра и сделайте отчет об обстановке. Верните аппарат вместе с полученными данными и кербалом на борту.
		hideChildren = true
	}
}
// *********************************
// *** First flight - Science from low altitude
// *********************************
CONTRACT_TYPE
{
	name = FMCP02
	title = Первый полет
	genericTitle = Первый полет
	group = FMCP_Intro
	
	sortKey = 11
	
	description = Нам нужно больше научных данных! Любой эксперимент во время полета расширит наше понимание окружающего мира. Технический отдел рекомендует прикрепить к кабине парашют сверху и малый твердотопливный ускоритель "Блоха" снизу - выглядит достаточно безопасно.
	synopsis = Запустите любой аппарат в полет и проведите любой эксперимент в низком полете.
	completedMessage = Отлично, мы знали, что вы справитесь. Теперь мы сможем разработать более эффективную технику для покорения космоса!

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Trivial
	rewardScience = 5
	rewardReputation = 3
	rewardFunds = 10000.00
	advanceFunds = 2500.0
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP01
	}
	//do not need parameter for flying. Get science in flying meens that we are in flight, right?
	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		situation = FlyingLow
		recoveryMethod = RecoverOrTransmit
		title = Получить научные данные во время полета низко над Кербином
		notes = Даже если вы взлетаете низко, кораблем надо управлять! Возьмите в экипаж пилота. При взлете, включите стабилизацию (SAS, клавиша "T"), и проводите эксперименты. Надеюсь, вы не забыли про парашют? для приземления он обязателен. Если вы хотите больше науки, соберите ее после посадки.
		hideChildren = true
	}
}
// *********************************
// *** Science from upper athmosphere
// *********************************
CONTRACT_TYPE
{
	name = FMCP03
	title = Атмосферные уровни
	genericTitle = Атмосферные уровни
	group = FMCP_Intro
	
	sortKey = 12
	
	description = Получите больше научных данных из атмосферы, на этот раз из верхних слоев, выше @/FMAltitude км. Если вы уверены в ракете, можно отправить пилота, но рекомендуем беспилотный полет.
	synopsis = Подняться до верхних слоев атмосферы (выше @/FMAltitude км) и провести любой эксперимент
	completedMessage = Ура, успех. Получив данные из верхних слоев, мы узнали немного больше о том, что будет еще выше.

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Trivial
	rewardScience = 5
	rewardReputation = 1
	rewardFunds = 17500.00
	advanceFunds = 2500.0
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP02
	}
	DATA
	{
		//just for show actual threshold - 18000 in stock KSP
		type = double
		FMAltitude = HomeWorld().FlyingAltitudeThreshold() / 1000
	}
	//do not needed parameter for altitude check - if we collect at flyinghigh, that is win
	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		situation = FlyingHigh
		recoveryMethod = RecoverOrTransmit
		title = Получить любые научные данные из верхних слоев атмосферы
		notes = Атмосфера Кербина становится с высотой менее плотной. Есть условный раздел между "плотность атмосферы, все еще достаточная для дыхания и турбин самолетов" и "разреженная атмосфера, где задыхаются кербалы и кислородные двигатели" - @/FMAltitude км. Поскольку вам надо собрать научные данные во время полета, корабль должен взлететь хотя бы на 500м выше этой отметки, чтобы было время провести эксперимент.
		hideChildren = true
	}
}
// *********************************
// *** 1st kerbal in space + science from space
// *********************************
CONTRACT_TYPE
{
	name = FMCP04
	title = Дотянуться до звезд
	genericTitle = Дотянуться до звезд
	group = FMCP_Intro
	
	sortKey = 13
	
	description = Мы хотим достичь космоса! Решайте, кто будет первым кербалом в космосе, стройте ракету и отправляйте отважного космонавта. Заодно проведите любой эксперимент - любые данные из космоса продвинут наши исследования. Как минимум, ждем доклад экипажа.
	synopsis = Достичь космоса (т.е. выше @/FMAltitude км) с кербалом на борту. Провести любой эксперимент (хотя бы доклад экипажа). Вернуть в целости экипаж и данные.
	completedMessage = Это невероятно! Новость о полете во всех газетах, видели?

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Significant
	rewardScience = 10
	rewardReputation = 10
	rewardFunds = 32500.00
	advanceFunds = 2500.0
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP03
	}
	DATA
	{
		//just for show actual threshold - 70000 for stock Kerbin
		type = double
		FMAltitude = HomeWorld().AtmosphereAltitude() / 1000
	}
	PARAMETER
	{
		name = ReachSpace
		type = VesselParameterGroup
		title = Отправить первого кербала за пределы атмосферы
		notes = При взлете корабль будет испытывать сопротивление воздуха, и может начать самопроизвольно разворачиваться, нужно управление для удержания на курсе.\n  Не перегружайте кабину разнообразными приборами - они увеличат лобовое сопротивление, изменят центровку, и могут сгореть в атмосфере при быстром подъеме (или при возвращении). Для выполнения достаточно простого доклада из кабины.\n  Постарайтесь не улететь слишком высоко! Чем выше взлетел - тем больнее падать. Корабль в свободном падении из космоса может сильно разогнаться - есть риск сгореть от трения или не успеть затормозить до безопасной для раскрытия парашюта скорости. Обязательно добавьте ОТДЕЛИТЕЛЬ под капсулу, чтобы отстрелить тяжелый двигатель первой ступени, когда он полностью выработает топливо. Не экономьте, стараясь вернуть все назад - ценность экипажа и капсулы намного выше!
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж: минимум 1 живой кербал
			hideChildren = true
		}
		//PARAMETER
		//{
		//	name = ReachState
		//	type = ReachState
		//	situation = SUB_ORBITAL
		//	minAltitude = 70000
		//	title = Достичь космоса
		//	hideChildren = true
		//}
		PARAMETER
		{
			name = ReachSpace
			type = ReachSpace
			title = Достичь космоса
		}
	}
	PARAMETER
	{
		name = SuccessfulReturn
		type = VesselParameterGroup
		title = Провести эксперименты и вернуть на Кербин экипаж и данные
		hideChildren=true
		PARAMETER
		{
			name = AnyExperiment
			type = CollectScience
			title = Собрать любые научные данные из космоса вокруг Кербина
			situation = InSpaceLow
			situation = InSpaceHigh		//well if collect science at 300+km
			recoveryMethod = RecoverOrTransmit
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Вернуть на Кербин экипаж и данные
			hideChildren = true
		}
		completeInSequence = true
	}
}
//Here intro part ends
