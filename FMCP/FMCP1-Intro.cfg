// Общая цель (что бы помнить):
// - Ракеты в приоритете. Самолеты вторичны
// - Идеально, если игрок не заморачивается натужным сбором науки и не возит 300 раз туристов, чтобы заработать на апгрейд.
// - Стоковые не отключаю - это ДОПОЛНЕНИЕ а не ЗАМЕНА!
// - Миссии должны быть доступны все, даже если игрок случайно выполнил что-то без миссии - это не повод лишать его награды.
// - Дублирования стока и других наборов избегать, за исключением случая "это великолепно и стоит увидеть любому"
// - Отключаемые в других наборах контракты (туризм, спасение с орбит) надо повторить, чтобы гарантированно были.
// ===============================================================================================
// задания на сбор науки на поверхности не будет. Есть стоковое.
CONTRACT_TYPE
{
	name = FMCP01
	title = Испытать радиосвязь
	group = FMCP_Intro
	
	sortKey = 10
	
	description = Мы хотим провести испытания антенны! Сделайте доклад экипажа из кабины с поверхности нашей планеты и передайте его по радио. Наличие связи критично для всей дальнейшей программы - чем раньше найдем проблемы, тем лучше.
	synopsis = Передать по радио доклад экипажа с поверхности Кербина
	completedMessage = Помехи минимальны, данные получены. Подтверждаем - антенны работают!

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Trivial
	rewardScience = 5
	rewardReputation = 2
	rewardFunds = 8000.00
	advanceFunds = 2000.0

	REQUIREMENT
	{	// стоковые антенны изучаются в ближайшей ноде за 5 науки
		// хотя многие моды добавляют антенну на старте - даже злобный Кербализм
		name = TechResearched
		type = TechResearched
		partModuleType = Antenna
	}
	// стоковый доклад со стоковой антенной требуют 36 энергии. Стартовая антенна тантареса - 44. В 50 должны уложиться!
	PARAMETER
	{	//зачем группа вокруг параметра: чтобы скрыть recoveryMethod в описании.
		name = TheShell
		type = VesselParameterGroup
		title = Передать по радио доклад экипажа с поверхности Кербина
		notes = Очевидно, должна быть антенна и некоторый запас энергии. Интересно, а сколько именно энергии потребуется для передачи?
		hideChildren = true
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			location = Surface
			experiment = crewReport
			recoveryMethod = Transmit
			hidden = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP02
	title = Исследовать доступные места старта
	group = FMCP_Intro
	
	sortKey = 11
	
	description = Нам доступно несколько мест, с которых можно запустить ракету или самолет. Кроме стартовой площадки Центра есть взлетная полоса (куда попадают аппараты, собираемые в Аэрокосмическом ангаре (АКА)). А еще есть Аэродром на острове, Место старта в пустыне и взлетная полоса в пустыне. И стартовая площадка "Бумеранг".\n  А кроме доклада экипажа (из кабины), наши кербонавты могут выходить наружу, если позволяет их тренировка и условия, и делать отчеты об обстановке в разных ситуациях. А также собирать образцы почвы, проводить специальные эксперименты на орбите или на поверхности, размещать сложное оборудование, производить ремонт сломанного или монтаж новых деталей.\n\n Сделайте отчеты об обстановке со стартовой площадки и со взлетной полосы! Мы убедимся, что вы знаете, как переключить место старта. А вы получите новые научные данные.
	synopsis = Сделайте отчеты об обстановке в заданных локациях.
	completedMessage = Отлично, с нашими основными точками старта разобрались!
	notes = Чтобы были доступны другие места старта (кроме основного космоцентра), они должны быть включены в настройках. Переключитесь на настройку сложности игры, и зажгите опцию "Разрешить другие места старта" - это расширит ваши возможности по запуску аппаратов и исследованию поверхности Кербина в разных биомах, с самого начала.
    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Trivial
	rewardScience = 4
	rewardReputation = 2
	rewardFunds = 10000.00
	advanceFunds = 2500.0

	PARAMETER
	{
		name = TheShell1
		type = VesselParameterGroup
		title = Получить отчет об обстановке со стартовой площадки
		notes = \nОтчет об обстановке делает лично космонавт - для этого надо выйти из капсулы. Убедитесь, что шлюз не заблокирован - не надо привинчивать на него контейнеры со слизью!
		rewardScience = 3
		hideChildren = true
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			location = Surface
			biome = LaunchPad
			experiment = evaReport
			hidden = true
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = TheShell2
		type = VesselParameterGroup
		title = Получить отчет об обстановке с взлетной полосы
		notes = \nЧтобы капсула с кербалом оказалась на взлетной полосе, ее надо выставить из АКА.
		rewardScience = 3
		hideChildren = true
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			location = Surface
			biome = Runway
			experiment = evaReport
			hidden = true
			hideChildren = true
		}
	}
}
// задания на первый полет не будет - есть стоковое.
CONTRACT_TYPE
{
	name = FMCP03
	title = Изучить атмосферу
	group = FMCP_Intro
	
	sortKey = 12
	
	description = Знаете, что на разной высоте - разные условия? Чем выше, тем разреженней наша атмосфера. Мы хотим получить данные из полетов на разной высоте - низко из плотных слоев, и из стратосферы. Любые данные, любым способом, в любом количестве! С пилотом или без - на ваш выбор.
	synopsis = Соберите научные данные из полета над Кербином в разных условиях
	completedMessage = Отлично, мы знали, что вы справитесь. Теперь мы сможем разработать более эффективную технику для покорения космоса!

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Significant
	rewardReputation = 15
	rewardFunds = 17500.00
	advanceFunds = 2500.0
	REQUIREMENT
	{	// появится после 1 полета. Чтобы был стимул сделать еще 1 или 2 полета до космоса
		name = FirstLaunch
		type = FirstLaunch
	}
	DATA
	{
		type = double
		HighAltitude = HomeWorld().FlyingAltitudeThreshold() / 1000
		SpaceAltitude = HomeWorld().AtmosphereAltitude() / 1000
	}
	PARAMETER
	{	//зачем группа вокруг параметра: чтобы скрыть recoveryMethod в описании.
		name = TheShell1
		type = VesselParameterGroup
		title = Собрать научные данные из нижних слоев атмосферы Кербина
		hideChildren = true
		rewardScience = 5
		rewardFunds = 7500.00
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			situation = FlyingLow
			recoveryMethod = RecoverOrTransmit
			hidden = true
			hideChildren = true
		}
	}
	PARAMETER
	{	//зачем группа вокруг параметра: чтобы скрыть recoveryMethod в описании.
		name = TheShell2
		type = VesselParameterGroup
		title = Собрать научные данные из верхних слоев атмосферы Кербина
		notes = Верхние слои атмосферы - это выше, чем @/HighAltitude км над уровнем моря, но ниже @/SpaceAltitude км (там уже космос, атмосфера отсутствует)
		hideChildren = true
		rewardScience = 10
		rewardFunds = 10000.00
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			situation = FlyingHigh
			recoveryMethod = RecoverOrTransmit
			hidden = true
			hideChildren = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP04
	title = Дотянуться до звезд
	genericTitle = Дотянуться до звезд
	group = FMCP_Intro
	
	sortKey = 13
	
	description = Мы хотим достичь космоса! Решайте, кто будет первым кербалом в космосе, стройте ракету и отправляйте отважного космонавта. Заодно проведите любой эксперимент - любые данные из космоса продвинут наши исследования. Как минимум, ждем доклад экипажа.
	synopsis = Достичь космоса (т.е. выше @/SpaceAltitude км) с кербалом на борту. Провести любой эксперимент (хотя бы доклад экипажа). Вернуть в целости экипаж и данные.
	completedMessage = Это невероятно! Новость о полете во всех газетах, видели?

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Significant
	rewardScience = 10
	rewardReputation = 10
	rewardFunds = 32500.00
	advanceFunds = 2500.0
	// эти контракты нельзя провалить
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP03
	}
	// я не буду отключать задания, если достижение уже получено.
	DATA
	{
		type = double
		SpaceAltitude = HomeWorld().AtmosphereAltitude() / 1000
	}
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		parameter = ReachSpaceAndReturn
		experience = 1
		// сработает так: за полет +1 и награда +1, итого +2.
		// При этом для игрока отметит "специальная тренировка +2".
	}
	// Первоначально тут был секвенс из 2х групп
	// Но это позволит выполнить контракт в 2 полета (вылететь в космос пилотируемо) и (вернуть любые научные данные из космоса)
	// Это приводило к казусам, хотя ничего страшного и не было - но логика должна соблюдаться!
	PARAMETER
	{
		name = ReachSpaceAndReturn
		type = VesselParameterGroup
		title = Запустить корабль с экипажем в космос и вернуть всех живыми
		//hideChildren = true
		notes = Не перегружайте капсулу разнообразными приборами - они увеличат лобовое сопротивление, изменят центровку, и могут сгореть в атмосфере. Для выполнения достаточно простого доклада из кабины.\n  Постарайтесь не улететь слишком высоко! Чем выше взлетел - тем больнее падать. Корабль в свободном падении из космоса может сильно разогнаться - есть риск не успеть затормозить до безопасной для раскрытия парашюта скорости.\n  Обязательно добавьте ОТДЕЛИТЕЛЬ, чтобы отстрелить тяжелый двигатель первой ступени. Не экономьте, стараясь вернуть все назад!
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж: минимум 1 кербал
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachSpace
			type = ReachState
			title = Достичь космоса
			situation = SUB_ORBITAL
			minAltitude = HomeWorld().AtmosphereAltitude()
			hideChildren = true
			disableOnStateChange = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = AnyExperiment
			type = CollectScience
			title = Собрать любые научные данные из космоса вокруг Кербина
			situation = InSpaceLow
			situation = InSpaceHigh		//кто знает, как высоко игрок закинет капсулу?
			recoveryMethod = RecoverOrTransmit
			// Не скрываем: игроку нужен пункт в чеклисте и намек как его выполнить
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Вернуть домой экипаж и данные
			hideChildren = true
		}
	}
}