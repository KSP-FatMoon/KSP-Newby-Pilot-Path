CONTRACT_TYPE
{
	name = RaceChallenge5000
	title = Большая гонка 5000
	
	description = Только сегодня! Объявляется регистрация на большие гонки на малых кораблях! Требования к участникам: любой управляемый корабль, способный оторваться от поверхности Кербина и выйти на орбиту, а потом отправиться к Минмусу. С экипажем или без, время гонки не ограничено. Любые детали на ваш выбор.\n\n Для участия выведите подготовленный корабль на заданную орбиту, и убедитесь что соответствуете всем требованиям: малые корабли, ограничение по массе 3.5 тонн. Запас dV на орбите должен быть от 1650 до 1900. Количество деталей - не более 12, из них максимум 1 отделитель. Антенны, солнечные панели или иные источники энергии - на ваш выбор. Будет мудро иметь тепловой щит и парашют, или иной способ доставить аппарат назад на Кербин в целости.\n\n Трасса очень простая: пролететь мимо Минмуса, пролететь мимо Муны, приземлиться на Кербин - именно в таком порядке. Орбиты вокруг Минмуса и Муны не обязательны. И никаких дозаправок - заявленного запаса dV должно хватить от старта и далее.
	synopsis = Выполните полет: Кербин (орбита) -> Минмус (пролет или орбита) -> Муна (пролет или орбита) -> Кербин (посадка), без дозаправок и имея на стартовой орбите не более 1900 dV
	completedMessage = Победа! Ваша награда вполне заслужена!
	// почему 5000? потому что вывод на орбиту примерно 3200...3400dV. +1600 = 5000, отсюда и название. Проходимо на 1600 дельты, проверял. А с 1900 - вообще без проблем
	// пилотируемый пример: МК1 + парашют + щит 1.25 + ТД12 + баки с топливом ФЛТ200 и 100 + Терьер. 3т, около 2000 dV, 7 деталей. Можно ФЛА150 и 151S + Искра, 2.5т
	prestige = Exceptional
	maxSimultaneous = 1
	group = FMCP
	deadline = 0
	cancellable = true
	declinable = true
	targetBody = @/homePlanet
	rewardFunds = 100000.0
	rewardScience = 10.0
	rewardReputation = 20.0

	failureFunds = 0
	failureReputation = 0
	advanceFunds = -5000.0	//вступительный взнос

	sortKey = 2020

	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
		targetMoon = HomeWorld().Children().First()
		targetMinmus = HomeWorld().Children().Last()
		title = Кербин и его луны
	}
	REQUIREMENT
	{
		name = MoonFlyByAchieved
		type = FlyBy
		targetBody = @/targetMoon
		title = Вы должны предварительно совершить хотя бы один пролет мимо Муны
	}
	REQUIREMENT
	{
		name = MinmusFlyByAchieved
		type = FlyBy
		targetBody = @/targetMinmus
		title = Вы должны предварительно совершить хотя бы один пролет мимо Минмуса
	}
	// убран стартовый чеклист, т.к. дельту считает только на текущей ступени. Поэтому вместо 5000-5200 на старте требую 1650-1900 в космосе
	// это не челлендж на мастерское выведение на орбиту - это челлендж на экономное маневрирование в космосе. На орбиту - с любыми затратами, любым способом.
	PARAMETER
	{
		name = Attestation
		type = VesselParameterGroup
		title = Пройти аттестацию на орбите - корабль должен удовлетворять всем требованиям
		define = Race5000
		dissassociateVesselsOnContractCompletion = true
		dissassociateVesselsOnContractFailure = true
		notes = Не используя гипердвигатели, мюоны, бозоны, кварки и антикварки. Допускаются - двигатели на эффекте Холла, ионные двигатели на ксеноне, и любые комбинации стандартных двигателей (на жидком, твердом или монокомпонентном топливе). Нарушения физики, добавление антигравитационных устройств, отрицательная масса, самовоспроизводящееся топливо - это дисквалификация!
		// атомные двигатели ок, но из-за веса в 3т самого двигателя, невозможно сделать корабль, имеющий 1650 dV массой менее 3.5т
		// а если вы поставили мод с атомными двигателями весом 0.05т - наверно это чит. Ваша совесть вам судья.
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Ракета должна быть запущена после взятия контракта
		}
		PARAMETER
		{
			name = CheckOrbit
			type = Orbit
			title = Достигнута орбита Кербина (перицентр выше 90, апоцентр ниже 150 км, наклон орбиты не более 4 градусов)
			targetBody = @/homePlanet
			minPeA = 90000.0
			maxApA = 150000.0
			maxInclination = 4.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = timer0
			type = Duration
			duration = 10s
			preWaitText = waiting
			waitingText = Stay on
			completionText = finished
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = CheckDelta
			type = ReachState
			situation = ORBITING
			targetBody = @/homePlanet
			// и то и другое, и не уверен что вакуумная считается
			minDeltaVeeActual = 1650.0
			maxDeltaVeeActual = 1900.0
			//minDeltaVeeVacuum = 1650.0
			//maxDeltaVeeVacuum = 1900.0
			title = Дельта в разрешенных пределах (от 1650 до 1900)
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = CheckMass1
			type = VesselMass
			minMass = 0.8
			maxMass = 3.5
			completeInSequence = true
			disableOnStateChange = false
			title = Масса в разрешенных пределах (от 0.8 до 3.5 т)
		}
		PARAMETER
		{//?
			name = PartValidation
			type = PartValidation
			minCount = 4
			maxCount = 12
			title = Количество деталей в разрешенных пределах (от 4 до 12, не более)
		}
	}
	PARAMETER
	{
		name = MainRace
		type = VesselParameterGroup
		title = Вперед к победе! Пролететь или выйти на орбиту Минмуса, перенаправиться к Муне, пролететь мимо Муны и вернуться на Кербин (требуется посадка!)
		vessel = Race5000
		completeInSequence = true
		PARAMETER
		{
			name = CheckMinmus
			type = ReachState
			title = Посетить Минмус
			targetBody = @/targetMinmus
			disableOnStateChange = true
			hideChildren = true
			//hidden = true
		}
		PARAMETER
		{
			name = CheckMuna
			type = ReachState
			title = Посетить Муну
			targetBody = @/targetMoon
			completeInSequence = true
			disableOnStateChange = true
			hideChildren = true
			//hidden = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			targetBody = @/homePlanet
			completeInSequence = true
			title = Вернуться на поверхность Кербина (сгоревшие или разбившиеся аппараты дисквалифицируются)
		}
	}
}