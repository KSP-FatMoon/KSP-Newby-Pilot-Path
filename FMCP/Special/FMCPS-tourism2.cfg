	title = Тур по лунам Кербина
	description = Группа туристов заказала сложный маршрут: вся группа должна путешествовать вместе, все цели должны быть выполнены в одном полете и на одном корабле - от взлета и до посадки. К счастью, целей всего 2 - уверены, вы легко справитесь. Туристы желают побывать на орбитах всех наших лун и вернуться домой, невредимыми! Никаких посадок, просто долгий полет и возвращение. Снаряжайте ракету запасом чипсов на месяц - и вперед!
