//
// А теперь правильный туризм! Почти как стоковый, с прогрессией
// По какой-то причине для потомка, получающего значение от родителя, вместо CelestialBody приходит список. Из 1 элемента.
// Этот список можно отправить в targetBody (там допускается список), но нельзя вызвать методы.
// IsHomeWorld() и IsSun() вызывают ошибку "в классе List таких методов нет", а ...
// попытка сделать .ElementAt(0) вызывает ошибку "в классе CelestialBody такого метода нет". Тут где-то серьезная бага :(
// Поэтому вместо вытаскивания @targetBody с уровня выше в пунктах задания и ограничениях..
// делаем вытаскивание тела из итератора - где честный список, и можно взять ElementAt без проблем. Получая одно тело.
// Далее, для Кербина нельзя использовать общий REQUIREMENT с типом ReturnFromSurface - пришлось вынести из итератора.
// Я был неправ - красиво туризм через конфигуратор сделать МОЖНО. Но не без извращений... 
// Фишка в 2х итераторах и наборе правил, отключающих пункты или тело целиком, по эволюции или случайно.
// Но стоковый... стоковый настолько лучше, что не надо портить хорошую вещь всем этим.
CONTRACT_TYPE
{
	name = FMCP_StocklikeTourism_v2
	title = Космический туризм (v2)
	description = Несколько туристов хотят увидеть звезды и небесные тела из иллюминатора, своими собственными глазами. Отправьте их по заказанным маршрутам и верните в целости домой.
	prestige = Significant
	maxSimultaneous = 1
	maxCompletions = 0
	group = FMCP_Tourism
	cancellable = true
	declinable = true
	synopsis = Обеспечьте всем туристам великолепные впечатления!
	completedMessage = Все туристы выполнили свои туры и возвращены живыми.
	advanceFunds = 25000.0
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб турист, это серьезно!
	failureReputation = 20
	// Панеслась! Отправлять будем от 2 минимум до 6 максимум туристов
	// Причем случайное "до 6" будет расти медленно с количеством открытых тел.
	// Все туристы летают как угодно, по 1 или группами.
	// Все задачи выполняются в любом порядке, за один или несколько полетов,
	// за исключением случая нескольких задач у одного тела. Тогда строго в одном полете.
	// Случай нескольких задач - это орбита и посадка, без вариантов.
	// Никогда не предлагается И пролет, И орбита. Либо-либо.
	// Пока не вернулись с орбиты - всегда пролет, потом всегда орбита.
	// Орбита Кербина выпадает всем (теоретически могут отключиться все тела,
	// и чтоб не было туриста, который ничего не хочет - орбита Кербина обязательна)
	// с шансом 1/5 случайное отключение цели, чтобы программы у туристов отличались...
	// ...иначе все будут хотеть одного и того же, за исключением посадок.
	// (посадки выдаются с шансом 1/4)
	// Количество целей увеличивается с увеличением числа открытых тел.
	// От орбиты Кербина до посещения каждого из достигнутых тел с орбитой и посадкой.
	// Контракт предлагается неограниченно. Без лимита на выполнение. Но по 1 одновременно.
	// Естественно, как только состоится посадка и возвращение с Дюны или Айка или Джилли,
	// ...она появится и в туристическом маршруте, превращая контракт в мучение. И возможно, дешевое
	// (я бы не повез туриста на посадку Дюны и возврат меньше чем за 500К, да и то подумал бы)
	// Если выпадут посадки на Айк и Джилли, их можно закрыть в 2 полета (один к Еве, один к Дюне)
	// Безумие отключено - посадок на Солнце не будет.
	
	// Не требуется. Если ждем пролета Муны, очевидно космос достигнут.
	//REQUIREMENT
	//{
	//	name = ReachSpace
	//	type = ReachSpace
	//	title = Доступно с момента выхода в космос
	//}
    REQUIREMENT
    {
    	name = Expression
		type = Expression
		expression = @/rBodies > 0
    	title = Должно быть достигнуто хотя бы одно тело (кроме Кербина)
    }
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_StocklikeTourism_v2
		cooldownDuration = 5d
	}
	DATA
	{
		// список всех посещенных тел. Заработает с момента суборбитального полета
		// Кербин, потом Кербин и Муна, потом Кербин, Муна и Минмус, потом +Солнце, потом +Дюна или Ева и так далее.
		// Вечное масштабирование!
		type = List<CelestialBody>
		allReached = ReachedBodies().Exclude(HomeWorld())	//Кроме Кербина
		hidden = true
	}
	DATA
	{
		// максимальное количество туристов будет увеличиваться с количеством посещенных тел, чисто для фана
		// сначала 2, потом 2-3, 2-4, 2-5. На Дюну и Еву уже 2-6. И это максимум
		type = int
		hidden = true
		rBodies = @/allReached.Count()
		tMax = Min(@/rBodies,5)	//сначала растет от 1 до 5, потом будет строго 5
		topMax = @tMax + 1	//и превращается максимум в 6
	}
	DATA
	{
		type = int
		touristCount = Random(2,@/topMax)	//от ровно 2 вокруг Кербина и Муны, до максимально 6 на другие планеты
		// скобка после имени функции должна быть слитно без пробелов!
	}
	DATA
	{
		// Нужно для итератора. Иначе можно было бы сразу SpawnPassengers
		type = List<Kerbal>
		hidden = true
		allTourists = NewKerbals(@/touristCount)
	}
	DATA
	{
		type = float
		hidden = true
		rewardF = 25000 + (8000 * @/touristCount) + (8000 * (@/touristCount-2)) + 25000 * (@/rBodies - 1)
		rewardR = 5 + 10 * @/touristCount + 5 * @/rBodies
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/allTourists
		kerbalType = Tourist		// не обязательно - по умолчанию так
		removePassengers = true		// не обязательно - для типа "турист" по умолчанию. Туристы исчезают после выполнения контракта
	}
	
	// Надо отладить скрытие лишних строк и распределение наград. А то в глазах рябит
	PARAMETER
	{	//обязательно, иначе гибель туриста контракт не провалит. И по дедлайну не провалит - дедлайна нет. Вечно невыполненный.
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/allTourists
		title = Без жертв: все туристы должны выжить
		hidden = true
		hideChildren = true
	}
	PARAMETER
	{
		name = ForEachTourist
		type=All
		title = Турист @curKerbal желает
			// curKerbal = @ITERATOR/curKerbal.ElementAt(IteratorCurrentIndex())
			// iteratorCount = @ITERATOR/curKerbal.Count()
		PARAMETER
		{
			// Кербин вынесен за итератор и будет всегда. Почему:
			// 1. потому что все остальные могут отключится рандомом. Гарантируем хотя бы орбиту Кербина
			// 2. для посадок, требование "был возврат с поверхности" неприменимо для Кербина.
			// Единственный минус - не будет суборбитальных, т.к. список тел больше не содержит Кербин.
			// И пока не достигнем Муны, контракт не предлагаем. Чтобы не отдать в итератор пустоту.
			name = KerbinPersonal
			type = VesselParameterGroup
			title = Выйти в космос над родной планетой, и совершить...
			targetBody = Kerbin
			//rewardFunds = 10000
			disableOnStateChange = true
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers
				kerbal = @../../curKerbal
				hideChildren = true
				disableOnStateChange = false
				hidden = true
			}
			// Параметр не нужен, т.к. всегда будет только орбита
			//PARAMETER
			//{
			//	name = KerbinSubOrbital
			//	type = ReachState
			//	situation = SUBORBITAL
			//	targetBody = Kerbin		//CelestialBody(@../targetBody)
			//	title = ...суб-орбитальный полет над Кербином
			//	hideChildren = true
			//	completeInSequence = true
			//	disableOnStateChange = true
			//	rewardFunds = 3000
			//	REQUIREMENT
			//	{
			//		// только пока не произошел первый возврат кербалов с орбиты тела!
			//		type = ReturnFromOrbit
			//		targetBody = Kerbin		//CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
			//		checkType = MANNED
			//		invertRequirement = true
			//		title = Суборбитальные полеты только до возврата с орбиты
			//	}
			//}
			PARAMETER
			{
				name = KerbinOrbit
				type = ReachState
				situation = ORBITING
				targetBody = Kerbin		//CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...орбитальный облет Кербина
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 7000
			// Требование не нужно - к моменту Муны орбита Кербина уже достигнута	
			//	REQUIREMENT
			//	{
			//		// только если был возврат кербалов с орбиты тела!
			//		type = ReturnFromOrbit
			//		targetBody = Kerbin	//CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
			//		checkType = MANNED
			//		title = А с момента возврата с орбиты - все хотят орбиту
			//	}
			}
		}
		PARAMETER
		{
			// Поскольку проверка возврата с поверхности для Кербина вызывает ошибку,
			// он вынесен отдельно. А в этом цикле Кербина просто не будет. Никогда.
			// Вот эти 2 строки вытащены из отладочной информации - и это единственный способ работы с итератором!
			// listBody = @ITERATOR/listBody.ElementAt(IteratorCurrentIndex())
			// iteratorCount = @ITERATOR/listBody.Count()
			name = ForEachBody
			type = VesselParameterGroup
			title = Посетить тело: @targetBody, совершив...
			// любое обращение к переменной за пределами параметра (из вложенных) возвращает список. Но не List<CelestialBody>!
			// т.е. Можно сделать итерацию на 1 уровне (и оно нормально примет - кербалов, эксперименты и тела)
			// но невозможно обратится на уровень выше за значением итератора. Вернет список, считая его не списком...
			// и тогда парсер контракта выдаст ошибку до формирования контракта. Не ран-тайм, а JIT.
			// кроме случаев когда список допустим, и не вызываются методы ни списка, ни объекта
			targetBody = @listBody
			//rewardFunds = 5000 * @/rBodies //5000*rBodies^2 - это 180К к достижению ближайших планет в сумме! перебьемся!
			disableOnStateChange = true
				REQUIREMENT
				{
				// случайно, с шансом 4/5
					type = Expression
					expression = (5 > Random(1,6))
					title = random
				}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers
				kerbal = @../../curKerbal
				disableOnStateChange = false
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = AnyFlyBy
				type = ReachState
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...пролет мимо @targetBody
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 10000
				REQUIREMENT
				{
					// только пока не произошел первый возврат кербалов с орбиты тела!
					type = ReturnFromOrbit
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					invertRequirement = true
					title = till not return from orbit
				}
				REQUIREMENT
				{
					// Тело, отличное от Кербина. Но не Солнце
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = !(@targetBody.IsSun())
					title = not Kerbin or Sun
				}
			}
			PARAMETER
			{
				name = ReachSol
				type = ReachState
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...выход из СТ Кербина к Солнцу!
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 15000
				REQUIREMENT
				{
					// тело является звездой
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = (@targetBody.IsSun())
					title = only for Sun
				}
			}
			PARAMETER
			{
				name = AnyOrbit
				type = ReachState
				situation = ORBITING
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...выход на орбиту @targetBody
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 10000
				REQUIREMENT
				{
					// только если был возврат кербалов с орбиты тела!
					type = ReturnFromOrbit
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					title = start past return
				}
				REQUIREMENT
				{
					// тело не является звездой
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = !(@targetBody.IsSun())
					title = but not for Sun
				}
			}
			PARAMETER
			{
				name = AnySurface
				type = ReachState
				situation = LANDED
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...посадку на поверхность @targetBody
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 20000
				REQUIREMENT
				{
					// Тело, отличное от Кербина. И не Солнце
					// Технически эта проверка не нужна, т.к. Кербин вынесен. А возврата с Солнца не будет :)
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = !(@targetBody.IsHomeWorld()||@targetBody.IsSun())
					title = not Kerbin or Sun
				}
				REQUIREMENT
				{
					// только если был возврат кербалов с поверхности тела!
					type = ReturnFromSurface
					// для Кербина тут ошибка. препятствующая формированию контракта...
					// несмотря на то что Кербин я отсеял выше, сама проверка для Кербина вызывает ошибку.
					// Либо универсальный туризм делать исключительно орбитальный. А для посадок нужен отдельный контракт.
					// Либо исключать Кербин из общего списка, делая круг по Кербину без итератора. Как и сделал в итоге.
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					title = only past return
				}
				REQUIREMENT
				{
					// случайно, с шансом 1/4
					type = Expression
					expression = (3 < Random(1,5))
					title = and random
				}
			}
			ITERATOR
			{
				type = CelestialBody
				listBody = @/allReached
			}
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @../curKerbal
			hideChildren = true
			title = И вернуться после всех полетов домой!
			completeInSequence = true
		}
		ITERATOR
		{
			type = Kerbal
			curKerbal = @/allTourists
		}
	}
}
// Простой суб- и орбитальный туризм над Кербином. См. всякие "Туризм Экстендед" и "Туризм +" - аналогично.
// Вся группа вместе, за 1 полет выполняет все намеченные цели. Вставил, потому что для 2-3 орбита Кербина - это норм.
// Требовать тут еще определенный биом или точку, над которой надо пролететь - ненужное извращение (не на старте карьеры точно)
// !!! Кербалов НЕОБХОДИМО создавать через NewKerbals, иначе само взятие контракта с SpawnPassengers очищает предыдущих туристов
// в момент запуска корабля. Новые - генерятся и садятся в пустые кабины, существовавшие - исчезают.
// С одной стороны это шикарно если все контракты такие. Туристов просто нет в центре, они генерируются в полет.
// Задания могут быть отвратительные - но само поведение удобное (но не предусматривает случая нескольких полетов!)
// С другой стороны, у меня УЖЕ есть контракты где туристы пред-созданные. И стоковый туризм. Так что ПРИДЕТСЯ для всех случаев
// создавать через NewKerbals и использовать в SpawnPassengers, KerbalDeaths, HasPassengers, RecoverKerbal список или конкретное имя.
CONTRACT_TYPE
{
	name = FMCP_EasySubOrbital
	title = Аттракцион "Побывай в космосе"
	description = Наш космический центр пользуется популярностью. Кербалы со всего мира занимают очередь - все хотят увидеть космос! Очередная группа туристов хочет ощутить себя настоящими космонавтами, побывав в космосе (или даже на орбите!). Но есть обязательное требование: вся группа летит вместе. Придется строить корабль повышенной вместимости. Уверены, вы справитесь - прикрутите несколько капсул, или замените пилота автоматикой, чтобы влезло больше туристов. Но постарайтесь обойтись без жертв - на кону наша репутация!
	prestige = Trivial
	maxSimultaneous = 1
	maxCompletions = 15
	group = FMCP_Tourism
	targetBody = HomeWorld()
	cancellable = true
	declinable = true
	synopsis = Прокатите группу туристов в космос вокруг Кербина, а затем верните их домой.
	completedMessage = Отличная работа, все туристы успешно возвращены, а их цели выполнены.
	advanceFunds = @/advanceF
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = @/failureF		// штраф -100К за каждого туриста
	failureReputation = @/failureR	// и -15 репутации за каждого туриста
	REQUIREMENT
	{
		name = ReachSpace
		type = ReachSpace
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_EasySubOrbital
		cooldownDuration = 1d
	}
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = HomeWorld().Children().First()
		checkType = MANNED
		invertRequirement = true
		title = Контракт предлагается от момента достижения космоса до возвращения с орбиты Муны!
	}
	// Идея в следующем: туристы жаждут совершить суборбитальный полет с момента достижения космоса.
	// Как только первые кербалы вернулись с орбиты - хотят еще и орбиту за доп-вознаграждение
	// Но как только было возвращение с орбиты Муны, этот атракцион считается несерьезным,
	// вместо него будет нормальное туристическое задание.
	// Это ранний источник средств и репутации. примерно по 30К и по 10 репутации за туриста
	// А чтобы игрок не увлекался харвестом - раз в день, и максимум 15 раз всего.
	// 15 дней срок приличный, скорее будет посещена Муна, чем кончится лимит выполнения.
	// Туристы летают группами по 2-3, в начале будет еще проблема обеспечить 3 места на аппарате!
	// Два - просто (две капсулы МК1 + ОКТО для управления, коряво но работает).
	// Еще вариант МК1 + авиационная кабина на 2 места, но там низкая термостойкость - нужен щит.
	// и конечно надо еще изучить эту кабину! Уверен, игрок разберется! Вариант строго 2 просто смешно предлагать.
	DATA
	{
		type = int
		touristCount = Random(2,4)	//2-3 туриста
		hidden = true
	}
	DATA
	{
		// Не только для итератора. Без предсоздания имен удаляются уже имеющиеся туристы (бага конфигуратора)
		type = List<Kerbal>
		hidden = true
		allTourists = NewKerbals(@/touristCount)
	}
	DATA
	{
		type = double
		// За 3-го туриста двойная оплата. Для покрытия сложности корабля на 3 места.
		advanceF = 6000.0 * @/touristCount + 6000 * (@/touristCount - 2)
		rewardF = 18000.0 * @/touristCount + 18000 * (@/touristCount - 2)
		orbitReward = 6000.0 * @/touristCount + 6000 * (@/touristCount - 2)
		rewardR = 10 * @/touristCount + 10 * (@/touristCount - 2)
		failureF = 100000 * @/touristCount
		failureR = 15 * @/touristCount
		hidden = true
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		//count = @/touristCount
		kerbal = @/allTourists
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/allTourists
		hideChildren = true
		hidden = true
	}
	PARAMETER
	{
		name = KerbinSpaceTour
		type = VesselParameterGroup
		title = Выполните все пункты полетного задания и верните всех пассажиров домой. На одном корабле, за один полет. Ни один кербал не должен погибнуть.
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			kerbal = @/allTourists
		}
		PARAMETER
		{
			name = KerbinSubOrbital
			type = ReachState
			targetBody=@/targetBody
			situation = SUB_ORBITAL
			title = Выполнить суборбитальный пролет над Кербином
			hideChildren = true
			disableOnStateChange = true
			REQUIREMENT
			{
				type = Any
				REQUIREMENT
				{
					type = Expression
					expression = (1 < Random(1,7))
					title = шанс 5 из 6
				}
				REQUIREMENT
				{
					type = Expression
					expression = (@/touristCount==3)
					title = Для группы из 3х туристов всегда (а то жирно будет попасть на 1-1 с группой 3)
				}
				REQUIREMENT
				{
					type = ReturnFromOrbit
					targetBody = @/targetBody
					checkType = MANNED
					invertRequirement = true
					title = До возвращения с орбиты всегда, потом с шансом 5 из 6
				}
			}
		}
		// нет предохранителя от 1-1 - не выпадет ни то ни другое, туристы пришли просто поглазеть)))
		PARAMETER
		{
			name = KerbinOrbit
			type = Orbit
			targetBody = @/targetBody
			minPeA = HomeWorld().AtmosphereAltitude()
			title = Выйти на орбиту Кербина
			hideChildren = true
			disableOnStateChange = true
			rewardFunds = @/orbitReward
			REQUIREMENT
			{
				type = Expression
				expression = (1 < Random(1,7))
				title = шанс 5 из 6
			}
			REQUIREMENT
			{
				type = ReturnFromOrbit
				targetBody = @/targetBody
				checkType = MANNED
				title = С момента возвращения с орбиты Кербина - с шансом 5 из 6
			}
		}
		PARAMETER
		{
			name = ReturnKerbin
			type = RecoverKerbal
			kerbal = @/allTourists
			title = Естественно вернуть всех домой - мы не можем оставить туристов в космосе!
			hideChildren = true
			hidden = true
		}
	}
}
// VIP-туризм на Кербине. Посадки в биом или в заданную точку. Сложно! (из-за атмосферы. Для точек надо садится с двигателем)
// После тестов радиус зачета точки увеличен до 5 км. Иначе это ультимативный челлендж.
// Поскольку это все равно мини-челлендж, количество выполнений ограничено в 10, в обоих случаях. и 1 день кулдаун.
// Уверяю, даже с 1 выполнением игрок запарится, нормально прицелиться с орбиты можно в зону не менее 15 км в поперечнике.
CONTRACT_TYPE
{
	name = FMCP_VIPTourKerbin_v1
	title = ВИП-туризм вокруг Кербина (посадка в биом)
	description = Очень Важная Персона (заместитель директора по связям с общественностью, а по совместительству главный дворник) желает вылететь в космос около Кербина и приземлиться в определенном биоме. Обеспечьте гостю незабываемые впечатления и верните целым и невредимым домой, иначе вместо оплаты будет штраф!
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 10
	group = FMCP_Tourism
	targetBody = HomeWorld()
	cancellable = true
	declinable = true
	synopsis = Выполните все пожелания ВИП-туриста, и совершите безопасную посадку в заданном месте.
	completedMessage = Превосходно, клиент доволен как слон. На дрожащих ногах (но со счастливой улыбкой на лице) только что оставил великолепный отзыв. Так держать!
	advanceFunds = 10000.0
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб турист, это серьезно!
	failureReputation = 20
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = @/targetBody
		checkType = MANNED
		title = Сначала надо вернуться с орбиты Кербина
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_VIPTourKerbin_v1
		cooldownDuration = 1d
	}
	DATA
	{
		type = Kerbal
		VIPname = NewKerbal()
		hidden = true
	}
	DATA
	{
		type = List<Biome>
		// Выкидываем горы вообще (безопасная посадка затруднительна, для начинающего пилота. И для опытного тоже, страдания)
		// для случаев (пустоши) будет увеличена награда
		// и для полярных (тундра, ледяные шапки, южный и северный ледник) тоже
		// (пустоши надо найти сначала) (самые удобные для посадки к востоку от Харвестер Массив)
		// (для полярных нужна полярная орбита) (попасть именно в шапку или в ледник - будет сложно, можно ошибиться)
		// безопасная посадка на горы - это редкие площадки по 200-500м в поперечнике (т.е. допуск 250м)
		// все остальное - склон, по которому будем катиться вниз, наращивая скорость. Гор не будет.
		// Воды - просто. Равнины - просто. Пустыни - просто.
		// Побережья и возвышенности сложно - они узкие, чуть промах и уже другой биом.
		allBiomes = [ Highlands, Shores, Grasslands, Water, Deserts, Badlands, Tundra, IceCaps, NorthernIceShelf, SouthernIceShelf ]
		difficultBiomes = [ Badlands, Tundra, IceCaps, NorthernIceShelf, SouthernIceShelf ]
		hidden = true
	}
	DATA
	{
		type = Biome
		targetBiome = @/allBiomes.Random()
		hidden = true
	}
	DATA
	{
		type = double
		rewardMult = (@/difficultBiomes.Contains(@/targetBiome)) ? 2.0 : 1.0
		rewardF = 85000 * @rewardMult
		rewardR = 35 * @rewardMult
		hidden = true
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/VIPname
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/VIPname
		hideChildren = true
		hidden = true
	}
	PARAMETER
	{
		name = MainGroup
		type = VesselParameterGroup
		title = Выполнить полет с @/VIPname на борту, выйти на орбиту Кербина, и сойти с орбиты, добившись посадки точно в заданном биоме: @/targetBiome
		targetBody = @/targetBody
		PARAMETER
		{
			name = HasPassenger
			type = HasPassengers
			kerbal = @/VIPname	//можно не указывать: по умолчанию подразумевает туристов по контракту
			// Реально без указания имени требует именно созданных в этой миссии! Т.е. с указанием индекса можно и итератор!
			// если бы эта падла еще и удаляла при отмене только созданных в этой миссии... Все бы было отлично.
			hidden = true
			hideChildren = true
			disableOnStateChange = false
		}
		// поскольку награда общая, нет смысла дополнительно чекать суборбитальный полет
		PARAMETER
		{
			name = OrbitCheck
			type = Orbit
			targetBody = @/targetBody
			minPeA = HomeWorld().AtmosphereAltitude()
			title = Выйти на орбиту Кербина
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = LandedCheck
			type = ReachState
			situation = LANDED
			situation = SPLASHED
			biome = @/targetBiome
			//Использовать biome.Name было бы красивее... если бы не добавка ^pf в конце.
			title = Сойти с орбиты и приземлиться на поверхность в заданном биоме: @biome
			completeInSequence = true
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/VIPname
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP_VIPTourKerbin_v2
	title = ВИП-туризм вокруг Кербина (посадка в заданную точку)
	description = Очень Важная Персона (заместитель директора по персоналу, а по совместительству ответственный мойщик посуды) желает вылететь в космос около Кербина и приземлиться в определенной точке. Обеспечьте гостю незабываемые впечатления и верните целым и невредимым домой, иначе вместо оплаты будет штраф!
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 10
	group = FMCP_Tourism
	targetBody = HomeWorld()
	cancellable = true
	declinable = true
	synopsis = Выполните все пожелания ВИП-туриста, и совершите безопасную посадку в заданном месте.
	completedMessage = Превосходно, клиент доволен как слон. На дрожащих ногах (но со счастливой улыбкой на лице) только что оставил великолепный отзыв. Так держать!
	advanceFunds = 10000.0
	rewardFunds = 75000.0
	rewardReputation = 35
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб турист, это серьезно!
	failureReputation = 20
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = @/targetBody
		checkType = MANNED
		title = Сначала надо вернуться с орбиты Кербина
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_VIPTourKerbin_v2
		cooldownDuration = 1d
	}
	DATA
	{
		type = Kerbal
		VIPname = NewKerbal()
		hidden = true
	}
	DATA
	{	// генерируем случайное название вейпойнта. Чтобы его использовать в title, иначе оно не нужно.
		type = List<String>
		spName = [ "Приключение ", "Мучение ", "Возвышение ", "Обучение ", "Задание ", "Отдых ", "Испытание ", "Страдание ", "Унижение " ]
		hidden = true
	}
	DATA
	{	// нельзя в одной DATA и список в скобках и сложение строк - ерунда будет.
		type = String
		wpName = @/spName.Random() + "Кермана"
		hidden = true
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/VIPname
		kerbalType = Tourist
		removePassengers = true
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		RANDOM_WAYPOINT
		{
			name = @/wpName
			targetBody = @/targetBody
			icon = marker	//balloon
			altitude = 0.0
			forceEquatorial = true
		}
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/VIPname
		hideChildren = true
		hidden = true
	}
	PARAMETER
	{
		name = MainGroup
		type = VesselParameterGroup
		title = Выйти на орбиту Кербина с @/VIPname на борту, и сойти с орбиты, добившись посадки точно в @/wpName
		targetBody = @/targetBody
		PARAMETER
		{
			name = HasPassenger
			type = HasPassengers
			kerbal = @/VIPname
			hidden = true
			hideChildren = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = OrbitCheck
			type = Orbit
			targetBody = @/targetBody
			minPeA = HomeWorld().AtmosphereAltitude()
			title = Выйти на орбиту Кербина
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			horizontalDistance = 5000.0	// после нескольких попыток, считаю 3 км с атмосферой круто. 5 км - норм
			hideOnCompletion = true
			showMessages = true
			// поскольку это не проверка посадки, приземлен или приводнен - не важно
			title = Сойти с орбиты и приземлиться на поверхность в заданной точке: @/wpName
			completeInSequence = true
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/VIPname
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
	}
}
// Контракты на 2 цели, тоже аналогичные "Туризм Экстендед"/Туризм+. 2-3 пассажира, всей группой, на одном корабле, по всем заданиям.
// Контракты на Муна - Солнце и Минмус - Солнце. И второй на орбиты Муны и Минмуса в один полет. Вполне летабельные, проверил.
CONTRACT_TYPE
{
	name = FMCP_TourAnyMoonAndSol
	title = Луна и Солнце - день чудесный
	description = Группа туристов заказала сложный маршрут: вся группа должна путешествовать вместе, все цели должны быть выполнены в одном полете и на одном корабле - от взлета и до посадки. К счастью, целей всего 2 - уверены, вы легко справитесь. Туристы желают побывать на орбите одной из наших лун, а потом покинуть сферу тяготения Кербина и выйти к Солнцу. И конечно, после всего этого вернуться домой, невредимыми! Никаких посадок, просто долгий полет и возвращение. Снаряжайте ракету запасом чипсов на пару месяцев - и вперед!
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 0
	group = FMCP_Tourism
	targetBody = HomeWorld().Parent()
	cancellable = true
	declinable = true
	synopsis = Прокатите группу туристов на орбиту @/targetMun и к Солнцу, а затем верните их домой.
	completedMessage = Отличная работа, все туристы успешно возвращены после долгого полета!
	advanceFunds = @/advanceF
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = 200000	// да, штраф будет большим - провал означает что у нас погибли туристы, как минимум сразу 2
	failureReputation = 30
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = HomeWorld().Children().First()
		checkType = MANNED
		title = Сначала надо вернуться с орбиты @targetBody
	}
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = HomeWorld().Children().Last()
		checkType = MANNED
		title = Сначала надо вернуться с орбиты @targetBody
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/targetBody.HaveReached()
		title = Сначала надо достичь @/targetBody, любым аппаратом
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_TourAnyMoonAndSol
		cooldownDuration = 15d
	}
	DATA
	{
		type = int
		touristCount = Random(2,4)	//2-3 туриста. Потому что есть капсула на 3 места.
		//теоретически можно и 5 (3+2), и 7 (3+кабина автостопщиков), но зачем?
		//нет цели заставить игрока сделать монструозный корабль и намучаться с возвращением
		hidden = true
	}
	DATA
	{
		// Не только для итератора. Без предсоздания имен удаляются уже имеющиеся туристы (бага конфигуратора)
		type = List<Kerbal>
		hidden = true
		allTourists = NewKerbals(@/touristCount)
	}
	DATA
	{
		type = CelestialBody
		targetMun = HomeWorld().Children().Random()
		hidden = true
	}
	DATA
	{
		type = double
		advanceF = 25000.0 * @/touristCount
		rewardF = 75000.0 * @/touristCount
		rewardR = 20 * @/touristCount
		hidden = true
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		//count = @/touristCount
		kerbal = @/allTourists
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/allTourists
		hideChildren = true
		hidden = true
	}
	PARAMETER
	{
		name = MoonSolTour
		type = VesselParameterGroup
		title = Выполните все пункты полетного задания: пассажиры на борту, посетить орбиту @/targetMun, достичь СТ @/targetBody, вернуть всех пассажиров домой. Ни один кербал не должен погибнуть.
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			kerbal = @/allTourists
		}
		PARAMETER
		{
			name = MoonOrbit
			type = ReachState
			situation = ORBITING
			targetBody = @/targetMun
			title = Выйти на орбиту @/targetMun
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReachSol
			type = ReachState
			targetBody = @/targetBody
			title = Уйти из сферы влияния Кербина к Солнцу
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReturnKerbin
			type = RecoverKerbal
			kerbal = @/allTourists
			hideChildren = true
			hidden = true
		}
	}
}
CONTRACT_TYPE
{
