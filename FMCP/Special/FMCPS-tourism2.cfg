}
// ВИП-туры на посадку на луны. Что-то такое есть в других наборах, но тут строго 1 турист. Я не издеваюсь над игроками!
// И никакой жести, ограничены локальными лунами. Требовать посадки в точку на Айк, чтобы при промахе возвращаться не солоно хлебавши?
// бугагашечки, я скажу куда засунуть такой контракт на сложности без сохранений. Только это неприлично.
// На Муну еще не так обидно - 2 дня и повторяем попытку. Простая ракета, быстрый полет
CONTRACT_TYPE
{
	name = FMCP_VIPTourMoons
	title = ВИП-туризм с посадкой на одну из лун в заданную точку
	description = Очень Важная Персона (уполномоченный по закупкам, а по совместительству ответственный облизыватель конвертов) желает посетить одну из лун Кербина и приземлиться в определенной точке. Обеспечьте гостю незабываемые впечатления и верните целым и невредимым домой, иначе вместо оплаты будет штраф!
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 0
	group = FMCP_Tourism
	targetBody = @/targetMun
	cancellable = true
	declinable = true
	synopsis = Доставьте ВИП-туриста на поверхность @/targetBody в заданную точку, а потом верните домой. Невредимым!
	completedMessage = Превосходно, клиент доволен как слон. На дрожащих ногах (но со счастливой улыбкой на лице) только что оставил великолепный отзыв. Так держать!
	advanceFunds = 15000.0
	rewardFunds = 80000.0
	rewardReputation = 35
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб турист, это серьезно!
	failureReputation = 20
	REQUIREMENT
	{
		type = ReturnFromSurface
		targetBody = HomeWorld().Children().First()
		checkType = MANNED
		title = Сначала надо вернуться с поверхности @targetBody
	}
	REQUIREMENT
	{
		type = ReturnFromSurface
		targetBody = HomeWorld().Children().Last()
		checkType = MANNED
		title = Сначала надо вернуться с поверхности @targetBody
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_VIPTourMoons
		cooldownDuration = 3d
	}
	DATA
	{
		type = CelestialBody
		targetMun = HomeWorld().Children().Random()
		hidden = true
	}
	DATA
	{
		type = Kerbal
		VIPname = NewKerbal()
		hidden = true
	}
	DATA
	{	// генерируем случайное название вейпойнта. Чтобы его использовать в title, иначе оно не нужно.
		type = List<String>
		spName = [ "Голубая ", "Зеленая ", "Коварная ", "Горячая ", "Большая ", "Небольшая ", "Зубастая ", "Крученая ", "Моченая " ]
		sdName = [ "Лагуна", "Дыра", "Устрица", "Нора", "Караганда", "Гора", "Спина", "Собака", "Коала", "Бастурма" ]
		hidden = true
	}
	DATA
	{	// нельзя в одной DATA и список в скобках и сложение строк - ерунда будет.
		type = String
		wpName = @/spName.Random() + @/sdName.Random()
		hidden = true
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/VIPname
		kerbalType = Tourist
		removePassengers = true
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		RANDOM_WAYPOINT
		{
			name = @/wpName
			targetBody = @/targetMun
			icon = marker	//balloon
			altitude = 0.0
			forceEquatorial = false
		}
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/VIPname
		hideChildren = true
		hidden = true
	}
	PARAMETER
	{
		name = MainGroup
		type = VesselParameterGroup
		title = Выполнить требования туриста @/VIPname (посадка в указанную точку) и вернуть его на Кербин. Живым!
		targetBody = @/targetBody
		PARAMETER
		{
			name = HasPassenger
			type = HasPassengers
			kerbal = @/VIPname
			hidden = true
			//помним, что скрывать полностью нельзя! имя туриста должно быть хоть где-то (в данном случае в title группы)
			hideChildren = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			horizontalDistance = 1500.0	// даже с допуском +-километр, задачка сложная
			// я успешно сажусь до 500м вручную. мехджеб +-100. Допуск в километр без атмосферы для молодого пилота норм
			hideOnCompletion = true
			showMessages = true
			// поскольку это не проверка посадки, приземлен или приводнен - не важно
			title = Приземлиться на поверхность @/targetMun в заданной точке: @/wpName
			completeInSequence = true
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/VIPname
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
	}
}