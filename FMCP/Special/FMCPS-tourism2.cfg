CONTRACT_TYPE
{
	name = UnifiedStocklikeTourism2
	// два дня тыканья методом проб и ошибок!
	// Зачем? потому что гладиолус! Потому что я хотел сделать как в стоке.
	// Туризм может быть отключен каким-то из наборов, потому что автор пака с самомнением...
	// Или туризм может перестать генерироваться, потому что предложений с наборов слишком много
	// А игроку нужен туризм хоть в каком виде, это источник средств и репутации.
	title = Космический туризм
	description = Группа туристов желает ощутить себя матерыми космическими волками, бороздящими просторы Вселенной. Отправьте их по заказанным маршрутам и верните в целости домой.
	prestige = Significant
	maxSimultaneous = 1
	maxCompletions = 0
	group = FMCP
	cancellable = true
	declinable = true
	synopsis = Обеспечьте всем туристам великолепные впечатления!
	completedMessage = Все туристы выполнили свои туры и возвращены живыми.
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	REQUIREMENT
	{
		type = Expression
		expression = @/tBodies.Count()>1
		title = Должно быть посещено хоть что-то кроме Кербина!
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = UnifiedStocklikeTourism2
		cooldownDuration = 5d
	}
	// Итак. Туризм происходит группами от 2 до 6 кербалов.
	// Каждый кербал определяет от 2 до 4 целей (например, орбита Кербина, орбита Муны, посадка на Минмус)
	// Каждого туриста можно возить любое количество раз, пока все его цели не будут закрыты.
	// Каждого туриста можно возить индивидуально. Или группой, если цели совпали.
	// Варианты как в стоке (пролет-орбита-посадка), планеты только Кербин и его луны.
	// Причем всегда, т.е. с момента доступности контракта и навечно.
	// Карьерное развитие вариантов для группы с индивидуальными планами в конфигураторе... на грани невозможного.
	// Оплата щедрая, особенно в репутации (почти как за стоковых ВИПов с каждого). Деньгами... в стоке выгоднее.
	DATA
	{
		type = int
		// функция возвернет от 2 до 6
		actualPassengerCount = Random(2, 7)
		hidden = true
	}
	DATA
	{
		// компенсация за фиксированные суммы на маршруте. за 6 туристов будет 120К и 60 репутации.
		type=float
		rewardF = 20000.0 * @/actualPassengerCount
		rewardR = 10 * @/actualPassengerCount
		hidden = true
	}
	DATA
	{
		type = List<String>
		allSituations = ["Kerbin SUB_ORBITAL","Kerbin ORBITING","Mun ESCAPING","Mun ORBITING", "Mun LANDED","Minmus ESCAPING","Minmus ORBITING","Minmus LANDED"]
		hidden=true
		ticketsTourist0 = @allSituations.Random(2, 5)
		ticketsTourist1 = @allSituations.Random(2, 5)
		ticketsTourist2 = @allSituations.Random(2, 5)
		ticketsTourist3 = @allSituations.Random(2, 5)
		ticketsTourist4 = @allSituations.Random(2, 5)
		ticketsTourist5 = @allSituations.Random(2, 5)
	}
	DATA
	{
		type = List<CelestialBody>
		listBodies = [ Kerbin, Mun, Minmus ]
		tBodies = ReachedBodies()	//пережиток старого режима, когда надеялся генерить для достигнутых тел. Наивно...
		hidden = true
	}
	DATA
	{
		type = List<Kerbal>
		// Зачем: чтобы в тексте ссылаться на имена туристов. Потому что итератора по туристам нет.
		flyingTourists = NewKerbals(@/actualPassengerCount)
		hidden = true
	}
	//=====================================================================================
	// Панеслась! Цените стоковый туризм, сделать аналог в конфигураторе то еще извращение!
	// 1. Итератор по кербалам невозможен, т.к. каждому надо собственную программу. А списка списков, многомерных массивов и словарей тут нет.
	//    И нельзя перемножать матрицы, чтобы из переменного состава ReachedBodies слепить массив для выбора. Пришлось жестко Кербин-Муна-Минмус.
	// 2. Свой класс создать нельзя, поэтому либо издеваться через ScienceSubject (там есть и тело и ситуация)(пробовал, title вообще не осилил)...
	//	  ...либо делать вот такую текстовую массивину, см. allSituations, а потом парсить ее. И полноценный парсер не сделать, выеживаемся как можем.
	// 3. Количество туристов ограничено. Я выбрал от 2 до 6. Для каждого ЗАРАНЕЕ надо создать программу полета. Даже если не летит, все равно надо.
	//    потому что массивов многомерных нет и списка из списков тоже. Значит 6 списков с персональными именами.
	// 4. Как следствие, надо иметь 6 блоков, на каждого возможного. И в каждом итератор с той самой персональной программой. Потому что по 1 списку.
	//    ну и в каждом блоке после 2го REQUIREMENT, отключающий неиспользуемое.
	// 5. Поскольку в итераторе строки, а из них надо получить CelestialBody и enum-ситуации, это боль... И title тоже боль... и награды боль!
	//    я ж хочу чтобы как в стоке! hideChildren и все в title... Потребовалось 8 перезапусков игры только на подписи.
	// 6. Ну и со всей этой халабудой попробуем взлететь - я ж еще не отлаживал, бугагашечки! Пока только "компиляции" добился.
	//=====================================================================================
	BEHAVIOUR
	{
		//создаем туристов. Все остальное пойдет по умолчанию (тип - туристы, удалить после выполнения)
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/flyingTourists
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/flyingTourists
		title = Без жертв: все туристы должны выжить
	}
	PARAMETER
	{
		name = TouristAll
		type = All
		title = Выполнить полетную программу индивидуально для каждого
		// Минимум 2, так что первый летит всегда
		PARAMETER
		{
			name = Goals0
			type = All
			// Должно начинаться со строки, иначе пытается приравнять кербала строке и выдает ошибку
			// ...казалось бы мелочь - но бесит. Нельзя получить "Асмодей Керман желает", выеживаемся :(
			title = Турист @/flyingTourists.ElementAt(0) желает
			PARAMETER
			{
				name = CheckPassenger0
				type = HasPassengers
				kerbal = @/flyingTourists.ElementAt(0)
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = Destination0
				type = ReachState
				// жесть как она есть. Просто так в тип CelestialBody строку не всунуть! и через CelestialBody(string) тоже.
				targetBody = @targetSubject.StartsWith("Kerbin")?@/listBodies.ElementAt(0):@targetSubject.StartsWith("Mun")? @/listBodies.ElementAt(1): @/listBodies.ElementAt(2)
				// аналогично, строку в enum не впихнуть.
				situation = (@targetSubject.EndsWith("SUB_ORBITAL")? SUB_ORBITAL:@targetSubject.EndsWith("ESCAPING")? ESCAPING:@targetSubject.EndsWith("ORBITING")?ORBITING:LANDED)
				// тут с множителями облом, потому что царь не настоящий. В смысле, у таргетБади нет мультиплаера, потому что его считает за List
				// И простите но выеживаться с оплатой по ситуациям я уже не хочу... так что и пролет, и орбита, и посадка стоят одинаково.
				rewardFunds = @targetSubject.StartsWith("Kerbin")? 10000: @targetSubject.StartsWith("Mun")? 16000: 20000
				// проклятое title, выпившее кровушки... Ну вот как-то так оно пишет примерно то, что хотелось
				title = @targetSubject.EndsWith("ORBITING")? "Побывать на орбите @targetBody" : @targetSubject.EndsWith("SUB_ORBITAL")? "Суборбитальный полет над Кербином" : @targetSubject.EndsWith("ESCAPING")? "Пролететь мимо @targetBody" : "Посетить поверхность @targetBody"
				// и скроем детали, оставив только title.
				hideChildren = true
				// это обязательно - нам нужна перманентная зеленая галка при выполнении каждой части маршрута
				disableOnStateChange=true
				ITERATOR
				{
					type = String
					// каждая переменная - строка, "ИД_тела СИТУАЦИЯ".
					// Вообще я мог бы писать "1 A", "1 B", "1 C", "2 A", "2 B" и так далее. Потому что все превратилось в уродские if
					targetSubject = @/ticketsTourist0
				}
			}
			PARAMETER
			{
				name = Recover0
				type = RecoverKerbal
				kerbal = @/flyingTourists.ElementAt(0)
				title = Вернуться живым на Кербин
				hideChildren = true
				// выдадим репутацию по 5 за каждую хотелку
				rewardReputation = 5 * @/ticketsTourist0.Count()
				// и доп-сумму в конце по 5К за каждую хотелку
				rewardFunds = 5000 *  @/ticketsTourist0.Count()
				// Вообще правильнее за полный маршрут выдавать - т.е. в корень группы ALL. НО по логике выполнение этого и будет завершением.
				//
				// вот этот completeInSequence нужен - если все правильно сработает - чтобы туриста можно было возить несколько раз.
				// Иначе кербала отрекаверит после первого полета, потом контракт закроется где-нибудь на Минмусе. И хз что будет.
				// А так надеемся, что пока не выполнятся ВСЕ хотелки по очереди, турист будет возвращаться и ждать очередного полета
				completeInSequence = true 
			}
			// Цените стоковый туризм, он уникален. Он приятен. Любые поделки в конфигураторе будут хуже. Да-да, и туризмЭкстендед, и прочие.
			// Просто можно сделать только "возить толпой сразу всех и по всем чекпойнтам на одном корабле"... Это отстой.
			// И вот это в том числе. В текстах планеты без падежей, привязать к карьере невозможно, короче - нормальный туризм тут не сделать!
			// Так что всеми силами любой контракто-писатель должен сохранить стоковый туризм. Как минимум - не отключать!
		}
		// Минимум 2, второй тоже летит всегда
		PARAMETER
		{
			name = Goals1
			type = All
			title = Турист @/flyingTourists.ElementAt(1) желает
			PARAMETER
			{
				name = CheckPassenger1
				type = HasPassengers
				kerbal = @/flyingTourists.ElementAt(1)
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = Destination1
				type = ReachState
				targetBody = @targetSubject.StartsWith("Kerbin")?@/listBodies.ElementAt(0):@targetSubject.StartsWith("Mun")? @/listBodies.ElementAt(1): @/listBodies.ElementAt(2)
				situation = (@targetSubject.EndsWith("SUB_ORBITAL")? SUB_ORBITAL:@targetSubject.EndsWith("ESCAPING")? ESCAPING:@targetSubject.EndsWith("ORBITING")?ORBITING:LANDED)
				rewardFunds = @targetSubject.StartsWith("Kerbin")? 10000: @targetSubject.StartsWith("Mun")? 16000: 20000
				title = @targetSubject.EndsWith("ORBITING")? "Побывать на орбите @targetBody" : @targetSubject.EndsWith("SUB_ORBITAL")? "Суборбитальный полет над Кербином" : @targetSubject.EndsWith("ESCAPING")? "Пролететь мимо @targetBody" : "Посетить поверхность @targetBody"
				hideChildren = true
				disableOnStateChange=true
				ITERATOR
				{
					type = String
					targetSubject = @/ticketsTourist1
				}
			}
			PARAMETER
			{
				name = Recover1
				type = RecoverKerbal
				kerbal = @/flyingTourists.ElementAt(1)
				title = Вернуться живым на Кербин
				hideChildren = true
				rewardReputation = 5 * @/ticketsTourist1.Count()
				rewardFunds = 5000 *  @/ticketsTourist1.Count()
				completeInSequence = true 
			}
		}
		// 3й летит только если счетчик 3 и больше. И далее аналогично
		PARAMETER
		{
			name = Goals2
			type = All
			title = Турист @/flyingTourists.ElementAt(2) желает
			REQUIREMENT
			{
				type = Expression
				expression = @/actualPassengerCount > 2
			}
			PARAMETER
			{
				name = CheckPassenger2
				type = HasPassengers
				kerbal = @/flyingTourists.ElementAt(2)
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = Destination2
				type = ReachState
				targetBody = @targetSubject.StartsWith("Kerbin")?@/listBodies.ElementAt(0):@targetSubject.StartsWith("Mun")? @/listBodies.ElementAt(1): @/listBodies.ElementAt(2)
				situation = (@targetSubject.EndsWith("SUB_ORBITAL")? SUB_ORBITAL:@targetSubject.EndsWith("ESCAPING")? ESCAPING:@targetSubject.EndsWith("ORBITING")?ORBITING:LANDED)
				rewardFunds = @targetSubject.StartsWith("Kerbin")? 10000: @targetSubject.StartsWith("Mun")? 16000: 20000
				title = @targetSubject.EndsWith("ORBITING")? "Побывать на орбите @targetBody" : @targetSubject.EndsWith("SUB_ORBITAL")? "Суборбитальный полет над Кербином" : @targetSubject.EndsWith("ESCAPING")? "Пролететь мимо @targetBody" : "Посетить поверхность @targetBody"
				hideChildren = true
				disableOnStateChange=true
				ITERATOR
				{
					type = String
					targetSubject = @/ticketsTourist2
				}
			}
			PARAMETER
			{
				name = Recover2
				type = RecoverKerbal
				kerbal = @/flyingTourists.ElementAt(2)
				title = Вернуться живым на Кербин
				hideChildren = true
				rewardReputation = 5 * @/ticketsTourist2.Count()
				rewardFunds = 5000 *  @/ticketsTourist2.Count()
				completeInSequence = true 
			}
		}
		PARAMETER
		{
			name = Goals3
			type = All
			title = Турист @/flyingTourists.ElementAt(3) желает
			REQUIREMENT
			{
				type = Expression
				expression = @/actualPassengerCount > 3
			}
			PARAMETER
			{
				name = CheckPassenger3
				type = HasPassengers
				kerbal = @/flyingTourists.ElementAt(3)
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = Destination3
				type = ReachState
				targetBody = @targetSubject.StartsWith("Kerbin")?@/listBodies.ElementAt(0):@targetSubject.StartsWith("Mun")? @/listBodies.ElementAt(1): @/listBodies.ElementAt(2)
				situation = (@targetSubject.EndsWith("SUB_ORBITAL")? SUB_ORBITAL:@targetSubject.EndsWith("ESCAPING")? ESCAPING:@targetSubject.EndsWith("ORBITING")?ORBITING:LANDED)
				rewardFunds = @targetSubject.StartsWith("Kerbin")? 10000: @targetSubject.StartsWith("Mun")? 16000: 20000
				title = @targetSubject.EndsWith("ORBITING")? "Побывать на орбите @targetBody" : @targetSubject.EndsWith("SUB_ORBITAL")? "Суборбитальный полет над Кербином" : @targetSubject.EndsWith("ESCAPING")? "Пролететь мимо @targetBody" : "Посетить поверхность @targetBody"
				hideChildren = true
				disableOnStateChange=true
				ITERATOR
				{
					type = String
					targetSubject = @/ticketsTourist3
				}
			}
			PARAMETER
			{
				name = Recover3
				type = RecoverKerbal
				kerbal = @/flyingTourists.ElementAt(3)
				title = Вернуться живым на Кербин
				hideChildren = true
				rewardReputation = 5 * @/ticketsTourist3.Count()
				rewardFunds = 5000 *  @/ticketsTourist3.Count()
				completeInSequence = true 
			}
		}
		PARAMETER
		{
			name = Goals4
			type = All
			title = Турист @/flyingTourists.ElementAt(4) желает
			REQUIREMENT
			{
				type = Expression
				expression = @/actualPassengerCount > 4
			}
			PARAMETER
			{
				name = CheckPassenger4
				type = HasPassengers
				kerbal = @/flyingTourists.ElementAt(2)
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = Destination4
				type = ReachState
				targetBody = @targetSubject.StartsWith("Kerbin")?@/listBodies.ElementAt(0):@targetSubject.StartsWith("Mun")? @/listBodies.ElementAt(1): @/listBodies.ElementAt(2)
				situation = (@targetSubject.EndsWith("SUB_ORBITAL")? SUB_ORBITAL:@targetSubject.EndsWith("ESCAPING")? ESCAPING:@targetSubject.EndsWith("ORBITING")?ORBITING:LANDED)
				rewardFunds = @targetSubject.StartsWith("Kerbin")? 10000: @targetSubject.StartsWith("Mun")? 16000: 20000
				title = @targetSubject.EndsWith("ORBITING")? "Побывать на орбите @targetBody" : @targetSubject.EndsWith("SUB_ORBITAL")? "Суборбитальный полет над Кербином" : @targetSubject.EndsWith("ESCAPING")? "Пролететь мимо @targetBody" : "Посетить поверхность @targetBody"
				hideChildren = true
				disableOnStateChange=true
				ITERATOR
				{
					type = String
					targetSubject = @/ticketsTourist4
				}
			}
			PARAMETER
			{
				name = Recover4
				type = RecoverKerbal
				kerbal = @/flyingTourists.ElementAt(4)
				title = Вернуться живым на Кербин
				hideChildren = true
				rewardReputation = 5 * @/ticketsTourist4.Count()
				rewardFunds = 5000 *  @/ticketsTourist4.Count()
				completeInSequence = true 
			}
		}
		PARAMETER
		{
			name = Goals5
			type = All
			title = Турист @/flyingTourists.ElementAt(5) желает
			REQUIREMENT
			{
				type = Expression
				expression = @/actualPassengerCount > 5
			}
			PARAMETER
			{
				name = CheckPassenger5
				type = HasPassengers
				kerbal = @/flyingTourists.ElementAt(5)
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = Destination5
				type = ReachState
				targetBody = @targetSubject.StartsWith("Kerbin")?@/listBodies.ElementAt(0):@targetSubject.StartsWith("Mun")? @/listBodies.ElementAt(1): @/listBodies.ElementAt(2)
				situation = (@targetSubject.EndsWith("SUB_ORBITAL")? SUB_ORBITAL:@targetSubject.EndsWith("ESCAPING")? ESCAPING:@targetSubject.EndsWith("ORBITING")?ORBITING:LANDED)
				rewardFunds = @targetSubject.StartsWith("Kerbin")? 10000: @targetSubject.StartsWith("Mun")? 16000: 20000
				title = @targetSubject.EndsWith("ORBITING")? "Побывать на орбите @targetBody" : @targetSubject.EndsWith("SUB_ORBITAL")? "Суборбитальный полет над Кербином" : @targetSubject.EndsWith("ESCAPING")? "Пролететь мимо @targetBody" : "Посетить поверхность @targetBody"
				hideChildren = true
				disableOnStateChange=true
				ITERATOR
				{
					type = String
					targetSubject = @/ticketsTourist5
				}
			}
			PARAMETER
			{
				name = Recover5
				type = RecoverKerbal
				kerbal = @/flyingTourists.ElementAt(5)
				title = Вернуться живым на Кербин
				hideChildren = true
				rewardReputation = 5 * @/ticketsTourist5.Count()
				rewardFunds = 5000 *  @/ticketsTourist5.Count()
				completeInSequence = true 
			}
		}
	}
}