					expression = !(@targetBody.IsHomeWorld()||@targetBody.IsSun())
					title = not Kerbin or Sun
				}
				REQUIREMENT
				{
					// только если был возврат кербалов с поверхности тела!
					type = ReturnFromSurface
					// проблема! для Кербина тут ошибка. препятствующая формированию контракта...
					//То есть: несмотря на то что Кербин я отсеял выше, сама проверка для Кербина вызывает ошибку.
					//То есть либо универсальный туризм исключительно орбитальный. А для посадок нужен отдельный контракт!
					// Либо исключать Кербин из общего списка, делая круг по Кербину без итератора.
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					title = only past return
				}
				REQUIREMENT
				{
					// случайно, с шансом 1/4
					type = Expression
					expression = (3 < Random(1,5))
					title = and random
				}
			}
			ITERATOR
			{
				type = CelestialBody
				listBody = @/allReached
			}
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @../curKerbal
			hideChildren = true
			title = И вернуться после всех полетов домой!
			completeInSequence = true
		}
		ITERATOR
		{
			type = Kerbal
			curKerbal = @/allTourists
		}
	}
}