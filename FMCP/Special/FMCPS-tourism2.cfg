// А теперь правильный туризм! Почти как стоковый, с прогрессией
// только не работает, потому что от переменной итератора нельзя передавать targetBody ниже в потомков. Вернее можно, но методы не вызываются
// По какой-то причине для потомка, получающего значение от родителя, вместо CelestialBody приходит список. Из 1 элемента.
// Этот список можно отправить в просто targetBody (там допускается список), но нельзя вызвать методы.
// IsHomeWorld() и IsSun() вызывают ошибку "в классе List таких методов нет", а ...
// попытка сделать .ElementAt(0) вызывает ошибку "в классе CelestialBody такого метода нет". Тут где-то серьезная бага :(
// при этом на уровне параметра с итератором все ок. Честное CelestialBody, никаких списков, любые методы.
CONTRACT_TYPE
{
	name = FMCP_StocklikeTourism_v2
	title = Космический туризм (v2)
	description = Несколько туристов хотят увидеть звезды и небесные тела из иллюминатора, своими собственными глазами. Отправьте их по заказанным маршрутам и верните в целости домой.
	prestige = Significant
	maxSimultaneous = 1
	maxCompletions = 0
	group = FMCP
	cancellable = true
	declinable = true
	synopsis = Обеспечьте всем туристам великолепные впечатления!
	completedMessage = Все туристы выполнили свои туры и возвращены живыми.
	advanceFunds = 25000.0
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб турист, это серьезно!
	failureReputation = 20
	// Панеслась! Отправлять будем от 2 минимум до 7 максимум туристов
	// Причем случайное "до 7" будет расти медленно с количеством открытых тел.
	// Все туристы летают как угодно, по 1 или группами.
	// Все цели выполняются в любом порядке, за один или несколько полетов,
	// за исключением случая нескольких целей у одного тела. Тогда строго в одном полете.
	// с шансом 1/5 случайное отключение цели, чтобы программы у туристов отличались...
	// ...иначе все будут хотеть одного и того же, за исключением посадок.
	// (посадки выдаются с шансом 1/4)
	// Количество целей увеличивается с увеличением числа открытых тел.
	// Неограниченно предлагается. Без лимита на выполнение.
	
	// Не требуется. Если ждем пролета Муны, очевидно космос достигнут.
	//REQUIREMENT
	//{
	//	name = ReachSpace
	//	type = ReachSpace
	//	title = Доступно с момента выхода в космос
	//}
    REQUIREMENT
    {
    	name = Expression
		type = Expression
		expression = @/rBodies > 0
    	title = Должно быть открыто хотя бы одно тело (кроме Кербина)
    }
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_StocklikeTourism_v2
		cooldownDuration = 1d
	}
	DATA
	{
		// список всех посещенных тел. Заработает с момента суборбитального полета
		// Кербин, потом Кербин и Муна, потом Кербин, Муна и Минмус, потом +Солнце, потом +Дюна или Ева и так далее.
		// Вечное масштабирование!
		type = List<CelestialBody>
		allReached = ReachedBodies().Exclude(HomeWorld())	//Кроме Кербина
		//allReached = [ Kerbin, Mun, Minmus, Sol ]	//ReachedBodies()
		hidden = true
	}
	DATA
	{
		// максимальное количество туристов будет увеличиваться с количеством посещенных тел, чисто для фана
		// сначала 2, потом 2-3, 2-4, 2-5. На Дюну и Еву уже 2-6. Но 7 туристов в контракте - это уже предел! 
		type = int
		hidden = true
		rBodies = @/allReached.Count()

		//topMax = @tMax + 1

	}
	DATA
	{
		type = int
		tMax = Min(@/rBodies,6)	//сначала растет от 1 до 6, потом будет строго 6
		topMax = @tMax + 2
		hidden = true
	}
	DATA
	{
		type = int
		touristCount = Random(2,@/topMax)	//от ровно 2 вокруг Кербина, до максимально 7 на другие планеты
		// скобка после имени должна быть слитно без пробелов!
	}
	DATA
	{
		// Нужно для итератора. Иначе можно было бы сразу SpawnPassengers
		type = List<Kerbal>
		hidden = true
		allTourists = NewKerbals(@/touristCount)
	}
	DATA
	{
		type = float
		hidden = true
		rewardF = 25000 + (8000 * @/touristCount) + (8000 * (@/touristCount-2))
		rewardR = 5 + 10 * @/touristCount + 5 * @/rBodies
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/allTourists
		kerbalType = Tourist		// не обязательно - по умолчанию так
		removePassengers = true		// не обязательно - для типа "турист" по умолчанию. Туристы исчезают после выполнения контракта
	}
	PARAMETER
	{
		name = ForEachTourist
		type=All
		title = Турист @curKerbal желает
			// curKerbal = @ITERATOR/curKerbal.ElementAt(IteratorCurrentIndex())
			// iteratorCount = @ITERATOR/curKerbal.Count()
		//сюда надо вкрячить требования только для Кербина без итератора
		//А список ReachedBodies - вычеркивать Кербин.
		PARAMETER
		{
			name = KerbinPersonal
			type = VesselParameterGroup
			title = Выйти в космос над родной планетой, и совершить...
			targetBody = Kerbin
			rewardFunds = 10000
			disableOnStateChange = true
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers
				kerbal = @../../curKerbal
				disableOnStateChange = false
				hidden = true
			}
			// Параметр не нужен, т.к. всегда будет только орбита
			//PARAMETER
			//{
			//	name = KerbinSubOrbital
			//	type = ReachState
			//	situation = SUBORBITAL
			//	targetBody = Kerbin		//CelestialBody(@../targetBody)
			//	title = ...суб-орбитальный полет над Кербином
			//	hideChildren = true
			//	completeInSequence = true
			//	disableOnStateChange = true
			//	rewardFunds = 3000
			//	REQUIREMENT
			//	{
			//		// только пока не произошел первый возврат кербалов с орбиты тела!
			//		type = ReturnFromOrbit
			//		targetBody = Kerbin		//CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
			//		checkType = MANNED
			//		invertRequirement = true
			//		title = Суборбитальные полеты только до возврата с орбиты
			//	}
			//}
			PARAMETER
			{
				name = KerbinOrbit
				type = ReachState
				situation = ORBITING
				targetBody = Kerbin		//CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...орбитальный облет Кербина
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 7000
			// Требование не нужно - к моменту Муны орбита Кербина уже достигнута	
			//	REQUIREMENT
			//	{
			//		// только если был возврат кербалов с орбиты тела!
			//		type = ReturnFromOrbit
			//		targetBody = Kerbin	//CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
			//		checkType = MANNED
			//		title = А с момента возврата с орбиты - все хотят орбиту
			//	}
			}
		}
		PARAMETER
		{
			//Поскольку проверка возврата с поверхности для Кербина вызывает ошибку,
			// он вынесен отдельно. А в этом цикле Кербина просто не будет. Никогда.
			// listBody = @ITERATOR/listBody.ElementAt(IteratorCurrentIndex())
			// iteratorCount = @ITERATOR/listBody.Count()
			// targetBody = @ITERATOR/listBody.ElementAt(IteratorCurrentIndex())
			name = ForEachBody
			type = VesselParameterGroup
			title = Посетить тело: @targetBody, совершив...
			//targetBody = @listBody		// Парадокс... 
			// listBody = @ITERATOR/listBody.ElementAt(IteratorCurrentIndex()) - на этом уровне. И это просто CelestialBody
			// Однако, любое обращение к переменной за пределами параметра (из вложенных) возвращает список. List<CelestialBody>
			// т.е. Можно сделать итерацию на 1 уровне (и оно нормально примет - кербалов, эксперименты и тела)
			// но невозможно обратится на уровень выше за значением итератора. Вернет список, считая его не списком...
			// и тогда парсер контракта выдаст ошибку до формирования контракта. Не ран-тайм, а JIT.
			// кроме случаев когда список допустим, и не вызываются методы ни списка, ни объекта
			targetBody = @listBody
			//IsSun = @ITERATOR/listBody.ElementAt(IteratorCurrentIndex()).IsSun()
			//IsHome = @ITERATOR/listBody.ElementAt(IteratorCurrentIndex()).IsHomeWorld()
			rewardFunds = 5000 * @/rBodies
			disableOnStateChange = true
			//REQUIREMENT
			//{
			//	type = Any
				REQUIREMENT
				{
				// случайно, с шансом 4/5
					type = Expression
					expression = (5 > Random(1,6))
					title = random
				}
				// Это больше не требуется, т.к. Кербин вынесен всегда
				//REQUIREMENT
				//{
				//	// Чтобы не было случая пустого списка, над Кербином и к Солнцу летать будут все.
				//	type = Expression
				//	targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				//	// потому что Any {Requirement - подняться на 2
				//	expression = (@targetBody.IsHomeWorld()||@targetBody.IsSun())
				//	title = always Kerbin and Sun
				//}
			//}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers
				kerbal = @../../curKerbal
				disableOnStateChange = false
				hidden = true
			}
			//PARAMETER
			//{
			//	name = KerbinSubOrbital
			//	type = ReachState
			//	situation = SUBORBITAL
			//	targetBody = CelestialBody(@../targetBody)
			//	title = ...суб-орбитальный полет над Кербином
			//	hideChildren = true
			//	completeInSequence = true
			//	disableOnStateChange = true
			//	rewardFunds = 6000
			//	REQUIREMENT
			//	{
			//		// только пока не произошел первый возврат кербалов с орбиты тела!
			//		type = ReturnFromOrbit
			//		targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
			//		checkType = MANNED
			//		invertRequirement = true
			//		title = till return orbit
			//	}
			//	REQUIREMENT
			//	{
			//		// только для Кербина - суборбитально. Для остальных пролет
			//		type = Expression
			//		targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
			//		expression = (@targetBody.IsHomeWorld())
			//		title = only Kerbin
			//	}
			//}
			PARAMETER
			{
				name = AnyFlyBy
				type = ReachState
				//situation = ESCAPING
				// any situation. Reach SOI of targetBody
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...пролет мимо @targetBody
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 10000
				REQUIREMENT
				{
					// только пока не произошел первый возврат кербалов с орбиты тела!
					type = ReturnFromOrbit
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					invertRequirement = true
					title = till not return from orbit
				}
				REQUIREMENT
				{
					// Тело, отличное от Кербина. Но не Солнце
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = !(@targetBody.IsSun())
					title = not Kerbin or Sun
				}
			}
			PARAMETER
			{
				name = ReachSol
				type = ReachState
				//situation = ESCAPING
				// any situation. Reach SOI of targetBody
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...выход из СТ Кербина к Солнцу!
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 15000
				REQUIREMENT
				{
					// тело является звездой
					type = Expression
