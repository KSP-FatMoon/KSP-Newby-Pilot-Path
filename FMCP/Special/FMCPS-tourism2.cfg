CONTRACT_TYPE
{
	name = FMCP_TouristsPurification
	title = Чистка туристов (отладочная)
	description = Берите контракт, только если провален один или несколько туристических, и у вас остались туристы, более не связанные с контрактом (они не исчезают при провале). И нет других туристических контрактов, еще невыполненных. Принятие этого контракта и выполнение, если туристы еще связаны со своими миссиями, приведет к еще большим багам - думайте что делаете.\n\n (ПРИМЕЧАНИЕ ОТ РАЗРАБОТЧИКА: событие RecoverKerbal срабатывает в момент возврата аппарата или кербала. Если все персонажи, которых надо вернуть, уже находятся в центре, погрузите их в капсулу, выставьте на стартовый стол и тут же верните, чтобы контракт закрылся)
	prestige = Trivial
	maxSimultaneous = 1
	maxCompletions = 0
	minExpiry = 1
	maxExpiry = 1
	group = FMCP_Tourism
	cancellable = true
	declinable = true
	synopsis = Если у вас остались туристы, не связанные с контрактами (например из-за гибели одного и провала контракта), и переиграть невозможно (например из-за максимальной сложности, не допускающей отмены или загрузки, или принципов - судьба, и пусть будет так!), выполните эту простую миссию. Выставьте капсулу с туристами на стартовый стол и тут же верните. 
	completedMessage = Надеюсь вы знаете, что делаете. Все туристы покинули центр кербонавтов.

	rewardFunds = 0.0
	rewardReputation = 0
	REQUIREMENT
	{
		type = Expression
		expression = false
		title = Перманентно скрыт. Поставить true для отладки
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/allTourists.Count()>0
		title = Есть туристы (хотя бы 1)
	}
	DATA
	{
		type = List<Kerbal>
		hidden = true
		allTourists = AllKerbals().Where(k=> (k.ExperienceTrait()==Tourist))
	}
	BEHAVIOUR
	{
		name = RemoveKerbal
		type = RemoveKerbal
		kerbal = @/allTourists
	}
	PARAMETER
	{
		name = ReturnSurvived
		type = RecoverKerbal
		ITERATOR
		{
			type=Kerbal
			actor = @/allTourists
		}
		kerbal = @actor
		hideChildren = true
		title = Персонаж @kerbal должен быть возвращен в центр кербонавтов.
	}
}
CONTRACT_TYPE
{
	name = FMCP_StocklikeTourism_v2
	title = Космический туризм (v2)
	description = Несколько туристов хотят увидеть звезды и небесные тела из иллюминатора, своими собственными глазами. Отправьте их по заказанным маршрутам и верните в целости домой.
	prestige = Significant
	maxSimultaneous = 1
	maxCompletions = 0
	group = FMCP_Tourism
	cancellable = true
	declinable = true
	synopsis = Обеспечьте всем туристам великолепные впечатления!
	completedMessage = Все туристы выполнили свои туры и возвращены живыми.
	advanceFunds = 25000.0
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб турист, это серьезно!
	failureReputation = 20

    REQUIREMENT
    {
    	name = Expression
		type = Expression
		expression = @/rBodies > 0
    	title = Должно быть достигнуто хотя бы одно тело (кроме Кербина)
    }
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_StocklikeTourism_v2
		cooldownDuration = 5d
	}
	DATA
	{
		type = List<CelestialBody>
		allReached = ReachedBodies().Exclude(HomeWorld())	//Кроме Кербина
		hidden = true
	}
	DATA
	{
		type = int
		hidden = true
		rBodies = @/allReached.Count()
		tMax = Min(@/rBodies,5)
		topMax = @tMax + 1
	}
	DATA
	{
		type = int
		touristCount = Random(2,@/topMax)
	}
	DATA
	{
		type = List<Kerbal>
		hidden = true
		allTourists = NewKerbals(@/touristCount)
	}
	DATA
	{
		type = float
		hidden = true
		rewardF = 25000 + (8000 * @/touristCount) + (8000 * (@/touristCount-2)) + 25000 * (@/rBodies - 1)
		rewardR = 5 + 10 * @/touristCount + 5 * @/rBodies
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/allTourists
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/allTourists
		title = Без жертв: все туристы должны выжить
		hidden = true
		hideChildren = true
	}
	PARAMETER
	{
		name = ForEachTourist
		type=All
		title = Турист @curKerbal желает

		PARAMETER
		{
			name = KerbinPersonal
			type = VesselParameterGroup
			title = Выйти в космос над родной планетой, и совершить...
			targetBody = HomeWorld()
			disableOnStateChange = true
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers
				kerbal = @../../curKerbal
				hideChildren = true
				disableOnStateChange = false
				hidden = true
			}
			PARAMETER
			{
				name = KerbinOrbit
				type = ReachState
				situation = ORBITING
				targetBody = HomeWorld()
				title = ...орбитальный облет Кербина
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 8000
			}
		}
		PARAMETER
		{
			name = ForEachBody
			type = VesselParameterGroup
			title = Посетить тело: @targetBody, совершив...
			targetBody = @listBody
			disableOnStateChange = true
			REQUIREMENT
			{
				type = Expression
				expression = (5 > Random(1,6))
				title = random
			}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers
				kerbal = @../../curKerbal
				disableOnStateChange = false
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = AnyFlyBy
				type = ReachState
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...пролет мимо @targetBody
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 10000
				REQUIREMENT
				{
					type = ReturnFromOrbit
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					invertRequirement = true
					title = till not return from orbit
				}
				REQUIREMENT
				{
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = !(@targetBody.IsSun())
					title = not Kerbin or Sun
				}
			}
			PARAMETER
			{
				name = ReachSol
				type = ReachState
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...выход из СТ Кербина к Солнцу!
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 15000
				REQUIREMENT
				{
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = (@targetBody.IsSun())
					title = only for Sun
				}
			}
			PARAMETER
			{
				name = AnyOrbit
				type = ReachState
				situation = ORBITING
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...выход на орбиту @targetBody
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 12000
				REQUIREMENT
				{
					type = ReturnFromOrbit
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					title = start past return
				}
				REQUIREMENT
				{
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = !(@targetBody.IsSun())
					title = but not for Sun
				}
			}
			PARAMETER
			{
				name = AnySurface
				type = ReachState
				situation = LANDED
				targetBody = CelestialBody(@../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
				title = ...посадку на поверхность @targetBody
				hideChildren = true
				completeInSequence = true
				disableOnStateChange = true
				rewardFunds = 20000
				REQUIREMENT
				{
					type = Expression
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					expression = !(@targetBody.IsHomeWorld()||@targetBody.IsSun())
					title = not Kerbin or Sun
				}
				REQUIREMENT
				{
					type = ReturnFromSurface
					targetBody = CelestialBody(@../../ITERATOR/listBody.ElementAt(IteratorCurrentIndex()))
					checkType = MANNED
					title = only past return
				}
				REQUIREMENT
				{
					type = Expression
					expression = (2 <= Random(1,5))
					title = and random
				}
			}
			ITERATOR
			{
				type = CelestialBody
				listBody = @/allReached
			}
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @../curKerbal
			hideChildren = true
			title = И вернуться после всех полетов домой!
			completeInSequence = true
		}
		ITERATOR
		{
			type = Kerbal
			curKerbal = @/allTourists
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP_EasySubOrbital
	title = Аттракцион "Побывай в космосе"
	description = Наш космический центр пользуется популярностью. Кербалы со всего мира занимают очередь - все хотят увидеть космос! Очередная группа туристов хочет ощутить себя настоящими космонавтами, побывав в космосе (или даже на орбите!). Но есть обязательное требование: вся группа летит вместе. Придется строить корабль повышенной вместимости. Уверены, вы справитесь - прикрутите несколько капсул, или замените пилота автоматикой, чтобы влезло больше туристов. Но постарайтесь обойтись без жертв - на кону наша репутация!
	prestige = Trivial
	maxSimultaneous = 1
	maxCompletions = 15
	group = FMCP_Tourism
	targetBody = HomeWorld()
	cancellable = true
	declinable = true
	synopsis = Прокатите группу туристов в космос вокруг Кербина, а затем верните их домой.
	completedMessage = Отличная работа, все туристы успешно возвращены, а их цели выполнены.
	advanceFunds = @/advanceF
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = @/failureF
	failureReputation = @/failureR
	REQUIREMENT
	{
		name = ReachSpace
		type = ReachSpace
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_EasySubOrbital
		cooldownDuration = 1d
	}
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = HomeWorld().Children().First()
		checkType = MANNED
		invertRequirement = true
		title = Контракт предлагается от момента достижения космоса до возвращения с орбиты Муны!
	}
	DATA
	{
		type = int
		touristCount = Random(2,4)
		hidden = true
	}
	DATA
	{
		type = List<Kerbal>
		hidden = true
		allTourists = NewKerbals(@/touristCount)
	}
	DATA
	{
		type = double
		// За 3-го туриста двойная оплата. Для покрытия сложности корабля на 3 места.
		advanceF = 6000.0 * @/touristCount + 6000 * (@/touristCount - 2)
		rewardF = 18000.0 * @/touristCount + 18000 * (@/touristCount - 2)
		orbitReward = 6000.0 * @/touristCount + 6000 * (@/touristCount - 2)
		rewardR = 10 * @/touristCount + 10 * (@/touristCount - 2)
		failureF = 100000 * @/touristCount
		failureR = 15 * @/touristCount
		hidden = true
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/allTourists
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/allTourists
		hideChildren = true
		hidden = true
	}
	PARAMETER
	{
		name = KerbinSpaceTour
		type = VesselParameterGroup
		title = Выполните все пункты полетного задания и верните всех пассажиров домой. На одном корабле, за один полет. Ни один кербал не должен погибнуть.
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			kerbal = @/allTourists
		}
		PARAMETER
		{
			name = KerbinSubOrbital
			type = ReachState
			targetBody=@/targetBody
			situation = SUB_ORBITAL
			title = Выполнить суборбитальный пролет над Кербином
			hideChildren = true
			disableOnStateChange = true
			REQUIREMENT
			{
				type = Any
				REQUIREMENT
				{
					type = Expression
					expression = (1 < Random(1,7))
					title = шанс 5 из 6
				}
				REQUIREMENT
				{
					type = Expression
					expression = (@/touristCount==3)
					title = Для группы из 3х туристов всегда (а то жирно будет попасть на 1-1 с группой 3)
				}
				REQUIREMENT
				{
					type = ReturnFromOrbit
					targetBody = @/targetBody
					checkType = MANNED
					invertRequirement = true
					title = До возвращения с орбиты всегда, потом с шансом 5 из 6
				}
			}
		}
		PARAMETER
		{
			name = KerbinOrbit
			type = Orbit
			targetBody = @/targetBody
			minPeA = HomeWorld().AtmosphereAltitude()
			title = Выйти на орбиту Кербина
			hideChildren = true
			disableOnStateChange = true
			rewardFunds = @/orbitReward
			REQUIREMENT
			{
				type = Expression
				expression = (1 < Random(1,7))
				title = шанс 5 из 6
			}
			REQUIREMENT
			{
				type = ReturnFromOrbit
				targetBody = @/targetBody
				checkType = MANNED
				title = С момента возвращения с орбиты Кербина - с шансом 5 из 6
			}
		}
		PARAMETER
		{
			name = ReturnKerbin
			type = RecoverKerbal
			kerbal = @/allTourists
			title = Естественно вернуть всех домой - мы не можем оставить туристов в космосе!
			hideChildren = true
			hidden = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP_VIPTourKerbin_v2
	title = ВИП-туризм вокруг Кербина (посадка в заданную точку)
	description = Очень Важная Персона (заместитель директора по персоналу, а по совместительству ответственный мойщик посуды) желает вылететь в космос около Кербина и приземлиться в определенной точке. Если промахнетесь - ничего страшного, но награда будет меньше. Обеспечьте гостю незабываемые впечатления и верните целым и невредимым домой, иначе вместо оплаты будет штраф!
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 3
	group = FMCP_Tourism
	targetBody = HomeWorld()
	cancellable = true
	declinable = true
	synopsis = Выполните все пожелания ВИП-туриста, и совершите безопасную посадку в заданном месте.
	completedMessage = Превосходно, клиент доволен как слон. На дрожащих ногах (но со счастливой улыбкой на лице) только что оставил великолепный отзыв. Так держать!
	advanceFunds = 7000.0
	rewardFunds = 75000.0
	rewardReputation = 40
	failureFunds = 100000
	failureReputation = 20
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = @/targetBody
		checkType = MANNED
		title = Сначала надо вернуться с орбиты Кербина
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_VIPTourKerbin_v2
		cooldownDuration = 2d
	}
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = HomeWorld().Children().Last()
		checkType = MANNED
		invertRequirement = true
		title = После возвращения с орбиты Минмуса контракты на Кербине не интересны.
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = KSCPerfectLanding
	}
	DATA
	{
		type = Kerbal
		VIPname = NewKerbal()
		hidden = true
	}
	DATA
	{
		type = List<String>
		spName = [ "Приключение ", "Мучение ", "Возвышение ", "Обучение ", "Задание ", "Отдых ", "Испытание ", "Страдание ", "Унижение " ]
		hidden = true
	}
	DATA
	{
		type = String
		wpName = @/spName.Random() + "Кермана"
		hidden = true
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/VIPname
		kerbalType = Tourist
		removePassengers = true
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		RANDOM_WAYPOINT
		{
			name = @/wpName
			targetBody = @/targetBody
			icon = marker	//balloon
			altitude = 0.0
			forceEquatorial = true
		}
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/VIPname
		hideChildren = true
		hidden = true
	}
	PARAMETER
	{
		name = MainGroup
		type = VesselParameterGroup
		title = Выйти на орбиту Кербина с @/VIPname на борту, и сойти с орбиты, добившись посадки в @/wpName (с допуском до 8км)
		targetBody = @/targetBody
		PARAMETER
		{
			name = HasPassenger
			type = HasPassengers
			kerbal = @/VIPname
			hidden = true
			hideChildren = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = OrbitCheck
			type = Orbit
			targetBody = @/targetBody
			minPeA = HomeWorld().AtmosphereAltitude()
			title = Выйти на орбиту Кербина
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 8000.0
			horizontalDistance = 8000.0
			hideOnCompletion = true
			showMessages = true
			title = Сойти с орбиты и приземлиться на поверхность в заданной точке: @/wpName
			hideChildren = true
			disableOnStateChange = true
			optional = true
			rewardFunds = 50000.0
			rewardReputation = 20
			completedMessage = Посадка в заданной точке зафиксирована! Вы заслужили дополнительную награду.
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/VIPname
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP_TourAnyMoonAndSol
	title = Луна и Солнце - день чудесный
	description = Группа туристов заказала сложный маршрут: вся группа должна путешествовать вместе, все цели должны быть выполнены в одном полете и на одном корабле - от взлета и до посадки. К счастью, целей всего 2 - уверены, вы легко справитесь. Туристы желают побывать на орбите одной из наших лун, а потом покинуть сферу тяготения Кербина и выйти к Солнцу. И конечно, после всего этого вернуться домой, невредимыми! Никаких посадок, просто долгий полет и возвращение. Снаряжайте ракету запасом чипсов на пару месяцев - и вперед!
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 0
	group = FMCP_Tourism
	targetBody = HomeWorld().Parent()
	cancellable = true
	declinable = true
	synopsis = Прокатите группу туристов на орбиту @/targetMun и к Солнцу, а затем верните их домой.
	completedMessage = Отличная работа, все туристы успешно возвращены после долгого полета!
	advanceFunds = @/advanceF
	rewardFunds = @/rewardF
	rewardReputation = @/rewardR
	failureFunds = 200000
	failureReputation = 30
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = HomeWorld().Children().First()
		checkType = MANNED
		title = Сначала надо вернуться с орбиты @targetBody
	}
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = HomeWorld().Children().Last()
		checkType = MANNED
