CONTRACT_TYPE
{
	name = AllEvaReportsFromSpace
	title = Заглянуть под каждый камень - 1
	group = FMCP
	agent = RRD
	description = Вы теперь знаете о полярной орбите, да? И то, что облетая нашу планету виток за витком, мы пролетим над каждой точкой? А вот мы в научном отделе до сих пор не знаем, почему у нас еще не все биомы осмотрены! Садитесь на корабль, коллега, выводите его на низкую полярную орбиту, и дособерите отчеты об обстановке из космоса - все, которые остались.
	genericDescription = Собрать отчеты об обстановке на еще необследованными областями Кербина.
	synopsis = Выполнить отчеты об обстановке низко из космоса над указанными биомами.
	completedMessage = Отлично! Полный картографический атлас EVA-отчетов для @/targetBody успешно завершен.

	targetBody = HomeWorld()
	maxCompletions = 1		//естественно 1 - после выполнения будут собраны данные по всем!
	maxSimultaneous = 1
	prestige = Significant
	// Награды за закрытие контракта (и как компенсация за жабу, которая будет давить: зачем собрал ВСЕ экваториальные бесплатно?)
	rewardFunds = 40000.0
	rewardReputation = 15.0
	DATA
	{
		type = List<ScienceExperiment>
		hidden = true
		myExperiment = [ evaReport ]	// выглядит странно, но нужен список
	}
	DATA
	{
		type = List<CelestialBody>
		hidden = true
		myBodies = [ HomeWorld() ]		// выглядит еще более странно, но нужен список
	}
	DATA
	{
		type = List<ScienceSubject>
		hidden = true
		allEVAReports = AllScienceSubjectsByBodyExperiment(@/myBodies, @/myExperiment).Where(s => !s.Biome().IsKSC())
		filterSpace = @allEVAReports.Where(s => s.Situation() == InSpaceLow)
		targetSubjects = @filterSpace.Where(s => s.CollectedScience() == 0.0)
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/targetSubjects.Count() > 0
		title = Должен оставаться хотя бы один неизученный биом для EVA-отчета
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP_Orbit03
		title = доступно после полярной орбиты
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP13
		title = и после того, как собрали данные с части биомов!
	}
	PARAMETER
	{
		name = CollectEvaReport
		type = CollectScience
		
		biome = @SciSubject.Biome()
		situation = InSpaceLow
		experiment = evaReport
		recoveryMethod = RecoverOrTransmit
		
		ITERATOR
		{
			type = ScienceSubject
			SciSubject = @/targetSubjects
			// на заметку: это практически единственный способ правильно сгенерить подобный контракт
			// если итерировать сразу subject, будет проблема...
		}
		
		// Микро-награда за каждый успешно сданный подпункт
		rewardFunds = 5000.0
		rewardScience = 5.0
		hideChildren = true
		title = Собрать EVA-отчет из космоса над биомом: @biome
	}
}
// и для Муны!
CONTRACT_TYPE
{
	name = AllEvaReportsMunaOrbit
	title = Заглянуть под каждый камень - 2
	group = FMCP
	agent = RRD
	description = Вы опять ждете специального приглашения? Или лень лететь на Муну? Хорошо, вот вам официальный приказ: летите! Выводите капсулу с пилотом на полярную орбиту Муны, или собирайте отчеты по одному, нацеливая корабли на полет над разными областями, все равно. Но соберите нам отчеты об обстановке из космоса низко над Муной, для всех указанных условий!
	genericDescription = Собрать отчеты об обстановке на еще необследованными областями Муны.
	synopsis = Выполнить отчеты об обстановке низко из космоса над указанными биомами (Муна).
	completedMessage = Отлично! Полный картографический атлас EVA-отчетов для @/targetBody успешно завершен.

	targetBody = HomeWorld().Children().First()
	maxCompletions = 1		//естественно 1 - после выполнения будут собраны данные по всем!
	maxSimultaneous = 1
	prestige = Exceptional
	// Награды за закрытие контракта (и как компенсация за жабу, которая будет давить: зачем собрал ВСЕ экваториальные бесплатно?)
	rewardFunds = 60000.0
	rewardReputation = 25.0
	DATA
	{
		type = List<ScienceExperiment>
		hidden = true
		myExperiment = [ evaReport ]	// выглядит странно, но нужен список
	}
	DATA
	{
		type = List<CelestialBody>
		hidden = true
		myBodies = [ @/targetBody ]		// выглядит еще более странно, но нужен список
	}
	DATA
	{
		type = List<ScienceSubject>
		hidden = true
		allEVAReports = AllScienceSubjectsByBodyExperiment(@/myBodies, @/myExperiment).Where(s => s.Situation() == InSpaceLow)
		targetSubjects = @allEVAReports.Where(s => s.CollectedScience() == 0.0)
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/targetSubjects.Count() > 0
		title = Должен оставаться хотя бы один неизученный биом для EVA-отчета
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP_Orbit03
		title = доступно после полярной орбиты
	}
	REQUIREMENT
	{
		name = ReturnFromOrbit
		type = ReturnFromOrbit
		checkType = MANNED
		targetBody = @/targetBody
		title = и после того, как вернулись с орбиты Муны
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = AllEvaReportsFromSpace
		title = и после того, как собрали отчеты с Кербина - чтобы не выполнять 2 раньше 1
	}
	PARAMETER
	{
		name = CollectEvaReport
		type = CollectScience
		
		biome = @SciSubject.Biome()
		situation = InSpaceLow
		experiment = evaReport
		recoveryMethod = RecoverOrTransmit
		
		ITERATOR
		{
			type = ScienceSubject
			SciSubject = @/targetSubjects
			// на заметку: это практически единственный способ правильно сгенерить подобный контракт
			// если итерировать сразу subject, будет проблема...
		}
		
		// Микро-награда за каждый успешно сданный подпункт
		rewardFunds = 8000.0
		rewardScience = 8.0
		hideChildren = true
		title = Собрать EVA-отчет из космоса над биомом ( @/targetBody, @biome.Name())
	}
}