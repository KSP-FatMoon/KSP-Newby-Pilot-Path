// требования к старту:
// открыта "Миниатюризация" (набор для исследований на орбите доступен, квадрадура доступна)
// открыта "электротехника" (солнечные панели и "Фотовспыш")
// открыто "исследование космоса (блок "горизонд" доступен)
// открыты "командные модули" (капсула МК1-3 доступна) (к Муне и Минмусу летят все вместе! нужна большая капсула)
// открыто "продвинутое ракетостроение" (игрок может выеживаться как может - но "пудель" для полетов большой капсулы нужен)
// открыты "посадка" и "аэродинамика" - доставка Лары явно самолетом, хорошие шасси, кабины и плоскости необходимы!
// + был возврат экипажа после посадки на Муну (вторая часть будет требовать посадку на Муну)
// + 2-й уровень центра кербонавтов, 2-й уровень научного центра (выходы из капсулы и сбор образцов)
// + был возврат экипажа с поверхности Минмуса (третья часть будет требовать посадки на Минмус)
// на орбите Кербина есть хотя бы 1 станция (хочу отправить на станцию! а если ее нет... печаль!)
//
CONTRACT_TYPE
{
	name = FMCP_StoryLine0_abort
	title = Осторожно: снимается кино (Неудача)
	description = Очень жаль, что вы сорвали съемки! Верните всех оставшихся актеров в центр кербонавтов, контракт на этом расторгнут. У вас 20 дней!\n\n (ПРИМЕЧАНИЕ ОТ РАЗРАБОТЧИКА: событие RecoverKerbal срабатывает в момент возврата аппарата или кербала. Если все персонажи, которых надо вернуть, уже находятся в центре, погрузите их в капсулу, выставьте на стартовый стол и тут же верните, чтобы контракт закрылся)
	prestige = Trivial
	maxSimultaneous = 1
	// однократное выполнение.
	maxCompletions = 1
	autoAccept = true
	deadline = 20
	group = FMCP
	cancellable = false
	declinable = false
	synopsis = Вернуть всех актеров, кто уцелел после неудачи, в центр подготовки астронавтов для отбытия. Съемки сорваны, мы выплачиваем неустойку и компенсацию. Не затягивайте, а то мы разоримся на штрафах!
	completedMessage = Печально, мы прикоснулись к миру кино, и тут же провалили шанс прославиться. А общественность не простит нам потерю артиста!
	rewardFunds = 0.0
	rewardReputation = 2
	failureFunds = 500000
	failureReputation = 50
	REQUIREMENT
	{
		type = Expression
		expression = $CC_FailStory0==1
		title = Обнаружен провал истории по дедлайну или гибели героев
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/survivedActors.Count()>0
		title = И список выживших актеров не пустой.
		// если выживших нет, чистить нечего. Полностью угробили весь цвет кинематографа...
	}
	DATA
	{
		type = Kerbal
		hidden = true
		// идентификатор кербала не просто строка. Поэтому без кавычек.
		ker1 = Kerbal(актриса Фифа Керман)
		ker2 = Kerbal(актер Тикруз Керман)
		ker3 = Kerbal(актер Джеки Керман)
		ker4 = Kerbal(актриса Лара Керман)
	}
	DATA
	{
		type = List<Kerbal>
		hidden = true
		// Имя кербала - не просто строка, а непойми что. сравнивать с "Фифа" нельзя (будет несовпадение, не найдено. Возможно "Фифа Керман"?). Сравнивать без кавычек нельзя - будет ошибка.
		// Единственный способ - получить кербала и сравнивать одно имя с другим. Коряво, странно, но работает. А искать почему не сравнивает со строкой - без меня!
		allActors = AllKerbals().Where(k=> (k.FirstName()==@/ker1.FirstName())||(k.FirstName()==@/ker2.FirstName())||(k.FirstName()==@/ker3.FirstName())||(k.FirstName()==@/ker4.FirstName()))
		survivedActors = @allActors.Where(k => (k.RosterStatus()==Available)||(k.RosterStatus()==Assigned))
	}
	BEHAVIOUR
	{
		name = RemoveKerbal
		type = RemoveKerbal
		// Удалять надо всех. Даже если они не выжили или почему-то не попали в список. Лишнего не удалится - только при совпадении имен.
		kerbal = @/ker1
		kerbal = @/ker2
		kerbal = @/ker3
		kerbal = @/ker4
	}
	PARAMETER
	{
		name = ReturnSurvived
		type = RecoverKerbal
		// RecoverKerbal отрабатывает в момент возврата. Т.е. если герои уже возвращены - не отработает. Надо сначала их в капсулу, потом вернуть. Увы, вот так это работает.
		// А поскольку возвращаться они могут по отдельности из разных мест, нужен итератор, чтобы засчитывать индивидуальное возвращение.
		ITERATOR
		{
			type=Kerbal
			actor = @/survivedActors
		}
		kerbal = @actor
		hideChildren = true
		title = Персонаж @kerbal должен быть возвращен в центр кербонавтов.
		//hidden = true
	}
}
CONTRACT_TYPE
{
	name = FMCP_StoryLine0_1
	title = Осторожно: снимается кино! (часть 1)
	description = Киностудия "КербалФильм" хочет использовать наш центр для съемок. Прибудут известнейшие актеры, чтобы снять эпизоды в разных ситуациях. От нас требуется только обеспечить выполнение их требований. Кстати, некоторые актеры прошли подготовку, и являются пилотами, инженерами и учеными - тем интересней будет с ними работать. К сожалению, они будут с нами только на время контракта. Дальше их ждут съемки в павильоне, на фоне зеленого экрана.\n\n Кажется, это будет одновременно фантастика, приключения, триллер и романтическая история. Герои будут прыгать с парашютом, пробираться через джунгли, летать в космос и находить загадочные артефакты предтеч. Помимо весьма существенной награды, нам наверняка дадут билеты на премьеру. Главное, не угробить актеров - штрафы, неустойка, ущерб репутации...
	prestige = Exceptional
	maxSimultaneous = 1
	// однократное выполнение. Пока - для теста 0, будет 1.
	maxCompletions = 0
	group = FMCP
	// при отмене взятого контракта будет непредсказуемое поведение, т.к. зависит от обстоятельств.
	// как по штрафам за отмену, так и с героями (их может не удалить из игры, по разным причинам. Например если кто-то сейчас на орбите... Или что-то багнуло)
	cancellable = false
	declinable = false
	targetBody = HomeWorld()
	synopsis = Выполните индивидуальные программы актеров, согласно заказанному.
	completedMessage = Ура! наш центр покажут в кино! Надеемся, что довольные лица наших кербонавтов попадут в финальную версию фильма...
	advanceFunds = 200000.0
	rewardFunds = 500000.0
	rewardReputation = 50
	failureFunds = 500000
	failureReputation = 40
	REQUIREMENT
	{
		type = Expression
		expression = !($CC_FailStory0==1)
		//invertRequirement = true
		title = Не было провала этой истории по дедлайну или гибели героев
	}
	REQUIREMENT
	{
		name = PossibleEVA
		type = Facility
		facility = AstronautComplex
		minLevel = 2
		title = Центр астронавтов должен быть хотя бы 2 уровня (для выхода из капсулы)
	}
	REQUIREMENT
	{
		name = GetSurfSampleAvailable
		type = Facility
		facility = ResearchAndDevelopment
		minLevel = 2
		title = Научный комплекс должен быть хотя бы 2 уровня (образцы грунта)
	}
	REQUIREMENT
	{
		name = ReturnFromSurface
		type = ReturnFromSurface
		checkType = MANNED
		targetBody = HomeWorld().Children().First()
		title = Успешно вернулись после посадки на Муну
	}
	REQUIREMENT
	{
		name = ReturnFromSurface
		type = ReturnFromSurface
		checkType = MANNED
		targetBody = HomeWorld().Children().Last()
		title = Успешно вернулись после посадки на Минмус
	}
	DATA
	{
		type = Kerbal
		// сделаем сложные имена чтобы исключить пересечения с стандартными случайными
		kPrincess = NewKerbal(Female,"актриса Фифа Керман","Tourist")
		kPilot = NewKerbal(Male,"актер Тикруз Керман","Pilot")
		kEngineer = NewKerbal(Male,"актер Джеки Керман","Engineer")
		kScientist = NewKerbal(Female,"актриса Лара Керман","Scientist")
		hidden = true
	}
	BEHAVIOUR
	// Надо делить туристов и команду отдельно, т.к. иначе все будут одного типа
	// (SpawnPassengers перезатирает тип кербала, заданный в NewKerbal)
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/kPrincess	//Фифа Керман	
		//removePassengers = false
		kerbalType = Tourist
	}
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/kPilot		//Тикруз Керман
		kerbal = @/kEngineer	//Джеки Керман
		kerbal = @/kScientist	//Лара Керман
		//removePassengers = false
		kerbalType = Crew	// при задании типа Crew кербалы становятся частью команды, и не удаляются после завершения без специального RemoveKerbal
	}
	BEHAVIOUR
	// Это для теста. По идее все исчезнут сами при завершении контракта.
	// А мне это вообще пока не нужно - я собираюсь сделать цепочку
	// при провале оставшиеся не удаляются! для их удаления нужна миссия зачистки
	{
		name = RemoveKerbal
		type = RemoveKerbal
		kerbal = актриса Фифа Керман
		kerbal = актер Тикруз Керман
		kerbal = актер Джеки Керман
		kerbal = актриса Лара Керман
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
		{
			name = Древние пирамиды
			icon = sample
			altitude  = 0.0
			latitude  = -6.4966
			longitude = -141.6676
		}
	}
	BEHAVIOUR
	// для определения внутри цепочки, что контракт провален.
	// будем взводить этот флаг во всех миссиях в случае провала. И добавлять требование для старта, что флаг не взведен.
	// Тогда очередная миссия не стартует, если была провалена (иначе будет рестартовать - она ж не выполнена, maxCompletions не достигли)
	// Взведенный флаг - сигнал для старта миссии зачистки.
	{
		name = Expression
		type = Expression
		//При первых тестах переменная установилась, хотя контракт не проваливался.
		//похоже, отмену взятого тоже считает провалом? Отмен не будет, cancellable=false!
		CONTRACT_COMPLETED_FAILURE
		{
			type=int
			CC_FailStory0 = 1
		}
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = актриса Фифа Керман
		kerbal = актер Тикруз Керман
		kerbal = актер Джеки Керман
		kerbal = актриса Лара Керман
		title = Никто из актеров не должен погибнуть!
		hidden = true
	}
	PARAMETER
	{
		name = TomKruzWanted
		type = VesselParameterGroup
		title = Актер Тикруз Керман хочет прыгнуть с парашютом с высоты не менее 10 км. Обеспечьте его ракетой, способной подняться выше 10 км, и парашютом. Убедитесь, что скорость ракеты безопасна для выхода, высота более 10 км и Тикруз на борту. Отправляйте нашего героя в самостоятельный прыжок и добейтесь успешной посадки!
		targetBody = @/targetBody
		hideChildren = true
		rewardFunds = 25000
		rewardReputation = 10
		// тут все выполнимо. Действовать по описанию. Кербал должен быть снаружи, падать, высота 10км или больше.
		// естественно с парашютом. Раскрыть и мягко опуститься. Я сказал "Мягко"!
		PARAMETER
		{
			name = EVAJump
			type = VesselIsType
			vesselType = EVA
			hideChildren = true
			hidden = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = TKOnBoard
			type = HasCrew
			kerbal = актер Тикруз Керман
			hideChildren = true
			hidden = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = HighJump
			type = ReachState
			minAltitude = 10000
			situation = FLYING
			hideChildren = true
			disableOnStateChange = true
			hidden = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = ReturnTKruz
			type = RecoverKerbal
			kerbal = актер Тикруз Керман
			hideChildren = true
			hidden = true
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = JackyChanWanted
		type = VesselParameterGroup
		title = Актер Джеки Керман хочет приземлиться в биоме Пустоши и сделать отчет об обстановке. Доставьте его в нужный биом и дайте возможность сделать отчет (а заодно проведите другие исследования - мы не часто бываем в пустошах, чтобы упустить такую возможность). Верните Джеки домой, вместе с результатами экспериментов.
		hideChildren = true
		targetBody = @/targetBody
		rewardFunds = 35000
		rewardReputation = 10
		// реально челлендж. Надо знать где биом Пустоши. Приземлиться там. На минимум двуместном аппарате, т.к. наш герой не пилот.
		// для чит-тестов - координаты (-12, 40)
		PARAMETER
		{
			name = JaсkyOnBoard
			type = HasCrew
			kerbal = актер Джеки Керман
			hideChildren = true
			hidden = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = BadlandsLanding
			type = CollectScience
			biome = Badlands
			location = Surface
			experiment = evaReport
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = ReturnJacky
			type = RecoverKerbal
			kerbal = актер Джеки Керман
			hideChildren = true
			hidden = true
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = LaraCroftWanted
		type = All
		title = Актриса Лара Керман хочет посетить древние пирамиды в пустыне и взять там образец грунта. Доставьте ее в нужное место, обеспечьте выход на поверхность, достижение локации и сбор образца. Верните отважную исследовательницу домой вместе с собранным образцом.
		hideChildren = true
		rewardFunds = 35000
		rewardScience = 10
		// самая большая сложность приземлиться у пирамид. Причем Лара не пилот, т.е. нужен двуместный аппарат
		// или беспилотное управление. Технически идеальной точности не надо, 300-500 метров можно ножками дойти.
		PARAMETER
		{
			name = GetSample
			type = VesselParameterGroup
			targetBody = @/targetBody
			hideChildren = true
			hidden = true
			PARAMETER
			{
				name = LaraOnBoard
				type = HasCrew
				kerbal = актриса Лара Керман
				hideChildren = true
				hidden = true
				disableOnStateChange = false
			}
			PARAMETER
			{
				name = EVAJump
				type = VesselIsType
				vesselType = EVA
				hideChildren = true
				hidden = true
				disableOnStateChange = false
			}
			PARAMETER
			{
				name = VisitPiramids
				type = VisitWaypoint
				index = 0
				horizontalDistance = 200.0
				showMessages = true
				disableOnStateChange = false
				hideChildren = true
				title = Посетите древние пирамиды в пустыне, чтобы взять образец грунта
			}
			PARAMETER
			{
				name = PiramidSample
				type = CollectScience
				experiment = surfaceSample
				// 1. возврат пробивается через все скрытия. 2. Если Ларе придется идти, а потом возвращаться,
				// то она выйдет из зоны и группа не закроется (т.к. Recover засчитается только при возврате).
				// Без требований возврата - закроется тут же. А нужен ли этот образец, пусть игрок решает.
				//recoveryMethod = Recover
				// Хорошая плоская площадка для посадки, надежный способ получить доклад, отчет и образец грунта в биоме "горы".
				completeInSequence = true
				hideChildren = true
				hidden = true
			}
		}
		// Вынесено из группы, если игрок захочет дойти до аппарата и вернуть вместе с аппаратом
		PARAMETER
		{
			name = ReturnLara
			type = RecoverKerbal
			kerbal = актриса Лара Керман
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
	}
	PARAMETER
	{
		name = PrincessWanted
		type = VesselParameterGroup
		title = Актриса Фифа Керман желает побывать на орбите и вернуться домой. У нее нет научных целей - она просто снимается в кино, делает селфи и ведет блог. Доставьте ее на орбиту и верните назад на Кербин, невредимой.
		hideChildren = true
		targetBody = @/targetBody
		rewardFunds = 30000
		// проще некуда - базовый туризм. Достичь орбиты и вернуться. Засчитает любую орбиту, как только перицентр будет выше атмосферы.
		PARAMETER
		{
			name = PrincessOnBoard
			type = HasCrew
			kerbal = актриса Фифа Керман
			hideChildren = true
			hidden = true
			disableOnStateChange = false
			// Если дизайблить, можно отстыковать отдельную капсулу с туристом на старте, и вывести на орбиту что осталось)))
		}
		PARAMETER
		{
			name = ReachOrbit
			type = ReachState
			situation = ORBITING
			disableOnStateChange = true
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = ReturnPrincess
			type = RecoverKerbal
			kerbal = актриса Фифа Керман
			completeInSequence = true
			hideChildren = true
			hidden = true
		}
	}
}