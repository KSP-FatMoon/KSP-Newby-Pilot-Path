// Космические станции.
// Контракт на запуск новой:
// Любое уже посещенное тело, еще не имеющее на орбите ни одной станции.
// Строго говоря, неплохо бы (!) выдавать контракты даже на еще не посещенные тела. Скажем, на следующее в цепочке.
// Кроме этого, никто не говорит что станция должна быть одна! Цели станций:
// - лаборатория (с Кербализмом... лаборатория это не источник данных, это просто большой аппарат для конкретного эксперимента)
// - поднятие уровней экипажа в космосе (неплохо иметь такую возможность, если собираемся размещать эксперименты на поверхности)
// - заправка, если имеем на станции топливо или какие-то ресурсы (вода, еда, кислород)
// - место отдыха экипажа или пересадочная станция для туристов (если на посадку летает посадочный модуль)
// - место базирования посадочных капсул, если запускаем большие космические корабли и не собираемся их возвращать - а экипаж возвратить надо.
// - завод по переработке руды (с Кербализмом будет боль в выстраивании технологической цепочки...)
// Поэтому надо делать контракт на научную станцию (которая может быть одна) - по наличию лабы
// И отдельно на перерабатывающую (проще иметь две, чем расширяться - кракен любит громоздкие конструкции) (? наличие ISRU)
// И отдельно на топливную (хотя такую можно совместить и с научной, и с перерабатывающей - но не обязательно) (? наличие топлива)
// Главное отличить одно от другого!
// Надо 2 контракта (или даже 3)!
// Trivial, вывести абы какую станцию с местами для 3-5 кербалов, без требований лабы.
//		док-порт, любой источник энергии, орбита. До изучения лабы, панелей "гигантор", батарей 2.5 и больших (сеньор) док-портов.
// Significant, вывести именно НАУЧНУЮ станцию с лабораторией, место 5-6, 2 док-порта, 2 солнечные панели, есть запас топлива.
//		С момента изучения лабы и до конца
// Exceptional - вывести станцию на орбиту Солнца или другой планеты (не Кербин и луны), можно даже еще не достигнутой - следующие 2 в прогрессе.
CONTRACT_TYPE
{
	name = FMCP-ScienceSpaceStation
	group = FMCP_SpaceStations
	title = Вывести новую научную станцию на орбиту @/tBody
	genericTitle = Запустить новую космическую станцию
	description = Мы хотим обеспечить @/tBody местом для отдыха, заправки и долговременного пребывания на орбите - космической станцией! А еще можно будет проводить исследования в состоянии невесомости, сделать центральный узел радиосвязи и прикрепить большие антенны и большие солнечные панели, да и много чего еще, придумаем позже. Соберите новую космическую станцию по нашим требованиям и выведите ее на орбиту @/tBody! Станция может быть выведена сразу целиком или по частям модульно. После вывода на орбиту измените тип корабля на "Станция", чтобы мы знали, что это именно станция, а не корабль к другой планете.
	genericDescription = Мы хотим разместить на орбите новую космическую станцию.
	synopsis = Вывести новую космическую станцию на орбиту тела: @/tBody. На станции должны быть солнечные панели, док-порты, антенны и вместимость экипажа минимум 5 кербалов. И обязательно мобильная лаборатория! Дополнительные требования см. ниже.
	completedMessage = Новая станция принята в эксплуатацию!
	sortKey = 100
	prestige = Significant
	cancellable = true
	declinable = true
	targetBody = @/tBody
	
	maxSimultaneous = 2
		
	// в "Базы и станции" без научных наград, но это все-таки научная станция! Без научной награды будет простая
	rewardScience = 15
	rewardReputation = 10	//@/rewardR
	rewardFunds = 120000	//@/rewardF
	advanceFunds = 50000.0
	// это задание технически невозможно провалить. Только если ОЧЕНЬ специально постараться.
	//REQUIREMENT
	//{
	//	type = PartModuleUnlocked
	//	partModule = ModuleScienceLab
	//	title = должна быть исследована любая лаборатория
	//}
	REQUIREMENT
	{
	// Будет неправильно накидывать контракт на станции игроку, который ни разу не стыковался!
		type = Docking
		targetBody = HomeWorld()
		//checkType = MANNED
		title = сначала выполните первую стыковку на орбите Кербина!
	}
	// обязательные технологии для стоковой карьеры. Без них станции (имеющие смысл) собираются только с модами.
	// Нужны раскладные солнечные панели. Нужна лаборатория. Нужен док-порт нормального размера
	// Очень пригодятся боковые двигатели, чтобы на радиальной ноде ставить док-порт И иметь двигатели.
	// Мощные двигатели, в частности Курьер, чтобы выводить на орбиту конструкцию шириной 2.5. Раз уж все равно техи за 160
	// Ну и раз открыто все это, еще капсулу МК1-3 не помешает открыть. Прекрасный командный узел, 3 места, РСУ и гиродин
	REQUIREMENT
	{
		type = TechResearched
		tech = advElectrics				//(продвинутая электротехника)	(раздвижные солнечные панели)
		tech = advExploration			//(прогрессивные исследования)	(лаборатория)
		tech = commandModules			//(Командные модули)			(капсула МК1-3)
		tech = heavyRocketry			//(Тяжелое ракетостроение)		(Курьер и другие мощные двигатели)
		tech = precisionPropulsion		//(Высокоточные двигатели)		(боковые Свеча и Юнец)
		tech = specializedConstruction	//(Специализированная сборка)	(нормальный док-порт)
		title = Должны быть исследованы технологии за 160: продвинутая электротехника, прогрессивные исследования, специализированная сборка и другие...
	}
	// Деталь "Mobile Processing Lab MPL-LG-2"
	// К сожалению, нельзя фильтровать по модулю ModuleScienceLab - т.е. игрок может иметь другую лабораторию из мода
	// технически валидную, но мы ограничены идентификатором. Нет стоковой лабы - значит станция не научная.
	// Тут вообще много ограничений - хорошо фильтруются только двигатели по ISP и мощности
	DATA
	{
		type = AvailablePart
		sciLab = AvailablePart(Large_Crewed_Lab)
		hidden = true
	}
	// все корабли с типом "станция", и имеющие в составе мобильную лабораторию.
	// Если в игре хотим получить контракт на 2-ю станцию у того же тела - меняем тип станция на корабль и ждем контракт
	DATA
	{
		type = List<Vessel>
		requiredValue = false
		stations = AllVessels().Where(v => (v.VesselType() == Station)&&(v.Parts().Contains(@/sciLab)))
		hidden = true
	}
	// выбираем тело, вокруг которого НЕТ ни одной станции с стоковой лабораторией 
	// тело любое, включая Кербин и Солнце.
	DATA
	{
		type = List<CelestialBody>
		hidden = true
		// все-таки OrbitedBodies! Не будем спешить.
		sbodies = OrbitedBodies()		//ReachedBodies()
		// все тела из числа достигнутых, на орбитах которых не обнаружено научных станций
		fbodies = @sbodies.Where(body => @/stations.Where(v => v.CelestialBody() == body).Count() == 0)
		// чтобы применить селектУникью. Хотя тут никакой уникальности
		homeBodies = [ HomeWorld() ]
	}
	DATA
	{
		type = CelestialBody
		requiredValue = true
		uniquenessCheck = GROUP_ACTIVE
		//уникальность по группе не даст одновременно 2 контракта на одно и то же. Всегда разные, даже если еще не выполнены
		//разрешим 2 контракта этого типа одновременно, и 4 контракта по группе в целом...
		// Кербин в приоритете - если на орбите нет станции, первый контракт всегда на него.
		tBody = @/fbodies.Contains(HomeWorld()) ? @/homeBodies.SelectUnique() : @/fbodies.SelectUnique()
		title = Тело, на орбите которого еще нет научной станции (с лабораторией МПЛ2)
	}
	//Основная группа параметров. Все вложенные будут отображаться - игрок должен знать, выполнились условия или нет.
	PARAMETER
	{
		name = ScienceStation
		type = VesselParameterGroup
		title = Вывести новую научную станцию, соответствующую требованиям, на орбиту тела @/targetBody
		notes = Обязательные требования к станции: наличие мобильной лаборатории, солнечных панелей (2 шт), док-портов (2 шт) и антенны. Станция должна иметь минимум 5 мест для экипажа. Станция должна быть запущена и собрана строго после принятия контракта.
		
		//проверка на New - обязательно, иначе будет чит: меняем тип станции на Корабль, берем контракт, меняем тип снова на Станция...
		//...и выполняем раз за разом любое количество контрактов на эту же планету, запустив реально всего одну. Исключим это!
		//...как минимум, придется попотеть (новый малый модуль с высоким приоритетом наименования стыкуется к старой станции = новая!)
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Новый аппарат, запущенный после взятия контракта
		}
		//Проверяем наличие модулей
		// поскольку наличие именно большой лабы вынесено в проверку станций на орбитах,
		// именно она и должна быть, чтобы засчитать именно научную станцию.
		// Извиняйте, но любой модуль лаборатории не засчитываем. Самому жаль!
		// Для стока без вариантов. С модами... запустите станцию с другими лабораториями просто так!
		// не все же должно быть строго по контракту!
		PARAMETER
		{
			name = HasMGPL2
			type = PartValidation
			part = Large_Crewed_Lab
		}
		// Наличие купола НЕ требую. Купол это тупо кабина на 1 человека
		// Не дает особых эффектов, экспериментов, просто кабина.
		// Лучше прикручивайте док-порт на МК1-3, и внизу еще 1 - пользы больше.
		PARAMETER
		{
			// с 1 док-портом это не станция, а недоразумение.
			// даже ДОС типа "Заря" имели 2 док-порта.
			// но если прямо экономия, можно пристыковать корабль и будет 1+1=2
			name = DockingValidation
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 2
			hideChildren = true
			disableOnStateChange = false	//!
			title = Есть минимум 2 док-порта
		}
		PARAMETER
		{
			name = AnyAntenna
			type = Any
			//мое мнение - должно быть и то и то. Обычная для передачи данных и ретранслятор, потому что нужен вдали от дома.
			//На заметку: антенны признает в раскрытом виде. Если антенна есть, а пункт не зеленый - раскройте ее!
			//И надо это менять на проверку модуля ModuleDataTransmitter. Это универсально и просто, без такой конструкции
			title = есть любая антенна (или ретранслятор).
			hideChildren = true
			PARAMETER
			{
				name = HasAnyAntenna
				type = HasAntenna
				antennaType = TRANSMIT
				minAntennaPower = 499999.0		//любая антенна кроме интегрированных (500км и мощнее)
				title = Можно передать научные данные
				hideChildren = true
			}
			PARAMETER
			{
				// на станции должен быть ретранслятор, давайте примем это как данность.
				// Здоровенная дура в космосе. Электричество, солнечные панели, висит и качает науку
				// Плюс-минус пара тонн вообще не влияет на вывод на орбиту.
				// Станции могут быть отправлены на другие планеты. Со станций могут стартовать и управляться
				// беспилотные зонды, шахтерские корабли. И лучше связь пойдет через наш ретранслятор, чем через Кербин!
				// и да, игрок заинтересован в том, чтобы антенна была мощной. Или даже 2 антенны.
				name = HasAntenna
				type = HasAntenna
				antennaType = RELAY
				minAntennaPower = 4000000.0		//5000000.0 первый ретранслятор.
				title = Есть антенна-ретранслятор
				hideChildren = true
			}
		}
		PARAMETER
		{
			// обычно требуют "есть источник энергии", включая ритеги
			// но научную станцию ритегом не прокормить! Исследование потребляет массу энергии,
			// нужны нормальные панели, жаль сложно проверить мощность - а требовать именно "Гигантор" не буду.
			// вариант ядерный реактор - есть в некоторых модах, с мощным генератором. Меня устраивает,
			// но в стоке такого нет, поэтому проверять не будем. В случае реактора прикрутите 2 маленьких панельки.
			name = HasSolarPanel
			type = PartValidation
			partModule = ModuleDeployableSolarPanel	//в модах иногда делают патч, заменяющий стоковый модуль на мод :(
			minCount = 2
			title = Есть минимум 2 солнечные панели
			hideChildren = true
			disableOnStateChange = false	//!
		}
		PARAMETER
		{	// Что бы было. Станция штука крупная, маневровые пригодятся.
			// и монотопливо пригодится, хотя бы 120. Но на орбите Кербина...
			// вдобавок считаем что кербинская станция первая, опыта у игрока нет,
			// послабление в проверках
			name = HasRCS
			type = PartValidation
			partModule = ModuleRCSFX
			minCount = 4
			title = Есть 4 маневровых РСУ
			hideChildren = true
			disableOnStateChange = false	//!
			REQUIREMENT
			{
				// Тело, отличное от Кербина
				type = Expression
				expression = !(@/targetBody.IsHomeWorld())
				title = not Kerbin
			}
		}
		//Наличие топлива. Спорный момент. Мне хотелось бы, чтобы топливо было.
		//Я потом квест привяжу, чтобы игрок мог на станциях дозаправиться
		//Но 4000 как в стоковых контрактах - это перебор. 1500 хватит за глаза, это аварийная заправка, а не повседневная
		//Для заправки надо станцию с ISRU, и руду перерабатывать.
		//3000 электричества - это базовая потребность научной станции. Лучше больше.
		PARAMETER
		{
			name = HasResources
			type = HasResource
			RESOURCE
			{
				resource = LiquidFuel
				minQuantity = 1440
			}
			RESOURCE
			{
				resource = Oxidizer
				minQuantity = 1760
			}
			// 18 тонн! +лаба, +модули, + все остальное = 25 т Нормальная солидная станция!
			title = должен быть аварийный запас топлива: минимум 1440 жидкого топлива и 1760 окислителя (топливный бак Рокомакс32)
			hideChildren = true
			disableOnStateChange = false
			REQUIREMENT
			{
				// Тело, отличное от Кербина
				type = Expression
				expression = !(@/targetBody.IsHomeWorld())
				title = not Kerbin
			}
		}
		PARAMETER
		{
			name = HasElecricity
			type = HasResource
			resource = ElectricCharge
			minQuantity = 2500
			title = Есть минимум 2500 единиц энергии
			hideChildren = true
			//перманентную проверку не ставлю, если игрок пожадничал и половина энергии в возвращаемой ступени...
			//...сам себе злобный буратино! Для научной станции 3000 энергии необходимый минимум. 8*400 = 3200
			//или 1.25 плоская батарея на 1000 и еще 4 по 400 = 2600
			//хотя лучше большую 2.5 батарею на 4К!
		}
		//вместимость команды. Расчет простой:
		// - пилот (станция может быть с двигателями, менять орбиту, перебазировать к другому телу и т.п. и т.д.)
		// - инженер (случаи бывают разные - отвинтить термометр или магнетометр с пристыкованного корабля, если сразу не поставили)
		// - 2 ученых в лабораторию обязательно, чтобы исследования шли чуть быстрее.
		// - 1 место свободно, для комфортного обмена экипажей, если придется. Получается 5.
		// - кроме этого, очень удобно собрать капсулу МК1-3 + лаборатория, =5
		// Если "режим экономии вкл.", то делайте 3 места и стыкуйте корабль на 3 места. Будет сразу 6!
		PARAMETER
		{
			name = HasFiveCapacity
			type = HasCrewCapacity
			title = Вместимость экипажа: минимум 5 мест
			minCapacity = 5
			hideChildren = true
			disableOnStateChange = false
		}
		// Финальные требования
		PARAMETER
		{
			name = typeStation
			type = VesselIsType
			vesselType = Station
			title = Тип аппарата: станция
		}
		//Неизвестно, на какую орбиту выведет станцию игрок. Но очевидно, состояние должно быть ORBITING.
		//А потом будем требовать сутки на орбите - если опустил перицентр до гор или в атмосферу, оно разобьется.
		//насколько высока орбита, наклон, эксцентричность - не важно.
		//Не будем считать игрока идиотом. Эта станция нужна ему (наука! заправка!), пусть выводит так, как удобно.
		PARAMETER
		{
			name = Orbiting
			type = ReachState
			targetBody = @/targetBody
			situation = ORBITING
			hideChildren = true
			disableOnStateChange = false	//!
			title = На орбите небесного тела: @/targetBody
		}
		// Выдерживать положение на орбите 6 часов. это 4 витка на ЛКО.
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 6h
			preWaitText = Ожидаем выхода на орбиту
			waitingText = Оставайтесь на орбите еще 
			completionText = Успех, орбита устойчива, все системы работают отлично!
			completeInSequence = true
		}
	}
}