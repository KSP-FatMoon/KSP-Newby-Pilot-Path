CONTRACT_TYPE
{
	name = BallisticMoonShot
	title = Проект «Стрела»: Выстрелить в луну
	genericTitle = Проект «Стрела»: Выстрелить в луну
	description = Военное ведомство проводит испытание дальних баллистических систем. Ваша задача — запустить беспилотную ракету с поверхности нашей планеты прямо в сторону ближайшего спутника: @/targetMoon. Полет ракеты должен происходить по баллистической траектории, без формирования орбиты. Контракт зачтется, как только ракета пересечет границу сферы влияния цели. За использование только твердотопливных двигателей будет бонусное вознаграждение. А если попадете прямо в @/targetMoon, научный департамент приплатит дополнительно.
	genericDescription = Запустите беспилотную ракету по суборбитальной траектории домашней планеты и доберитесь до сферы влияния её первого спутника.
	synopsis = Войдите в сферу влияния ближайшей луны без предварительного выхода на орбиту планеты. Если хотите увеличить вознаграждение, попадите прямо в луну, не используя жидкотопливных двигателей.
	notes = Для попадания в СТ луны потребуется ракета примерно на [засекречено] dV, запущенная по дуге с наклоном примерно [засекречено] к горизонту, когда цель будет примерно над местом запуска. Возможно, потребуется несколько попыток, чтобы определить точный момент пуска, необходимый запас топлива и финальный угол гравитационного маневра. Все примерные величины зависят друг от друга и набранной в итоге скорости, если dV выбрано с большим запасом и полностью использовано.
	completedMessage = Попадание зафиксировано! Ракета успешно вошла в зону действия @/targetMoon, двигаясь по баллистической дуге. Данные телеметрии переданы в штаб.

	group = FMCP
	sortKey = 2000
	//agent = @/randomAgent
	
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 0
	deadline = 150
	cancellable = true
	declinable = true
	rewardFunds = 90000.0
	rewardScience = 20.0
	rewardReputation = 15
	advanceFunds = 30000
	failureFunds = 30000
	failureReputation = 5

	//DATA
	//{
	//	type = agent
    //    randomAgent = AllAgents().Random()
	//}
	
	// ========================================================
	// БЛОК ДИНАМИЧЕСКИХ КОНСТАНТ (СОВМЕСТИМОСТЬ С КОПЕРНИКУС)
	// ========================================================
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
		title = Home world
	}
	DATA
	{
		type = CelestialBody
		// Автоматически находим ПЕРВУЮ луну домашней планеты (Муна, Луна, Сетхи и т.д.)
		targetMoon = @/homePlanet.Children().First()
		//requiredValue = true
		title = target Moon
	}
	DATA
	{
		type = double
		//multiplier = @/targetMoon.Multiplier()
		// Динамически считываем высоту атмосферы домашней планеты
		atmosphereCeiling = HomeWorld().AtmosphereAltitude()
		// Рассчитываем критический максимальный периапсис для запрета орбиты (Атмосфера - 100 метров)
		maxAllowedPeA = @atmosphereCeiling - 100.0
	}
	PARAMETER
	{
		name = BallisticVessel
		type = VesselParameterGroup
		title = Использовать беспилотную баллистическую ракету
		PARAMETER
		{
			name = NewVesselCheck
			type = NewVessel
			title = Запустить новый аппарат
		}
		PARAMETER
		{
			name = UnmannedCheck
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Аппарат должен быть беспилотным
		}
		PARAMETER
		{
			name = NoOrbit
			type = Not
		// 1. ЖЕСТКИЙ ЗАПРЕТ ОРБИТЫ КЕРБИНА
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody = @/homePlanet
				//maxPeA = @/maxAllowedPeA
				situation = ORBITING
				title = Траектория должна оставаться суборбитальной
			}
		}
		// 2. ГЛАВНОЕ УСЛОВИЕ: Вход в сферу влияния Муны
		PARAMETER
		{
			name = ReachMoonSOI
			type = ReachState
			targetBody = @/targetMoon
			title = Войти в сферу влияния луны
		}
		// ========================================================
		// ОПЦИОНАЛЬНЫЙ БОНУС 1: ТОЛЬКО ТВЕРДОТОПЛИВНЫЕ УСКОРИТЕЛИ (ТТУ)
		// ========================================================
		PARAMETER
		{
			name = SolidFuelBonus
			type = All
			optional = true // Делает параметр необязательным для закрытия всего контракта
			title = Бонус: Использовать только ТТУ (Без жидкого топлива и окислителя)
			// Дополнительная выплата, которая начислится ТОЛЬКО если этот блок выполнен
			rewardFunds = 35000.0 

			PARAMETER
			{
				name = NoLiquidFuel
				type = HasResource
				resource = LiquidFuel
				minQuantity = 0.0
				maxQuantity = 0.0
				title = Отсутствие жидкого топлива (LiquidFuel)
			}
			PARAMETER
			{
				name = NoOxidizer
				type = HasResource
				resource = Oxidizer
				minQuantity = 0.0
				maxQuantity = 0.0
				title = Отсутствие окислителя (Oxidizer)
			}
		}
		// ========================================================
		// ОПЦИОНАЛЬНЫЙ БОНУС 2: КУРС НА ПРЯМОЕ СТОЛКНОВЕНИЕ С МУНОЙ
		// ========================================================
		PARAMETER
		{
			name = ImpactBonus
			type = Orbit
			targetBody = @/targetMoon
			optional = true
			situation = SUB_ORBITAL
			// Если периапсис внутри Луны меньше 0, траектория ведет на таран.
			// Сработает сразу при входе в SOI, независимо от масштаба планет в моде.
			//Строго - нет. У нас ландшафт везде выше 0, кроме небольшой области в двойном кратере.
			//Поэтому вполне возможно разбиться о Муну с перицентром порядка 3-5км, о возвышенности.
			//Поскольку "чиркнуть" вдоль поверхности в двойном кратере невозможно, Пе 2км уже зачет
			//либо будет прямой удар, либо столкновение с ландшафтом справа или слева
			//НО поскольку может быть мод, задающий первый спутник более гладким, уменьшим до 500м
			maxPeA = 500	//если разбились на траектории выше 500м без бонуса - не баг. Цельтесь наверняка
			title = Бонус: Траектория гарантированного столкновения с луной
			rewardFunds = 50000.0
			rewardScience = 20
		}
	}
	REQUIREMENT
	{
		name = MoonFlyByAchieved
		// Проверяем прогресс строго для Муны/Первой луны, выбранной в DATA
		type = FlyBy
		targetBody = @/targetMoon
		title = Вы должны предварительно совершить хотя бы один пролет мимо первой луны
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = BallisticMoonShot
		cooldownDuration = 3d
	}
}