CONTRACT_TYPE
{
	name = BallisticInterplanetary
	title = Проект «Стрела»: Выстрелить в луну!
	description = Военное ведомство проводит испытание межпланетной баллистической ракеты. Ваша задача — запустить беспилотную ракету с поверхности нашей планеты прямо в сторону ближайшего спутника: @/targetMoon. Полет ракеты должен происходить по баллистической траектории, без формирования орбиты. Ракета должна попасть точно в цель, промах и падение боеголовки на @/homePlanet - это провал. К моменту достижения луны все бустеры должны полностью исчерпать топливо, никаких коррекций курса в СТ @/targetBody!
	notes = С момента взятия контракта, любые попытки выйти на орбиту или переключится на находящиеся на орбите корабли, провалят данный контракт. Другие суборбитальные запуски тоже исключены. Выполнение данного задания в приоритете - у вас всего 2 дня!
	genericDescription = Запустите беспилотную ракету по суборбитальной траектории, с поверхности домашней планеты, и попадите в её первый спутник.
	synopsis = Войдите в сферу влияния ближайшей луны (и разбейте ракету о поверхность!) без предварительного выхода на орбиту. Разрешены только твердотопливные двигатели. Промахов быть не должно!

	completedMessage = Попадание зафиксировано! Данные телеметрии переданы в штаб.

	group = FMCP		//FMCP_Special
	sortKey = 2000
	agent = BBR
	
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 5
	deadline = 3
	cancellable = true
	declinable = true
	targetBody = @/homePlanet	//@/targetMoon
	rewardFunds = 100000.0
	rewardScience = 30.0
	rewardReputation = 25
	advanceFunds = 30000
	failureFunds = 35000
	failureReputation = 3
	REQUIREMENT
	{
		name = MoonFlyByAchieved
		type = FlyBy
		targetBody = @/targetMoon
		title = Вы должны предварительно совершить хотя бы один пролет мимо первой луны
	}
	//REQUIREMENT
	//{
		// выполняется максимум 5 раза, повторы не ранее 5 дней. Развлекаемся!
	//	type = CompleteContract
	//	minCount = 0
	//	contractType = BallisticInterplanetary
	//	cooldownDuration = 5d
	//}
	// Миссия совместима с ЛЮБЫМИ модами, включая RSS-GPP-JSNQ и прочие подобные.
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
		title = Home world
	}
	DATA
	{
		type = CelestialBody
		targetMoon = @/homePlanet.Children().First()
		title = target Moon
	}
	DATA
	{
		type = String
		vesselName = ProjectArrow
	}
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		DIALOG_BOX
		{
			title = Оповещение о привязке к контракту
			condition = PARAMETER_COMPLETED
			parameter = LaunchCheck
			position = CENTER
			titleColor = #BADA55
			TEXT
			{
				text = Внимание! Данный корабль определен как объект проекта "Стрела". Вывод на орбиту провалит взятый контракт! Падение на @/homePlanet или взрыв в атмосфере - провалит контракт! Ваша цель - запуск межпланетной баллистической ракеты с поверхности, и попадание в луну, без формирования орбиты и дополнительных маневров, с использованием только твердотопливных двигателей. Удачи!
			}
		}
	}
	PARAMETER
	{
		name = ToDoAndNotToDo
		type = All
		title = ...
		// сцуко тут-то что написать? необходимость заголовка угнетает. "Выполнить все"?
	PARAMETER
	{
		name = BallisticVessel
		type = Sequence
		targetBody = @/homePlanet
		title = Все задачи должны быть выполнены на одном аппарате, от старта до финала.
		notes = Для попадания в СТ луны потребуется ракета примерно на [засекречено] dV, запущенная по дуге с наклоном примерно [засекречено] к горизонту, когда цель будет примерно над местом запуска. Либо запустите ракету вертикально, когда цель будет в [засекречено] градусах после зенита. Возможно, потребуется несколько попыток, чтобы определить точный момент пуска, необходимый запас топлива и финальный угол наклона. Все примерные величины зависят друг от друга и набранной в итоге скорости, если dV выбрано с большим запасом и полностью использовано.
		PARAMETER
		{
			// нужно для отсекания от старта, где часть проверок не сработает
			// т.к. ступень еще не активна. А для ТТУ активация = запуск.
			name = LiftOff
			type = ReachState
			situation = FLYING
			//situation = SUB_ORBITAL
			//situation = ESCAPING
			targetBody = HomeWorld()
			title = Взлет зафиксирован
			//hidden = true
			disableOnStateChange = true
		}	// топливо нормально считает только после взлета - на старте не проверить.
		PARAMETER
		{ // привязка коварна, привяжем не то и контракт повиснет
			name = LaunchCheck
			type = VesselParameterGroup
			title = Стартовая проверка: запущена новая беспилотная ракета, только твердотопливные ускорители
			define = @/vesselName
		dissassociateVesselsOnContractFailure = True
	    dissassociateVesselsOnContractCompletion = True
	    //resetChildrenWhenVesselDestroyed = True
			PARAMETER
			{
				name = NewVesselCheck
				type = NewVessel
				title = Ракета должна быть создана после взятия контракта
			}
			PARAMETER
			{
				name = UnmannedCheck
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Аппарат должен быть беспилотным
				hideChildren = true
			}
			//PARAMETER
			//{
			//	name = ReadyForLaunch
			//	type = ReachState
			//	situation = PRELAUNCH
			//	targetBody = @/homePlanet
			//	title = На стартовом столе, готов к запуску
			//}
			// Проверка отсутствия топлива. Идея челленджа - ТТУ.
			PARAMETER
			{
				name = NoFuelButSRB
				type = HasResource
				title = Разрешены только твердотопливные ускорители
				hideChildren = true
				RESOURCE
				{
					resource = LiquidFuel
					minQuantity = 0.0
					maxQuantity = 0.0
				}
				RESOURCE
				{
					resource = Oxidizer
					minQuantity = 0.0
					maxQuantity = 0.0
				}
				RESOURCE
				{
					resource = MonoPropellant
					minQuantity = 0.0
					maxQuantity = 0.0
				}
			}
		}

		PARAMETER
		{
			// никаких маневров после старта. Чтобы не читерить сепратронами
			name = NuclearLaunchDetected
			type = VesselParameterGroup
			title = Пуск ракеты зарегистрирован: удаляемся от @/homePlanet, топливо полностью израсходовано
			targetBody = @/homePlanet
			vessel = @/vesselName
			hideChildren = true
			completeInSequence = true
		PARAMETER
		{	// на случай уничтожения в атмосфере
			name = StrangeCheck
			type = VesselNotDestroyed
			vessel = @/vesselName
			title = не сжечь ракету в атмосфере, иначе провал!
			//completeInSequence = true
			//disableOnStateChange = true
		}
			PARAMETER
			{
				name = ReachSpace
				type = ReachSpace
				title = Launch detected!
				//hidden = true
			}
			//PARAMETER
			//{
			//	// таймер тут нужен, чтобы разнести по времени проверки. Вряд ли бустер будет гореть более 25с в космосе, так?
			//	name = OrbitFix
			//	type = Duration
			//	duration = 25s
			//	preWaitText = Ожидаем ...
			//	waitingText = Ждите еще ...
			//	completionText = Оки!
			//	hideChildren = true
			//	//hidden = true
			//	completeInSequence = true
			//}
			PARAMETER
			{
				name = NoSolidFuel
				type = HasResource
				resource = SolidFuel
				minQuantity = 0.0
				maxQuantity = 0.001
				// особенность чисел с плавающей точкой... Если топливо было, то может остаться 1Е-20, и это не 0!
				title = Топливо полностью сгорело, движение по неизменной траектории
				//hidden = true
			}
		}
		PARAMETER
		{
			name = MoonImpact
			type = VesselParameterGroup
			title = Цель - @/targetMoon!
			vessel = @/vesselName
			PARAMETER
			{
				name = ReachMoonSOI
				type = ReachState
				targetBody = @/targetMoon
				situation = SUB_ORBITAL
				situation = ESCAPING
				title = Войти в сферу влияния луны
				maxRateOfClimb = -50
				hideChildren = true
				//hidden = true
			}
			PARAMETER
			{	// так себе проверка. Но пусть будет
				name = NoLeavingMoon
				type = Not
				completeInSequence = true
				disableOnStateChange = false
				PARAMETER
				{
					name = LeaveMoonSOI
					type = ReachState
					targetBody = HomeWorld()
					title = ушли из СТ луны!
					disableOnStateChange = false
				}
				hidden = true
			}
		}
		PARAMETER
		{
			name = VesselDestroyed
			type = VesselDestroyed
			title = Ракета уничтожена от удара о поверхность @/targetMoon
			//targetBody = @/targetMoon
			completeInSequence = true
		}
	}
		PARAMETER
		{
			name = NotToDo
			type = None
			title = Запрещено: выходить на орбиту, падать на Кербин, улетать к Солнцу.
			// к сожалению данное правило относится к любым кораблям...
			completeInSequence = true
			disableOnStateChange = false	//вот оно, моя прелесть.
			PARAMETER
			{
				// если промахнулись, и оказалиcь на орбите Кербина, провал.
				// закруглили после запуска, и 2й бустер для перехода - провал.
				name = NoOrbit
				type = ReachState
				targetBody = @/homePlanet
				situation = ORBITING
				title = выходить на орбиту запрещено
				//disableOnStateChange = true
				//hidden = true
			}
			PARAMETER
			{	// если промахнулись аж в Солнце - тоже провал
				name = NoSol
				type = ReachState
				targetBody = HomeWorld().Parent()
				title = промахнуться и уйти к Солнцу запрещено
				//disableOnStateChange=true	//false
				//hidden = true
			}
			PARAMETER
			{	// если пролетели/недолетели луну, или падаем
				name = NoKerbinReturn
				type = ReachState
				title = упасть на Кербин запрещено
				targetBody = HomeWorld()
				maxRateOfClimb = -1.0
			}
		}
	}
	PARAMETER
	{
		name = Timer
		type = Timer
		duration = 2d
		timerType = PARAMETER_COMPLETION
		parameter = NuclearLaunchDetected
		failContract = true
		// отсекаем долгие эллиптические пролеты, уход к Солнцу, и возврат с Муны
		// и вообще держим игрока в тонусе. 2 дня с момента принятия контракта.
	}
}
