CONTRACT_TYPE
{
	name = BallisticMoonShot
	title = Проект «Стрела»: Выстрелить в луну
	description = Военное ведомство проводит испытание межпланетной баллистической ракеты. Ваша задача — запустить беспилотную ракету с поверхности нашей планеты прямо в сторону ближайшего спутника: @/targetMoon. Полет ракеты должен происходить по баллистической траектории, без формирования орбиты. Ракета должна попасть точно в луну, промах и падение боеголовки на @/homePlanet - это провал.
	genericDescription = Запустите беспилотную ракету по суборбитальной траектории, с поверхности домашней планеты, и попадите в её первый спутник.
	synopsis = Войдите в сферу влияния ближайшей луны (и разбейте ракету о поверхность!) без предварительного выхода на орбиту планеты. Разрешены только ТТУ. Промахов быть не должно!

	completedMessage = Попадание зафиксировано! Данные телеметрии переданы в штаб.

	group = FMCP
	sortKey = 2000
	//agent = @/randomAgent
	
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 0
	deadline = 150
	cancellable = true
	declinable = true
	targetBody = @/targetMoon
	rewardFunds = 100000.0
	rewardScience = 30.0
	rewardReputation = 25
	advanceFunds = 30000
	failureFunds = 35000
	failureReputation = 5

	//DATA
	//{
	//	type = agent
	//    randomAgent = AllAgents().Random()
	//}
	
	// Миссия максимально совместима с ЛЮБЫМИ модами, включая RSS-GPP-JSNQ и прочие подобные. И Кербализмом,
	// и авариями, воспламенениями и чем угодно. Пока моды не изменят игру настолько, что имеющимися деталями
	// задача в принципе не осуществима (Луна в 40 мегаметрах, с радиусом 40км, бустеры с 1000 dV максимум,
	// беспилотный блок весом 2т, гравитация родной планеты 5жэ и так далее)
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
		title = Home world
	}
	DATA
	{
		type = CelestialBody
		targetMoon = @/homePlanet.Children().First()
		title = target Moon
	}
	DATA
	{
		// Добавил, чтобы проверки контракта относились к той самой стартовавшей ракете, а не любому кораблю
		type = String
		vesselName = ArrowOne
	}
	PARAMETER
	{
		name = BallisticVessel
		type = VesselParameterGroup
		define = @/vesselName
		title = Должна быть подготовлена новая беспилотная твердотопливная баллистическая ракета
		notes = Для попадания в СТ луны потребуется ракета примерно на [засекречено] dV, запущенная по дуге с наклоном примерно [засекречено] к горизонту, когда цель будет примерно над местом запуска. Либо запустите ракету вертикально, когда цель будет в [засекречено] градусах после зенита. Возможно, потребуется несколько попыток, чтобы определить точный момент пуска, необходимый запас топлива и финальный угол гравитационного маневра. Все примерные величины зависят друг от друга и набранной в итоге скорости, если dV выбрано с большим запасом и полностью использовано.
		PARAMETER
		{
			name = NewVesselCheck
			type = NewVessel
			title = Ракета должна быть создана после взятия контракта
		}
		PARAMETER
		{
			name = UnmannedCheck
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Аппарат должен быть беспилотным
		}
		PARAMETER
		{
			name = ReadyForLaunch
			type = ReachState
			situation = PRELAUNCH
			targetBody = @/homePlanet
			title = На стартовом столе, готов к запуску
		}
		// Проверка отсутствия топлива. Если кто-то использует радон, криптонит, конденсированный ион, SPACE+TIME
		// и прочие гиперчиты - ну развлекайтесь! Первоначальная идея челленджа - ТТУ.
		PARAMETER
		{
			name = NoFuelCheck
			type = All
			title = Разрешены только твердотопливные ускорители
			PARAMETER
			{
				name = NoLiquidFuel
				type = HasResource
				resource = LiquidFuel
				minQuantity = 0.0
				maxQuantity = 0.0
				title = Отсутствие жидкого топлива (LiquidFuel)
				hidden = true
			}
			PARAMETER
			{
				name = NoOxidizer
				type = HasResource
				resource = Oxidizer
				minQuantity = 0.0
				maxQuantity = 0.0
				title = Отсутствие окислителя (Oxidizer)
				hidden = true
			}
			PARAMETER
			{
				name = NoXenon
				type = HasResource
				resource = XenonGas
				minQuantity = 0.0
				maxQuantity = 0.0
				title = Отсутствие ксенона (XenonGas)
				hidden = true
			}
			PARAMETER
			{
				name = NoMonoPropellant
				type = HasResource
				resource = MonoPropellant
				minQuantity = 0.0
				maxQuantity = 0.0
				title = Отсутствие монотоплива (MonoPropellant)
				hidden = true
			}
		}
	}
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		DIALOG_BOX
		{
			title = Оповещение о привязке к контракту
			condition = PARAMETER_COMPLETED
			parameter = BallisticVessel
			TEXT
			{
				text = Внимание! Данный корабль определен как объект проекта "Стрела". Вывод на орбиту провалит взятый контракт! \n Ваша цель - запуск межпланетной баллистической ракеты с поверхности, для попадания в @/targetMoon, без формирования орбиты и дополнительных маневров, с использованием только твердотопливных двигателей. \n Промах по луне и уход за сферу влияния Кербина, или уничтожение ракеты в атмосфере - провалит контракт. Если вы не уверены, уберите ракету со старта и подготовьтесь получше. Удачи!
			}
		}
	}
	PARAMETER
	{
		name = NuclearLaunchDetected
		type = VesselParameterGroup
		title = Пуск ракеты зарегистрирован
		vessel = @/vesselName
		PARAMETER
		{
			name = ReachSpace
			type = ReachSpace
			title = Launch detected!
			//hidden = true
		}
		PARAMETER
		{
			name = NoSolidFuel
			type = HasResource
			resource = SolidFuel
			minQuantity = 0.0
			maxQuantity = 0.0
			title = На корабле не должно остаться топлива - никаких маневров после запуска!
			//hidden = true
		}
	}
	PARAMETER
	{
		name = CheckImpactMoon
		type = VesselParameterGroup
		title = Войдите в сферу влияния @/targetMoon на курсе неизбежного столкновения
		vessel = @/vesselName
		PARAMETER
		{
			name = ReachMoonSOI
			type = ReachState
			targetBody = @/targetMoon
			title = Войти в сферу влияния луны
		}
		PARAMETER
		{
			name = VesselDestroyed
			type = VesselDestroyed
			//mustImpactTerrain = true		//bug in "true" value, never return true
			title = Ракета уничтожена от удара о поверхность @/targetMoon
			targetBody = @/targetMoon
		}
	}
	PARAMETER
	{
		name = CrazyGroup
		type = VesselParameterGroup
		title = Запреты
		vessel = @/vesselName
		hidden = true
		PARAMETER
		{
			name = None
			type = None
			title = Запрещено: орбиты, выход из СТ луны после достижения, взрыв аппарата на родной планете
			//vessel = @/vesselName
			PARAMETER
			{
				name = NoOrbit
				type = Orbit
				targetBody = @/homePlanet
				minPeA = HomeWorld().AtmosphereAltitude()
				title = выходить на орбиту запрещено
				hidden = true
			}
			PARAMETER
			{
				name = NoSol
				type = ReachState
				targetBody = HomeWorld().Parent()
				title = промахнуться и уйти к Солнцу запрещено
				hidden = true
			}
			PARAMETER
			{
				name = NoCrashOnKerbin
				type = VesselDestroyed
				targetBody = @/homePlanet
				title = и разбить в СТ @/homePlanet запрещено
				hidden = true
			}
		}
	}
	REQUIREMENT
	{
		name = MoonFlyByAchieved
		type = FlyBy
		targetBody = @/targetMoon
		title = Вы должны предварительно совершить хотя бы один пролет мимо первой луны
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = BallisticMoonShot
		cooldownDuration = 3d
	}
}