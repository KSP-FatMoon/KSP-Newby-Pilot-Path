CONTRACT_TYPE
{
	name = BallisticInterplanetary
	title = Проект «Стрела»: Выстрелить в луну 2
	description = Военное ведомство проводит испытание межпланетной баллистической ракеты. Ваша задача — запустить беспилотную ракету с поверхности нашей планеты прямо в сторону ближайшего спутника: @/targetMoon. Полет ракеты должен происходить по баллистической траектории, без формирования орбиты. Ракета должна попасть точно в луну, промах и падение боеголовки на @/homePlanet - это провал.
	genericDescription = Запустите беспилотную ракету по суборбитальной траектории, с поверхности домашней планеты, и попадите в её первый спутник.
	synopsis = Войдите в сферу влияния ближайшей луны (и разбейте ракету о поверхность!) без предварительного выхода на орбиту планеты. Разрешены только твердотопливные двигатели. Промахов быть не должно!

	completedMessage = Попадание зафиксировано! Данные телеметрии переданы в штаб.

	group = FMCP
	sortKey = 2000
	
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 0
	deadline = 150
	cancellable = true
	declinable = true
	targetBody = @/homePlanet	//@/targetMoon
	rewardFunds = 100000.0
	rewardScience = 30.0
	rewardReputation = 25
	advanceFunds = 30000
	failureFunds = 35000
	failureReputation = 5
	REQUIREMENT
	{
		name = MoonFlyByAchieved
		type = FlyBy
		targetBody = @/targetMoon
		title = Вы должны предварительно совершить хотя бы один пролет мимо первой луны
	}
	// Миссия совместима с ЛЮБЫМИ модами, включая RSS-GPP-JSNQ и прочие подобные. И Кербализмом
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
		title = Home world
	}
	DATA
	{
		type = CelestialBody
		targetMoon = @/homePlanet.Children().First()
		title = target Moon
	}
	DATA
	{
		type = String
		vesselName = ProjectArrow
	}
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		DIALOG_BOX
		{
			title = Оповещение о привязке к контракту
			condition = PARAMETER_COMPLETED
			parameter = preLaunchCheck
			TEXT
			{
				text = Внимание! Данный корабль определен как объект проекта "Стрела". Вывод на орбиту провалит взятый контракт! Ваша цель - запуск межпланетной баллистической ракеты с поверхности, и попадание в луну, без формирования орбиты и дополнительных маневров, с использованием только твердотопливных двигателей. Удачи!
			}
		}
	}
	
	PARAMETER
	{
		name = BallisticVessel
		type = Sequence
		targetBody = @/homePlanet
		title = Все задачи должны быть выполнены на одном аппарате, от старта до финала.
		notes = Для попадания в СТ луны потребуется ракета примерно на [засекречено] dV, запущенная по дуге с наклоном примерно [засекречено] к горизонту, когда цель будет примерно над местом запуска. Либо запустите ракету вертикально, когда цель будет в [засекречено] градусах после зенита. Возможно, потребуется несколько попыток, чтобы определить точный момент пуска, необходимый запас топлива и финальный угол гравитационного маневра. Все примерные величины зависят друг от друга и набранной в итоге скорости, если dV выбрано с большим запасом и полностью использовано.

		PARAMETER
		{
			name = preLaunchCheck
			type = VesselParameterGroup
			title = Предстартовая проверка:
			define = @/vesselName
		dissassociateVesselsOnContractFailure = True
	    dissassociateVesselsOnContractCompletion = True
	    //resetChildrenWhenVesselDestroyed = True
			PARAMETER
			{
				name = NewVesselCheck
				type = NewVessel
				title = Ракета должна быть создана после взятия контракта
			}
			PARAMETER
			{
				name = UnmannedCheck
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Аппарат должен быть беспилотным
				hideChildren = true
			}
			PARAMETER
			{
				name = ReadyForLaunch
				type = ReachState
				situation = PRELAUNCH
				targetBody = @/homePlanet
				title = На стартовом столе, готов к запуску
			}
			// Проверка отсутствия топлива. Идея челленджа - ТТУ.
			PARAMETER
			{
				name = NoFuelCheck
				type = All
				title = Разрешены только твердотопливные ускорители
				PARAMETER
				{
					name = NoLiquidFuel
					type = HasResource
					resource = LiquidFuel
					minQuantity = 0.0
					maxQuantity = 0.0
					title = Отсутствие жидкого топлива (LiquidFuel)
					hidden = true
				}
				PARAMETER
				{
					name = NoOxidizer
					type = HasResource
					resource = Oxidizer
					minQuantity = 0.0
					maxQuantity = 0.0
					title = Отсутствие окислителя (Oxidizer)
					hidden = true
				}
				PARAMETER
				{
					name = NoXenon
					type = HasResource
					resource = XenonGas
					minQuantity = 0.0
					maxQuantity = 0.0
					title = Отсутствие ксенона (XenonGas)
					hidden = true
				}
				PARAMETER
				{
					name = NoMonoPropellant
					type = HasResource
					resource = MonoPropellant
					minQuantity = 0.0
					maxQuantity = 0.0
					title = Отсутствие монотоплива (MonoPropellant)
					hidden = true
				}
			}
		}
		PARAMETER
		{
			name = NuclearLaunchDetected
			type = VesselParameterGroup
			title = Пуск ракеты зарегистрирован
			targetBody = @/homePlanet
			vessel = @/vesselName
			PARAMETER
			{
				name = ReachSpace
				type = ReachSpace
				title = Launch detected!
				hidden = true
			}
			PARAMETER
			{
				name = NoSolidFuel
				type = HasResource
				resource = SolidFuel
				minQuantity = 0.0
				maxQuantity = 0.0
				title = Топливо полностью сгорело, движение по неизменной траектории
				hidden = true
			}
		}
		PARAMETER
		{
			name = MoonImpact
			type = VesselParameterGroup
			title = Цель - @/targetMoon!
			vessel = @/vesselName
			PARAMETER
			{
				name = ReachMoonSOI
				type = ReachState
				targetBody = @/targetMoon
				title = Войти в сферу влияния луны
				hideChildren = true
				hidden = true
			}
		}
				PARAMETER
			{
				name = VesselDestroyed
				type = VesselDestroyed
				title = Ракета уничтожена от удара о поверхность @/targetMoon
				//targetBody = @/targetMoon
				completeInSequence = true
			}
	}

	//PARAMETER
	//{
	//	name = Restrictions
	//	type = VesselParameterGroup
	//	title = Условия провала:
	//	vessel = @/vesselName
		PARAMETER
		{
			name = None
			type = None
			title = Выводить эту ракету на орбиту запрещено!
			
			PARAMETER
			{
				name = NoOrbit
				type = Orbit
				targetBody = @/homePlanet
				minPeA = HomeWorld().AtmosphereAltitude()
				title = выходить на орбиту запрещено
				hidden = true
			}
			PARAMETER
			{
				name = NoSol
				type = ReachState
				targetBody = HomeWorld().Parent()
				title = промахнуться и уйти к Солнцу запрещено
				hidden = true
			}
			//PARAMETER
			//{
			//	name = NoCrashOnKerbin
			//	type = VesselDestroyed
			//	targetBody = @/homePlanet
			//	title = и разбить в СТ @/homePlanet запрещено
			//	//hidden = true
			//}
		}
	//}

