//=====================================
// миссия 2: определить нужные корабли на орбите, собрать список спасаемых
// задача: все должны выжить. Все должны быть доставлены на Кербин, любым способом (в том числе можно вместе с кабиной)
CONTRACT_TYPE
{
	name = FMCP_StoryResque1
	title = Крутое пике: спасательная операция
	description = К счастью, все (пока!) целы - и экипаж, и пассажиры. Впереди сложная и долгая работа - спасти всех! 20 кербалов на орбите, даже если возить по 3 - потребуется 7 рейсов. 7 запусков спасательного 3х-местного корабля с устройством для стыковки, ведь туристы не могут вылезти через люк и пересесть в спасательный корабль.\n\n Если вы захотите спасти всех "по быстрому", учтите, что потребуется несколько парашютов и тепловой щит, прикрепленные к обломкам. Или гигантский спасательный корабль, способный удержать 8-тонную кабину в тени щита в атмосфере. Так или иначе - способ спасения за вами.
	autoAccept = true
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 1
	group = FMCP		//_Resque
	targetBody = HomeWorld()
	declinable = false
	cancellable = false
	sortKey = 02Story
	synopsis = Спасти 20 кербалов с орбиты - и экипаж, и пассажиров, не потеряв никого в процессе.
	completedMessage = Знаете кто герой Кербина? Да-да, именно. Наша репутация взлетела до небес, отлично!
	advanceFunds = 20000.0
	rewardFunds = 250000.0
	rewardReputation = 30
	failureFunds = 200000.0
	failureReputation = 100
	REQUIREMENT
	{
		type = Expression
		expression = !($CC_FailStoryR0==1)
		title = Не было провала этой миссии по дедлайну или гибели кербалов
	}
	REQUIREMENT
	{
		name = ChainTrigger
		type = CompleteContract
		contractType = FMCP_StoryResque0
	}
	DATA
	{
		type = AvailablePart
		cabin16 = AvailablePart(mk3CrewCabin)
		cabin4 = AvailablePart(mk3Cockpit_Shuttle)
		hidden = true
	}
	DATA
	{
		type = Vessel
		//казалось бы это можно включить в предыдущую миссию...
		//Но я хочу независимость - спасение отдельно, инженерные работы отдельно.
		//поэтому будем извращаться и получать спасаемых кербалов вот таким образом
		//иначе стартовать миссию на орбитальную сборку будет не то чтоб невозможно... но неудобно
		Cockpit = AllVessels().Where(v => (v.CelestialBody()==HomeWorld())&&v.IsOrbiting()&&(v.Parts().ElementAt(0)==@/cabin4)&&(v.EmptyCrewSpace()==0)).ElementAt(0)
		BigCabin = AllVessels().Where(v => (v.CelestialBody()==HomeWorld())&&v.IsOrbiting()&&(v.Parts().ElementAt(0)==@/cabin16)&&(v.EmptyCrewSpace()==0)).ElementAt(0)
		hidden = true
	}
	DATA
	{
		type = List<Kerbal>
		hidden = true
		ks1 = @/Cockpit.Crew()
		ks2 = @/BigCabin.Crew()
		ksa = @ks1.Concat(@ks2)
	}
