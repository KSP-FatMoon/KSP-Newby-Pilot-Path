	BEHAVIOUR
	{	//спасенные пассажиры должны исчезнуть после выполнения
		name = RemoveKerbal
		type = RemoveKerbal
		kerbal = @/ks2
	}
	PARAMETER
	{
		name = SafetyFirst
		type = KerbalDeaths
		//или kerbal = @/ksa
		vessel = @/Cockpit
		vessel = @/BigCabin
		hidden = true
		hideChildren = true
	}
	PARAMETER
	{	//сделаю с итератором, чтобы платить за каждого спасенного. В сумме 600К и 200 репутации - есть за что страдать
		name = ReturnKerbal
		type = RecoverKerbal
		kerbal = @ker
		ITERATOR
		{
			type = Kerbal
			ker = @/ksa
		}
		title = Вернуть @ker домой!
		rewardFunds = 30000.0
		rewardReputation = 10
		hideChildren = true
	}
	//есть нюанс... Если кто-то погибнет, у игрока будет до 16 туристов. Вечно живущих в центре...
	//на всякий случай включу в конструктурскую миссию скрытое удаление тех же туристов. Чтобы был шанс удалить оставшихся
}
//=====================================
// миссия 3: собрать из обломков станцию! Громадные модули, 20 мест экипажа в сумме, большой бак с топливом - уже на орбите.
// Или (ветка альтернативы) свести с орбиты кабины вместе с кербалами, чтобы спасти их как можно скорее.
// А в станцию превратить только бак, прикрутив стыковочные узлы и пристыковав модуль с управлением.
// Свести с орбиты 8т большой кабины с 16ю туристами - задача со звездочкой, нужен монтаж тепловых щитов и парашютов.
// В любом случае будут инженерные работы.
//======================================

// классические спасательные операции.
// Стоковое спасение не отключаю - там есть спасение с поверхности и спасение вместе с капсулой - хотя такие задачи сложные
// даже для опытных (утащить с Муны капсулу - это нужен ровер с клешней, кран с клешней, и спускаемый модуль с клешней.
// спасаемая капсула передается по цепочке - ровер отвозит к крану, кран поднимает на орбиту, передает возвращаемому)
// (наверно есть гуру, способные ухватить капсулу сразу краном, и он же спускаемый аппарат... но я лично в такое не верю!)
// но именно из-за кучи операций весьма интересные. Нельзя вычеркивать! Повторять же сам не буду
// Если по каким-то причинам игрок потерял стоковые спасательные (поставил кербал-академию?), будет хоть какая компенсация
CONTRACT_TYPE
{
	name = FMCP_ResqueSimple
	title = Спасти кербала, застрявшего на низкой орбите Кербина
	description = К нам обратилось другое агентство за срочной помощью. Из-за плохо завернутой гайки, @/ker1 оказался на низкой орбите без средств управления и возможности вернуться. Надо организовать спасательную операцию - отправьте корабль со свободным местом для экипажа, пересадите потерпевшего крушение персонажа и верните его домой на Кербин.
	genericDescription = Вернуть кербала с орбиты домой
	prestige = Significant
	maxSimultaneous = 1
	maxCompletions = 15	// Достаточно 15 раз за глаза. 4 стартовых, 15 с миссий х1 и 20 с миссий х2
						// и еще с сюжетки 3, и еще со спасения с лун 10 = 52. Куда столько огурцов, солить?
						// а еще большая сюжетка с Христофором Керманом, будет +5. И стоковое спасение.
	group = FMCP		//_Resque
	targetBody = HomeWorld()
	sortKey = 0100
	cancellable = true
	declinable = true
	synopsis = Спасти кербала с орбиты - при удаче он станет частью нашей команды.
	completedMessage = Отлично, кербал спасен. Наша программа получила нового астронавта.
	advanceFunds = 8000.0
	rewardFunds = 60000.0
	rewardReputation = 10
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб кербал, это серьезно!
	failureReputation = 20
	//======================================================================
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = @/targetBody
		checkType = MANNED
		title = Сначала надо вернуться с орбиты Кербина
	}
	REQUIREMENT
	{
		type = Rendezvous
		targetBody = @/targetBody
		title = и хотя бы раз совершить сближение с другим аппаратом на орбите
	}
	REQUIREMENT
	{	// не будем спамить спасательными операциями! раз в 2 дня более чем достаточно
		type = CompleteContract
		minCount = 0
		contractType = FMCP_ResqueSimple
		cooldownDuration = 2d
	}
	//======================================================================
	DATA
	{	// деталь будет всегда, т.к. они есть - следовательно список не пустой, и получим 1 случайную деталь.
		// На заметку: деталь всегда создается с полным количеством ресурсов. Т.е. топливо-монотопливо-электричество - все 100%
		type = AvailablePart
		// любая деталь с местом для экипажа хотя бы 1, массой менее 2.5т и не имеющая двигателя
		// потому что если есть интегрированный двигатель, наш кербал сам себя спасет - сойдет с орбиты и прыгнет с парашютом.
		avPart = AllParts().Where(p => (p.CrewCapacity() > 0) && (p.Mass() < 2.5) && (p.EngineVacuumThrust() == 0.0)).Random()
		// но надо исключить лабы и большие 5-местные модули (лаба 3.4 тонны)(авиакабина МК3 3.5т)
		hidden = true
	}
	DATA
	{
		type = List<String>
		kTraits = [ "Pilot", "Engineer", "Scientist" ]	// это бесполезно, т.к. в CREW будет рандом
		spName = [ "Поврежденный корабль ", "Поврежденная капсула ", "Аварийный отсек ", "Сломанный корабль ", "Поврежденный модуль ", "Потерявшийся модуль ", "Обломок корабля " ]
		hidden = true
	}
	DATA
	{	// понятия не имею, надо ли это... Проверим! в принципе если заданы кербалы как CREW, туристов быть не должно.
		type = String
		kTrait = @/kTraits.Random()	//не надо
		hidden = true
	}
	DATA
	{
		type = Kerbal
		ker1 = NewKerbalWithTrait(@/kTrait)	//можно просто NewKerbal или (string)RandomKerbalName(gender)
		hidden = true
	}
	DATA
	{
		// случайное название корабля
		type = String
		hidden = true
		//тут засада. Получение фрагментов имени возвращает строку "Джеб^m" или "Вирджиния^f" - с гендером.
		//а использование переменной как есть даст "Аварийный отсек Белебор Керман". Даже не знаю как лучше...
		sName = @/spName.Random() + @/ker1		//.FirstName()
	}
	DATA
	{
		type = double
		rInc = Random(0.0, 6.0)	//пусть наклонение незначительно гуляет, +-6 градусов
		//кстати, стоковые на строго экваториальной. 6 градусов - уже интересней, надо выравнивать наклонение
		orbitAlt = Random(79000.0, 95000.0)		// 79км уже низко. 82-90 нормально. Пусть будет до 95
		// Радиус Кербина = 600000м. Большая полуось (SMA) = Радиус + Высота
		rSMA = 600000.0 + @orbitAlt
		// Случайное положение на орбите для уникальности
		orbitMean = Random(0.0, 360.0)
	}
	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel
		VESSEL
		{
			name = @/sName
			// хорошо для имени. Плохо для идентификатора :(
			craftPart = @/avPart
			owned = false
			targetBody = @/targetBody
			ORBIT
			{
				SMA = @/rSMA
				ECC = 0.0001
				INC = @/rInc
				MNA = @/orbitMean
			}
			CREW
			{	//принимает в том числе объект "Кербал" (преобразуемый в имя). Но не список!
				//если надо создать несколько, ТОЛЬКО несколько нод CREW, по одной на кербала
				name = @/ker1
				gender = @/ker1.Gender()	//иначе может быть мальчик Виктория и девочка Бальтазар... и они будут!
				addToRoster = true	// если false, то исчезнет после спасения
				//count = 1 - не работает совсем, ни 1 ни любое количество. Игнор полный. Поэтому по имени
			}
			// кербалы создаются как управляемые, но не экипаж. Чтобы сделать их экипажем, надо тип менять
			// а тип меняется криво, при старте. Иногда до того, как кербал создан. Нельзя изменить тип кербала по событию.
			// пусть так и останется! Тем интереснее - получим "как бы туриста" но профессионала. Я бы такое и в другом месте использовал...
		}
	}
	PARAMETER
	{	//обязательно
		name = SafetyFirst
		type = KerbalDeaths
		kerbal = @/ker1
		hidden = true
		hideChildren = true
	}
	PARAMETER
	{	// параметр нужен для перевода созданного обломка в owned.
		name = Rendezvous
		type = Rendezvous
		// без задания дистанции засчитывает с 2 км по умолчанию. Устраивает!
		vessel = @/sName
		title = Выслать спасательный корабль к @/sName
		//hidden = true		// можно и скрыть. Наград для сближения я не задаю, а оно по любому состоится.
		hideChildren = true
	}
	BEHAVIOUR
	{	// без этого обломок после спасения снова станет недоступным - зачем нам это?
		name = ChangeVesselOwnership
		type = ChangeVesselOwnership
		onState = PARAMETER_COMPLETED
		parameter = Rendezvous
		vessel = @/sName
		owned = true
	}
	PARAMETER
	{
		name = ReturnKerbal
		type = RecoverKerbal
		kerbal = @/ker1
		title = Вернуть @/ker1 домой!
		hideChildren = true
	}
}
// Нельзя заспавнить случайное количество 1-2-3-4-5 кербалов и знать их имена :( Т.е.
// либо спавним строго заданное количество (например 1 или 2)
// либо делаем сюжетную цепочку с автоакцептом - сначала генерим обломок с 16 кербалами,
// а в следующей авто-миссии получаем их через vessel.Crew() и используем в параметрах список
// Поэтому одна миссия на спасение одного, и вторая - на спасение двух. Третья - спасение одиночек с орбиты лун, и хватит.
// спасение с орбиты Евы-Дюны и так далее технически возможно. Но совершенно неправдоподобно! Нельзя выжить в капсуле год
// Но надо подумать над миссиями спасения, где кербалы НЕ будут попадать в отряд. Спасли - спасибо. И до свидания))
CONTRACT_TYPE
{	// см. далее - count в CREW не работает, контракт висит валидным, но не предлагается, без сообщений об ошибках
	// поэтому только цепочка нод CREW, и никаких count. Замысел с полной туристов кабиной на 16 мест - будет суровым!
	// Для разнообразия, сгенерим кербалов сразу в SpawnVessel, никаких DATA с NewKerbalWithTrait. Да, работает.
	// Но намного приятнее генерить кербалов в DATA и подставлять - полный контроль над именами!
	name = FMCP_ResqueSimple2
	title = Спасти кербалов, застрявших на низкой орбите Кербина
	description = К нам обратилось другое агентство за срочной помощью. Из-за плохо завернутой гайки, астронавты оказался на низкой орбите без средств управления и возможности вернуться. Надо организовать спасательную операцию - отправьте корабль, пересадите потерпевших крушение и верните их домой на Кербин.
	prestige = Significant
	maxSimultaneous = 1
	maxCompletions = 10	// 10*2 = 20 кербалов в отряд. Это как бы много. Не надо больше!
	group = FMCP		//_Resque
	targetBody = HomeWorld()
	cancellable = true
	declinable = true
	sortKey = 0101
	synopsis = Спасти экипаж с орбиты - при удаче они станут частью нашей команды.
	completedMessage = Отлично, кербалы спасены. Наша программа получила новых астронавтов.
	advanceFunds = 10000.0
	rewardFunds = 80000.0
	rewardReputation = 10
	failureFunds = 100000	// да, штраф будет большим - провал означает что у нас погиб кербал, это серьезно!
	failureReputation = 20
	//======================================================================
	REQUIREMENT
	{
		type = CompleteContract
		contractType = FMCP_ResqueSimple
		title = Должен быть опыт спасательной операции!
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP_ResqueSimple2
		cooldownDuration = 4d
	}
	//======================================================================
	DATA
	{	
		type = AvailablePart
		// любая деталь с местом для экипажа хотя бы 2, массой менее 2.5т и не имеющая двигателя
		avPart = AllParts().Where(p => (p.CrewCapacity() > 1) && (p.Mass() < 2.5) && (p.EngineVacuumThrust() == 0.0)).Random()
		// в стоке + DLC это круглые капсулы "Восход" на 2 и 3, МК2 "джемини", МК1-3 "Аполлон", авиа-кабина 1.25,
		// банка 2.5, мунный модуль и кабина автостопщиков. С тантаресом вариантов больше.
		hidden = true
	}
	DATA
	{
		type = int
		hidden = true
		numPostfix = Random(0,200)
	}
	DATA
	{
		type = List<String>
		spName = [ "Корабль ", "Капсула ", "Отсек ", "Модуль ", "Обломок " ]
		hidden = true
	}
	DATA
	{
		// случайное название корабля строка + номер. Да, могут перекрыться. Но редко. Из 10 миссий - вообще не должны!
		type = String
		hidden = true
		sName = @/spName.Random() + @/numPostfix
	}
	DATA
	{
		type = double
		rInc = Random(3.0, 9.0)	//пусть наклонение гуляет 3..9 градусов. Ради двоих можно и пострадать!
		orbitAlt = Random(80000.0, 100000.0)	// пуркуа бы и не па? чуть повыше
		// Радиус Кербина = 600000м. Большая полуось (SMA) = Радиус + Высота
		rSMA = 600000.0 + @orbitAlt
		// Случайное положение на орбите для уникальности
		orbitMean = Random(0.0, 359.9)
		// и эксцентриситет тоже пусть слегка гуляет
		orbitEcc = Random(0.001, 0.005)
	}
	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel
		VESSEL
		{
			name = @/sName
			craftPart = @/avPart
			owned = false
			targetBody = @/targetBody
			ORBIT
			{
				SMA = @/rSMA
				ECC = @/orbitEcc	//0.0001
				INC = @/rInc
				MNA = @/orbitMean
			}
			// и вот теперь я хочу более 1 кербала в модуле. И это оказалась совершенно неочевидная жесть
			// документация противоречит реальности - но правильный путь обнаружен!
			CREW
			{	// Пустая нода неприемлема несмотря на "значения по умолчанию"
				// имя обязательно, потому что count не работает. Совсем. Ни со значением 1, ни любым другим
				// имя придется задавать явно - либо через RandomKerbalName, либо через NewKerbalWithTrait
				name = RandomKerbalName(Male)	//случайное имя само генерится только в одном случае: кербал уже существует
				// например если контракт берется повторно, а имя не случайное - вместо уже существующего само сгенерит случайное.
				gender = Male	// зачем? А тут рандом как раз работает. Чтоб не получить разнобой имя-пол.
				// профессия тут не задается. Случайно. Хотим предзаданную... можно попробовать создать заранее кербала-профи
				// или рискнуть положиться на ChangeKerbalType (но туда надо передать кербала, хотя бы имя)
				addToRoster = true
				//count = 1	- наличие count вешает контракт. Считается валидным, ошибок нет, но миссия не предлагается
			}
			CREW
			{	// если хотим 2х - две ноды. Хотим 16 в большую кабину - 16.
				name = RandomKerbalName(Female)
				gender = Female
				addToRoster = true
			}
		}
	}
	PARAMETER
	{	//обязательно
		name = SafetyFirst
		type = KerbalDeaths
		//мы не знаем имен в данном случае - так что никто не должен погибнуть, не только наши спасаемые.
		hidden = true
		hideChildren = true
	}
	PARAMETER
	{
		name = Rendezvous
		type = Rendezvous
		vessel = @/sName
		title = Выслать спасательный корабль для перехвата @/sName
		hideChildren = true
	}
	BEHAVIOUR
	{
		name = ChangeVesselOwnership
		type = ChangeVesselOwnership
		onState = PARAMETER_COMPLETED
		parameter = Rendezvous
		vessel = @/sName
		owned = true
	}
	PARAMETER
	{
		name = ReturnKerbal
		type = RecoverKerbal
		index = 0	// индекс соответствует VESSEL а не CREW
		// =0 по умолчанию
		// 1 параметр - 1 индекс, нельзя несколько индексов
		//title = Вернуть @/ker1 домой!			//Поскольку задаем прямо в SpawnVessel, имена мы не узнаем. Никак.
		// оставляем подпись по умолчанию (будут перечислены все в корабле0)
	}
}
