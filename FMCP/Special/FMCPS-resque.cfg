			kerbal = @/ks2.ElementAt(8)
			kerbalType = Tourist
			trait = Tourist
		}
		KERBAL_INFO
		{
			kerbal = @/ks2.ElementAt(9)
			kerbalType = Tourist
			trait = Tourist
		}
