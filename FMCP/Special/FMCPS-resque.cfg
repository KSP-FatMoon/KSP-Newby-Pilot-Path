CONTRACT_TYPE
{
	name = FMCP_StoryResque0
	title = Крутое пике: черезвычайная ситуация на орбите
	description = Срочно завершайте ближайшие неотложные дела - посадки капсул, выводы на орбиты, маневры и прочее - у нас черезвычайная ситуация! К Кербину приближается космолайнер с повреждениями корпуса, на борту 4 члена экипажа и полный салон туристов, вход в атмосферу приведет к гарантированной гибели всех. Рекомендовано экстренное торможение и выход на устойчивую орбиту. Мы не знаем, переживет ли корабль перегрузку - можем получить на орбите либо лайнер, либо груду обломков. В любом случае, придется поработать сверхурочно, применять инженерную смекалку и исключительные навыки пилотажа для спасения экипажа и пассажиров. Надеемся, что обойдется без жертв. Ожидайте подробности после принятия контракта.
	notes = Это сюжетная миссия, после принятия которой возникнет каскад неотменяемых заданий на сближение, стыковку, и инженерные операции в космосе. Рекомендую завершить все быстрые миссии, выполнить запланированные в ближайшие дни маневры, сократить количество взятых контрактов и сделать точку сохранения, чтобы иметь возможность переиграть все с начала. Награда - вариабельная, в зависимости от способа и полноты выполнения всех миссий. Время выполнения не ограничено, но чем дольше оттягивать начало спасательных работ, тем сложнее. Вам потребуется минимум 2 орбитальных сближения, максимум - порядка 20, со стыковками, с существенными затратами на конструирование и старты спасательных кораблей. Звучит как серьезное испытание? так и есть!
	prestige = Significant
	maxSimultaneous = 1
	maxCompletions = 1
	group = FMCP		//_Resque
	targetBody = HomeWorld()
	declinable = false
	cancellable = false
	sortKey = 01Story
	synopsis = Обследовать поле обломков на орбите в поисках выживших кербалов. Стабилизировать их дальнейшее выживание в кабине без жизнеобеспечения: рекомендуется запуск специализированного корабля с инженером на борту для монтажа стыковочных узлов, аккумуляторами и солнечными панелями. Надо спасти всех!
	completedMessage = Обнаружены выжившие, начинаем спасательную операцию!
	advanceFunds = 10000.0
	rewardFunds = 50000.0
	rewardReputation = 10
