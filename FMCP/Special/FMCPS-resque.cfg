				text = Командующий спасательной операцией, фиксируем множественные обломки на орбите, связь с лайнером потеряна. Орбиты устойчивы, есть надежда на успех. Вы должны знать, что пассажирская кабина Бройлеров не имеет источников энергии! Надо действовать быстро. На борту 16 пассажиров, вы не сможете эвакуировать всех сразу, это займет время. Первоочередная задача - пристыковать спасательный модуль, имеющий емкие аккумуляторы и солнечные панели, чтобы запустить и поддерживать жизнеобеспечение отсека. Считаем необходимым отправить инженера для монтажа стыковочного узла, прямо на орбите. И тут же пристыковать спасательный корабль. А потом придется повторить с кабиной экипажа, там ситуация чуть лучше, аккумулятора должно хватить на несколько часов. Для стабилизации достаточно прикрутить солнечную панель - и потом не спеша и без паники решать, что делать.
			}
