CONTRACT_TYPE
{
	name = RetrogradeToProgradeMunTour
	title = Орбитальный разворот
	
	description = Читали фантаста Абеля Кермина? После его романа многие верят, что вращаясь против вращения планеты, экипаж будет молодеть, идя во времени в другую сторону. Занятное, но совершенно необоснованное заблуждение! Время, которое мы видим по часам, с этими часовыми поясами, не то же самое, что время как интервал от события А до события Б. Что причина, а что следствие, понимаете? Чтобы окончательно развеять эту теорию, мы хотим запустить корабль с экипажем на орбиту против вращения Кербина. Так называемая "ретроградная" орбита. Но вот в преимуществах и недостатках мы не уверены (хотя наверняка утверждаем, что потребуется на 200-300 dV больше - придется противостоять скорости вращения самого Кербина). Выйдя на ретроградную орбиту, постройте маршрут к Муне, войдите в ее сферу действия, закруглите орбиту и оцените, проще или сложнее такой маневр? Вернитесь с Муны на нормальную экваториальную орбиту и выполните посадку. На всякий случай, рассчитывайте топливо с запасом.
	synopsis = Выполните последовательный полет (ретроградная орбита Кербина) -> (любая орбита Муны) -> (орбита Кербина с наклонением 0) -> Посадка.
	notes = Для вывода корабля на ретроградную орбиту, наклоняйте его при взлете в другую сторону от экватора. Если всегда на 90, теперь на 270. Возвращаясь домой, сначала постройте маневр возврата с Муны, выводящий на стабильную орбиту с низким перицентром (но выше 70км). А оказавшись на орбите Кербина, развернитесь против движения и малыми импульсами снизьте перицентр до атмосферного торможения (считаем оптимумом 25-35км). Остатки топлива не жалейте, или сбросьте ступень при возврате, или сожгите при торможении. Скорость будет высокой - вы же падаете с высоты 10000 км! Обязательно установите тепловой щит.
	completedMessage = Невероятное достижение! Доказано, что на ретроградной орбите экипаж не молодеет. А выход на такую орбиту и закругление орбиты Муны требуют чуть больше dV. А самое интересное - через орбиту Муны можно повернуть на 180 градусов!

	//agent = Department of Aerospace Navigation
	prestige = Exceptional
	maxSimultaneous = 1
	maxCompletions = 1
	group = FMCP		//FMCP_Special
	deadline = 250
	cancellable = true
	declinable = true

	rewardFunds = 80000.0
	rewardScience = 25.0
	rewardReputation = 20.0

	failureFunds = 45000.0
	failureReputation = 20.0

	sortKey = 2010

	REQUIREMENT
	{
		name = MoonOrbitAchieved
		type = Orbit
		targetBody = HomeWorld().Children().First()
		title = Вы должны предварительно побывать на орбите Муны, хотя бы беспилотно!
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP_Orbit04
		title = И сначала выполнить контракт на ретроградную орбиту Кербина.
	}
	// --------------------------------------------------------
	// ЧЕКПОИНТ 1: Кербин, ретроградная орбита (180 +- 5 градусов)
	// --------------------------------------------------------
	PARAMETER
	{
		name = Check1
		type = All
		title = Вывести корабль с экипажем на ретроградную орбиту Кербина
	
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = На борту должен быть экипаж
			hideChildren = true
		}
		PARAMETER
		{
			name = RetrogradeOrbit
			type = Orbit
			targetBody = HomeWorld()
			minPeA = HomeWorld().AtmosphereAltitude()
			minInclination = 175.0
			maxInclination = 180.0
			title = Выйти на стабильную орбиту с наклонением 175° – 180°
			// Наклонение от 0 до 180, 185 не существует, т.к. считает =175, под другим углом
			hideChildren = true
		}
	}
	// --------------------------------------------------------
	// ЧЕКПОИНТ 2: Муна, любая орбита (PeA > 7500)
	// --------------------------------------------------------
	PARAMETER
	{
		name = Check2
		type = VesselParameterGroup
		title = Выйти на орбиту Муны
		targetBody = HomeWorld().Children().First()
		completeInSequence = true
		PARAMETER
		{
			name = Checkpoint2_Mun
			type = Orbit
			targetBody = HomeWorld().Children().First()
			minPeA = 7500
			title = Выйти на орбиту Муны (перицентр выше 7500м)
			//disableOnStateChange = false
		}
		PARAMETER
		{
			name = OrbitFix
			type = Duration
			duration = 5s
			preWaitText = Ожидаем устойчивой орбиты
			waitingText = Оставайтесь на орбите еще		//в течении @duration
			completionText = Орбита устойчива, как яйцо на столе!
			hideChildren = true
			hidden = true
		}
	}
	// --------------------------------------------------------
	// ЧЕКПОИНТ 3: Кербин, нормальная орбита (0 +- 5 градусов)
	// --------------------------------------------------------
	PARAMETER
	{
		name = Check3
		type = VesselParameterGroup
		title = Выйти на экваториальную орбиту Кербина
		targetBody = HomeWorld()
		completeInSequence = true
		PARAMETER
		{
			name = NormalInclination
			type = Orbit
			targetBody = HomeWorld()
			minPeA = HomeWorld().AtmosphereAltitude()
			minInclination = 0.0
			maxInclination = 5.0
			title = Наклонение орбиты должно быть в пределах 5 градусов от экватора
		}
		PARAMETER
		{
			name = OrbitFix2
			type = Duration
			duration = 5s
			preWaitText = Ожидаем устойчивой орбиты
			waitingText = Оставайтесь на орбите еще		//в течении @duration
			completionText = Орбита устойчива, как яйцо на столе!
			hideChildren = true
			hidden = true
		}
	}
	// --------------------------------------------------------
	// ЧЕКПОИНТ 4: возврат домой
	// --------------------------------------------------------
	PARAMETER
	{
		name = ReturnHome
		type = ReturnHome
		targetBody = HomeWorld()
		title = Посадка или приводнение аппарата на Кербин
		completeInSequence = true
	}
}