			}
		}
	}
	// =================================================================
	// Группа параметров - 1. Сближение и стыковка.
	// =================================================================
	PARAMETER
	{
		name = DockingKaracatica
		type = Sequence			// с группой по кораблю почему-то не работают диалоги. Совсем.
		failWhenCompleteOutOfOrder = false
		//vessel = @/vesselName - секвенс-параметр не имеет ссылки на корабль!
		hiddenParameter = CoplanarInclination
		hiddenParameter = RendezvousKaracatica1
		hiddenParameter = RendezvousKaracatica2
		hiddenParameter = RendezvousKaracatica3
		hiddenParameter = DockNow
		title = Изменить наклонение, перехватить станцию и состыковаться в КРАТЧАЙШИЕ сроки: следуйте указаниям ЦУПа, появляющимся заданиям и логике!
		PARAMETER
		{
			name = CommandReady
			type = HasCrew
			kerbal = Христофор Керман
			kerbal = Дебрис Керман
			hidden = true
		}
		PARAMETER
		{
			name = CoplanarInclination
			type = Orbit
			minInclination = 0
			maxInclination = 2
			// около 1000 dV, мне стабильно получалось 870-845 из 10 попыток
			title = Выйдите на копланарную орбиту со станцией в ближайшем подходящем узле
			hideChildren = true
		}
		PARAMETER
		{
			name = RendezvousKaracatica1
			type = Rendezvous
			vessel = @/vesselName
			vessel = @/stationName
			distance = 1000
			// около 300 dV на транзит и выравнивание скоростей. С мехджебом - меньше 150
			title = Выполните маневр перехвата и сблизьтесь со станцией до 1000м
			//completeInSequence = true
		}
		PARAMETER
		{
			name = RendezvousKaracatica2
			type = Rendezvous
			vessel = @/vesselName
			vessel = @/stationName
			distance = 60
			// нормальный человек идет на маневровых, ~5-10 монотоплива на сближение и стыковку
			title = ...ближе!
			//completeInSequence = true
		}
		PARAMETER
		{
			// рассчитываем на нормального игрока, приближающегося со скоростью 0.3-0.5 м/с
			// Конечно, если лететь хотя бы 5м/с, диалоги будут не совсем в тему...
			// ...потому что маневровыми затормозить не успеют, втетерятся в станцию
			// ...А крутиться хвостом туда-сюда - будет не до диалогов
			name = IdleTimer1
			type = Duration
			duration = 5s
			preWaitText = inter-message interval
			waitingText = just waiting for reply
			completionText = finished
			//completeInSequence = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = IdleTimer2
			type = Duration
			duration = 5s
			preWaitText = inter-message interval
			waitingText = just waiting for reply
			completionText = finished
			//completeInSequence = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = IdleTimer3
			type = Duration
			duration = 5s
			preWaitText = inter-message interval
			waitingText = just waiting for reply
			completionText = finished
			//completeInSequence = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = RendezvousKaracatica3
			type = Rendezvous
			vessel = @/vesselName
			vessel = @/stationName
			distance = 40
			title = Приблизьтесь до 40 м и оцените обстановку
			//completeInSequence = true
		}
		PARAMETER
		{
			name = IdleTimer4
			type = Duration
			duration = 5s
			preWaitText = inter-message interval
			waitingText = just waiting for reply
			completionText = finished
			//completeInSequence = true
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = DockNow
			type = Docking
			vessel = @/vesselName
			vessel = @/stationName
			title = Выполните стыковку!
			//completeInSequence = true
			//defineDockedVessel = Каракатица-Победа
		}
	}
// Этот блок выглядит бесполезным, но иногда первый не отрабатывает. А я хочу Фукса именно ученым
// ...возможно, что бесполезным является первый блок :))
	BEHAVIOUR
	{
		name = OwnedFuks
		type = ChangeKerbalType
