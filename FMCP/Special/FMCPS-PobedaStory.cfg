	{
		name = DialogBoxB2
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog1b
			condition = PARAMETER_COMPLETED
			parameter = IdleTimer1
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = RIGHT
			
			KERBAL
			{
				characterName = Христофор Керман
				showName = true
				animation = idle
			}
			TEXT
			{
				text = Дебрис, отставить выход в космос, ищите стыковочный шлюз. А то откроешь дверь, воздух выпустишь, а там персонал без скафандра.
			}
		}
	}
	// =================================================================
	// Сближение на расстояние видимости 2
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBoxB3
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog2a
			condition = PARAMETER_COMPLETED
			parameter = IdleTimer2
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = LEFT
			
			KERBAL
			{
				characterName = Дебрис Керман
				showName = true
				animation = idle_lookAround
			}
			TEXT
			{
				text = О, Христофор Бонифатьевич, смотрите, бак со слизью, совсем новый. Давайте себе возьмем, вдруг пригодится? И вижу батарею на 400, прижата к дверям лаборатории.
			}
		}
	}
	BEHAVIOUR
	{
		name = DialogBoxB4
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog2b
			condition = PARAMETER_COMPLETED
			parameter = IdleTimer3
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = RIGHT
			
			KERBAL
			{
				characterName = Христофор Керман
				showName = true
				animation = idle
			}
			TEXT
			{
				text = Дебрис, ты нам таким "возьмем" всю аэродинамику коту под хвост отправишь, и краску поцарапаешь.
			}
		}
	}
	// =================================================================
	// Сближение на расстояние видимости 3
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBoxB5
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog3a
			condition = PARAMETER_COMPLETED
			parameter = RendezvousKaracatica3
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = LEFT
			
			KERBAL
			{
				characterName = Дебрис Керман
				showName = true
				animation = idle_wonder
			}
			TEXT
			{
				text = Так Христофор Бонифатьевич, какая аэродинамика в космосе? Мы даже вон ту дуру можем себе на борт привинтить, хуже летать не будем. Заодно двери разблокируем, а то внутрь не зайти.
			}
		}
	}
	BEHAVIOUR
	{
		name = DialogBoxB6
		type = DialogBox

		DIALOG_BOX
		{
