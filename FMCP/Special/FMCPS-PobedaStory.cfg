		parameter = DockNow
		KERBAL_INFO
		{
			kerbal = Фукс Керман
			kerbalType = Crew		//! должно сработать...
			trait = Scientist
		}
	}
	// =================================================================
	// Радостный Фукс просится в команду
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBoxF1
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog
			condition = PARAMETER_COMPLETED
			parameter = DockingKaracatica
			
			title = ОБНАРУЖЕН ВЫЖИВШИЙ!
			position = CENTER
			
			KERBAL
			{
				characterName = Фукс Керман
				showName = true
				animation = true_smileB
			}
			TEXT
			{
				text = Ой спасибо, я уже собирался голодать, дышать через раз, таинственной слизью питаться. Возьмите меня с собой, на планете скучно, и на орбите тоже все изучено. А я другие планеты увидеть хочу. От ученого в команде большая польза, вот я вам к примеру уровни могу повысить. Сейчас компьютер настроим, тесты пройдем - и сразу верти дырочки под новые звездочки!
			}
		}
	}
	// =================================================================
	// Группа параметров - 2. тренировка экипажа
	// =================================================================
	PARAMETER
	{
		name = TrainingPhase
		type = VesselParameterGroup
		//vessel = Каракатица-Победа		//к черту корабль! Ищите топливо! - Есть сэр!
		title = Используйте мобильную лабораторию станции, чтобы повысить уровни экипажа
		//dissassociateVesselsOnContractCompletion = true
		PARAMETER
