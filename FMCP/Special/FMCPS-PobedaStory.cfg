//добавить в требования посадки на Муну и Минмус (иначе история появляется рано)
//добавить в требования НИИ 2 уровня (пусть требует сразу. Образцы почвы!)
//добавить в требования DSN 3 уровня (отслеживание бесхозных объектов и астероидов)
CONTRACT_TYPE
{
	name = Pobeda_LaunchMission
	title = Приключения капитана Кермана: Байкербанурские старты
	description = После 4х лет обучения в Космической Академии, капитан Христофор Керман получил корабль и отправляется в космическое путешествие.\n\n По правилам, требуется полный экипаж из 3х астронавтов для орбит и посадок на другие планеты и их луны.\n\n Нашему герою не повезло - в команду вошел только 1 инженер, тот еще раздолбай. А вдвоем можно не дальше родной планеты летать. Но не отказываться же из-за этого от собственного корабля!
	synopsis = Переключитесь на «Победа Мк2», настройте ступени и взлетайте. Достигнув орбиты, ждите дальнейших указаний из центра управления полетами. И никакого своеволия, если хотите заработать новые звания!
	completedMessage = Ну вот и орбита. Не расстраивайтесь, вам еще дадут порулить... немного.
	notes = Эту сюжетную историю можно пройти только 1 раз.\n Чаще сохраняйтесь (вот прямо сейчас сохранитесь!), не расходуйте топливо зря, стройте маневры экономно, приземляйтесь плавно и берегите корабль! Он у вас один, от старта и до победного конца.\n Cмотрите в задание! Если сказано "состыковаться", стыкуйтесь. Сказано "открутить фонарь на станции" - откручивайте.\n Если вам ОЧЕНЬ захочется странного, сделайте сохранение в отдельный слот ДО гениальной движухи.\n Руководствуйтесь логикой и здравым смыслом - например, вот эта орбита, очевидно, должна быть не слишком эксцентричной и не слишком наклонной. Как думаете, с полярной орбиты вы в Муну попадете?
	
	rewardFunds = 50000
	rewardReputation = 5
	failureFunds = 30000
	failureReputation = 5
	maxSimultaneous = 1
	maxCompletions = 1
	deadline = 1			// Если вы решили начать историю, начинайте. Прямо сейчас.
							// Я бы поставил 15 минут (этого с избытком достаточно на эту миссию)
							// Но дедлайн задается строго в днях, меньше 1 поставить нельзя
	cancellable = false
	declinable = false
	targetBody = HomeWorld()

	DATA
	{
		type = string
		vesselName = "Победа Мк2"
	}
	// =================================================================
	// Требования к началу истории
	// =================================================================
	REQUIREMENT
	{
		name = PossibleEVA
		type = Facility
		facility = AstronautComplex
		minLevel = 2
		title = Центр астронавтов должен быть хотя бы 2 уровня (для выхода из капсулы)
	}
	REQUIREMENT
	{
		name = DSNUpgrade
		type = Facility
		facility = TrackingStation
		minLevel = 3
		title = Станция слежения должна быть 3 уровня (дальность космической связи)
	}
	REQUIREMENT
	{
		name = ManeuvrAvailable
		type = Facility
		facility = MissionControl
		minLevel = 2
		title = Центр управления полетами должен быть хотя бы 2 уровня (для маневров)
	}
	REQUIREMENT
	{
		name = GetSurfSampleAvailable
		type = Facility
		facility = ResearchAndDevelopment
		minLevel = 2
		title = Научно-конструкторский комплекс должен быть хотя бы 2 уровня (образцы грунта)
	}
	// =================================================================
	// 1. СПАВН КОРАБЛЯ С ЭКИПАЖЕМ (Христофор Бонифатьевич и помощник Дебрис)
	// =================================================================
	// Дальнейшее прохождение миссий возможно ТОЛЬКО этим же кораблем,
	// с этим же названием, и этим же составом экипажа.
	// Более того, полученные во время прохождения предметы, оборудование,
	// новые члены экипажа и сюжетные повороты важны для следующих миссий.
	// Для придания уникального образа, переоденьте героев в особые скафандры
	// (через контракт скафандры не переодеваются)
	// =================================================================
	BEHAVIOUR
	{
		name = SpawnPobedaVessel
		type = SpawnVessel
		//deferVesselCreation = false

		VESSEL
		{
			name = Победа Мк2
			craftURL = ContractPacks/FMCP/Special/Победа Мк2.craft
			
			flagURL = Squad/Flags/default
			vesselType = Ship
			owned = true

			// Координаты стартовой площадки Байкербанура
			targetBody = Kerbin
			lat = 20.6635
			lon = -146.421
			alt = 425
			heading = 90
			pitch = 0
			roll = 0

			// А вот и  наши герои, пока 0-го уровня. Зеленые... да они всегда зеленые!
			CREW
			{
				// Христофор Керман - бывший преподаватель истории, навигации и математики
				// Мужчина в полном расцвете сил, флегматично спокойный и рассудительный.
				// Хотя у него первый самостоятельный полет, зато симулятор сдан на "отлично"
				name = Христофор Керман
				gender = Male
				addToRoster = true
			}
			CREW
			{
				// Да, старший помощник Лом - женщина, и что? Эмансипация, равноправие, повесточка!
				// Поскольку женщине имя "Лом" как-то не подходит, она Деб. Debris - это тоже лом.
				// Только космический. Молодая, простая в общении, слегка глуповатая, слегка трусливая.
				// Но инженерное дело знает, любит крутить гайки, жечь сваркой и демонтировать всякое.
				name = Дебрис Керман
				gender = Female
				addToRoster = true
			}
		}
	}
	BEHAVIOUR
	{
		name = ChangeKerbalType
		type = ChangeKerbalType
		onState = CONTRACT_ACCEPTED
		KERBAL_INFO
		{
			kerbal = Христофор Керман
			kerbalType = Crew
			trait = Pilot
		}
		KERBAL_INFO
		{
			kerbal = Дебрис Керман
			kerbalType = Crew
			trait = Engineer
		}
	}
	// =================================================================
	// 2. ИГРОК ПРИНЯЛ УПРАВЛЕНИЕ, а потом еще и начал взлетать...
	// =================================================================
	PARAMETER
	{
		name = ControlTheRocket
		type = VesselParameterGroup
		vessel = @/vesselName
		title = Примите управление ракетой «Победа Мк2» на космодроме Байкербанур, доложите обстановку и начните взлет
		//hideChildren = true
		PARAMETER
		{	// Это только для определения, что игрок взял управление кораблем. Конечно там 2 кербала,
			// куда они денутся если я так написал?
			name = WeAreTheCommand
			type = HasCrew
			minCrew = 2
			maxCrew = 2
			hidden = true
			hideChildren = true
			title = Принять управление "Победой"
		}
		PARAMETER
		{
			name = PreLaunchCrewReport
			// не переживаем о наличии электричества - пока мы на старте, опоры подключены к сети
			type = CollectScience
			situation = SrfLanded
			targetBody = @/targetBody
			experiment = crewReport
			recoveryMethod  = Transmit
			title = Передайте в ЦУП доклад экипажа
			hideChildren = true
		}
		PARAMETER
		{
			name = LiftOffTrigger
			type = ReachState
			minAltitude = 1500
			hidden = true
		}
	}
	// =================================================================
	// ЦУП на связи: доложите обстановку!
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			name = StartDialog
			condition = PARAMETER_COMPLETED
			parameter = WeAreTheCommand
			
			title = ВНИМАНИЕ: СВЯЗЬ С ЦУП
			position = CENTER
			
			INSTRUCTOR
			{
				// Руководитель полетов Джин Керман
				name = Instructor_Gene	//Gene Kerman
				showName = true
				animation = idle
			}
			TEXT
			{
				text = Победа, это ЦУП. Проверяем телеметрию. Доложите обстановку!
			}
		}
	}
	// =================================================================
	// ЦУП на связи: неполный экипаж
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			name = LaunchConfirmation
			condition = PARAMETER_COMPLETED
			parameter = PreLaunchCrewReport
			
			title = ВНИМАНИЕ: СВЯЗЬ С ЦУП
			position = CENTER
			
			INSTRUCTOR
			{
				name = Instructor_Gene	//Gene Kerman
				showName = true
				animation = false_disappointed
			}
			TEXT
			{
				text = Победа, это ЦУП! Вас всего двое, дальше орбиты я вас не отпущу. Найдите третьего сначала. Выход на орбиту - разрешен, удачного взлета. А потом придется назад, команда-то неполная.
			}
		}
	}
	// =================================================================
	// Старший помощник, отставить панику!
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog1
			condition = PARAMETER_COMPLETED
			parameter = LiftOffTrigger
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = RIGHT
			
			KERBAL
			{
				// Старший помощник Дебрис
				crewIndex = 1
				showName = true
				animation = idle
			}
			TEXT
			{
				text = Христофор Бонифатьевич, а это у вас какой полет? Если не считать учебных? Как-то сильно наклонились, меня укачивает, и трясет нехорошо. Ту кнопку точно надо было нажимать?
			}
		}
	}
	// =================================================================
	// Христофор Керман на орбиту прибыл!
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog2
			condition = PARAMETER_COMPLETED
			parameter = OrbitPhase
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = LEFT
			
			KERBAL
			{
				// Капитан всегда успокоит экипаж!
				crewIndex = 0
				showName = true
				animation = true_thumbsUp
			}
			TEXT
			{
				text = Отставить панику, Дебрис. Видите, мы уже на орбите. И топливо не все потратили, если что, вернемся. А знаете, на настоящем корабле все так же, как и на тренажере. Только невесомостью отличается.\n А полет у меня ... 10й примерно. 2 раза с сарая летал, 4 прыжка с парашютом, 2 на дельтаплане... а, и еще на "Динавинге" из академии летел, пассажиром.\n Разрешаю 5 минут расслабиться, а то ты пожелтела слегка. ЦУП, мы на орбите, экипаж цел, бодр и готов к выполнению заданий!
			}
		}
	}
	// =================================================================
	// 3. ФИНАЛ-1: корабль выведен на орбиту с перицентром выше 75км и наклонением около 19-22
	// (потому что старт с Байкербанура). Если руки достаточно прямые, у вас около 3800 dV
	// Возможно больше, остаток 200 с первой ступени и полностью заправленные баки на 3875.
	// Но никак не меньше 3500, или я так не играю! Куда вы ее дели?
	// Если вывели на орбиту в мегаметр - сами себе злобные Буратино!
	// Если сделали наклонение 90 или вообще 180 - выкручивайтесь как хотите
	// =================================================================
	PARAMETER
	{
		name = OrbitPhaseGroup
		type = VesselParameterGroup
		vessel = @/vesselName
		title = Выйти на орбиту родной планеты
		PARAMETER
		{
			name = OrbitPhase
			type = Orbit
			targetBody = @/targetBody
			situation = ORBITING
			minPeA = HomeWorld().AtmosphereAltitude() + 5000
			title = Выведите корабль на стабильную орбиту
			hideChildren = true
		}
		PARAMETER
		{
			name = StayOn
			type = Duration
			duration = 5m
			preWaitText = Ожидаем устойчивой орбиты
			waitingText = Оставайтесь на орбите еще		//в течении @duration
			completionText = Орбита устойчива, как яйцо на столе!
			hideChildren = true
			disableOnStateChange = true
		}
	}
	//============================================================================================
	// Этот набор миссий изначально создается на русском языке, и переводить или делать
	// мультиязычную локализацию я пока не планирую. Кто не знает русский - не мои проблемы!
	//
	// Требования к старту истории:
	// - центр кербонавтов 2 уровень (наши герои будут выходить из капсулы в космосе)
	// - центр аэрокосмических программ и станция слежения 2 уровень (нужны маневры!)
	// - научно-исследовательский комплекс 2 уровень (даст возможность собирать образцы почвы)
	// - были посадки (а также пролет и орбита) обоих лун, чтобы не обломать себе другие миссии
	// - открыты технологии с перекачкой ресурсов и стяжками - потому что так удобнее
	// - Критично только первые два требования, остальные вопрос удобства.
	// Апгрейды ЦВС и стартовой площадки совершенно не важны - старт с Кербанура.
	// Учтите, что возвращаться мы не собираемся долго! Возвращение будет только в конце.
	// Поэтому все прочие контракты, предполагающие вернуться домой, выполните заранее
	// (или параллельно, не надеясь что Победа закроет ваш контракт с пролетом Дюны).
	// Хотя на историю другие контракты влиять НЕ должны, история МОЖЕТ повлиять на другие
	// контракты, как взятые, так и не взятые.
	//
	// Если миссия не предполагает жестких временных рамок (или вы в эти рамки заведомо укладываетесь),
	// можно брать другие контракты и выполнять их параллельно, в том числе используя возникшие
	// в процессе этой истории корабли, роверы, станции и саму Победу. С осторожностью, конечно.
	// (не надо менять орбиты или перегонять к другим небесным телам). Некоторые созданные крафты
	// будут автоматически уничтожаться - не возите пассажиров к заброшенным станциям!
	//
	// Если вам не предложена новая миссия после завершения текущей, скорее всего
	// не выполнены какие-то требования. Например, я решил, что тут надо взять образец грунта,
	// и добавил требования для научного комплекса - уровень 2. Или решил разнообразить миссию
	// стыковкой со случайной станцией (а вы еще не вывели ни одной). Или - надо открутить где-нибудь
	// барометр, мне лень создавать крафт с барометром, и нужен ваш спутник или корабль,
	// с которого этот барометр можно позаимствовать. А вы ничего такого не запустили. Обычно это
	// решается само (когда станция или корабль с барометром появятся, стартует и продолжение).
	//
	// Однако, в некоторых случаях это неявный провал, за который я не планировал наказывать,
	// но продолжать историю невозможно. Например мне на следующую миссию нужен термометр, а вы его
	// не получили (или разбили). Давать вам новый термометр я не предполагал, и можете либо
	// отправляться домой (конец истории), либо копаться в файлах и искать, почему не стартовало
	// продолжение. А потом везти специальным кораблем новый термометр. В принципе, это нормальное
	// логически продолжение, имейте в виду если лишитесь какой-нибудь детали случайно.
	//
	// В примерном плане полета будет:
	// - взлет и выход на орбиту Кербина (уже, эта миссия)
	// - стыковки со станциями
	// - пересаживание экипажа
	// - выходы из капсулы в космос и инженерные операции
	// - орбиты Муны и Минмуса
	// - посадки на луны
	// - управление беспилотным ровером
	// - выход за пределы СТ Кербина
	// - сближение с астероидами
	// - захват объектов "клешней"
	// - совершенствование корабля путем пристыковки к различным модулям...
	// - и обрастание различными дополнительными деталями, которые Деб будет откручивать и прикручивать
	// (совершенно хаотически и на ваше усмотрение, следите за центровкой сами!)
	// - полет к Дюне и Айку и возвращение на орбиту Кербина
	// - полет к Мохо, орбита Мохо и отправление на Еву
	// - исследование Евы и посадка на Джилли
	// - возможно, смена корабля (3500-3800 дельты маловато, надо сюжетно пересадить)
	// - орбита Джула и посещение лун - придется быть богом из машины и снабжать топливом...
	//   ...но я поставлю там заправку, и будете туда летать на каждой миссии, пока не кончится.
	// - флаги на нескольких планетах
	// - и конечно торжественное возвращение домой после нескольких лет этого невероятного полета
	//
	// Наличие готовых станций у планет и спутников или их конструирование в процессе прохождения
	// совершенно не критично, но может существенно помочь и разнообразить историю.
	// Наличие сети спутников-ретрансляторов тоже очень поможет, или отключите кербонет
	// (или будьте готовы к зависшему роверу или зонду вне зоны связи)
	//
	// Конфликтующие моды:
	// - Кербализм и моды на жизнеобеспечение (никаких запасов не хватит на 10-20 лет,
	//	и я не предусматривал заправку и снабжение едой-водой-кислородом)
	// - Коперникус и моды, меняющие небесные тела и солнечную систему (расчет dV и возможных полетов,
	// равно как использование названий планет, сделаны исходя из оригинального стокового КСП)
	// - моды, добавляющие критические поломки модулей случайным образом. Невозможно предусмостреть
	// в логике контракта, и история завершится провалом и эвакуацией наших героев домой.
	// - BDArmory и моды, добавляющие возгорания и взрыв деталей по истечению прочности,
	// - и любые моды, ограничивающие сроки службы деталей или количество зажиганий двигателя.
	// Это не жесткий конфликт, в игре ничего не сломается, миссии стартуют...
	// ...но скорее всего, вы не сможете их выполнить, рано или поздно.
	// Все остальное может как облегчить, так и затруднить прохождение, но не должно жестко помешать.
	// Первые 2 миссии гарантированно выполняются с Кербализмом, загоревшимся при взлете двигателем,
	// и даже на некоторых измененных системах.
	//
	// Требуемые моды:
	// - Оригинальный КСП версии 1.12.х (я проверяю на 1.12.5, последней доступной на данный момент)
	// - стандартные DLC от Squad (детали могут присутствовать в крафтах миссий)
	// - Contract Configurator последней версии и модульменеджер (естественно)
	//
	// Рекомендуемые моды:
	// - МехДжеб, если не любите самостоятельного экстремального пилотирования.
	// - моды, добавляющие новые приборы или опции конструирования (как КИС-КАС), расширят возможности
	// (представляете, что сможет собрать инженер с дрелью в руках?)
	// - фиксы загрузки сцен (защита от кракена!), стояночный тормоз и подобные.
	// Остальное на усмотрение игрока.
}
// Авария на станции
CONTRACT_TYPE
{
	name = Pobeda_RescueMission
	title = Приключения капитана Кермана: Спасательная операция
	description = Станция "Каракатица" столкнулась с небольшим астероидом. Подлетите к останкам станции, доложите в ЦУП и осмотрите обломки в поисках выживших. Спасите, если найдете. Заправьтесь топливом. Действуйте быстро, времени в обрез.
	synopsis = Переключитесь на «Победа Мк2», выполните маневры для подлета к станции Каракатица, и состыкуйтесь. Спасите выживших и ценное оборудование.
	
	rewardFunds = 40000
	rewardReputation = 10
	failureFunds = 5000
	failureReputation = 3
	maxSimultaneous = 1
	maxCompletions = 1
	deadline = 2			//станция возникает так, что (скорее всего) наиболее экономный
							//переход будет через сутки (по мехджебу). Конечно так не интересно!
							//поэтому постройте-ка переход сами, всю миссию можно пройти за 3 часа.
	cancellable = false
	declinable = false
	targetBody = HomeWorld()
	autoAccept = true 
	completedMessage = Пристыковавшись к станции, экипаж Победы начал поиск выживших... и получил нового члена команды!

	REQUIREMENT
	{
		name = ChainTrigger
		type = CompleteContract
		contractType = Pobeda_LaunchMission
	}

	DATA
	{
		type = string
		vesselName = "Победа Мк2"
		stationName = "Каракатица"
		//PobedaCraft = AllVessels().Where(v => v.Name() == "Победа Мк2").First()
		title = Определить корабли
	}
	// =================================================================
	// 1. СПАВН СТАНЦИИ С УЦЕЛЕВШИМ ЭКИПАЖЕМ (Фукс Керман, в дальнейшем ученый)
	// =================================================================
	BEHAVIOUR
	{
		name = SpawnDamagedStation
		type = SpawnVessel
		VESSEL
		{
			name = @/stationName
			craftURL = ContractPacks/FMCP/Special/Каракатица.craft
			owned = false 
			vesselType = Station
			targetBody = @/targetBody
			ORBIT
			{
				ECC = 0.0007 
				SMA = 745000 
				INC = 0.0 
				LAN = 0.0
				LPE = 0.0
				MNA = 0.0
				EPH = 0.0
				REF = 1
			}
			// Генерируем Фукса внутри unowned-станции
			// Он должен быть полноценной частью команды - добавляем в отряд
			CREW
			{
				name = Фукс Керман
				gender = Male
				addToRoster = true
			}
		}
	}
	BEHAVIOUR
	{
		name = UnOwnedFuks
		type = ChangeKerbalType
		onState = CONTRACT_ACCEPTED		// интересный момент, триггер поведения в вики не описан
		KERBAL_INFO
		{
			kerbal = Фукс Керман
			kerbalType = Crew
			trait = Scientist
		}
	}
	// ПЕРЕГОВОРЫ с ЦУП
	BEHAVIOUR
	{
		name = DialogBoxK1
		type = DialogBox

		DIALOG_BOX
		{
			name = UrgentMessage
			condition = PARAMETER_COMPLETED
			parameter = CommandReady
			title = ВНИМАНИЕ: СВЯЗЬ С ЦУП
			position = CENTER
			
			INSTRUCTOR
			{
				name = Instructor_Gene
				showName = true
				animation = false_sadA
			}
			TEXT
			{
				text = Победа, это ЦУП! У нас черезвычайная ситуация - в станцию "Каракатица" попал метеорит! Станция осталась на орбите, но связь прервалась, предполагаем массивные повреждения. Орбита станции 150 на 140 км ровно, строго экваториальная. Вы единственный корабль, способный в кратчайшее время обследовать место катастрофы. У вас наклонение орбиты слишком велико, приказываем в кратчайшие сроки выйти на орбиту с наклонением 0..2 градуса для маневра перехвата, сблизиться и оценить состояние "Каракатицы". Мы готовим спасательную операцию, но на счету каждая секунда!
			}
		}
	}
	// на заметку: если 2 диалога привязаны к одному событию, то отображаются в порядке
	// текста в файле. То есть я мог не добавлять эти гнусные таймерсы...
	BEHAVIOUR
	{	// Если игрок подлетел ближе 1км с ускорением времени, диалог может не возникнуть. Совсем.
		name = DialogBoxK2
		type = DialogBox

		DIALOG_BOX
		{
			name = CiteReport
			condition = PARAMETER_COMPLETED
			parameter = RendezvousKaracatica1
			
			title = СВЯЗЬ С ЦУП
			position = CENTER
			
			KERBAL
			{
				characterName = Христофор Керман
				showName = true
				animation = idle
			}
			TEXT
			{
				text = ЦУП, это Победа. Визуальный контакт, наблюдаем станцию. Сильно покорежена, будто пережевана. Электричество есть, аварийное освещение включено. Возможно наличие выживших, попробуем состыковаться, если стыковочный узел не пострадал.
			}
		}
	}
	BEHAVIOUR
	{
		name = DialogBoxK3
		type = DialogBox

		DIALOG_BOX
		{
			name = EndReport
			condition = PARAMETER_COMPLETED
			parameter = TrainingPhase
			
			title = СВЯЗЬ С ЦУП
			position = CENTER
			
			KERBAL
			{
				characterName = Христофор Керман
				showName = true
				animation = idle
			}
			TEXT
			{
				text = ЦУП, это Победа. Спасли ученого, взяли в команду. Других выживших не обнаружено. Экипаж полностью укомплектован, 3 человека. Готовы к выполнению любых заданий!
			}
		}
	}
	// =================================================================
	// Сближение на расстояние видимости 1
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBoxB1
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog1a
			condition = PARAMETER_COMPLETED
			parameter = RendezvousKaracatica2
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = LEFT
			
			KERBAL
			{
				characterName = Дебрис Керман
				showName = true
