// проблемы:
// Из-за особенностей откручивания и прикручивания, инженеру придется полетать в ЕВА,
// или полетать вместе с кораблем, замирая рядом с необходимыми деталями. Или и то и другое.
// И некоторые детали не прикручиваются в стоке, только КИС-КАС. Слизь - прикручивается.
// Проблемы из-за автопринятия и неожиданных поворотов:
// - если в части 1-1 игрок разбил корабль с гибелью всей команды, будет провал,
// но возможно начать заново. Если кто-то выжил - начать заново уже не получится :( Взяв
// историю 2-й раз, получим корабль со случайным экипажем и абсурдные диалоги. Либо убивать
// выжившего, либо создавать через чит-меню погибшего, выводить на орбиту корабль заново...
// а потом - см. ниже, клепать новый корабль с героями и на нем лететь к Каракатице.
// - если в части 1-1 игрок ушел с орбиты и приземлился до истечения таймера, можно попытаться
// вернуть историю в русло, запустив аналогичный корабль на 3 места, с этими же героями
// - если игрок немного пролетел в части 1-2 (кончилось топливо, ушел с орбиты и приземлился) но
// герои выжили - пока не истек дедлайн, можно запустить аналогичный корабль с этими же героями
// - если игрок разбил корабль об станцию, или разбил станцию, это крах) Абсолютный крах, потому что
// миссия 2 провалится (смерть кербала), автопримется заново и тут же снова провалится.
// И так без конца, заливая всю орбиту новыми экземлярами станции, уводя деньги и репутацию в --.
// понятия не имею как чинить, тут только загрузка поможет.
// - если игрок начал отвинчивать и проклятая слизь улетела, это небольшой крах. Можно срочно
// привезти на отдельном корабле слизь, дрель из КИС, и что захотите, чтобы выполнилось условие.
// Или загрузить сохранение до отвинчивания. Ну нет автосейва по скрипту, увы.

// Краткий сюжет 3-й миссии:
// 1. ЦУП дает задание посетить обе луны, в любой последовательности.
// Корабль ловит сигнал СОС с орбиты Муны, и маршрут становится определенным - Кербин-Муна.
// На орбите Муны генерируется капсула с отшельником и его дроидом-Тузиком,
// с небольшим запасом топлива и док-портом, без двигателей.
// ахтунг! из 3600 истрачено 850+450 на маневры. После стыковки масса увеличится, и ...
// 2. Основная последовательность:
// Выйти на орбиту Муны.
//		тут делаем уборку - удаляем станцию Каракатица и обломки от 1-й миссии, если найдем
// Перехватить капсулу отшельника.
// Перелить топливо себе.
// Построить маневр Муна-Минмус, любыми вариантами
// (прямой трансфер в подходящем окне или уход на орбиту Кербина и перехват Минмуса)
// Достичь Минмуса и выйти на низкую орбиту.
// Приземлиться в указанной точке.
// Сбросить капсулу с пассажиром.
// 3. Вторая задача:
// Выгулять ровер-Тузик до заданной точки.
// Открутить от капсулы малый док-порт, а от Тузика термометр.
// Уйти на низкую орбиту Минмуса.
//
// 3а. Третья развлекуха:
// ЦУП на связи, полеты засчитаны, отправляйтесь на станцию Минмуса для заправки.
// станция создается из файла.
// Сблизиться со станцией.
// Обнаруживаем что у станции малые док-порты.
// Инженер откручивает док-порт, прикручивает малый.
// Стыковка.
// Повышение уровней (орбита Муны+посадка на Минмус - это 2я звезда!)
// Конец 3-й миссии.

// 4-я миссия.
// 1. Компьютер станции предлагает забрать ЗАХВАТ, приделанный к станции док-портом.
// Захват имеет внутреннее имя Б3ДА, и перекрывает название корабля (хе-хе)
// ЦУП заносит в реестр новый позывной, и теперь наш корабль официально БЗДА.
// ЦУП просит обследовать остатки разрушенного корабля на орбите Муны,
// забрать оборудование и разместить его на поверхности Муны.
// Док-порта на корабле нет, зато у нас есть клешня.
// 2. Основная последовательность:
// Перейти на орбиту Муны с орбиты Минмуса.
//		тут делаем уборку: удаляем капсулу предыдущего пассажира и тузика
// Перехватить корабль.
// Захватить его клешней.
// Забрать блок управления, квадрадуру и солнечную панель. Вместе с шкафчиком.
// По желанию забрать посадочные опоры и прикрутить себе.
// Заправиться топливом, сколько есть.
// Совершить посадку на Муну
// Разместить научное оборудование и поставить флаг.
// Выйти на орбиту Муны, получить координаты контейнера с топливом.
// Перехватить контейнер клешней и заправиться.
// ЦУП предлагает убрать посадочные опоры - посадок больше не планируется.

// Миссия 5а: для полетов нам нужна станция-ретранслятор в системах Дюны и Евы. Запустите зонды
// с ретрансляторами минимум на 15Г и оставьте их на высоких орбитах Евы и Дюны.

// 5-я миссия.
// 1. ЦУП предлагает обследовать ЛЮБОЙ астероид (доклад ЕВА и образец астероида).
// Очевидно, нужна станция слежения 3-й уровень (астероиды) и научный отдел 2-го (образцы)
// Основная последовательность:
// Выйти за СТ Кербина
//		тут делаем уборку: удаляем разрушенный корабль и бак с топливом из предыдущей
//		Удаляется станция на орбите Минмуса (потом создадим заново с полным запасом топлива).
// Собрать данные с орбиты Солнца
// Подлететь к ЛЮБОМУ астероиду на наш выбор
// Сделать доклад экипажа, отчет ЕВА, и любые доступные эксперименты. Взять образец грунта.
// Вернуться на низкую орбиту Кербина.
// Здесь мы стыкуемся с спускаемой капсулой
// 2. Дебрис забирает научные данные и переносит в капсулу.
// Дебрис отправляется на Кербин, вернуть данные в ЦУП.

// 6-я миссия. Воссоединение экипажа.
// Игроку надо построить корабль и доставить Дебрис назад на орбиту. Полная свобода самовыражения.
// Параллельная миссия - вывести станцию с лабораторией и запасом топлива в 2000 единиц +окислитель.
// Перехват цели, стыковка.
// Пересаживание Дебрис и слив топлива на Победу.
// ЦУП предлагает отстыковать клешню
// Победа летит к новой станции, поднимает уровни экипажа
// (посадки Муна-Минмус + орбита Солнца - 3 звезды!) и до-заправляется топливом.
//		станция на орбите Минмуса создается заново с полным запасом топлива.
// Следующая цель - пролет Дюны и возвращение.
// Цуп предлагает убрать все лишнее кроме научных приборов (т.е. лишний док-порт, балки и прочее)


// 7я миссия. Войдя в СТ Дюны, Фукс предлагает приземлиться на Айк.
// топлива на возвращение не хватит (скорее всего)
// ЦУП приказывает остаться на орбите Айка, чтобы не ловить корабль на солнечной орбите.
// Хотелось бы вилку - вернутся на Кербин ИЛИ ждать заправки в системе Дюны в зависимости от
// доступной dV в данный момент. Время на миссию - 7 лет.
// 		8я миссия (необязательная).
// 	Игроку предлагается сделать ракету-заправщик для доставки топлива Победе на орбиту Дюны.
// 	после прибытия состыковать корабли и заправить победу. Учтите что дальность связи исключительная
//
// Победа строит маневр возвращения домой, оттормаживается и капсула приземляется на Кербин.
// Наши герои в отряде, Победы больше нет, но начинается новая миссия!
// 9. Постройте корабль с запасом топлива (более 4500dV на финальной ступени) для полетов
// Мохо-Ева. Требования - экипаж 3 места, кербалы Христофор, Дебрис и Фукс.
// внешний вид, наличие оборудования - полностью на усмотрение игрока. Очевидно, что это будут
// честные атомные или жидкостные двигатели, ионные не утянут.
// 
// Игроку предлагается дозаправится на любой из станций и отправится к Мохо в удобном окне
// Дальше не придумал, зато в середине будет добавочка, пассажир с Минмуса еще пригодится!