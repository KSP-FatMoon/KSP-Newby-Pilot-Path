			hideChildren = true
			title = Ученый со звездой
		}
	}
	// =================================================================
	// Переговоры на станции
	// =================================================================
	BEHAVIOUR
	{
		name = DialogBoxF2
		type = DialogBox

		DIALOG_BOX
		{
			name = MiscDialog3b
			condition = PARAMETER_COMPLETED
			parameter = TrainingPhase
			
			title = ПЕРЕГОВОРЫ ЭКИПАЖА
			position = RIGHT
			
			KERBAL
			{
				characterName = Христофор Керман
				showName = true
				animation = true_thumbsUp
			}
			TEXT
			{
				text = Дебрис, балка нам не нужна. А вот слизь открути, Фукс эксперименты ставить будет. Астрономические. Или гастрономические, это как пойдет.\n И надо слить топливо - нам пригодится, а тут оно больше не нужно.\n И маневровые движки у нас слабоваты... может позаимствовать? Впрочем, нам на них не летать, а для маневров хватит. А еще я в шкафу ремкомплект видел - ну да не мне тебя учить
			}
		}
	}
	// =================================================================
	// Группа параметров - 3. Эвакуация
	// Перед откручиванием надо сохраниться... иначе можно попасть)
	// Надеюсь, игрок знает, что баки нельзя прикрутить (даже пустые - взрыв будет. Только дрелью)
	// =================================================================
	PARAMETER
	{
		name = EvacuationPhase
		type = VesselParameterGroup
		vessel = @/vesselName
		title = Осмотрите станцию, заберите инвентарь и открутите ценные приборы. Переместите Фукса в капсулу Победы, перелейте топливо (и монотопливо!) и отстыкуйтесь. Можете прихватить все, что понравилось, если оно откручивается и прикручивается.
		//hideChildren = true
		// игрок может утащить:
		// - Батарею на 400, если жадность одолеет (но зачем?)
		// - бак со слизью, потому что я так сказал. Понятия не имею зачем, науку собирать!
		// - второй док-порт (но зачем? Он такой же, лишний вес)
		// - солнечную панель Гигантор (польза сомнительна, но на здоровье)
		// - там торчит магнетометр. Ну по логике разграбления, вполне можно ;) 
		// - шкафчик на 3 места инвентаря. Хм. Я бы взял)))
