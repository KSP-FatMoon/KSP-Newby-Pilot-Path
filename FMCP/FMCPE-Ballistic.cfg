		notes = Посмотрите на настройки парашюта. Одна из них - площадь раскрытия купола (1-10, по умолчанию 7). Для мягкой посадки спускаемый на парашюте аппарат должен коснуться земли на скорости, не превышающей прочность детали. Обычно 7 м/с и ниже достаточно. Проверьте массу того, что будет приземляться, в ЦВС - нужен минимум 1 парашют с площадью более 20 (настроенный на максимальное раскрытие 10) на каждые 3т массы. Если масса на границе возможностей - приземляйтесь на воду. Это смягчит момент столкновения, даже если скорость при посадке будет 9 м/с или чуть выше. Если масса спускаемой ступени меньше тонны - даже маленькие тормозные парашюты вполне подойдут для безопасного спуска.
