// Ballistic launches. Get some experience launching unmanned easy rockets without maneuvres
// ...and freely destroy some by impact or temperature!
//
// *** Ballistic launches pre-req
CONTRACT_TYPE
{
	name = Ballistic0
	title = Баллистические ракеты - 0: Начать баллистические запуски!
	genericTitle = Баллистические ракеты 0
	group = FMCP_Ballistic		//FMCP_Ballistic
	
	sortKey = 200
	synopsis = Получите набор экспериментальных деталей для вашей космической программы. Модули беспилотного управления, маленькие парашюты, обтекатель, аэродинамический нос, и прочие приятные мелочи.
	description = Для запуска баллистических ракет нужны детали. Главное - беспилотное управление, мы же не можем рисковать нашими кербонавтами? Поэтому будем запускать бездушные железяки, пока не поймем, как безопасно отправить в космос живое существо. Вы справитесь, мы в вас верим! Баллистические ракеты - это просто. Берете беспилотный модуль, закрываете его обтекателем (чтобы не сгорел при взлете), выбираете подходящий двигатель (рекомендуем твердотопливные - они дешевые, а ракеты будут разбиваться). Если надо вернуть блок назад на Кербин - ставьте разделитель и парашют. А чтобы ракета не кувыркалась, используйте дополнительный гиродин или маленькие стабилизаторы. Даже наш директор (по совместительству дворник) в детстве запускал фейерверки - а это тоже самое, только чуть побольше.

	completedMessage = Теперь у нас есть всё необходимое!
	
	maxCompletions = 1
	cancellable = false
	declinable = true
	prestige = Trivial
	rewardScience = 0
	rewardReputation = 0
	rewardFunds = 0.0
	advanceFunds = 0.0

	BEHAVIOUR
	{
		name = ExperimentalPart
		type = ExperimentalPart			//for pure stock if no mods like Tantares, CRE
										//or any unmanned-before-manned
		part = probeCoreSphere_v2		//no SAS Stayputnik
		part = probeCoreOcto_v2			//OCTO
		part = HeatShield0				//0.625 heat shield
		part = HeatShield1				//1.25 heat shield
		part = fairingSize1				//1.25 fairing
		part = sasModule				//0.625 SAS stabilizer
		part = noseCone					//aerodinamic nose cone 1.25
		part = radialDrogue				//stock radial drogueshute quite enough for small probes
		part = solidBooster1-1			//SFB hammer
		part = Decoupler_0				//0.625 TD-06
		part = Decoupler_1				//1.25 TD-12
		part = solidBooster_v2			//more SFB!
		unlockCriteria = CONTRACT_ACCEPTANCE
		lockCriteria = DO_NOT_LOCK
	}
	PARAMETER
	{
		name = Timer
		type = Timer
		duration = 1s
		timerType = CONTRACT_ACCEPTANCE	
		failContract = false
	}
	REQUIREMENT
	{
		name = FirstLaunch
		type = FirstLaunch
	}
}
