			disableOnStateChange = false
		}
		PARAMETER
		{
			name = FourScienceExperiments
			type = PartValidation
			partModule = ModuleScienceExperiment
			minCount = 4
			hideChildren = true
			title = Требуется наличие минимум 4 модулей для научных экспериментов, по вашему выбору (включая доклад экипажа из кабины)...
		}
		PARAMETER
		{
			name = CriticalExperiments
			type = PartValidation
			part = science_module
			//part = GooExperiment
