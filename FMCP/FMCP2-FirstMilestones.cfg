// *** Crewed orbit
CONTRACT_TYPE
{
	name = FMCP12
	title = Первый кербал на орбите
	genericTitle = Первый кербал на орбите
	group = FMCP
	
	sortKey = 21
	
	description = Теперь, когда мы умеем выводить на орбиту хоть что-то, настало время отправить туда живого кербала. Все тесты пройдены, скафандр в порядке, двигатели выдают нужную тягу. Чтобы нам не говорили потом, что орбитальный полет ничем не отличается от суб-орбитального, оставайтесь на орбите 3 дня! Запасов воздуха и еды должно хватить. Не старайтесь объять необъятное - в плане полета только орбита, 3 дня, и возвращение астронавта домой невредимым. Не рекомендуем выходить в космос - технологии шлюзов не испытаны, может не хватить кислорода после разгерметизации кабины. Просто вернитесь живым!
	synopsis = Отправьте на орбиту астронавта на 3 дня. Оптимальная орбита - не выше 120 км.
	notes = Сохраняйте положение на орбите и наличие экипажа в кабине все 3 дня, до выполнения задания. Вам понадобится 1 кербал, 1 кабина, парашют, топливо и двигатель. Достигнув орбиты, воспользуйтесь технологией "ускорения времени"ТМ - иначе это будет очень долгое ожидание. Не рекомендуем орбиту выше 120-150 км: неизвестно, сколько топлива потребуется для возврата, и с какой скоростью будет падать капсула с такой высоты. На всякий случай, добавьте термо-щит.
	completedMessage = Первый кербал на орбите, длительное время! Все в восторге. Научный отдел требует повторить, но уже с выходом в открытый космос.
    //minExpiry = 0
    //maxExpiry = 0
	//deadline = 0
    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Exceptional
	rewardScience = 15
	rewardReputation = 25
	rewardFunds = 62500.00
	//failureReputation = 0.0
	//failureFunds = 0.0
	advanceFunds = 7500.0

	PARAMETER
	{
		name = FirstCrewedOrbit
		type = VesselParameterGroup
		title = Отправить на орбиту астронавта (на 3 дня).
	
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Должен быть новый корабль
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж минимум 1 астронавт
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Выйти на орбиту (@targetBody)
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = StayOn
			type = Duration
			duration = 3d
			preWaitText = Ожидаем устойчивой орбиты
			waitingText = Оставайтесь на орбите еще		// в течении @duration
			completionText = Готово! можете возвращаться домой.
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Вернуться на Кербин
			hideChildren = true
			completeInSequence = true
		}
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP11
	}
}
// *** EVA on low orbit
CONTRACT_TYPE
{
	name = FMCP13
    group = FMCP
    title = Выход в открытый космос и наблюдения
	genericTitle = EVA на орбите
	
	sortKey = 22

    description = Цель миссии - испытания скафандра на низкой орбите Кербина. Да-да, вам придется выйти из надежной капсулы в открытый космос и доложить об обстановке. Возможно, не один раз: наши ученые предполагают наличие "биомов", постарайтесь осмотреть несколько - побережья, воды, равнины, пустыни и горы. Это не последняя орбита вокруг Кербина, ничего страшного, если что-то упустите. В экипаже должно быть 2 астронавта - один выходит, второй внутри, управляет кораблем. Время на орбите не ограничиваем, но думаем, одного-двух витков будет достаточно. И сразу назад, мы внизу ждем экипаж с ценными данными, фотографиями и селфи на фоне Кербина. Научный отдел предлагает использовать антенну для немедленной передачи результатов, но смотрите по обстоятельствам - хватит ли энергии?
	
    synopsis = Запустить новый корабль, с экипажем минимум 2 кербала, на низкую орбиту (не выше 300км в апоцентре). Выполнить выход в открытый космос и доложить результаты наблюдений (желательно - хотя бы для 2х биомов). Передать (если возможно) данные в ЦУП. Вернуть экипаж и оставшиеся данные.
		
    completedMessage = Наши поздравления! Аж дух захватывает...
	
