// Фактически, экипаж на этой станции вообще не нужен. Если игрок вывел другую станцию... ну что же, доставит туда новую команду!
// Поэтому 19-я миссия будет крайне простой:
// вернуть весь экипаж домой, прихватив результаты экспериментов (Малый научный модуль SC-9001 - зря что ли его вытащили на орбиту?)
// Естественно, придется искать "совместимую" станцию, имеющую этот модуль. Если все выполнялось честно - первая совместима.
CONTRACT_TYPE
{
	name = FMCP19
    group = FMCP_SpaceStations
    title = Возвращение экспериментов и экипажа домой 
	
	sortKey = 03
	
    description = Мы подумали и решили, что программа испытаний выполнена! Станция остается, ее можно использовать для любых целей - например, для заправки любого корабля по вашему желанию, зря что ли выводили бочки с топливом? Или в дальнейшем расширите ее новыми модулями - лабораторией, или перерабатывающим заводом? А пока - верните весь экипаж на Кербин, и не забудьте захватить результаты экспериментов! Соберите данные из Малого научного модуля SC-9001, сохраните их в капсулу возвращаемого модуля, отстыкуйтесь и сойдите с орбиты. Ждем всех внизу!
	
    synopsis = Вернуть весь экипаж (поименно!) домой, не забыв результаты исследования материалов низко в космосе.
	
    completedMessage = Отлично, наши космонавты готовы к новым заданиям. Вы получили ценный опыт, а наш научный отдел - новые данные с орбиты. Надеемся, оно того стоило...
	
    maxCompletions = 1
	// миссия остается предлагаемой пока не выполнится 1 раз, но есть возможность отклонить ее или отменить.
	// Почему? потому что на орбите может не быть станции с SC-9001. Или игрок случайно разберет ее. Превратит в корабль, и т.д.
	// Мы же ожидаем станцию на орбите Кербина, экипаж 3 или больше, и наличие этого самого SC-9001.
    cancellable = true
    declinable = true
	
    targetBody = HomeWorld()
    
    rewardScience = 3
    rewardReputation = 10
    rewardFunds = 55000
	
    advanceFunds = 7500
	
	prestige = Significant
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP18
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/stations.Count()>0
		title = на орбите Кербина должна быть хотя бы 1 станция с экипажем 3 или больше, и малым научным модулем на борту.
	}
	DATA
	{
		type = AvailablePart
		sciSC = AvailablePart(science_module)
		hidden = true
	}
	DATA
	{
		type = List<Vessel>
		requiredValue = false
		stations = AllVessels().Where(v => (v.VesselType() == Station)&&(v.CelestialBody() == @/targetBody)&&(v.Parts().Contains(@/sciSC))&&(v.CrewCount() >= 3))
		hidden = true
	}
	DATA
	{
		type = Vessel
		spaceStation = @/stations.First()
		hidden = true
		// если вдруг что-то произошло со станцией, ошибки сборки, или перетасовка - задание замрет
		// пока не появится хотя бы 1 станция с экипажем 3 и научным модулем SC-9001. Чтобы было выполнимым
	}
	DATA
	{
		type = List<Kerbal>
		allCrew = @/spaceStation.Crew()
		hidden = true
	}
	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		experiment = mobileMaterialsLab
		situation = InSpaceLow
		recoveryMethod = Recover
		title = Проведите @experiment на орбите (низко в космосе) и верните результаты (заберите из научного модуля и сохраните в возвращаемой капсуле)
		hideChildren = true
	}
	PARAMETER
	{
		// понятия не имею, как работает эта конструкция, если экипаж возвращается не одновременно все вместе.
		// поэтому разобьем на несколько параметров, позволяющих точно возвращать вместе, или по одному, или в любых комбинациях
		name = RecoverCrew
		type = RecoverKerbal
		kerbal = @ikerbal
		ITERATOR
		{
			type = Kerbal
			ikerbal = @/allCrew
		}
		title = Верните @ikerbal домой!
		hideChildren = true
	}
}