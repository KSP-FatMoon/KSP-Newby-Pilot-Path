// *************************** Rendezvous
CONTRACT_TYPE
{
	name = FMCP15
    group = FMCP		//FMCP_Milestones
    title = Встречи в космосе
	genericTitle = Сближение
	
	sortKey = 24
	
    synopsis = Выполните маневр сближения с другим кораблем в космосе.
	
    description = План выглядит сложным, но вы должны справится. Мы хотим, чтобы вы сблизились с другим кораблем. На орбите. Да, безумная скорость выше 2000 м/с - но если оба корабля на одной орбите, то скорость относительно друг друга может быть и 0! Именно это вам и предстоит сделать. Запустите корабль с экипажем (минимум 1 кербонавт, рекомендуем выбрать опытного пилота для уверенных маневров), выведите его на орбиту и... окей, возможно вам надо вывести 2 корабля, как минимум 1 из них - с 1 пилотом? Или выберите для цели сближения наш спутник, если он еще летает. Займите орбиту, отличную от орбиты цели (выше или ниже), создайте маневр, переводящий ваш корабль на орбиту цели, и выберите время для маневра. В какой-то момент наш компьютер предскажет оптимальный момент - когда в точке пересечения появятся маркеры сближения, неподалеку друг от друга. \n Вам останется только выполнить маневр в нужное время, и погасить скорость относительно цели в точке сближения. Думаем, по космическим меркам 1 км и меньше уже точно можно считать встречей. Техники рекомендуют поставить маневровые двигатели, чтобы изменять скорость более точно.
	
    completedMessage = Полностью подтвердили наши рассчеты - два корабля могут встретится, несмотря на высокую скорость!
	
    //minExpiry = 0
    //maxExpiry = 0
    maxCompletions = 1
	
    cancellable = false
    declinable = false
	
    targetBody = HomeWorld()
    
	// REWARDS
    rewardScience = 5
    rewardReputation = 10
    rewardFunds = 25000
	
    advanceFunds = 5000
	
	prestige = Significant
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP13
		//title = Complete @contractType Contract
	}
	PARAMETER
	{
		name = Rendezvous
		type = VesselParameterGroup
		title = Первое сближение
		define = Rendezvous
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустите новый корабль
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Минимум с 1 кербалом на борту
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Orbit @targetBody
