// First Milestones: satellite, crewed orbit, EVA on orbit, high orbit. Rendezvour and docking.
// *********************************
// *** Unmanned orbit
// *********************************
CONTRACT_TYPE
{
	name = FMCP11
	title = Первый спутник
	genericTitle = Первый спутник
	group = FMCP_Milestones
	
	sortKey = 20
	
	description = Все, подброшенное вверх, рано или поздно падает вниз. Кроме тел, достигших орбитальной скорости - они не падают, а остаются вращаться вокруг планеты! Мы хотим вывести на орбиту беспилотный аппарат (кодовое название "Спутник"), и оставить на долгое время. Возможно, что и навсегда. Не гонитесь за многим - достаточно, если наш "Спутник" прослужит минут 30, прежде чем кончится заряд в батарее. Хотя, если вы сможете добавить солнечные панели, антенну и научные эксперименты - мы будем только рады.
	synopsis = Выведите на орбиту первый спутник на низкую (ниже 250км) орбиту.
	notes = Для достижения цели, приближаясь к апоцентру дуги, придайте аппарату горизонтальную скорость, достаточную для устойчивого перицентра выше 70 км
	completedMessage = Слышите "Бип-бип"? Это вокруг нашей планеты впервые полетел искусственный спутник, отличный результат!

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Exceptional
	rewardScience = 10
	rewardReputation = 15
	rewardFunds = 32500.00
	advanceFunds = 2500.0

	PARAMETER
	{
		name = FirstSat
		type = VesselParameterGroup
		title = Первый спутник
		targetBody = @/targetBody
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустите новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = Nocrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Беспилотный
			hideChildren = true
		}
		PARAMETER
		{
			name = OptionalCollectScience
			type = CollectScience
			optional = true
			title = (бонус) Передать результат научного эксперимента из космоса низко над Кербином
			situation = InSpaceLow
			recoveryMethod = Transmit
			rewardScience = 15
			rewardReputation = 10
			rewardFunds = 5000
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			disableOnStateChange = true
			title = Спутник на орбите @targetBody
			hideChildren = true
		}
		PARAMETER
		{
			name = CheckStableOrbit
			type = Duration
			duration = 5m
			preWaitText = Ожидаем устойчивой орбиты
			waitingText = Удерживать орбиту в течении 	//@duration
			completionText = Выполнено, 5 минут полет нормальный.
			disableOnStateChange = true
		}
	}
	//REQUIREMENT
	//{
	//	name = CompleteContract
	//	type = CompleteContract
	//	contractType = FMCP04
	//}
	//REQUIREMENT
	//{
	//	name = CompleteContract
	//	type = CompleteContract
	//	contractType = Ballistic5
	//}
	REQUIREMENT
	{
		name = ReachSpace
		type = ReachSpace
	}
}
// *** Crewed orbit
CONTRACT_TYPE
{
	name = FMCP12
	title = Первый кербал на орбите
	genericTitle = Первый кербал на орбите
	group = FMCP_Milestones
	
	sortKey = 21
	
	description = Теперь, когда мы умеем выводить на орбиту хоть что-то, настало время отправить туда живого кербала. Все тесты пройдены, скафандр в порядке, двигатели выдают нужную тягу. Чтобы нам не говорили потом, что орбитальный полет ничем не отличается от суб-орбитального, оставайтесь на орбите 3 дня! Запасов воздуха и еды должно хватить. Не старайтесь объять необъятное - в плане полета только орбита, 3 дня, и возвращение астронавта домой невредимым. Не рекомендуем выходить в космос - технологии шлюзов не испытаны, может не хватить кислорода после разгерметизации кабины. Просто вернитесь живым!
	synopsis = Отправьте на орбиту астронавта на 3 дня. Оптимальная орбита - не выше 120 км.
	notes = Сохраняйте положение на орбите и наличие экипажа в кабине все 3 дня, до выполнения задания. Вам понадобится 1 кербал, 1 кабина, парашют, топливо и двигатель. Достигнув орбиты, воспользуйтесь технологией "ускорения времени"ТМ - иначе это будет очень долгое ожидание. Не рекомендуем орбиту выше 120-150 км: неизвестно, сколько топлива потребуется для возврата, и с какой скоростью будет падать капсула с такой высоты. На всякий случай, добавьте термо-щит.
	completedMessage = Первый кербал на орбите, длительное время! Все в восторге. Научный отдел требует повторить, но уже с выходом в открытый космос.

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Exceptional
	rewardScience = 15
	rewardReputation = 25
	rewardFunds = 55000.00
	advanceFunds = 5000.0

	PARAMETER
	{
		name = FirstCrewedOrbit
		type = VesselParameterGroup
		title = Отправить на орбиту астронавта (на 3 дня).
		targetBody = @/targetBody
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж минимум 1 астронавт
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Выйти на орбиту (@/targetBody)
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = StayOn
			type = Duration
			duration = 3d
			preWaitText = Ожидаем устойчивой орбиты
			waitingText = Оставайтесь на орбите еще		// в течении @duration
			completionText = Готово! можете возвращаться домой.
			disableOnStateChange = true
		}
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP11
	}
}
// *** EVA on low orbit
CONTRACT_TYPE
{
	name = FMCP13
    group = FMCP_Milestones
    title = Выход в открытый космос и наблюдения
	genericTitle = EVA на орбите
	
	sortKey = 22

    description = Цель миссии - испытания скафандра на низкой орбите Кербина. Да-да, вам придется выйти из надежной капсулы в открытый космос и доложить об обстановке. Возможно, не один раз: наши ученые предполагают наличие "биомов", постарайтесь осмотреть несколько - побережья, воды, равнины, пустыни и горы. Это не последняя орбита вокруг Кербина, ничего страшного, если что-то упустите. Время на орбите не ограничиваем, но думаем, одного-двух витков будет достаточно. И сразу назад, мы внизу ждем экипаж с ценными данными, фотографиями и селфи на фоне Кербина. Научный отдел предлагает использовать антенну для немедленной передачи результатов, но смотрите по обстоятельствам - хватит ли энергии?
	
    synopsis = Запустить новый корабль с экипажем на низкую орбиту (не выше 300км в апоцентре). Выполнить выход в открытый космос и доложить результаты наблюдений (желательно - хотя бы для 2х биомов). Передать (если возможно) данные в ЦУП. Вернуть экипаж и оставшиеся данные.
	
    completedMessage = Наши поздравления! Аж дух захватывает...
	
    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Significant
    rewardScience = 10
    rewardReputation = 15
    rewardFunds = 22500
    advanceFunds = 7500
	
	// было 2 кербала в экипаже, но на данном этапе в чистом стоке не должно быть 2х-местных
	// пришлось урезать до 1, к данному моменту не факт что все за 45 исследовано.
	// А заставлять конструировать крякозябру из 2х кабин начинающего игрока - не стоит.
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP12
	}
	REQUIREMENT
	{
		name = PossibleEVA
		type = Facility
		facility = AstronautComplex
		minLevel = 2
	}
	PARAMETER
	{
		name = StartVessel
		type = VesselParameterGroup
		title = Вывести на орбиту корабль с экипажем
		targetBody = @/targetBody
		PARAMETER
		{
			name = OneCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж минимум 1 астронавт
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @/targetBody.AtmosphereAltitude()
			maxApA = @/targetBody.SpaceAltitudeThreshold()-1	//299999
			title = Достигнута низкая орбита Кербина
			//hideChildren = true
		}
	}
	PARAMETER
	{
		name = EVAReport
		type = CollectScience
		situation = InSpaceLow
		experiment = evaReport
		title = Выполнить выход в открытый космос и сделать доклад об обстановке
		hideChildren = true
		completeInSequence = true
	}
	PARAMETER
	{
		name = SuccessfulReturn
		type = VesselParameterGroup
		title = Вернуть экипаж и данные
		hideChildren=true
		PARAMETER
		{
			name = EVAReport
			type = CollectScience
			situation = InSpaceLow
			experiment = evaReport
			recoveryMethod = RecoverOrTransmit
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			hideChildren = true
			hidden = true
		}
		completeInSequence = true
	}
}
// *** Crewed high orbit
CONTRACT_TYPE
{
	name = FMCP14
    group = FMCP_Milestones
    title = Очень высокая орбита
	//genericTitle = Высоко над Кербином
	
	sortKey = 23

    description = Научный отдел хочет исследовать высокую орбиту. Это область жесткой космической радиации, не прикрытая магнитным полем Кербина. Более того, все ионы и космические лучи, отраженные магнитосферой, устраивают там буйство энергии, даже выше, чем просто где-то далеко в космосе. Мы думаем, на первый раз 1 день более чем достаточно. Запустите новый корабль, с экипажем не менее 2х кербонавтов. Выведите его на устойчивую орбиту и поднимите апоцентр и перицентр выше @/kmAltitude2 .. @/kmAltitude1 км соответственно. Но не поднимайтесь слишком высоко - надо же будет потом вернуться! Проведите эксперименты на ваше усмотрение, обязательно совершите выход в космос и сделайте доклад об обстановке с высокой орбиты. После 1 дня на орбите, возвращайтесь назад. Мы не знаем, сможет ли затормозить капсула, падая с такой высоты. Возможно, вам придется сначала снизить орбиту, и только потом спускаться домой на Кербин? На всякий случай, приготовьтесь получше - надежный корабль, хороший парашют, тепловой щит. Помните, что жизни наших астронавтов в приоритете!
	genericDescription = Доложить результаты наблюдений с высокой орбиты и вернуться домой.
    synopsis = Запустить новый корабль, с экипажем минимум 2 кербала, на высокую орбиту (выше @/kmAltitude2 км в апоцентре, с перицентром выше @/kmAltitude1). Выполнить выход в открытый космос и доложить результаты наблюдений. Передать (если возможно) данные в ЦУП. Вернуть экипаж и оставшиеся данные.
	
	// будет непросто к моменту контракта иметь капсулу на 2х кербалов...
	// поэтому выход в космос перед этим - экипаж урезан до минимум 1. А здесь оставил намеренно!
	// давайте, двигайте науку за 90, изучайте капсулу Джемини или Восход, если нет Тантареса.
	// Или соединяйте две капсулы (например кабину самолета+МК1), проявите фантазию!
	
    completedMessage = Наши поздравления! Аж дух захватывает...
	
    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Significant
    rewardScience = 10
    rewardReputation = 15
    rewardFunds = 27500
    advanceFunds = 7500

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP13
	}
	//REQUIREMENT
	//{		//Not needed: mission 13 can't be started without lvl 2 complex!
	//	name = PossibleEVA
	//	type = Facility
	//	facility = AstronautComplex
	//	minLevel = 2
	//}
	DATA
	{
		//just for show actual threshold - 300km in stock KSP
		type = double
		FMAltitude = HomeWorld().SpaceAltitudeThreshold()
		FMAltitude1 = @FMAltitude + 10000
		kmAltitude1 = @FMAltitude / 1000
		kmAltitude2 = @kmAltitude1 + 10
	}
	PARAMETER
	{
		name = StartVessel
		type = VesselParameterGroup
		title = Вывести на орбиту корабль с экипажем 2 человека
		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			maxCrew = 99
			title = Экипаж минимум 2 астронавта
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @/FMAltitude
			minApA = @/FMAltitude1
			title = Достигнута высокая орбита Кербина
			hideChildren = true
		}
		PARAMETER
		{
			name = StayOn
			type = Duration
			duration = 6h
			preWaitText = Ожидаем устойчивой орбиты
			waitingText = Оставайтесь на орбите еще	//в течении @duration
			completionText = Готово! можете возвращаться домой.
			disableOnStateChange = true
		}
	}
	PARAMETER
	{
		name = EVAReport
		type = CollectScience
		situation = InSpaceHigh
		experiment = evaReport
		title = Выполнить выход в открытый космос и сделать доклад об обстановке
		hideChildren = true
		completeInSequence = true
	}
	PARAMETER
	{
		name = SuccessfulReturn
		type = VesselParameterGroup
		title = Вернуть экипаж и данные
		hideChildren=true
		PARAMETER
		{
			name = EVAReport
			type = CollectScience
			situation = InSpaceHigh
			experiment = evaReport
			recoveryMethod = RecoverOrTransmit
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			hideChildren = true
			hidden = true
		}
		completeInSequence = true
	}
}
// *************************** Rendezvous
