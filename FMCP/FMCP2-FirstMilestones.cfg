// была мысль потребовать также количество топлива - до 2000, но для молодых пилотов это будет фрустрацией...
CONTRACT_TYPE
{
	name = FMCP18
    group = FMCP_SpaceStations
    title = Расширение космической станции и доставка экипажа
	
	sortKey = 02
	
    description = Станция - это хорошо. Но на ней должны быть наши астронавты! Доставьте на станцию минимум 3 кербала, разных профессий. Должен быть 1 пилот, 1 инженер и 1 ученый - представители всех специализаций. Ученый нужен для проведения экспериментов и восстановления их работоспособности. Инженер на всякий случай - вдруг что-то сломается? Или вы доставите на станцию новые приборы - только инженер сможет их открутить и привинтить! А пилот и так понятно - пилотировать.\n  И надо расширить нашу станцию новым модулем - добавьте места для экипажа до 8. Это не значит, что надо занять все 8 мест - зато астронавтам там будет свободнее, личный комфорт тоже важен.\n  Сделайте это в 2 полета! Пристыкованый модуль останется надолго, а транспортный корабль еще пригодится, чтобы увезти команду домой. Поэтому собирайте транспорт с рассчетом на возвращение: парашют, тепловой щит, двигатель, немного топлива чтобы сойти с орбиты. А второй модуль лучше сделать проходным, с двумя док-портами. Один для стыковки со станцией и второй для стыковки других кораблей или модулей.\n  В итоге, ожидаем следующий результат: на станции в сумме минимум 8 мест для экипажа, минимум 4 док-порта, и есть экипаж - минимум 1 пилот, 1 инженер и 1 ученый. Действуйте!
	
    synopsis = Расширьте станцию @/spaceStation вторым модулем, обеспечив 8 мест для экипажа. Доставьте на станцию как минимум 3х кербалов, чтобы был пилот, инженер и ученый. Оставьте их на 10 дней на орбите. Если станция уже удовлетворяет условиям (8 или больше мест и команда 3 или больше кербалов), переключитесь на нее, чтобы начать отсчет 10 дней.
	
    completedMessage = Отлично, первая часть программы выполнена. Мы уверенно стыкуемся на орбите, можем собрать крупную конструкцию, и разработали транспортные корабли для доставки экипажа. Теперь вернем экипаж назад, вместе с результатами экспериментов - ждите новое задание!
	
    maxCompletions = 1
	// миссия остается предлагаемой пока не выполнится 1 раз, но есть возможность отклонить ее или отменить.
	// Потому что если игрок смухлевал ранее
	//(например вывел 2 2-местных корабля с приборами и топливом, чтобы формально удовлетворить требованиям)
	// надо дать возможность собрать новую станцию, расширяемую. Возможно даже с лабораторией, если изучена
	// Так или иначе, в какой-то момент придется выполнить. Но после технологий за 160 это будет очень просто.
    cancellable = true
    declinable = true
	
    targetBody = HomeWorld()
    
    rewardScience = 5
    rewardReputation = 10
    rewardFunds = 75000
	
    advanceFunds = 15000
	
	prestige = Significant
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP17
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/stations.Count()>0
		title = на орбите Кербина должна быть хотя бы 1 станция
	}
	DATA
	{
		type = List<Vessel>
		requiredValue = false
		stations = AllVessels().Where(v => (v.VesselType() == Station)&&(v.CelestialBody() == @/targetBody))
		hidden = true
	}
	DATA
	{
		type = Vessel
		spaceStation = @/stations.First()
		hidden = true
		// если игрок вывел несколько станций, и наша была не первой... неудобненько получится.
		// НО привязываться жестко к станции из предыдущего контракта нельзя! См. пояснения по отклонению и отмене
		// жесткая привязка может дать вечно невыполнимый контракт, если что-то пойдет не так.
		// собственно я хочу подтверждения "игрок умеет выводить корабли от 6 т и более на орбиту",
		// "игрок умеет стыковаться, не случайно получилось один раз, а вполне уверенно, снова и снова"
		// "у игрока есть станция на орбите, в которую вложены средства, время и личные усилия - и ее так просто не уничтожат"
		// чтобы можно было использовать станцию в других контрактах сюжетно. Эту или другую - не суть важно. Важно чтоб была.
	}
	PARAMETER
	{
		name = CrewCheck
		type = VesselParameterGroup
		vessel = @/spaceStation
		title = Обеспечить станцию @/spaceStation экипажем: минимум 3 кербала, разных специальностей
		PARAMETER
		{
			name = HasPilot
			type = HasCrew
			trait = Pilot
			minCrew = 1
			title = В экипаже должен быть хотя бы 1 пилот
			hideChildren = true
		}
		PARAMETER
		{
			name = HasPilot
			type = HasCrew
			trait = Engineer
			minCrew = 1
			title = В экипаже должен быть хотя бы 1 инженер
			hideChildren = true
		}
		PARAMETER
		{
			name = HasPilot
			type = HasCrew
			trait = Scientist
			minCrew = 1
			title = В экипаже должен быть хотя бы 1 ученый
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = CapacityCheck
		type = VesselParameterGroup
		vessel = @/spaceStation
		title = Пристыкуйте еще 1 модуль достаточной вместимости. На станции @/spaceStation должно появиться 8 мест для экипажа и 4 стыковочных узла, включая состыкованные.
		notes = Если вы испытываете сложности с добавлением большого модуля на 4 места, пристыкуйте 2 транспортных корабля по 2 места. С экипажами - пилот и инженер, пилот и ученый. Количество стыковочных устройств, требования по вместимости и наличию экипажа - выполнятся.
		PARAMETER
		{
			name = ExtendedEight
			type = HasCrewCapacity
			title = Увеличить вместимость станции до минимум 8 мест экипажа
			minCapacity = 8
			hideChildren = true
		}
		PARAMETER
		{
			name = DockingNodes
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 4
			hideChildren = true
			title = Обеспечьте наличие минимум 4 стыковочных портов (включая состыкованные)
		}
	}
	PARAMETER
	{
		name = Duration
		type = Duration
		duration = 10d
		preWaitText = Ожидаем выполнения всех условий...
		waitingText = Сохраняйте положение на орбите и наличие экипажа еще  
		completionText = Экипаж провел 10 дней в космосе, все чувствуют себя отлично, ждут новых заданий.
