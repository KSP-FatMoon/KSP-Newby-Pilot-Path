// По факту первые достижения и стартовые задания - одна категория, надо было в один файл и одну группу. Но как сделано, так и оставлю.
CONTRACT_TYPE
{
	name = FMCP10
	title = Запустить первый спутник
	group = FMCP_Milestones
	
	sortKey = 20
	
	description = Все, подброшенное вверх, рано или поздно падает вниз. Кроме тел, достигших орбитальной скорости - они не падают, а остаются вращаться вокруг планеты! Мы хотим вывести на орбиту беспилотный аппарат (кодовое название "Спутник"), и оставить на долгое время. Возможно, что и навсегда. Не гонитесь за многим - достаточно, если наш "Спутник" прослужит минут 30, прежде чем кончится заряд в батарее. Хотя, если вы сможете добавить солнечные панели, антенну и научные эксперименты - мы будем только рады.
	synopsis = Выведите наш первый спутник на любую орбиту (выше атмосферы - иначе это будет не орбита!)
	completedMessage = Слышите "Бип-бип"? Это вокруг нашей планеты впервые полетел искусственный спутник, отличный результат!

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Exceptional
	rewardScience = 10
	rewardReputation = 15
	rewardFunds = 32500.00
	advanceFunds = 2500.0
	REQUIREMENT
	{
		name = ReachSpace
		type = ReachSpace
	}
	DATA
	{
		type = double
		SpaceAltitude = HomeWorld().AtmosphereAltitude() / 1000
	}
	PARAMETER
	{
		name = FirstSat
		type = VesselParameterGroup
		duration = 15s
		title = Вывести на орбиту беспилотный аппарат "Спутник"
		targetBody = @/targetBody
		hideChildren = true
		notes = Для достижения цели, приближаясь к апоцентру дуги, придайте аппарату горизонтальную скорость, достаточную для устойчивого перицентра выше @/SpaceAltitude км
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустите новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = Nocrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Беспилотный
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			disableOnStateChange = false
			title = Спутник на орбите @targetBody
			hideChildren = true
		}
	}
}
CONTRACT_TYPE
{
	name = FMCP11
	title = Первый кербал на орбите
	genericTitle = Первый кербал на орбите
	group = FMCP_Milestones
	
	sortKey = 21
	
	description = Теперь, когда мы умеем выводить на орбиту хоть что-то, настало время отправить туда живого кербала. Все тесты пройдены, скафандр в порядке, двигатели выдают нужную тягу. Чтобы нам не говорили потом, что орбитальный полет ничем не отличается от суб-орбитального, оставайтесь на орбите 1 день! Запасов воздуха и еды должно хватить. Не старайтесь объять необъятное - в плане полета только орбита, 1 день, и возвращение астронавта домой. Не рекомендуем выходить в космос - технологии шлюзов не испытаны, может не хватить кислорода после разгерметизации кабины. Просто вернитесь живым!
	synopsis = Отправьте на орбиту астронавта на сутки. Оптимальная орбита - не выше 120 км.
	notes = Сохраняйте положение на орбите и наличие экипажа в кабине до выполнения задания. Вам понадобится 1 кербал, 1 кабина, парашют, топливо и двигатель. Достигнув орбиты, воспользуйтесь технологией "ускорения времени"ТМ - иначе это будет очень долгое ожидание. Не рекомендуем орбиту выше 120-150 км: неизвестно, сколько топлива потребуется для возврата, и с какой скоростью будет падать капсула с такой высоты. На всякий случай, добавьте термо-щит.
	completedMessage = Первый кербал на орбите, длительное время! Все в восторге. Научный отдел требует повторить, но уже с выходом в открытый космос.

    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Exceptional
	rewardScience = 15
	rewardReputation = 25
	rewardFunds = 55000.00
	advanceFunds = 5000.0
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		parameter = FirstCrewedOrbit
		experience = 2
	}
	PARAMETER
	{
		name = FirstCrewedOrbit
		type = VesselParameterGroup
		title = Отправить на орбиту астронавта (на сутки).
		targetBody = @/targetBody
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж минимум 1 астронавт
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Выйти на орбиту Кербина
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = StayOn
			type = Duration
			duration = 1d
			preWaitText = Ожидаем достижения орбиты
			waitingText = Оставайтесь на орбите еще		// в течении @duration
			completionText = Готово! можете возвращаться домой.
			disableOnStateChange = true
		}
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP10
	}
}
// *** EVA on low orbit
CONTRACT_TYPE
{
	name = FMCP12
    group = FMCP_Milestones
    title = Испытать скафандр на орбите
	
	sortKey = 22

    description = Цель миссии - испытания скафандра на низкой орбите. Да-да, вам придется выйти из надежной капсулы в открытый космос и доложить об обстановке. Возможно, не один раз: наши ученые предполагают наличие "биомов", постарайтесь осмотреть несколько. Это не последняя орбита, ничего страшного, если что-то упустите. Думаем, что одного-двух витков будет достаточно. И сразу назад, мы внизу ждем экипаж с ценными данными и фотографиями!
	
    synopsis = Запустить новый корабль с экипажем на низкую орбиту Кербина (не выше @/kmHighSpaceAlt км в апоцентре). Выполнить выход в открытый космос и зафиксировать результаты наблюдений (желательно - хотя бы для 2х биомов). Передать (если возможно) данные в ЦУП. Вернуть экипаж и оставшиеся данные.
	
    completedMessage = Наши поздравления! Аж дух захватывает...
	
    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Significant
    rewardScience = 10
    rewardReputation = 15
    rewardFunds = 22500
    advanceFunds = 7500
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP11
	}
	REQUIREMENT
	{
		name = PossibleEVA
		type = Facility
		facility = AstronautComplex
		minLevel = 2
	}
	DATA
	{
		type = double
		SpaceAltitude = HomeWorld().AtmosphereAltitude()
		kmSpaceAlt = @SpaceAltitude / 1000
		HighSpaceAltitude = HomeWorld().SpaceAltitudeThreshold()
		kmHighSpaceAlt = @HighSpaceAltitude / 1000
	}
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		parameter = SuccessfulReturn
		experience = 2
		// если летят новые (не те кто получил бонус за первый космос), начислится +4 специального опыта (2 орбита и 2 бонус)
		// уже побывавшие на орбите будут иметь 2 за орбиту +2 бонуса
		// с бонусом за суборбитальный 2 +3 специального (будет 5 специального)
		// с бонусом за сутки на орбите 4 +2 специального (будет 6 специального)
		// собравшие все фишки должны получить +2 суборбитального, +3 орбита +2 сейчас = 7 специального опыта
	}
	PARAMETER
	{
		name = MainSequence
		type = Sequence
		title = Испытать скафандр на низкой орбите и вернуться
		PARAMETER
		{
			name = StartVessel
			type = VesselParameterGroup
			title = Вывести на орбиту корабль с экипажем
			targetBody = @/targetBody
			//define = Apparat01
			//dissassociateVesselsOnContractCompletion = true
			PARAMETER
			{
				name = OneCrew
				type = HasCrew
				minCrew = 1
				maxCrew = 99
				title = Экипаж минимум 1 астронавт
				hideChildren = true
			}
			PARAMETER
			{
				// тут скрывать нельзя. Иначе будет недоумение, если апоцентр слишком высоко
				name = Orbit
				type = Orbit
				minPeA = @/SpaceAltitude
				maxApA = @/HighSpaceAltitude-1	//249999
				title = Достигнута низкая орбита
				//hideChildren = true
			}
		}
		PARAMETER
		{
			name = EVAReport
			type = CollectScience
			situation = InSpaceLow
			experiment = evaReport
			title = Выполнить выход в открытый космос и сделать доклад об обстановке
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = SuccessfulReturn
			type = VesselParameterGroup
			title = Вернуть экипаж и данные
			hideChildren=true
			//vessel = Apparat01
			PARAMETER
			{
				name = EVAReport
				type = CollectScience
				situation = InSpaceLow
				experiment = evaReport
				recoveryMethod = RecoverOrTransmit
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = ReturnHome
				type = ReturnHome
				hideChildren = true
				hidden = true
			}
			//completeInSequence = true
		}
	}
}
// *** Crewed high orbit
CONTRACT_TYPE
{
	name = FMCP13
    group = FMCP_Milestones
    title = Очень высокая орбита
	
	sortKey = 23

    description = Научный отдел хочет исследовать высокую орбиту. Это область жесткой космической радиации, не прикрытая магнитным полем планеты. Более того, все ионы и космические лучи, отраженные магнитосферой, устраивают там буйство энергии, даже выше, чем просто где-то далеко в космосе. Мы думаем, на первый раз 2 часа более чем достаточно. Запустите новый корабль с экипажем. Выведите его на устойчивую орбиту и поднимите апоцентр и перицентр выше @/kmAltitude2 .. @/kmAltitude1 км соответственно. Но не поднимайтесь слишком высоко - надо же будет потом вернуться! Проведите эксперименты на ваше усмотрение, обязательно совершите выход в космос и сделайте доклад об обстановке с высокой орбиты. Мы не знаем, сможет ли затормозить капсула, падая с такой высоты. Возможно, вам придется сначала снизить орбиту, и только потом спускаться домой? На всякий случай, приготовьтесь получше - надежный корабль, хороший парашют, тепловой щит. Помните, что жизни наших астронавтов в приоритете!
	genericDescription = Доложить результаты наблюдений с высокой орбиты и вернуться домой.
    synopsis = Запустить новый корабль с экипажем на высокую орбиту (выше @/kmAltitude2 км в апоцентре, с перицентром выше @/kmAltitude1). Выполнить выход в открытый космос и доложить результаты наблюдений. Передать (если возможно) данные в ЦУП. Вернуть экипаж и оставшиеся данные.
	
    completedMessage = Наши поздравления! Аж дух захватывает...
	
    maxCompletions = 1
    cancellable = false
    declinable = false
    targetBody = HomeWorld()
	prestige = Significant
    rewardScience = 10
    rewardReputation = 15
    rewardFunds = 27500
    advanceFunds = 7500

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP12
	}
	DATA
	{
		type = double
		FMAltitude = HomeWorld().SpaceAltitudeThreshold()
		FMAltitude1 = @FMAltitude + 10000
		kmAltitude1 = @FMAltitude / 1000
		kmAltitude2 = @kmAltitude1 + 10
	}
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		parameter = SuccessfulReturn
		experience = 2
	}
	PARAMETER
	{
		name = MainSequence
		type = Sequence
		title = Достичь высокой орбиты, выполнить полетное задание и вернуться
		PARAMETER
		{
			name = StartVessel
			type = VesselParameterGroup
			title = Вывести на орбиту корабль с экипажем
			//dissassociateVesselsOnContractCompletion = true
			//define = Apparat01
			notes = Ожидаем орбиту с перицентром выше @/kmAltitude1 и апоцентром выше @/kmAltitude2 км
			PARAMETER
			{
				name = AnyCrew
				type = HasCrew
				minCrew = 1
				maxCrew = 99
				title = Есть экипаж
				hideChildren = true
			}
			PARAMETER
			{
				name = Orbit
				type = Orbit
				minPeA = @/FMAltitude
				minApA = @/FMAltitude1
				title = Достигнута высокая орбита
				hideChildren = true
			}
			PARAMETER
			{
				name = StayOn
				type = Duration
				duration = 2h
				preWaitText = Ожидаем устойчивой орбиты
				waitingText = Оставайтесь на орбите еще
				completionText = Готово! можете возвращаться домой.
				//disableOnStateChange = true
			}
		}
		PARAMETER
		{
			name = EVAReport
			type = CollectScience
			situation = InSpaceHigh
			experiment = evaReport
			title = Выполнить выход в открытый космос и сделать доклад об обстановке
			hideChildren = true
			//completeInSequence = true
		}
		PARAMETER
		{
			name = SuccessfulReturn
			type = VesselParameterGroup
			title = Вернуть экипаж и данные
			hideChildren=true
			//vessel = Apparat01
			PARAMETER
			{
				name = EVAReport
				type = CollectScience
				situation = InSpaceHigh
				experiment = evaReport
				recoveryMethod = RecoverOrTransmit
