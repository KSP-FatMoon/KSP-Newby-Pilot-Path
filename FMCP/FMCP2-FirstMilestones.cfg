// Хотя с модами Тантарес + SpaceStationsRedux технологии за 90 дают отличную станцию... с лабораторией!
CONTRACT_TYPE
{
	name = FMCP17
    group = FMCP_SpaceStations
    title = Первая космическая станция около Кербина
	
	sortKey = 01
	
    description = Теперь, когда вы научились стыковаться в космосе, самое время вывести станцию для долговременного нахождения на орбите Кербина. Настоящую! Мы думаем, что станцию надо выводить в несколько этапов: сначала основной модуль, беспилотный. Потом - доставка экипажа и второго модуля.\n  Конечно же, наши кербонавты не должны ютиться в тесной кабине - нужно дополнительное место, даже если экипажа будет меньше. И надо хотя бы 2 док-порта: к одному пристыкуем модуль расширения, а к второму будут стыковаться корабли снабжения и транспортные. Нужен запас топлива для дозаправки кораблей, и возможность менять орбиту в некоторых пределах - предусмотрите двигатели либо на первом, либо на втором модуле. Очень пригодится модуль с гиродином, чтобы разворачивать станцию или удерживать ее на курсе маневра. Обязательно запас электричества - станция будет на каждом витке уходить в тень Кербина, при этом все системы должны продолжать работу. И конечно солнечные панели - чтобы станция подзаряжала потраченное электричество. Антенна тоже пригодится, а еще лучше - ретранслятор! Наши станции наверняка со временем отправятся на другие планеты, и с них мы будем управлять беспилотными зондами и роверами. Понятно, что на орбите Кербина связь отличная, но тренировку никто не отменял.\n  На нашей первой станции мы проверим все идеи, в безопасной обстановке рядом с домом. И прикрепите несколько научных приборов - хотя мы можем получать данные из космоса и более легким способом, но проверить заранее, как происходит научная работа на орбите, должны. А вот парашют и тепловой щит необязательны - возвращать станцию на Кербин мы не будем. Постарайтесь сделать станцию как можно легче - вывести на орбиту 10 т намного проще, чем 25.
	// на самом деле получится около 11-13т, если выводить одним модулем. 9т топливо, и 2.5-4т все остальное
	
    synopsis = Вывести на низкую орбиту Кербина космическую станцию для долговременного пребывания. Станция должна удовлетворять всем требованиям по чеклисту ниже. Станция может состоять из одного или нескольких модулей, запущенных отдельно. Станция может быть собрана из уже находящихся на орбите аппаратов, если при этом все требования выполняются. Один из док-портов должен быть свободен для стыковки. После сборки сохраняйте положение на орбите в течении суток для проверки систем.
	
    completedMessage = Поздравляем, настоящая космическая станция! Теперь мы будем учиться расширять ее, доставлять туристов, менять экипажи - и даже подзаправляться перед полетами к другим планетам!
	
    maxCompletions = 1
	
    cancellable = false
    declinable = false
	
    targetBody = HomeWorld()
    
    rewardScience = 10
    rewardReputation = 15
    rewardFunds = 90000
	
    advanceFunds = 25000
	
	prestige = Exceptional
	
	REQUIREMENT
