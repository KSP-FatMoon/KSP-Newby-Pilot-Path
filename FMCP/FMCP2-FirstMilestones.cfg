// *************************** Docking

CONTRACT_TYPE
{
	name = FMCP16
    group = FMCP_Milestones		//FMCP_Milestones
    title = Стыковка на орбите
	genericTitle = Стыковка
	
	sortKey = 25
	
    synopsis = Запустите новый корабль с устройством стыковки (вернее, 2 новых корабля), встретьтесь в космосе, и состыкуйте один с другим.
	
    description = Убедившись, что возможно подлететь в космосе достаточно близко к другому кораблю, и при этом скорости относительно друг друга могут быть примерно как у пешехода - настало время заложить фундамент для долговременного пребывания в космосе, с дозаправкой и сменой экипажей при необходимости! То есть соединить 2 корабля в 1, прямо на орбите. Вам потребуюся док-порты, на обоих кораблях. Догоните одним кораблем другой, уравняйте скорости, сблизьтесь на 100-50 метров, развернитесь друг к другу док-портами и воспользуйтесь маневровыми двигателями для медленного сближения. Когда корабли столкнутся друг с другом, док-порты соединятся. По-крайней мере, в теории должно быть так. Только не сталкивайтесь на космической скорости - максимум 2-3м/с должно быть и достаточно, и безопасно. Инженер по безопасности предлагает скорость сближения вообще не более 0.5 м/с, смотрите по обстоятельствам.
	
    completedMessage = Теперь мы можем собрать сложный корабль, состоящий из нескольких секций: вывести их на орбиту независимо и состыковать. Да это же... это будет космическая станция!
	
    maxCompletions = 1
	
    cancellable = false
    declinable = false
	
    targetBody = HomeWorld()
    
	// REWARDS
    rewardScience = 5
    rewardReputation = 15
    rewardFunds = 35000
	
    advanceFunds = 5000
	
	prestige = Exceptional
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP15
	}
	REQUIREMENT
	{
		name = PartModuleTypeUnlocked
		type = PartModuleTypeUnlocked
		partModuleType = Dock		//RTFM. названия типов модулей перечислены в вики.
	}
	PARAMETER
	{
		name = Docking
		type = VesselParameterGroup
		title = Первая стыковка
		define = Docking
		
		PARAMETER
		{
			//да, тут нужен НОВЫЙ. А старый (после сближения), если есть док-порт, будет целью.
			name = NewVessel
			type = NewVessel
			title = Запустите новый корабль...
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = как минимум с 1 кербалом на борту
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Orbit @targetBody
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			title = ...и состыкуйтесь с другим кораблем на орбите!
			hideChildren = true
			disableOnStateChange = true
			completeInSequence = true
		}
	}
}
