// да, жестоко - удвоить вместимость экипажа. В чистом стоке станция на 4 места с технологиями за 45 и немного 90 - та еще проблема.
// Но к этому моменту как минимум должны быть открыты 2-местные капсулы 1.8 из MakingHistory (аналог капсул Gemini)
