			partModule = ModuleDeployableSolarPanel
			minCount = 1
			title = (бонус) Есть солнечные панели
			rewardFunds = 3500.0
			hideChildren = true
		}
		PARAMETER
		{
			name = OptionalCollectScience
			type = CollectScience
			optional = true
			title = (бонус) Передать результат научного эксперимента из космоса низко над Кербином
			situation = InSpaceLow
			recoveryMethod = Transmit
			rewardScience = 25
			rewardReputation = 10
			rewardFunds = 5000
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
