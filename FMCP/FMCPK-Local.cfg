		name = CraterWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Место старта в кратере
			icon = LookingFor
			targetBody = @/homePlanet
			latitude = 8.39
			longitude = -179.68
			altitude = 5.0
			hidden = true
		}
	}
	PARAMETER
