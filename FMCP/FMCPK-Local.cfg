// *** Discover CoveLaunch
CONTRACT_TYPE
{
	name = DiscoverCoveLaunchSite
	title = Секретные материалы: Лети туда не зная куда
	
	description = В старых архивах обнаружены упоминания о заброшенных (но вполне работоспособных!) стартовых площадках, кроме нашего проекта. Было бы неплохо найти их и использовать. По слухам, одна из них находится в бухте на северо-восток от нашего космического центра. Постройте самолет или быстрый вездеход и обследуйте побережье. Главное не перепутать восток и запад - к северо-западу у нас горы. Для получения награды, надо проехать рядом на расстоянии до 500м (или пролететь над найденной площадкой на высоте менее 500м).
	
	synopsis = Обнаружьте заброшенную стартовую площадку в одной из бухт.
	completedMessage = Потрясающе! Координаты площадки «Бухта» внесены в реестр Центра Полетов. Теперь эта локация официально доступна нам для запусков!

	prestige = Significant
	maxCompletions = 1
	group = FMCP_Local
	cancellable = false
	declinable = false
	
	sortKey = 1500
	
	rewardFunds = 80000.0
	rewardScience = 35.0
	rewardReputation = 15.0
	failureFunds = 5000.0

	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
	}
	// точка спрятана. Координаты = точным координатам стартовой площадки
	BEHAVIOUR
	{
		name = CoveWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Место старта в бухте
			icon = LookingFor
			targetBody = @/homePlanet
			// Точные координаты стокового Cove Launch Site
			latitude = 3.7478
			longitude = -72.2133
			altitude = 5.0
			// Прячем точку
			hidden = true
		}
	}

	// слепой поиск по индексу вейпоинта
	PARAMETER
	{
		name = VisitCove
		type = VisitWaypoint
		index = 0
		// Радиус зоны обнаружения.
		distance = 500.0
		horizontalDistance = 500.0	//default 5m - annoying for rover! let be 500 anywere!
		showMessages = true
		title = Обнаружить скрытую площадку на побережьях рядом с космическим центром (Сблизиться до 500 м)
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP21
	}
}
// *** Sink!
CONTRACT_TYPE
{
	name = Diving1
	title = Учимся нырять
	
	group = FMCP_Local
	
	sortKey = 1501
	
	description = Проще пареной репы! Мы хотим чтобы вы погрузились под воду, и пробыли там 5 минут. Никаких ограничений - хотите погружайтесь до дна, хотите - оставайтесь в плавучем состоянии. Но ниже уровня воды!
	notes = Все капсулы имеют положительную плавучесть, то есть не тонут. Вам потребуется или плавающая платформа и капсула под ней, чтобы затолкнуть капсулу под воду весом сверху. Или какой-то утяжелитель снизу, компенсирующий плавучесть - например, бак с топливом или контейнер, полный руды. Постарайтесь не топить капсулу в центре океана - нам ее потом доставать!
	synopsis = Погрузиться под воду и пробыть там 5 минут.
	completedMessage = Ну, как там было? Рыбок видели? А крабов?
	deadline = 10
	maxCompletions = 1
	cancellable = true
	declinable = true
	prestige = Trivial
	targetBody = HomeWorld()
	rewardFunds = 10000
	rewardScience = 10
	rewardReputation = 5
		PARAMETER
		{
			name = Diving!
			type = ReachState
			targetBody = @/targetBody
			situation = LANDED
			situation = SPLASHED
			maxAltitude = -1.0
			title = Погрузитесь под воду хотя бы на 1 метр
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = checkState
			type = Duration
			duration = 5m
			preWaitText = Ожидаем погружения
			waitingText = Оставайтесь под водой еще
			completionText = Готово!
			completeInSequence = true
			disableOnStateChange = true
		}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = DiscoverCoveLaunchSite
	}
}
// Погрузиться на дно
CONTRACT_TYPE
{
	name = Diving2
	title = Погрузиться до дна
	
	group = FMCP_Local
	
	sortKey = 1502
	
	description = Теперь, когда удалось первое погружение, мы хотим превратить нашего космонавта в водолаза. И исследовать именно дно! Утопите капсулу минимум с 1 кербалом на борту так, чтобы устойчиво достигнуть дна. Отсчет пойдет с момента касания, 5 минут. И соберите данные любого эксперимента - условия на дне должны отличаться от поверхности!
	notes = Если в предыдущем погружении вы могли добавить "поплавок", то теперь обойдитесь только грузом. Если прикрепить к капсуле пару малых баков с рудой, они наверняка потянут вниз! Если собираетесь ронять батискаф в воду с большой высоты, возьмите парашют побольше - аппарат получится тяжелым. И не забудьте про таймер - не всплывайте сразу, 5 минут на дне!
	synopsis = Погрузиться под воду до дна и пробыть там 5 минут.
	completedMessage = Ну, как там было? Рыбок видели? А крабов?

	deadline = 10
	maxCompletions = 1
	cancellable = true
	declinable = true
	prestige = Trivial
	targetBody = HomeWorld()
	rewardFunds = 10000
	rewardScience = 10
	rewardReputation = 5
	PARAMETER
	{
		name = hasCrew
		type = HasCrew
		minCrew = 1
		maxCrew = 99
		title = Нужна капсула с экипажем
		hideChildren = true
	}
   PARAMETER
	{
		name = Diving
		type = ReachState
		targetBody = @/targetBody
		situation = LANDED
		//situation = SPLASHED
		maxAltitude = -1.0
		title = Погрузитесь под воду и достигните дна!
		hideChildren = true
		disableOnStateChange = true
	}
	PARAMETER
	{
		name = checkState
		type = Duration
		duration = 5m
		preWaitText = Ожидаем погружения
		waitingText = Оставайтесь под водой еще
		completionText = Готово!
		completeInSequence = true
		disableOnStateChange = true
	}
	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		targetBody = @/targetBody
		situation = SrfLanded
		title = Собрать научные данные из-под воды
		recoveryMethod = RecoverOrTransmit
		//recoveryMethod = Ideal
		hideChildren = true
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Diving1
	}
}
