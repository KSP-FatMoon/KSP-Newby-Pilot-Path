}
CONTRACT_TYPE
{
	name = HistoricalPlaces
	title = Кербинские аномалии: исторические места
	description = Наверняка вы видели на беспилотных блоках опцию "КербаНет"... Если нет - посмотрите, прямо сейчас! Переключитесь на спутник или ретранслятор, и активируйте КербаНет на командном блоке. Вы увидите карту высот или биомов, и наклон поверхности. Можно задать режим обновления - например каждые 3 секунды, - или обновлять вручную. Если вы ищете конкретный биом, или плоскую площадку, или живописное место для палатки - можно поставить маркер, чтобы потом прилететь туда, с любыми целями.\n\n Беспилотные блоки имеют еще 1 параметр - шанс обнаружения аномалий! От 0 до 100%, смотря какой блок и какие условия (на поверхности, в низком полете или на орбите). Аномалии - это монолиты (как вот тот черный камень рядом с нашим центром), большие станции связи (стоящие в основном в горах). Другие места старта - как Бухта или Кратер, развалины древних пирамид или замков, артефакты инопланетных пришельцев, и все прочее, что бортовой компьютер считает выделяющимся или отличным от нормальной поверхности.\n\n В окрестностях нашего Центра наверняка увидите несколько знаков вопроса - аномальных отметок - на территории центра и на острове. И в пустыне рядом с аэродромом. Это определенно артефакты - но особые, относящиеся к древним временам на заре космической эры. На территории нашего Центра стоит мемориальная капсула MK1. В ангаре на острове - несколько деталей старого образца, давно не используемые. А в пустыне - ржавеет старый подъемник, на котором когда-то поднимались в ракету. Все это до сих пор сводит наши компьютеры с ума - вот и причина маркеров. Проведите экскурсию по всем указанным точкам (кербал в скафандре, ноги, расстояния 10-20 метров до достопримечательности).\n\n И если увлечетесь поисками аномалий, не устраивайте раскопок на рельсах, ведущих к стартовому столу!
	synopsis = Посетите исторические места, связанные с зарей космической эры
	completedMessage = Награда небольшая - но зато вы узнали чуть больше об истории покорения космоса, а это бесценно! Хотя в глубине души вы ощущаете какой-то подвох и разочарование. Кажется, что просто зря потратили время - на осмотр каких-то ржавых деталей!
	prestige = Trivial
	maxCompletions = 1
	group = FMCP_Local
	cancellable = true
	declinable = true
	targetBody = HomeWorld()
	sortKey = 1520
	rewardFunds = 20000
	rewardScience = 5
	rewardReputation = 10
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Diving2
	}
	REQUIREMENT
	{
		name = VAB3
		type = Facility
		facility = VehicleAssemblyBuilding
		minLevel = 3
		title = ЦВС должен быть уровня 3 для появления мемориальной капсулы
	}
	BEHAVIOUR
	{
		name = Waypoints
		type = WaypointGenerator
		WAYPOINT
		{
			name = Ангар на острове
			icon = eva
			targetBody = @/targetBody
			latitude = -1.529
			longitude = -71.902
			altitude = 0.0
		}
		WAYPOINT
		{
			name = Мемориал МК1
			icon = eva
			targetBody = @/targetBody
			latitude = -0.092
			longitude = -74.630
			altitude = 0.0
		}
		WAYPOINT
		{
			name = Ржавый лифт
			icon = eva
			targetBody = @/targetBody
			latitude = -6.518
			longitude = -144.016
			altitude = 0.0
		}
	}
	PARAMETER
	{
		name = Visit0
		type = All
		title = Посетить ангар со старыми деталями на острове рядом с КСЦ
		hideChildren = true
		rewardFunds = 2500
		PARAMETER
		{
