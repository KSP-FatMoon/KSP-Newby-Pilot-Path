// Сюда пойдет все, что касается Кербина и интересных заданий на планете.
// погружение под воду, посещение необычных мест, открытие стартовых площадок и подобное.
// *** Discover CoveLaunch
CONTRACT_TYPE
{
	name = DiscoverCoveLaunchSite
	title = Секретные материалы: Лети туда не зная куда
	
	description = В старых архивах обнаружены упоминания о заброшенных (но вполне работоспособных!) стартовых площадках, кроме нашего проекта. Было бы неплохо найти их и использовать. По слухам, одна из них находится в бухте на северо-восток от нашего космического центра. Постройте самолет или быстрый вездеход и обследуйте побережье. Главное не перепутать восток и запад - к северо-западу у нас горы. Для получения награды, надо проехать рядом на расстоянии до 500м (или пролететь над найденной площадкой на высоте менее 500м).
	
	synopsis = Обнаружьте заброшенную стартовую площадку в одной из бухт.
	completedMessage = Потрясающе! Координаты площадки «Бухта» внесены в реестр Центра Полетов. Теперь эта локация доступна нам для запусков!

	prestige = Significant
	maxCompletions = 1
	group = FMCP_Local
	cancellable = false
	declinable = false
	targetBody = @/homePlanet
	sortKey = 1500
	
	rewardFunds = 80000.0
	rewardScience = 35.0
	rewardReputation = 15.0
	failureFunds = 5000.0

	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
	}
	// точка спрятана. Координаты = точным координатам стартовой площадки
	BEHAVIOUR
	{
		name = CoveWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Место старта в бухте
			icon = LookingFor
			targetBody = @/homePlanet
			// Точные координаты Cove Launch Site
			latitude = 3.7478
			longitude = -72.2133
			altitude = 5.0
			// Прячем точку
			hidden = true
		}
	}
	PARAMETER
	{
		name = VisitCove
		type = VisitWaypoint
		index = 0
		// Радиус зоны обнаружения.
		distance = 500.0
		horizontalDistance = 500.0	//default 5m - annoying for rover! let be 500 anywere!
		showMessages = true
		title = Обнаружить скрытую площадку на побережьях рядом с космическим центром (Сблизиться до 500 м)
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FMCP20
	}
}
// *** Sink!
CONTRACT_TYPE
{
	name = Diving1
	title = Учимся нырять
	
	group = FMCP_Local
	
	sortKey = 1501
	
	description = Проще пареной репы! Мы хотим чтобы вы погрузились под воду, и пробыли там 5 минут. Никаких ограничений - хотите погружайтесь до дна, хотите - оставайтесь в плавучем состоянии. Но ниже уровня воды! Место старта "Бухта" идеально для отправки в воду ровера - мы не требуем пытаться утопить именно капсулу, можете попробовать для начала беспилотный ровер или зонд.
	notes = Капсулы имеют положительную плавучесть, то есть не тонут. Вам потребуется или плавающая платформа и капсула под ней, или какой-то утяжелитель, компенсирующий плавучесть - например, бак с топливом или контейнер, полный руды. Беспилотные блоки обычно без пустот и могут тонуть без дополнительных ухищрений. Постарайтесь не топить аппарат в центре океана - нам его потом доставать!
	synopsis = Погрузиться под воду и пробыть там 5 минут.
	completedMessage = Погружение зарегистрировано!
	deadline = 10
	maxCompletions = 1
	cancellable = true
	declinable = true
	prestige = Trivial
	targetBody = HomeWorld()
	rewardFunds = 10000
	rewardScience = 10
	rewardReputation = 5
		PARAMETER
		{
			name = Diving!
			type = ReachState
			targetBody = @/targetBody
			situation = LANDED
			situation = SPLASHED
			maxAltitude = -1.0
			title = Погрузитесь под воду хотя бы на 1 метр
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = checkState
			type = Duration
			duration = 5m
			preWaitText = Ожидаем погружения
			waitingText = Оставайтесь под водой еще
			completionText = Готово!
			completeInSequence = true
			disableOnStateChange = true
		}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = DiscoverCoveLaunchSite
	}
}
// Погрузиться на дно
CONTRACT_TYPE
{
	name = Diving2
	title = Погрузиться до дна
	
	group = FMCP_Local
	
	sortKey = 1502
	
	description = Теперь, когда удалось первое погружение, мы хотим превратить нашего космонавта в водолаза. И исследовать именно дно! Утопите капсулу минимум с 1 кербалом на борту так, чтобы устойчиво достигнуть дна. Отсчет пойдет с момента касания, 5 минут. И соберите данные любого эксперимента - условия на дне должны отличаться от поверхности! Представьте себе доклад "Приземлен в биоме воды Кербина" - Да его в рамку можно будет вешать, такая редкость!
	notes = Если в предыдущем погружении вы могли добавить "поплавок", то теперь обойдитесь только грузом. Если прикрепить к капсуле пару малых баков с рудой, они наверняка потянут вниз! Если собираетесь ронять батискаф в воду с большой высоты, возьмите парашют побольше - аппарат получится тяжелым. И не забудьте про таймер - не всплывайте сразу, 5 минут на дне!
	synopsis = Погрузиться под воду до дна и пробыть там 5 минут.
	completedMessage = Ну, как там было? Рыбок видели? А крабов?

	deadline = 10
	maxCompletions = 1
	cancellable = true
	declinable = true
	prestige = Trivial
	targetBody = HomeWorld()
	rewardFunds = 10000
	rewardScience = 10
	rewardReputation = 5
	PARAMETER
	{
		name = hasCrew
		type = HasCrew
		minCrew = 1
		maxCrew = 99
		title = Нужна капсула с экипажем
		hideChildren = true
	}
   PARAMETER
	{
		name = Diving
		type = ReachState
		targetBody = @/targetBody
		situation = LANDED
		//situation = SPLASHED
		maxAltitude = -1.0
		title = Погрузитесь под воду и достигните дна!
		hideChildren = true
		disableOnStateChange = true
	}
	PARAMETER
	{
		name = checkState
		type = Duration
		duration = 5m
		preWaitText = Ожидаем погружения
		waitingText = Оставайтесь под водой еще
		completionText = Готово!
		completeInSequence = true
		disableOnStateChange = true
	}
	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		targetBody = @/targetBody
		situation = SrfLanded
		title = Собрать научные данные из-под воды
		recoveryMethod = RecoverOrTransmit
		//recoveryMethod = Ideal
		hideChildren = true
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Diving1
	}
}
// *** Discover Crater Launch Site
CONTRACT_TYPE
{
	name = DiscoverCraterLaunch
	title = Секретные материалы: Лети туда не зная куда - 2
	
	description = В старых архивах обнаружены упоминания о заброшенных (но вполне работоспособных!) стартовых площадках, кроме нашего проекта. Было бы неплохо найти их и использовать. Еще одна площадка должна быть в центре Кратера. Вы видели кратер? Он у нас один, почти на экваторе, с обратной от космического центра стороны планеты. Здоровенная круглая яма в океане, да. И горы по периметру. В центре находится островок, там и должна быть еще одна стартовая площадка! Для получения награды, надо оказаться рядом на расстоянии до 500м (или пролететь над найденной площадкой на высоте менее 500м). Как лететь? Да проще некуда - стартуете с взлетной полосы в пустыне, до кратера менее получаса полета.
	
	synopsis = Обнаружьте заброшенную стартовую площадку на острове в центре Кратера.
	completedMessage = Потрясающе! Координаты места старта в кратере внесены в реестр Центра Полетов. Теперь эта локация доступна нам для запусков!

	prestige = Significant
	maxCompletions = 1
	group = FMCP_Local
	cancellable = false
	declinable = false
	targetBody = @/homePlanet
	sortKey = 1503
	
	rewardFunds = 80000.0
	rewardScience = 35.0
	rewardReputation = 15.0
	failureFunds = 5000.0

	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
	}
	BEHAVIOUR
	{
		name = CraterWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Место старта в кратере
			icon = LookingFor
			targetBody = @/homePlanet
			// Точные координаты
			latitude = 8.39
			longitude = -179.68
			altitude = 5.0
			// Прячем точку
			hidden = true
		}
	}
	PARAMETER
	{
		name = VisitCrater
		type = VisitWaypoint
		index = 0
		// Радиус зоны обнаружения.
		distance = 500.0
		horizontalDistance = 500.0
		showMessages = true
		title = Обнаружить скрытую площадку на островке в центре Кратера (Сблизиться до 500 м)
		//сближение на самолете намного проще неконтролируемого падения! можно даже 250 м задавать
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Diving2
	}
}
CONTRACT_TYPE
{
	name = KSCPerfectLanding
	title = Исключительно точная посадка
	
	description = Настало время доказать свое мастерство пилотирования: приземлитесь с орбиты на стартовую площадку! Да, она маленькая. Поэтому облегчим задачу: приземлитесь в круг с радиусом 2000 м, с центром на стартовой площадке. Круг диаметром 4 км! \n\n Но обязательно с орбиты - из обычного атмосферного полета это сделать слишком просто. Запустите новый аппарат или используйте любой уже имеющийся - но сначала орбита, потом спуск и приземление не далее 2000 м от стартовой площадки нашего центра.
	
	synopsis = Сойти с орбиты и приземлиться в КСЦ не дальше чем 2000м от стартовой площадки
	completedMessage = Потрясающая точность! А прямо на стартовую сможете?
	
	prestige = Significant
	maxCompletions = 1
	group = FMCP_Local
	cancellable = false
	declinable = false
	targetBody = @/homePlanet
	sortKey = 1504
	
	rewardFunds = 50000.0
	rewardScience = 0.0
	rewardReputation = 10.0
	REQUIREMENT
	{
		type = ReturnFromOrbit
		targetBody = @/homePlanet
		title = стартует после возврата с орбиты
	}
	// подсказки: космолет/космоплан. Ровер. Капсула с двигателем и запасом топлива для маневра в атмосфере.
	// Капсула с крыльями, стабилизаторами и аэро-рулями.
	// Ну и конечно точный расчет и повторные попытки методом проб и ошибок. Недолет-перелет, подбор момента зажигания.
	// хитрый способ: лететь в кресле - раскрытый личный парашют прекрасно работает в кресле.
	// наглый способ: прыгнуть с парашютом. Кербал-пилот считается тем же аппаратом, орбита засчитана. ТАК НЕЧЕСТНО!
	// Я не знаю способа ТОЧНОЙ посадки с орбиты в заданную точку, кроме как "на глазок" - поэтому 2000м отличный допуск.
	// Умельцы, сажающие на платформу в океане, явно не относятся к "молодым пилотам" - можете сбрасывать миссию,
	// пока не сядете на саму площадку ;) наверно там нужен keoscript или что-то подобное, вручную граничит с безумием
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
	}
	BEHAVIOUR
	{
		name = LaunchPadWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Стартовый стол Космоцентра
			icon = balloon
			targetBody = @/homePlanet
			// Точные координаты -0.097, -74.558
			latitude = -0.097
			longitude = -74.558
			altitude = 0.0
			hidden = false
		}
	}
	PARAMETER
	{
		name = mainSequence
		type = VesselParameterGroup
		title = Спуститесь с орбиты Кербина в заданную точку с точностью до 2000 м
		PARAMETER
		{
			name = OrbitingVessel
			type = ReachState
			situation = ORBITING
			targetBody = @/homePlanet
			title = Вывести на орбиту новый аппарат (или использовать уже имеющийся, готовый к возвращению)
			// однако ричСтейт может не взять аппарат на орбите - он срабатывает при изменении состояния! а состояние не менялось...
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = LandedVessel
			type = ReachState
			situation = LANDED
			targetBody = @/homePlanet
			title = Приземлиться на Кербин...
			hideChildren = true
			disableOnStateChange = false
			completeInSequence = true
		}
		PARAMETER
		{
			name = LandOnLaunchpad
			type = VisitWaypoint
			index = 0
			distance = 1000.0
			horizontalDistance = 2000.0
			showMessages = true
			title = ...не далее 2000 м от стартового стола нашего Космического Центра!
			disableOnStateChange = false
			completeInSequence = true
			hideChildren = true
		}
	}
}
CONTRACT_TYPE
{
	name = ReachHighestMountain
	title = Покорение Кевереста
	
	description = Знаете самую высокую точку Кербина? Это гора Кеверест, высота 6767 метров над уровнем моря. Вершина горы находится выше облаков, и вид должно быть потрясающий! Мы хотим поставить там флаг - ради престижа! Продумайте детали экспедиции и способ попасть на гору. Отправьте кербала и поставьте флаг. На самую-самую вершину!
	notes = Рассчитывайте на космолет или самолет с парашютом (ровной полосы для посадки не будет!), вертолет, вездеход или крепкие ноги отважного героя. Или комбинируйте - самолет доставляет ровер, а около цели кербал идет пешком. Можно попытаться сойти с орбиты примерно над горой, и выпрыгнуть с парашютом (но учтите, что на высоте 7000 м атмосфера разреженная). Приземление ракеты или капсулы в горах - это невыполнимая задача и ненужный риск.
	
	synopsis = Любым способом попасть на вершину Кевереста и поставить там наш флаг.
	completedMessage = Да! ДАА! Вы сделали это - наш флаг на самой высокой вершине Кербина, невероятно!
	
	prestige = Significant
	maxCompletions = 1
	group = FMCP_Local
	cancellable = false
	declinable = false
	targetBody = @/homePlanet
	sortKey = 1505
	advanceFunds = 15000.0
	rewardFunds = 75000.0
	rewardScience = 0.0
	rewardReputation = 25.0
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = DiscoverCraterLaunch
	}
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
	}
	BEHAVIOUR
	{
		name = KeverestWaypoint
		type = WaypointGenerator
		WAYPOINT
		{
			name = Гора Кеверест
			icon = balloon
			targetBody = @/homePlanet
			// Точные координаты 61.598056, 46.358889
			latitude = 61.598056
			longitude = 46.358889
			altitude = 0.0	//6767.0
			hidden = false
		}
	}
	PARAMETER
	{
		name = mainSequence
		type = VesselParameterGroup
		title = Поставить флаг на вершине самой высокой горы на Кербине
		PARAMETER
		{
			name = VesselIsType
			type = VesselIsType
			vesselType = EVA
			title = Нужен кербал (капсулы и автоматика ставить флаг не умеют)
			hideChildren = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachKeverest
			type = VisitWaypoint
			index = 0
			distance = 150.0
			horizontalDistance = 200.0
			showMessages = true
			title = Достичь вершины высочайшей горы...
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = PlantFlag
			type = PlantFlag
			title = ...и поставить на Кеверест наш флаг!
			completeInSequence = true
		}
	}
}
// вкрячу еще 2 миссии: измерить температуру и давление у храма в пустыне, и у монолита рядом с КСЦ (barometerScan и temperatureScan)
// задать без маркера ледниковое озеро и остров Махи-Махи достаточно сложно. Придется делать по видимому маркеру... Или цепочке маркеров!
// ДАА! первый маркер на центр острова или озера, второй скрытый. А направление через диалог: ищите к юго-востоку от вас
// Наука у Центра Связи (TrackingStationHub, TrackingStationDishEast, TrackingStationDishNorth, TrackingStationDishSouth, TrackingStation) (лвл2)
// посетить все стартовые площадки (IslandAirfield, DessertLaunchSite, DessertRunway, WoomerangLaunchSite, LaunchPad,Runway) и собрать образцы грунта
