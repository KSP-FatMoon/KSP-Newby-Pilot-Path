//Minmus Programm start. FlyBy, orbit, crewed orbit and EVA, landing, flag planting
//
// *** Unmanned Minmus Flyby, science and leave Kerbin SOI
CONTRACT_TYPE
{
	name = FMCP30
	group = FMCP_Muns
	
	title = Два в одном: Минмус и Солнце
	
	sortKey = 40
	
	description = Вторая луна нашей планеты - @/targetBody. Самое время дотянутся до него! Однако, мнения ученых разделились. Половина за отправку зонда за сферу влияния Кербина, вторая половина хочет исследовать @/targetBody. И мы решили совместить в одной миссии и то, и другое! Отправьте зонд к @/targetBody, передайте данные экспериментов в ЦУП, и скорректируйте траекторию так, чтобы, покинув сферу тяготения Кербина после пролета, уйти к Солнцу. Потребуется более мощная антенна - расстояния гигантские, несмотря на продвинутую станцию слежения. И конечно же, данные с орбиты Солнца нам тоже пригодятся! Зонд, антенна, приборы и солнечные панели - разрабатывайте аппарат и в полет!
	
	synopsis = Пролететь мимо @/targetBody и уйти из сферы влияния Кербина. Спутник должен иметь солнечные батареи, антенну мощностью от 2 гигаметров и любой научный прибор для сбора данных. Передать данные экспериментов из сферы влияния @/targetBody и Солнца.
	notes = Учтите, что @/targetBody не только дальше, но его орбита наклонена примерно на 6 градусов относительно экватора. Смена наклонения орбиты потребует дополнительных затрат топлива. Можете сразу построить маневр так, чтобы зонд пролетел мимо @/targetBody и ушел к Солнцу без дополнительных зажиганий. Думаем, примерно 1300 dV на все маневры должно хватить.
	completedMessage = Получив сведения о @/targetBody, все единодушно решили, что это в приоритете!
	
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().Last()
	prestige = Exceptional
	rewardScience = 15
	rewardReputation = 25
	rewardFunds = 80000
	advanceFunds = 15000
	
	REQUIREMENT
	{	//вместо привязки к предыдущим контрактам, каждую программу привяжем к достижениям карьеры
		name = SurfaceEVA
		type = SurfaceEVA
		targetBody = HomeWorld().Children().First()
		checkType = MANNED
	}
	PARAMETER
	{
		name = MinmusFlyby
		type = VesselParameterGroup
		title = Полет к @/targetBody
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустить новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = Nocrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Беспилотный
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSolarPanel
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			minCount = 1
			title = Есть солнечные панели
			hideChildren = true
		}
		PARAMETER
		{
			name = Any2GAntenna
			type = Any
			title = Может передавать данные за пределами SOI Кербина
			PARAMETER
			{
				name = HasAntenna1
				type = HasAntenna
				antennaType = RELAY				// без уточнения типа требует трансмит. То есть вилку надо описывать явно!
				minAntennaPower = 999000000.0	//(в стоке нет 1G-антенн и ретрансляторов... технически меня устроит и 1G из тантареса)
				title = Может передавать данные за пределами SOI Кербина
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = HasAntenna2
				type = HasAntenna
				antennaType = TRANSMIT
				minAntennaPower = 999000000.0
				title = Может передавать данные за пределами SOI Кербина
				hideChildren = true
				hidden = true
			}
		}
		PARAMETER
		{
			name = FlybyMinmus
			type = ReachState
			targetBody = @/targetBody	//HomeWorld().Children().First()
			title = Войти в сферу тяготения @targetBody
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			targetBody = @/targetBody	//HomeWorld().Children().First()
			recoveryMethod = Transmit
			hideChildren = true
			title = Провести любой эксперимент в СТ @targetBody и передать результаты
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = LeaveKerbin
		type = VesselParameterGroup
		title = Отправить зонд за пределы сферы влияния Кербина
		targetBody = HomeWorld().Parent()
		completeInSequence = true
		PARAMETER
		{
			name = OutThere
			type = ReachState
			targetBody = HomeWorld().Parent()
			title = Мы оторвались от Кербина и впервые оказались на орбите Солнца!
			hideChildren = true
			//disableOnStateChange = true
		}
		PARAMETER
		{
			name = SolScience
			type = CollectScience
			targetBody = HomeWorld().Parent()
			title = Передать научные данные с орбиты Солнца
			recoveryMethod = Transmit
			hideChildren = true
		}
	}
}
// *** Crewed orbit, science and return
CONTRACT_TYPE
{
	name = FMCP31
	group = FMCP_Muns
	
	title = Пилотируемая орбита Минмуса
	
	sortKey = 41
	
	description = Не будем долго тянуть, нашего опыта достаточно, чтобы сразу отправить астронавтов на орбиту @/targetBody. Запаситесь едой - полет будет долгим, рассчитывайте на 20-25 дней. План полета - выйти на высокую орбиту, провести наблюдения, понизить орбиту до 20км и осмотреть @/targetBody вблизи. Собрать как можно больше данных, и вернуться назад. Наличие антенны и передача результатов будет плюсом, но смотрите по обстоятельствам. Громадное расстояние, необходимость возвращения - лучше мы дождемся, чем перегрузить капсулу мощной антенной и остаться без энергии.
	synopsis = Выйти на орбиту @/targetBody (высокую и низкую), собрать результаты научных экспериментов и вернуться на Кербин.
	completedMessage = Отлично! А вы заметили, какой он маленький по сравнению с Муной?
	
	//minExpiry = 0
	//maxExpiry = 0
	//deadline = 0
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().Last()		//First()
	prestige = Exceptional
	rewardScience = 25
	rewardReputation = 35
	rewardFunds = 90000
	advanceFunds = 20000
	
	REQUIREMENT
	{
		name = FlybyMinmus
		type = FlyBy
		targetBody = @/targetBody
	}
	PARAMETER
	{
		name = CrewedMinmusOrbit
		type = VesselParameterGroup
		title = Полет к @/targetBody
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустить новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Экипаж минимум 1 кербал
			hideChildren = true
		}
		PARAMETER
		{
			name = HighOrbit
			type = Orbit
			targetBody = @/targetBody	//HomeWorld().Children().First()
			title = Выйти на орбиту @/targetBody
			minPeA = 9000
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			targetBody = HomeWorld().Children().Last()	//First()
			situation = InSpaceLow
			recoveryMethod = RecoverOrTransmit
			hideChildren = true
			title = Получите научные данные из космоса в сфере влияния @/targetBody
			//completeInSequence = true
		}
	}
	PARAMETER
	{
		name = ReturnHome
		type = ReturnHome
		targetBody = HomeWorld()
		title = Вернуться на Кербин
		hideChildren = true
		//completeInSequence = true
	}
}
// *** orbit relay
CONTRACT_TYPE
{
	name = FMCP32
	group = FMCP_Muns
	
	title = Ретранслятор на орбите Минмуса
	
	sortKey = 42
	
	description = Орбита @/targetBody очень далеко от нашей планеты, слабые антенны не дотягиваются. А мы наверняка отправим зонды и даже автоматические роверы - им нужна связь! Выведите на орбиту @/targetBody спутник-ретранслятор, с мощностью минимум 2G. Он не только обеспечить связь с будущими беспилотными аппаратами у @/targetBody, но и дотянется до ближайших окрестностей за сферой влияния Кербина - например, до астероидов...
	genericDescription = Вывести ретранслятор на заданную орбиту
	synopsis = Спутник должен иметь солнечные батареи и антенну-ретранслятор. Выведите его на заданную орбиту с минимальными отклонениями.
	completedMessage = Успех! Теперь наши беспилотные аппараты будут обеспечены связью.
	
	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().Last()
	prestige = Significant
	rewardScience = 5
	rewardReputation = 10
	rewardFunds = 60000
	advanceFunds = 8000
	
	REQUIREMENT
	{
		name = FlybyMinmus
		type = FlyBy
		targetBody = @/targetBody
	}
	BEHAVIOUR
	{
		name = OrbitGenerator
		type = OrbitGenerator
		RANDOM_ORBIT
		{
			targetBody = @/targetBody
			type = RANDOM
			altitudeFactor = 0.5
			inclinationFactor = 0.5
			deviationWindow = 8.0
		}
	}
	PARAMETER
	{
		name = MinmusRelay
		type = VesselParameterGroup
		title = Ретранслятор на орбите @/targetBody
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Запустить новый аппарат
			hideChildren = true
		}
		PARAMETER 
		{
			name = Nocrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Беспилотный
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSolarPanel
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			minCount = 1
			title = Есть солнечные панели
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAntenna
			type = HasAntenna
			antennaType = RELAY
			minAntennaPower = 1900000000.0		//required!
			title = Есть антенна-ретранслятор
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachSpecificOrbit
			type = ReachSpecificOrbit
			displayNotes = true
			index = 0
			deviationWindow = 8.0
			title = Вывести ретранслятор на заданную орбиту
		}
	}
}
// *** Посадка на Минмус
CONTRACT_TYPE
{
	name = FMCP33
	group = FMCP_Muns
	
	title = Пробуем Минмус на вкус
	
	sortKey = 43
	
	description = Наши наблюдения подтвердились. Гравитация @/targetBody очень незначительна, мы думаем что даже космонавт с ранцем может выйти на орбиту Минмуса, высоко подпрыгнув! А это значит, что и приземлиться очень просто. Кроме того, на @/targetBody очень много плоских пространств, без неожиданных противных склонов. Мы уверены, что после Муны опустить корабль на поверхность будет отдыхом - одним пальцем и с закрытыми глазами. И со взлетом и возвращением тоже проблем не будет. Только 20 дней на полет туда-обратно, но не волнуйтесь, запас чипсов мы пополним, от голода не умрете.\n  Планируйте и отправляйте экспедицию! Нам нужны данные с поверхности, флаг, и возвратившиеся герои. Ждем доклад экипажа и отчет об обстановке, как ранее с Муны. Вы уже знаете, что для этого нужна антенна, разберетесь. И обязательно привезите образец почвы! Ученые Кербина уже занимают очередь на его исследования.
	synopsis = Опустите корабль с экипажем на поверхность @/targetBody. Передайте доклад экипажа и отчет об остановке с поверхности. Поставьте флаг. Соберите образец почвы и верните домой капсулу с экипажем и собранный образец.
	completedMessage = Ура! Побывав на обоих спутниках, мы готовы к любым задачам в ближнем и дальнем космосе!

	maxCompletions = 1
	cancellable = false
	declinable = false
	targetBody = HomeWorld().Children().Last()
	prestige = Exceptional
	rewardScience = 25
	rewardReputation = 35
	rewardFunds = 100000
	advanceFunds = 25000
	
	REQUIREMENT
	{
		name = ReturnFromMinmus
		type = ReturnFromOrbit
		targetBody = @/targetBody
		checkType = MANNED
	}
	REQUIREMENT
	{
		name = GetSurfSampleAvailable
		type = Facility
		facility = ResearchAndDevelopment
		minLevel = 2
		title = Научно-конструкторский комплекс должен быть хотя бы 2 уровня (образцы грунта)
	}
	PARAMETER
	{
		name = MissionSequence
		type = Sequence
		title = Все должно быть выполнены на одном корабле в одной экспедиции
		PARAMETER
		{
			name = CrewedMinmusLanding
			type = VesselParameterGroup
			title = Новый корабль с экипажем должен опуститься на @/targetBody
			hideChildren = true
			define = MinmusExplorer
			PARAMETER
			{
				name = NewVessel
				type = NewVessel
				title = Запустить новый аппарат
				hideChildren = true
				hidden = true
			}
			PARAMETER 
			{
				name = HasCrew
				type = HasCrew
				minCrew = 1
				maxCrew = 99
				title = Экипаж минимум 1 кербал
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = LandOn
				type = ReachState
				targetBody = @/targetBody
				situation = LANDED
				hideChildren = true
				title = Успешная посадка на поверхность!
				hidden = true
			}
		}
		PARAMETER
		{
			name = MinmusOperations
			type = All
			title = Находясь на поверхности @/targetBody, выполните следующие действия в любом порядке:
			PARAMETER
			{
				name = CollectCrewReport
				type = CollectScience
				targetBody = HomeWorld().Children().Last()
				situation = SrfLanded
				experiment = crewReport
				recoveryMethod = Transmit
				hideChildren = true
				title = Отправить в ЦУП доклад экипажа с поверхности @/targetBody
			}
			PARAMETER
			{
				name = CollectEvaReport
				type = CollectScience
				targetBody = HomeWorld().Children().Last()
				situation = SrfLanded
				experiment = evaReport
				recoveryMethod = Transmit
				hideChildren = true
				title = Отправить в ЦУП отчет об обстановке на поверхности @/targetBody
			}
			PARAMETER
			{
				name = MinmusFlag
				type = PlantFlag
				title = Поставить флаг на @/targetBody !
				targetBody = HomeWorld().Children().Last()
			}
			PARAMETER
			{
				name = CollectSurfaceSampleVisual
				type = CollectScience
				targetBody = HomeWorld().Children().Last()
				situation = SrfLanded
				experiment = surfaceSample
				//recoveryMethod = Recover
				hideChildren = true
				title = Собрать образец почвы с поверхности @/targetBody
			}
		}
		PARAMETER
		{
			name = ReturnVessel
			type = VesselParameterGroup
			vessel = MinmusExplorer
			title = Верните аппарат, команду и образец почвы на Кербин.
			PARAMETER
			{
				name = RecoverSurfaceSample
				type = CollectScience
				targetBody = HomeWorld().Children().Last()
				situation = SrfLanded
				experiment = surfaceSample
				recoveryMethod = Recover
				hideChildren = true
				title = Соберите образец почвы с поверхности @/targetBody
				hidden = true
			}
			PARAMETER
			{
				name = ReturnHome
				type = ReturnHome
				title = Верните аппарат и результаты на Кербин
				targetBody = HomeWorld()
				hideChildren = true
				hidden = true
			}
		}
	}
}
// *** Repeated surface samples (till has any science value)
CONTRACT_TYPE
{
	name = FMCP34
	group = FMCP_Muns
	
	title = Еще один образец почвы Минмуса!
	
	sortKey = 44
	
	description = Не поверите, образцы почвы Минмуса вызывают нездоровый интерес. Ученые жаждут еще и еще. Что они там с ними делают, едят что ли? Да мне и самому нравится этот мятный цвет, так и хочется лизнуть... Кхм, о чем мы? Отправляйтесь на @/targetBody и доставьте еще 1 образец почвы, из определенного биома - на него самый большой спрос.
	genericDescription = Добыть еще 1 образец почвы Минмуса.
	synopsis = Доставить домой образец почвы Минмуса из определенного биома.
	completedMessage = Еще один образец с Минмуса отдан ученым.

	maxCompletions = 15
	maxSimultaneous = 1
	cancellable = true
	declinable = true
	targetBody = HomeWorld().Children().Last()
	prestige = Significant
	rewardScience = 10
	rewardReputation = 10
	rewardFunds = 60000
	advanceFunds = 20000
	
	REQUIREMENT
	{
		type = ReturnFromSurface
		checkType = MANNED
		targetBody = @/targetBody
	}
	REQUIREMENT
	{
		type = CompleteContract
		minCount = 0
		contractType = FMCP34
		cooldownDuration = 8d
	}
	
	// data for biome
	DATA
	{
		type = List<ScienceExperiment>
		hidden = true
		myExperiment = [ surfaceSample ]
	}
	DATA
	{
		type = List<CelestialBody>
		hidden = true
		myBodies = [ HomeWorld().Children().Last() ]
	}
	DATA
	{
		type = CelestialBody
		homePlanet = HomeWorld()
		title = home world
	}
	DATA
	{
		type = List<ScienceSubject>
		hidden = true
		targetSubjects = AllScienceSubjectsByBodyExperiment(@/myBodies, @/myExperiment).Where(s => s.RemainingScience() > 0.05)
	}
	DATA
	{
		type = ScienceSubject
		sciSubject = @/targetSubjects.Random()
		title = 1 случайный биом из еще не выжатых досуха
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/targetSubjects.Count() > 0
		title = Должен оставаться хотя бы один неизученный образец
	}
	// ЭТО НЕ КОНТРАКТ А МЕЧТА! 1 условие для выполнения = ...
	// (НОВЫЙ ПИЛОТИРУЕМЫЙ корабль, ПОСАДКА на Минмус, в ОПРЕДЕЛЕННОМ биоме, сбор ОБРАЗЦА и ВОЗВРАЩЕНИЕ)
    PARAMETER
    {
		name = OneMoreSample
        type = CollectScience
        biome = @/sciSubject.Biome()
        situation = SrfLanded			//@/sciSubject.Situation()
        experiment = surfaceSample		//@/sciSubject.Experiment()
        recoveryMethod = Recover
		hideChildren = true
		title = Соберите еще 1 образец почвы ( @/targetBody, @biome.Name() ), и доставьте на @/homePlanet
    }
}